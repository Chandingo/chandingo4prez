<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

, "2": 27, "3": 14}, "week_part1": {"4": 22, "5": 28}, "format": {"direct": 17, "image": 14, "negative": 2, "sequence": 1, "vignette": 25}, "options": {"4": 3, "5": 56}, "keys": {"A": 12, "B": 12, "C": 12, "D": 12, "E": 11}, "keys_part1": {"A": 10, "B": 10, "C": 10, "D": 10, "E": 10}, "keys_part2": {"A": 2, "B": 2, "C": 2, "D": 2, "E": 1}, "median_stem_words_part1": 37.0, "vignette_median_words": 48.5, "stems_le25_part1": 22, "stems_gt60_part1": 10, "patient_framed_part1": 28, "negative_stems": [22, 44], "sequence_items": [27], "none_of_these_keyed": [55], "drug_items": [5, 17, 23, 30, 31], "laterality_items": [28, 32, 37, 40, 42], "image_items": [3, 19, 21, 25, 49, 51, 52, 53, 54, 55, 56, 57, 58, 59], "reworked_items": [7, 9, 13, 23, 27, 36, 40, 42, 45, 50], "session_counts": {"Anatomy Lab: Ear": 3, "Anatomy Lab: Eye": 3, "Anatomy Lab: Midline Cavities": 3, "Ataxia": 3, "Basal Ganglia & Circuitry": 3, "Basic Eye and Orbit Exam": 2, "Cerebellum & Circuitry": 2, "Dizziness & Vertigo": 3, "Ear Anatomy & Neurophysiology": 3, "Extra-Ocular Movements & Oculomotion Neuropathies": 2, "Glaucoma": 1, "Hearing Loss and Evaluation": 3, "Hyperkinetic Movement Disorders": 2, "Hypokinetic Movement Disorders": 1, "Motor Neuron Disorders: ALS and UMN Disorders": 2, "Motor Neuron Disorders: Lower Motor Neuron / Junction": 2, "Nasal & Oral Cavities": 2, "Nystagmus": 1, "Pharynx & Larynx": 2, "Retinopathy / Macular Degeneration": 2, "Structures of the Eye and Retina": 4, "Sympathetics & Parasympathetics of the Eye": 1, "Taste and Smell": 1, "Treatment of Movement Disorders": 1, "Tremor and Other Movement Disorders": 2, "Vestibular Anatomy & Neurophysiology": 2, "Visual Fields & Deficits": 3}}, "questions": [{"id": "m2mk2-q01", "n": 1, "part": 1, "title": null, "stem": "A 61-year-old woman who has smoked a pack a day for 40 years develops slurred speech and a clumsy, wide-based gait over 6 weeks, and she now needs a cane. She has nystagmus, overshoots on finger-to-nose testing with both arms, and her rapid alternating hand movements are irregular. Strength, reflexes and sensation are normal, and brain MRI is unremarkable. Which mechanism most likely explains her ataxia?", "options": [{"letter": "A", "text": "Antibodies against cerebellar Purkinje cells, triggered by a tumor outside the nervous system"}, {"letter": "B", "text": "Loss of dorsal-column proprioception from vitamin B12 deficiency"}, {"letter": "C", "text": "Inflammation of the vestibular nerve after a viral illness"}, {"letter": "D", "text": "Degeneration of the vermis from chronic alcohol use"}, {"letter": "E", "text": "Hypertensive hemorrhage into one cerebellar hemisphere"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO7 (causes of cerebellar ataxia)", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "A subacute (weeks), bilateral cerebellar syndrome (dysarthria, nystagmus, limb dysmetria, gait ataxia) with a normal MRI in a heavy smoker fits paraneoplastic cerebellar degeneration: a tumor outside the cerebellum, most often small cell lung cancer or a gynecological cancer, drives antibodies against Purkinje cells.", "distractor_explanations": {"B": "Sensory ataxia gives a Romberg-positive, stomping gait with lost position sense; her sensation is normal, and dysarthria, nystagmus and limb dysmetria point to the cerebellum.", "C": "Vestibular neuritis gives days of vertigo with unidirectional nystagmus, not 6 weeks of progressive dysarthria and bilateral limb dysmetria.", "D": "Alcohol affects the vermis, giving gait ataxia with relatively preserved limbs; she has no alcohol history and both arms are dysmetric.", "E": "A hemorrhage is sudden (hours), gives ipsilateral signs with headache, and would show on imaging; this was a 6-week bilateral course with a normal MRI."}, "source": "Wk4 packet p. 31 (LO7 subacute/chronic causes: 'Paraneoplastic ataxia results from tumors outside the cerebellum producing antibodies against Purkinje cells, commonly associated with small cell lung cancer and gynecological cancers'), p. 33-34 (sensory and vestibular ataxia features)."}, {"id": "m2mk2-q02", "n": 2, "part": 1, "title": null, "stem": "A 34-year-old man has had foul-smelling drainage from his left ear for months, and his hearing on that side has slowly worsened. He had repeated ear infections as a child. Otoscopy shows a pearly white mass behind a retracted, perforated tympanic membrane. What is this lesion made of?", "options": [{"letter": "A", "text": "Abnormal new bone remodeling around the stapes footplate"}, {"letter": "B", "text": "Purulent effusion from Streptococcus pneumoniae"}, {"letter": "C", "text": "Keratin debris shed by squamous epithelium growing in the middle ear"}, {"letter": "D", "text": "A benign Schwann cell tumor of CN VIII"}, {"letter": "E", "text": "Impacted cerumen in the external auditory canal"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "This is a cholesteatoma: misplaced squamous epithelium in the middle ear (usually after eustachian tube dysfunction or a perforation) that sheds keratin debris. It causes conductive loss and chronic drainage and can erode the ossicles, the mastoid and the facial nerve.", "distractor_explanations": {"A": "That is otosclerosis: a stiff stapes behind a normal-looking tympanic membrane, not a white mass with chronic drainage.", "B": "Acute otitis media gives a red, bulging tympanic membrane with fever, not a pearly mass behind a retracted, perforated drum.", "D": "A vestibular schwannoma causes asymmetric sensorineural loss from the internal auditory canal; it is not visible behind the tympanic membrane.", "E": "Earwax sits in the canal lateral to the tympanic membrane, not in the middle ear behind it."}, "source": "Wk5 packet p. 15 (LO2 b, 'Accumulations of desquamated keratin debris from the squamous epithelial cell lining build up'); Hearing Loss deck (88ab33e1) slide 30 ('Misplaced epithelium that grows in the ME space ... Can erode ossicles')."}, {"id": "m2mk2-q03", "n": 3, "part": 1, "title": null, "stem": "The nucleus indicated by the arrow projects to the internal segment of the globus pallidus. Which transmitter does it release there, and with what effect?", "options": [{"letter": "A", "text": "GABA; it inhibits the internal segment"}, {"letter": "B", "text": "Glutamate; it excites the internal segment"}, {"letter": "C", "text": "Dopamine; it excites the internal segment through D1 receptors"}, {"letter": "D", "text": "GABA; it inhibits the thalamus directly"}, {"letter": "E", "text": "Acetylcholine; it excites the internal segment"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/s-bg-stn.png", "image_needed": true, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO1, LO3", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the subthalamic nucleus (faculty-circled label on this Nolte coronal section), just below the thalamus and above the substantia nigra. Its glutamatergic projection to the internal segment of the globus pallidus is the only excitatory intrinsic connection of the basal ganglia; it is the link in the indirect pathway that increases pallidal inhibition of the thalamus.", "distractor_explanations": {"A": "GABA onto the internal segment comes from the striatum (direct pathway) and the external segment; the arrowed nucleus is the subthalamic nucleus, the one excitatory link.", "C": "Dopamine comes from the substantia nigra pars compacta and acts on striatal neurons, not on the internal segment.", "D": "The GABAergic projection to the thalamus comes from the internal segment and the substantia nigra pars reticulata, not from the arrowed nucleus.", "E": "No basal ganglia output described in the course is cholinergic; the subthalamic projection is glutamatergic."}, "source": "BG deck (4285501b) slide 4 (Nolte coronal section, circled 'Subthalamic nucleus' label), slides 13-14 ('STN Glutamate'); Wk4 packet p. 13 ('the projection from the subthalamic nucleus is in fact the only excitatory intrinsic connection'; 'sends excitatory (glutamate) projections to the internal segment').", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/s-bg-stn.png", "options": {"A": "GABA to the internal pallidum comes from the striatum (labels 'Putamen', 'Caudate nucleus' on this figure)", "B": "Arrowed structure: faculty-circled label 'Subthalamic nucleus' (glutamatergic projection to the internal pallidum)", "C": "Dopamine comes from the substantia nigra (circled 'Substantia nigra' label, just below the arrow)", "D": "The GABAergic output to the thalamus comes from the internal pallidum (figure label 'Globus pallidus')", "E": "No cholinergic basal ganglia projection in the course"}, "note": "The choices are transmitter/effect pairs, so the arrowed structure is starred, not boxed. The faculty circled 'Subthalamic nucleus' and 'Substantia nigra' on this slide.", "how": "Faculty slide with its labels showing (the question cropped them out). Amber arrow = where the question placed it; amber box with star = the faculty label whose leader ends at the arrow tip. The choices are transmitter/effect pairs, so none is boxed.", "marked": [], "status": "built 2026-11-20 in Cowork: qbank/midterm2-mock2-images/annotated/s-bg-stn.png"}}, {"id": "m2mk2-q04", "n": 4, "part": 1, "title": null, "stem": "Which tract arises from the lateral vestibular nucleus, descends uncrossed to all levels of the spinal cord, and adjusts tone in antigravity muscles?", "options": [{"letter": "A", "text": "Medial vestibulospinal tract"}, {"letter": "B", "text": "Tectospinal tract"}, {"letter": "C", "text": "Lateral corticospinal tract"}, {"letter": "D", "text": "Medial longitudinal fasciculus (ascending fibers)"}, {"letter": "E", "text": "Lateral vestibulospinal tract"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": null, "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO4-5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The lateral vestibular nucleus sends an uncrossed lateral vestibulospinal tract to all cord levels for postural adjustments in antigravity muscles. The medial vestibular nucleus sends a bilateral medial vestibulospinal tract through the MLF to the cervical cord for head and eye coordination.", "distractor_explanations": {"A": "The medial tract is bilateral, travels in the MLF, and reaches only the cervical cord to coordinate head and eye movements.", "B": "The tectospinal tract arises from the superior colliculus and turns the head toward visual stimuli.", "C": "The lateral corticospinal tract arises from motor cortex, crosses in the medulla, and drives voluntary movement.", "D": "Ascending MLF fibers link the vestibular nuclei to the nuclei of CN III, IV and VI for the vestibulo-ocular reflex."}, "source": "Wk5 packet p. 33-34 (LO4-5: 'The lateral vestibular nucleus sends an uncrossed lateral ... vestibulospinal tract to all cord levels ... to make postural adjustments in antigravity muscles')."}, {"id": "m2mk2-q05", "n": 5, "part": 1, "title": null, "stem": "A 67-year-old man with mild asthma and primary open-angle glaucoma has an intraocular pressure of 27 mm Hg in both eyes. He starts a new eye drop that lowers intraocular pressure by reducing aqueous production. Two weeks later he is wheezing and short of breath, and his resting heart rate is 50/min. Which drug was most likely started?", "options": [{"letter": "A", "text": "Latanoprost"}, {"letter": "B", "text": "Pilocarpine"}, {"letter": "C", "text": "Acetazolamide"}, {"letter": "D", "text": "Timolol"}, {"letter": "E", "text": "Apraclonidine"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Glaucoma", "topic": "Glaucoma", "note": "Keyed on side effects only; no option turns on betaxolol selectivity.", "blueprint_category": "Glaucoma", "learning_objective": "Glaucoma LO3; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Timolol", "laterality": false, "reworks": null, "explanation": "Timolol is a topical beta-blocker that reduces aqueous production. Enough is absorbed systemically to block beta-2 receptors in the airways (bronchospasm) and cardiac beta receptors (bradycardia), so it is used with caution in asthma, COPD, heart block and heart failure.", "distractor_explanations": {"A": "Latanoprost raises uveoscleral outflow; its side effects are local: eyelash growth, iris darkening, conjunctival redness.", "B": "Pilocarpine increases trabecular outflow; its side effects are miosis, dim vision, accommodation and brow ache.", "C": "Acetazolamide does reduce aqueous production, but its side effects are malaise, fatigue, weight loss and acidosis, not bronchospasm and bradycardia.", "E": "Apraclonidine (alpha-2 agonist) also reduces aqueous production; its listed side effect is ocular allergy."}, "source": "Drug list (Exam 2, Ocular pharmacology): Timolol, 'Inhibit aqueous humor secretion', side effects 'Bronchospasm, bradycardia'; Wk5 packet p. 101 (Glaucoma LO3: 'All must be used in caution in patients with asthma and COPD due to bronchospasm from β2 receptors. Underlying cardiac conditions like heart block and heart failure may be exacerbated')."}, {"id": "m2mk2-q06", "n": 6, "part": 1, "title": null, "stem": "A 29-year-old woman has drooping eyelids and trouble chewing that worsen as the day goes on. On low-frequency repetitive nerve stimulation of a hand muscle, the compound muscle action potential gets smaller with each successive stimulus. Which explanation best accounts for this decrement?", "options": [{"letter": "A", "text": "With fewer functional acetylcholine receptors, the normal small fall in acetylcholine released with each impulse leaves more endplate potentials below threshold"}, {"letter": "B", "text": "Antibodies against presynaptic calcium channels reduce acetylcholine release, which normally improves with repeated stimulation"}, {"letter": "C", "text": "Acetylcholinesterase is overactive, so acetylcholine is cleared before it can bind"}, {"letter": "D", "text": "Motor axons are degenerating, so fewer muscle fibers are innervated with each impulse"}, {"letter": "E", "text": "Calcium release from the sarcoplasmic reticulum fails during repeated contractions"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO1-2, LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "In myasthenia gravis, antibodies reduce the number of functional postsynaptic acetylcholine receptors and damage the junctional folds, shrinking the safety margin. Acetylcholine released per impulse normally falls slightly during repeated activity; with the margin already reduced, more and more endplate potentials miss threshold, so the response decrements and weakness is fatigable.", "distractor_explanations": {"B": "That is LEMS (presynaptic). Its response improves with repeated activation, the opposite of a decrement.", "C": "MG is not caused by excess cholinesterase; that's why inhibiting the enzyme (pyridostigmine) helps.", "D": "Axon loss lowers the response size from the first stimulus but does not make it fall progressively with each stimulus.", "E": "Transmission at the junction fails, not excitation-contraction coupling inside the muscle."}, "source": "Wk4 packet p. 93-94 (LO1 safety margin; LO2: 'During repeated activity, the amount of acetylcholine released with each impulse normally declines slightly ... In MG, that margin is already reduced'), p. 96 (LO4 table: 'Low-frequency stimulation may show a decrement in compound muscle action potential amplitude')."}, {"id": "m2mk2-q07", "n": 7, "part": 1, "title": null, "stem": "A 68-year-old man has had severe constipation for 10 years, lost his sense of smell 5 years ago, and acts out his dreams at night. Over the past year his handwriting has become small and his face less expressive. He now has a resting tremor of his left hand, cogwheel rigidity and slow movements. Which protein most likely forms the eosinophilic inclusions in his remaining nigral neurons?", "options": [{"letter": "A", "text": "Tau"}, {"letter": "B", "text": "TDP-43"}, {"letter": "C", "text": "Alpha-synuclein"}, {"letter": "D", "text": "Huntingtin"}, {"letter": "E", "text": "Beta-amyloid"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hypokinetic Movement Disorders", "topic": "Hypokinetic Movement Disorders", "note": null, "blueprint_category": "Hypokinetic Movement Disorders", "learning_objective": "Hypokinetic LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q4 (parkinsonism with anosmia and vivid dreams -> PD vs atypical parkinsonism): new ask (protein in the inclusions)", "explanation": "This is Parkinson disease with a classic prodrome. In the Braak scheme Lewy pathology starts outside the nigra (enteric nervous system, olfactory system, caudal brainstem: constipation, anosmia, REM sleep behavior disorder) before reaching the substantia nigra. Lewy bodies are intracytoplasmic eosinophilic inclusions made of aggregated (phosphorylated) alpha-synuclein.", "distractor_explanations": {"A": "Tau aggregates characterize other neurodegenerative diseases (general knowledge: Alzheimer tangles, PSP); Lewy bodies are alpha-synuclein.", "B": "TDP-43 inclusions are the typical finding in ALS motor neurons.", "D": "Mutant huntingtin with an expanded polyglutamine tail causes Huntington disease, a choreic disorder.", "E": "Beta-amyloid forms plaques in Alzheimer disease, not intracytoplasmic Lewy bodies."}, "source": "Wk4 packet p. 69 (LO1 A-B: damaged alpha-synuclein aggregates; 'Lewy bodies ... intracytoplasmic, spherical cellular inclusions with eosinophilic cores'; Braak ascending spread, constipation prodromal, olfaction); Hypokinetic deck (6782c80d) slides 4, 7-8 (synucleinopathy; REM sleep behavior disorder in upper brainstem)."}, {"id": "m2mk2-q08", "n": 8, "part": 1, "title": null, "stem": "The tensor tympani, which attaches to the handle of the malleus and damps vibration of the tympanic membrane, is innervated by which nerve?", "options": [{"letter": "A", "text": "Facial nerve (CN VII)"}, {"letter": "B", "text": "Trigeminal nerve (CN V)"}, {"letter": "C", "text": "Glossopharyngeal nerve (CN IX)"}, {"letter": "D", "text": "Vestibulocochlear nerve (CN VIII)"}, {"letter": "E", "text": "Vagus nerve (CN X)"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The tensor tympani is innervated by CN V (mandibular division); it pulls the malleus in to tighten the tympanic membrane and may reduce internal sounds during chewing. The stapedius is innervated by CN VII.", "distractor_explanations": {"A": "CN VII supplies the stapedius, the other middle-ear muscle.", "C": "CN IX gives sensory innervation to the middle-ear lining, not motor supply to its muscles.", "D": "CN VIII is purely sensory (hearing and balance).", "E": "CN X gives sensory twigs to the tympanic membrane and external canal, not motor supply to middle-ear muscles."}, "source": "Wk5 packet p. 3 (LO2: 'The tensor tympani (innervated by CN V) attaches to the handle of the malleus ... the stapedius (innervated by CN VII)')."}, {"id": "m2mk2-q09", "n": 9, "part": 1, "title": null, "stem": "A 6-year-old boy has had morning headaches and vomiting for a month. He sways when he sits or stands unsupported, and his eyes cannot hold steady fixation because of nystagmus. Lying down, his finger-to-nose and heel-to-shin tests are nearly normal. MRI shows a mass in the roof of the fourth ventricle involving the nodulus. Which functional division of the cerebellum is damaged?", "options": [{"letter": "A", "text": "Spinocerebellum"}, {"letter": "B", "text": "Cerebrocerebellum"}, {"letter": "C", "text": "Intermediate zone (paravermis)"}, {"letter": "D", "text": "Vestibulocerebellum"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk4-slide-questions #9 (cerebrocerebellum -> dysarthria): other division, new case (child, nodulus mass) and new ask (division from signs)", "explanation": "The flocculonodular lobe (flocculus and nodulus) with the medial vermis forms the vestibulocerebellum. It receives vestibular input for balance and gaze control, so damage gives difficulty sitting or standing upright, impaired fixation and nystagmus, while limb coordination is spared.", "distractor_explanations": {"A": "The spinocerebellum (vermis + intermediate zone) receives spinal proprioception for axial and proximal limb control; nystagmus and gaze instability point to the vestibular division.", "B": "The cerebrocerebellum (lateral posterior lobes) plans skilled limb movements; his limb tests are nearly normal.", "C": "The intermediate zone (part of the spinocerebellum) coordinates the distal limbs, which test nearly normal here."}, "source": "Wk4 packet p. 23 (LO2 table: 'Vestibulocerebellum: Flocculonodular lobe (flocculus & nodulus), medial vermis ... Difficulty standing or sitting upright, impaired gaze control (fixation, interocular coordination), nystagmus'), p. 30 (midline lesions)."}, {"id": "m2mk2-q10", "n": 10, "part": 1, "title": null, "stem": "In olfactory receptor neurons, calcium entering through cAMP-gated channels opens a second channel that carries most of the depolarizing current. Which ion moves through it, and which way?", "options": [{"letter": "A", "text": "Chloride flows into the cell"}, {"letter": "B", "text": "Potassium flows out of the cell"}, {"letter": "C", "text": "Sodium flows into the cell"}, {"letter": "D", "text": "Calcium flows out of the cell"}, {"letter": "E", "text": "Chloride flows out of the cell"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Taste and Smell", "topic": "Taste and Smell", "note": null, "blueprint_category": "Taste and Smell", "learning_objective": "Taste & Smell LO1", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Odorant binding activates adenylyl cyclase; cAMP opens cation channels that admit Na+ and Ca2+. The Ca2+ opens calcium-activated chloride channels, and because intracellular chloride is high in these neurons, Cl- leaves the cell. That efflux supplies as much as 80% of the depolarizing current.", "distractor_explanations": {"A": "Olfactory neurons keep intracellular chloride high, so opening chloride channels lets chloride leave, which depolarizes; chloride entry would hyperpolarize.", "B": "Potassium efflux would hyperpolarize the cell.", "C": "Sodium enters through the first (cyclic nucleotide-gated) channel, not through the calcium-activated one.", "D": "Calcium enters through the cyclic nucleotide-gated channel; the second channel is a calcium-activated chloride channel."}, "source": "Wk5 packet p. 93 (LO1: 'the calcium activates a unique chloride channel ... the intracellular concentration of chloride is relatively high ... outflow of Cl- that will help depolarize'; Fig. 4 legend: 'Cl- efflux through these channels account for as much as 80% of the depolarizing current flow')."}, {"id": "m2mk2-q11", "n": 11, "part": 1, "title": null, "stem": "Two days after a left tonsillectomy, a 24-year-old woman notices that food tastes dull over the back of the left side of her tongue, and touching the left side of her pharynx no longer makes her gag. Which nerve was most likely injured during surgery?", "options": [{"letter": "A", "text": "Vagus nerve (CN X)"}, {"letter": "B", "text": "Glossopharyngeal nerve (CN IX)"}, {"letter": "C", "text": "Lingual nerve"}, {"letter": "D", "text": "Hypoglossal nerve (CN XII)"}, {"letter": "E", "text": "Internal branch of the superior laryngeal nerve"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": null, "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx & Larynx LO1-2, LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "CN IX runs in the pharyngeal wall deep to the palatine tonsil and is at risk in tonsillectomy. It carries general sensation and taste from the posterior third of the tongue and the afferent limb of the gag reflex from the upper pharynx.", "distractor_explanations": {"A": "CN X carries the gag reflex's motor limb and supplies most pharyngeal muscles, but not taste or sensation from the posterior third of the tongue.", "C": "The lingual nerve (V3, with chorda tympani fibers) serves the anterior two-thirds of the tongue.", "D": "CN XII is motor to the tongue muscles; injury causes deviation, not taste or gag loss.", "E": "The internal laryngeal nerve gives sensation to the larynx above the vocal folds, not the posterior tongue."}, "source": "Wk4 packet p. 55-56 (tonsillar bed: structures at risk include 'the Glossopharyngeal Nerve (CN IX)'), p. 47 ('On the posterior 1/3 of the tongue, the glossopharyngeal nerve (CN IX) carries both general sense and taste'), p. 66-67 ('CN IX to cover more superior areas (gag reflex afferent)'; 'CN X: gag reflex efferents')."}, {"id": "m2mk2-q12", "n": 12, "part": 1, "title": null, "stem": "A 74-year-old man with poorly controlled diabetes has 3 weeks of severe, worsening right ear pain that keeps him awake at night, with discharge despite antibiotic drops. His temperature is 37.9 °C. Granulation tissue fills the floor of the external canal. Today he cannot close his right eye or raise the right corner of his mouth. Which organism most likely causes this infection?", "options": [{"letter": "A", "text": "Pseudomonas aeruginosa"}, {"letter": "B", "text": "Streptococcus pneumoniae"}, {"letter": "C", "text": "Haemophilus influenzae"}, {"letter": "D", "text": "Cytomegalovirus"}, {"letter": "E", "text": "Treponema pallidum"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO2", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Severe, persistent otitis externa in an older diabetic with canal granulation tissue and a new facial palsy is malignant otitis externa: skull-base osteomyelitis spreading from the external canal, here reaching the facial nerve. Otitis externa is most often Pseudomonas, and diabetes is the risk factor for the malignant form.", "distractor_explanations": {"B": "S. pneumoniae (with H. influenzae) causes acute otitis media in young children, a middle-ear infection.", "C": "H. influenzae is a cause of acute otitis media in children, not of skull-base spread from the external canal in a diabetic adult.", "D": "CMV is the most common infectious cause of congenital sensorineural hearing loss.", "E": "Syphilis can cause labyrinthitis (inner ear), not external-canal infection with granulation tissue."}, "source": "Hearing Loss deck (88ab33e1) slide 23 ('Otitis Externa: Often Pseudomonas; Risk factors: age, DM. Malignant Otitis Externa: Risk factor DM; Skull base osteomyelitis'), slide 28 (AOM: H flu, S pneumo), slide 33 (CMV), slide 35 (syphilis, labyrinthitis). Facial nerve involvement from skull-base spread is general knowledge."}, {"id": "m2mk2-q13", "n": 13, "part": 1, "title": null, "stem": "The dorsal (occipitoparietal) visual stream, which judges motion, receives most of its input from which retinal ganglion cells?", "options": [{"letter": "A", "text": "P cells: small receptive fields, color sensitive, concentrated near the fovea"}, {"letter": "B", "text": "M cells: small receptive fields, color sensitive, concentrated near the fovea"}, {"letter": "C", "text": "P cells: large receptive fields, achromatic, mostly in the peripheral retina"}, {"letter": "D", "text": "M cells: large receptive fields, high contrast sensitivity, mostly in the peripheral retina"}, {"letter": "E", "text": "Rod bipolar cells, each receiving input from many rods"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO1", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": "wk5-slide-questions #20 and wk5-worksheets wk5-vf-pm-cells row 2 (M cells -> motion and contrast): reversed ask (motion stream -> which class, with its receptive-field properties)", "explanation": "The dorsal 'where' stream (occipitoparietal cortex) processes contrast and motion carried by the magnocellular (M) pathway. M ganglion cells have large receptive fields, high contrast sensitivity, achromatic responses and fast responses, and lie mainly in the peripheral retina. P cells (detail and color, near the fovea) feed the ventral 'what' stream.", "distractor_explanations": {"A": "P cells feed the ventral 'what' stream (detail, color, recognition), not the motion stream.", "B": "Right cell class, wrong properties: M cells have large receptive fields, are achromatic, and sit mainly in the peripheral retina.", "C": "Those are M-cell properties attached to the wrong class.", "E": "Bipolar cells are retinal interneurons; the cortical streams are defined by ganglion cell class (M vs P)."}, "source": "Wk5 packet p. 67-68 (LO1: P cells small fields, wavelength-specific, low contrast sensitivity, fovea; M cells large fields, achromatic, high contrast sensitivity, peripheral retina), p. 71 ('The cortical dorsal \"where\" pathway processes information collected primarily by the M Cell Pathway')."}, {"id": "m2mk2-q14", "n": 14, "part": 1, "title": null, "stem": "A 31-year-old woman has 8 months of drooping eyelids, double vision and arm fatigue that worsen by evening. Testing confirms generalized myasthenia gravis with positive acetylcholine receptor antibodies. Pyridostigmine controls her symptoms well, and her breathing and swallowing are normal. Chest CT shows thymic hyperplasia but no thymoma. Which additional treatment should be considered early to improve long-term control?", "options": [{"letter": "A", "text": "Plasma exchange"}, {"letter": "B", "text": "Intravenous immunoglobulin"}, {"letter": "C", "text": "Thymectomy"}, {"letter": "D", "text": "Glycopyrrolate"}, {"letter": "E", "text": "Doubling the pyridostigmine dose"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Thymectomy is a disease-modifying option that should be considered early in adults with generalized, AChR-antibody-positive MG, planned while the patient is clinically stable, even without a thymoma. It improves long-term control and reduces immunotherapy needs.", "distractor_explanations": {"A": "Plasma exchange is rapid rescue for a severe exacerbation or crisis, not long-term control in a stable patient.", "B": "IVIG, like plasma exchange, is for severe exacerbations or crisis.", "D": "Glycopyrrolate only blunts pyridostigmine's muscarinic side effects; it does not change the disease.", "E": "Pyridostigmine is symptomatic only and does not treat the autoimmune process; her symptoms are already controlled."}, "source": "Wk4 packet p. 94 ('AChR-positive MG is also associated with abnormalities of the thymus, especially thymic hyperplasia and thymoma'), p. 97 (LO5: 'Thymectomy ... should be considered early in adults with generalized, AChR-positive MG'; table: crisis -> plasma exchange or IVIG; glycopyrrolate for muscarinic side effects)."}, {"id": "m2mk2-q15", "n": 15, "part": 1, "title": null, "stem": "A 66-year-old man with long-standing diabetes and hypertension wakes with double vision and a droopy right eyelid, with a dull ache behind the right eye. Lifting the lid shows the right eye resting down and out, and it cannot adduct or elevate. Both pupils are equal and react normally to light. He has never had headaches like this and has had no recent trauma. Why is the pupil spared?", "options": [{"letter": "A", "text": "The pupillary fibers travel with CN IV, which is unaffected"}, {"letter": "B", "text": "Sympathetic fibers to the dilator compensate fully for the parasympathetic loss"}, {"letter": "C", "text": "A posterior communicating artery aneurysm compresses only the fibers to the extraocular muscles"}, {"letter": "D", "text": "The Edinger-Westphal nucleus lies in the pons, away from the lesion"}, {"letter": "E", "text": "The pupillary fibers run on the outside of the nerve, and microvascular ischemia damages the nerve's core"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": null, "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO2; Sympathetics LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Pupillary (parasympathetic) fibers lie on the outer edge of CN III. A compressive lesion (aneurysm, herniation) hits them early and gives a fixed, dilated pupil. Microvascular ischemia from diabetes or hypertension damages the core of the nerve, so the eye is down and out with ptosis while the pupil is spared.", "distractor_explanations": {"A": "Parasympathetic pupillary fibers travel in CN III, not CN IV.", "B": "Unopposed sympathetic tone would dilate the pupil; it can't keep a denervated pupil equal and reactive.", "C": "Compression hits the peripheral pupillary fibers first, so an aneurysm typically gives a fixed, dilated pupil.", "D": "The Edinger-Westphal nucleus is part of the oculomotor complex in the midbrain; the lesion here is in the nerve."}, "source": "Wk5 packet p. 109 (EOM LO2, third nerve palsy: 'Pupillary fibres are present outwards/peripheral ... affected by a compressive lesion but not by a non-compressive nerve lesion ... in ischemic lesions, the pupil is spared'), p. 86 (Sympathetics: 'Non-pupil involving palsies can be caused by diabetes or hypertension (microvascular injury)')."}, {"id": "m2mk2-q16", "n": 16, "part": 1, "title": null, "stem": "A 45-year-old woman with long-standing chronic otitis media develops fever, headache, word-finding difficulty and a seizure. Imaging shows that the infection has eroded through the thin bone forming the roof of the epitympanic recess. Into which space has it most likely spread?", "options": [{"letter": "A", "text": "Posterior cranial fossa"}, {"letter": "B", "text": "Middle cranial fossa"}, {"letter": "C", "text": "Mastoid air cells"}, {"letter": "D", "text": "Internal acoustic meatus"}, {"letter": "E", "text": "Nasopharynx, via the auditory tube"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The middle ear extends upward into the epitympanic recess; on the other side of its thin roof is the middle cranial fossa, which holds the temporal lobe. Erosion here lets infection reach the temporal lobe, explaining the aphasia and seizure.", "distractor_explanations": {"A": "The posterior fossa lies behind and below the petrous ridge, not directly above the epitympanic recess.", "C": "The epitympanic recess opens posteriorly into the mastoid air cells, but that is not through its roof and wouldn't explain temporal-lobe signs.", "D": "The internal acoustic meatus is medial, in the petrous bone, carrying CN VII and VIII.", "E": "The auditory tube leaves the middle ear anteriorly to the nasopharynx; it doesn't pass through the roof."}, "source": "Wk5 packet p. 3 (LO1-2: 'It extends above the tympanic membrane into the epitympanic recess, on the other side of which is the middle cranial fossa. The epitympanic recess leads off posteriorly into the mastoid air cells, and anteriorly the middle ear cavity continues into the auditory tube')."}, {"id": "m2mk2-q17", "n": 17, "part": 1, "title": null, "stem": "A 71-year-old man with Parkinson disease finds that his symptoms return about an hour before each carbidopa-levodopa dose. His neurologist adds tolcapone, a COMT inhibitor with some entry into the CNS. Which adverse effect calls for monitoring with this drug in particular?", "options": [{"letter": "A", "text": "Hepatotoxicity"}, {"letter": "B", "text": "Livedo reticularis"}, {"letter": "C", "text": "Cardiac valve disease"}, {"letter": "D", "text": "Compulsive gambling and other impulse-control behaviors"}, {"letter": "E", "text": "Neuroleptic malignant syndrome"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Treatment of Movement Disorders", "topic": "Treatment of Movement Disorders", "note": null, "blueprint_category": "Treatment of Movement Disorders", "learning_objective": "PD Treatment LO2; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Tolcapone", "laterality": false, "reworks": null, "explanation": "Wearing-off (symptoms returning before the next dose) is the second stage of the levodopa response. COMT inhibitors slow dopamine and levodopa breakdown to prolong each dose. Tolcapone, unlike entacapone, carries hepatotoxicity, so liver function is monitored; both share GI upset, hallucinations, confusion and orthostatic hypotension.", "distractor_explanations": {"B": "Livedo reticularis is listed for amantadine.", "C": "Valve trouble is listed for bromocriptine, an ergot dopamine agonist.", "D": "Impulse-control problems are a dopamine-agonist side effect (pramipexole, ropinirole).", "E": "NMS is listed for tetrabenazine and other dopamine-depleting or blocking drugs."}, "source": "Drug list (Exam 2, Parkinson's): Tolcapone 'some entry into the CNS', side effects 'GI disturbances, Hepatotoxicity, Hallucinations and confusion, Orthostatic hypotension' (Entacapone row has no hepatotoxicity); Amantadine 'Livedo reticularis'; Bromocriptine 'Cardiac valve trouble'; Treatment deck (5fd53768) slides 8 (agonists: compulsive behavior), 12 (COMT inhibition), 14 ('Wearing off')."}, {"id": "m2mk2-q18", "n": 18, "part": 1, "title": null, "stem": "A 76-year-old man started a new blood pressure medication last week. Since then, when he stands up from a chair his vision dims and he feels he might faint; the spells pass within a minute if he sits back down. The spells never come on while he is lying or sitting. He denies any spinning sensation, and his gait is steady. What is the most likely mechanism of his dizziness?", "options": [{"letter": "A", "text": "Unequal input from the two vestibular labyrinths"}, {"letter": "B", "text": "Displaced otoconia in the posterior semicircular canal"}, {"letter": "C", "text": "Loss of proprioception from the feet"}, {"letter": "D", "text": "Ischemia of the vestibular nuclei"}, {"letter": "E", "text": "Transient cerebral hypoperfusion"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Feeling about to faint, with dimming vision, on standing is presyncope, not vertigo. Presyncope points to transient cerebral hypoperfusion, here orthostatic hypotension from the new antihypertensive.", "distractor_explanations": {"A": "A right-left vestibular mismatch produces vertigo, a false sense of spinning or motion, which he denies.", "B": "BPPV gives brief spinning vertigo triggered by head position (rolling over, looking up), not dimming vision on standing.", "C": "Sensory loss causes imbalance when standing or walking, worse in the dark; his gait is steady.", "D": "Brainstem vestibular ischemia causes acute vertigo, usually with other neurologic findings."}, "source": "Wk5 packet p. 41 (Vertigo LO1 table: 'Presyncope: \"I feel as though I might faint,\" sometimes with dimming vision, sweating, or symptoms on standing. Consider transient cerebral hypoperfusion, including hypotension and arrhythmia'), p. 43 (vestibular imbalance -> vertigo), p. 45 (BPPV triggers)."}, {"id": "m2mk2-q19", "n": 19, "part": 1, "title": null, "stem": "A 68-year-old woman with hypertension notices sudden, painless blurring of vision in one eye. Her fundus is shown. What most likely caused these findings?", "options": [{"letter": "A", "text": "An embolus lodged in the central retinal artery"}, {"letter": "B", "text": "New vessels driven by VEGF in diabetic retinopathy"}, {"letter": "C", "text": "Raised intracranial pressure swelling both optic nerve heads"}, {"letter": "D", "text": "A thrombus in the central retinal vein"}, {"letter": "E", "text": "Separation of the neural retina from the pigment epithelium"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/s-fundus-crvo.png", "image_needed": true, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": null, "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal Disorders LO1", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Hemorrhages scattered through every quadrant along dilated, tortuous veins, with a swollen disc, are central retinal vein occlusion. The faculty slide gives the cause as thrombus formation in the vein, with hypertension, diabetes and hypercoagulability as systemic risk factors.", "distractor_explanations": {"A": "Artery occlusion gives a pale, whitened retina with a cherry-red spot, not hemorrhages throughout the fundus.", "B": "Proliferative retinopathy shows neovascularization and possibly vitreous hemorrhage; diffuse hemorrhages along dilated veins in all quadrants point to a vein occlusion.", "C": "Papilledema is bilateral optic disc edema without hemorrhages spread across the whole retina.", "E": "A detachment shows an elevated, folded retina, not diffuse hemorrhages."}, "source": "Retinal Disorders deck (jones_retinal_disorders) slide 10 ('Central & Branch Retinal Vein Occlusion (CRVO & BRVO)' ... 'Cause: thrombus development' ... 'Systemic risk factors: Hypertension, Diabetes mellitus, Hypercoagulability'; photo used here), slide 11 (artery occlusion: embolus, cherry red spot), slide 34 (papilledema), slide 24 (detachment).", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/s-fundus-crvo.png", "options": {"A": "Not shown: artery occlusion (embolus, cherry-red spot) is the next slide (11)", "B": "Not shown: diabetic retinopathy slides 14-17", "C": "Not shown: papilledema slide 34", "D": "Faculty slide: 'Central & Branch Retinal Vein Occlusion (CRVO & BRVO)', 'Cause: thrombus development' (this photo)", "E": "Not shown: retinal detachment slides 24-27"}, "note": "The question photo has no labels; the annotated version is slide 10 with its heading and bullets.", "how": "Faculty slide the photo comes from, with its heading and bullets. Amber box with star = the slide text that answers the question. Amber outline = the photo used in the question.", "marked": [], "status": "built 2026-11-20 in Cowork: qbank/midterm2-mock2-images/annotated/s-fundus-crvo.png"}}, {"id": "m2mk2-q20", "n": 20, "part": 1, "title": null, "stem": "A confused man with cirrhosis holds his arms out, wrists extended; his hands drop forward in brief, irregular lapses and snap back. What is this sign?", "options": [{"letter": "A", "text": "Myoclonus"}, {"letter": "B", "text": "Athetosis"}, {"letter": "C", "text": "Asterixis"}, {"letter": "D", "text": "Akathisia"}, {"letter": "E", "text": "Dystonia"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": null, "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Asterixis is a 'negative' myoclonus: irregular lapses of posture, first described as a 'liver flap' in hepatic insufficiency and seen in metabolic encephalopathies. It is tested with the arms outstretched as if stopping traffic.", "distractor_explanations": {"A": "Myoclonus is a very rapid jerk from active muscle contraction; asterixis is the 'negative' form, a lapse in posture.", "B": "Athetosis is slow, involuntary writhing, often with chorea.", "D": "Akathisia is an inner restlessness and compulsion to move, usually from antipsychotics.", "E": "Dystonia is sustained, abnormally increased tone producing spasm and abnormal postures."}, "source": "Wk4 packet p. 75 (LO1 glossary: 'Asterixis is a type of \"negative\" myoclonus characterized by irregular lapses of posture ... \"liver flap\" ... Testing ... with out-stretched arms as if stopping traffic'; definitions of myoclonus, athetosis, dystonia), p. 74 (akathisia)."}, {"id": "m2mk2-q21", "n": 21, "part": 1, "title": null, "stem": "Identify the structure indicated by the arrow.", "options": [{"letter": "A", "text": "Lacrimal caruncle"}, {"letter": "B", "text": "Lateral canthus"}, {"letter": "C", "text": "Lower palpebrum"}, {"letter": "D", "text": "Interpalpebral fissure"}, {"letter": "E", "text": "None of these"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/s-eye-caruncle.png", "image_needed": true, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": "Session image item in the faculty identification template (4 neighbors + 'None of these', as Practice Test 2 Q47). Medial canthus is left out of the choices because the caruncle sits inside it.", "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the lacrimal caruncle (with the lacrimal fold beside it), the small pink mound in the medial corner of the eye, inside the medial canthus.", "distractor_explanations": {"B": "The lateral canthus is the outer corner where the lids meet, on the other side of the eye.", "C": "The lower palpebrum is the lower eyelid along the bottom of the eye.", "D": "The interpalpebral fissure is the whole opening between the lids, not the small pink mound.", "E": "The arrowed structure is listed (lacrimal caruncle)."}, "source": "Eye & Retina deck (42e068d1) p. 11 ('External Features' photo; faculty pink arrow labeled 'Lacrimal Caruncle + Fold' in the slide image; 'You should be able to identify: The lateral and medial canthus, the lacrimal caruncle and lacrimal fold, the interpalpebral fissure, and the upper and lower palpebrae').", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/s-eye-caruncle.png", "options": {"A": "Faculty label 'Lacrimal Caruncle + Fold' (pink arrow; arrowed)", "B": "Faculty label 'Lateral Canthus' (on the other eye)", "C": "Faculty label 'Lower Palpebrum'", "D": "Faculty label 'Interpalpebral Fissure' (on the other eye)", "E": "not applicable (the key is listed)"}, "note": "The question crop is the right eye of the slide photo; the amber arrow is laid over the faculty's pink arrow. Lateral canthus and interpalpebral fissure are labeled on the other eye of the full photo.", "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"], "status": "built 2026-11-20 in Cowork: qbank/midterm2-mock2-images/annotated/s-eye-caruncle.png"}}, {"id": "m2mk2-q22", "n": 22, "part": 1, "title": null, "stem": "A 63-year-old man is being evaluated for amyotrophic lateral sclerosis. All of the following findings would be consistent with that diagnosis EXCEPT:", "options": [{"letter": "A", "text": "Tongue wasting with fasciculations"}, {"letter": "B", "text": "A brisk jaw jerk with emotional lability"}, {"letter": "C", "text": "A sensory level at T6 with early urinary incontinence"}, {"letter": "D", "text": "Hyperreflexia in a weak, wasted arm"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO1", "difficulty": 2, "format": "negative", "drug_item": null, "laterality": false, "reworks": null, "explanation": "ALS affects motor pathways, so sensation is preserved and bowel, bladder and eye movements are relatively spared. A sensory level or early sphincter dysfunction points to another or additional diagnosis, such as a myelopathy.", "distractor_explanations": {"A": "Bulbar LMN signs (tongue wasting and fasciculations) are typical of ALS.", "B": "Pseudobulbar (corticobulbar UMN) signs fit ALS.", "D": "Coexisting UMN and LMN signs in the same limb are the hallmark of ALS."}, "source": "Wk4 packet p. 105 (LO1: 'Prominent sensory loss, a sensory level, early sphincter dysfunction, or abnormalities of extraocular movement should therefore raise concern for another or additional diagnosis'; UMN/LMN table: pseudobulbar and bulbar findings)."}, {"id": "m2mk2-q23", "n": 23, "part": 1, "title": null, "stem": "A 49-year-old accountant with tremor-dominant Parkinson disease has a resting tremor of his right hand that embarrasses him in meetings. His slowness and stiffness are mild, and carbidopa-levodopa has helped them more than the tremor. His neurologist adds trihexyphenidyl. Which set of adverse effects should he be warned about?", "options": [{"letter": "A", "text": "Increased salivation, sweating, diarrhea and bronchial secretions"}, {"letter": "B", "text": "Bradycardia, fatigue and bronchospasm"}, {"letter": "C", "text": "Sleep attacks, leg swelling and compulsive gambling"}, {"letter": "D", "text": "Dry mouth, blurred vision, constipation and difficulty urinating"}, {"letter": "E", "text": "Eyelash growth and darkening of the iris"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO1 (treatment of PD resting tremor); drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Trihexyphenidyl", "laterality": false, "reworks": "wk4-slide-questions #17 (which drug to add for a mild resting tremor -> anticholinergic): new case and new ask (adverse effects of the anticholinergic)", "explanation": "Trihexyphenidyl blocks muscarinic acetylcholine receptors and is used for PD resting tremor, which may respond only partly to levodopa. Its side effects are antimuscarinic: drowsiness, dizziness, blurred vision, dry mouth, constipation and other GI effects, difficulty urinating, and worsened memory, a concern in older patients.", "distractor_explanations": {"A": "Those are cholinergic (SLUDGE) effects, the opposite of an antimuscarinic; they are listed for pyridostigmine and neostigmine.", "B": "Those are beta-blocker effects (propranolol, used for essential tremor).", "C": "Those are dopamine-agonist effects (pramipexole, ropinirole).", "E": "Those are prostaglandin-analog (latanoprost) eye-drop effects."}, "source": "Tremor deck (0088ac9b) slide 5 ('Treatment of Resting Tremor in PD ... May only partially respond to levodopa ... anticholinergic medication: Trihexyphenidyl, Benztropine'); Treatment deck (5fd53768) slide 11 ('SE: dry mouth, constipation, etc; worsen memory'); drug list (Exam 2, Parkinson's): Trihexyphenidyl side effects."}, {"id": "m2mk2-q24", "n": 24, "part": 1, "title": null, "stem": "A 38-year-old woman has had a week of nasal congestion and a deep ache that she feels in her upper left molars, although her dentist finds no dental disease; the ache worsens when she bends forward. Her temperature is 37.8 °C. CT shows an opacified paranasal sinus on the left. The sinus most likely responsible normally drains into which part of the nasal cavity?", "options": [{"letter": "A", "text": "Inferior meatus"}, {"letter": "B", "text": "Middle meatus, through the semilunar hiatus"}, {"letter": "C", "text": "Superior meatus"}, {"letter": "D", "text": "Sphenoethmoidal recess"}, {"letter": "E", "text": "Nasopharynx, through the choana"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": null, "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal & Oral LO2", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Pain felt in the upper molars points to the maxillary sinus, because the sinus and the upper molars share the superior alveolar nerves (V2), so maxillary sinusitis can feel like a toothache. The maxillary sinus opens into the middle meatus at the semilunar hiatus.", "distractor_explanations": {"A": "The inferior meatus receives the nasolacrimal duct, not a sinus.", "C": "The superior meatus drains some of the posterior ethmoid air cells.", "D": "The sphenoethmoidal recess above the superior concha receives the sphenoid sinus.", "E": "The choanae are the posterior openings of the nasal cavity; no paranasal sinus drains there."}, "source": "Wk4 packet p. 39 (inferior meatus: nasolacrimal duct; middle meatus: maxillary, frontal, many ethmoid; superior meatus: remaining ethmoid; sphenoethmoidal recess: sphenoid), p. 41 (LO2: maxillary sinuses 'open into the middle meatus in the semilunar hiatus'; 'maxillary sinus and upper molar teeth are innervated by the superior alveolar n. branch of V2 so maxillary sinus infection may be perceived as a tooth ache')."}, {"id": "m2mk2-q25", "n": 25, "part": 1, "title": null, "stem": "A 54-year-old man has had type 2 diabetes for 15 years, and his central vision has slowly become blurry. His fundus is shown; no new vessels are seen at the disc or elsewhere. What most likely explains his loss of central vision?", "options": [{"letter": "A", "text": "Vitreous hemorrhage from fragile new vessels"}, {"letter": "B", "text": "Traction retinal detachment from fibrovascular scar tissue"}, {"letter": "C", "text": "Embolic occlusion of the central retinal artery"}, {"letter": "D", "text": "Drusen with geographic atrophy of the pigment epithelium"}, {"letter": "E", "text": "Leakage from damaged retinal capillaries causing macular edema"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/s-fundus-npdr.png", "image_needed": false, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": "The photo supports the stem (dot-blot hemorrhages and exudates, no neovascularization), but the stem already states the key fact, so the image is not strictly needed.", "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal Disorders LO2", "difficulty": 3, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Dot-blot hemorrhages, microaneurysms and exudates without new vessels are non-proliferative diabetic retinopathy. Pericyte damage breaks down the blood-retinal barrier, and VEGF released by the poorly perfused retina raises vascular permeability, so leaky vessels cause macular edema, the usual cause of central vision loss before neovascularization appears.", "distractor_explanations": {"A": "Vitreous hemorrhage is a complication of proliferative disease (neovascularization), which is absent here, and it gives sudden floaters or loss rather than slow central blur.", "B": "Traction detachment also follows proliferative disease with new vessels and scar tissue.", "C": "An artery occlusion causes sudden, painless loss with a pale retina and cherry-red spot.", "D": "That is dry age-related macular degeneration, not diabetic retinopathy."}, "source": "Retinal Disorders deck (jones_retinal_disorders) slides 14-16 ('Damage to vessel pericytes; Breakdown of blood-retinal barrier ... Non-proliferative (NPDR) ... Dot-blot hemorrhages, Cotton-Wool spots, Macular Edema'; photo used here), slide 17 (PDR: neovascularization; vitreous hemorrhage, retinal detachment), slide 18 ('Increased VEGF leads to: Higher vascular permeability; Leaky vessels; Macular edema -> vision loss'), slide 23 (dry AMD drusen).", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/s-fundus-npdr.png", "options": {"A": "Not shown: vitreous hemorrhage is a PDR complication (slide 17)", "B": "Not shown: traction detachment (PDR, slide 17)", "C": "Not shown: artery occlusion (slide 11)", "D": "Not shown: dry AMD drusen (slide 23)", "E": "Faculty slide bullets 'Breakdown of blood-retinal barrier', 'Macular Edema'; labels on this photo 'Dot-Blot Hemorrhages', 'Cotton-Wool Spots' (NPDR)"}, "note": "The question photo is unlabeled; on slide 14 the faculty arrows mark cotton-wool spots and dot-blot hemorrhages on it.", "how": "Faculty slide the photo comes from, with its labels and bullets. Amber boxes with star = the slide text that answers the question; the choices are mechanisms, so none is boxed as a label. Amber outline = the photo used in the question.", "marked": [], "status": "built 2026-11-20 in Cowork: qbank/midterm2-mock2-images/annotated/s-fundus-npdr.png"}}, {"id": "m2mk2-q26", "n": 26, "part": 1, "title": null, "stem": "After an explosion at work, a 40-year-old man has a large perforation of his right tympanic membrane, and temporal bone CT shows the incus dislocated from the stapes. Tuning-fork testing shows a conductive loss in the right ear, and bone-conduction thresholds are normal, so his cochlea is undamaged. He says voices sound muffled on the right. Why is his right-ear hearing markedly reduced?", "options": [{"letter": "A", "text": "Without the large tympanic membrane and the ossicles focusing force onto the small oval window, most sound energy is reflected at the air-fluid boundary of the inner ear"}, {"letter": "B", "text": "The stapedius can no longer contract, so loud sounds damage the hair cells"}, {"letter": "C", "text": "Endolymph leaks out through the perforation, so the hair cells depolarize continuously"}, {"letter": "D", "text": "Sound can no longer reach the round window, which is what vibrates the basilar membrane"}, {"letter": "E", "text": "The tensor tympani is denervated, so the tympanic membrane goes slack"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO6", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Sound crosses an air-water interface poorly, and the inner-ear perilymph is essentially water. The large tympanic membrane, coupled through the ossicles' slight lever advantage onto the much smaller oval window, raises force per unit area and matches the air to the fluid. With the drum torn and the chain broken, most sound energy is reflected, causing a large conductive loss.", "distractor_explanations": {"B": "Loss of the stapedius reflex makes loud sounds uncomfortable; it does not explain a large drop in hearing.", "C": "The perforation is in the tympanic membrane, which opens the middle ear, not the membranous labyrinth.", "D": "The stapes footplate at the oval window drives the perilymph; the round window bulges to accommodate those movements.", "E": "The tensor tympani's nerve (CN V) isn't affected by ossicular dislocation; its role in hearing is minor."}, "source": "Wk5 packet p. 2 (LO6: 'sound does not cross an air-water interface very well ... The slight mechanical advantage of the middle ear ossicles, together with the much larger area of the tympanic membrane relative to the oval window, results in a much greater force per unit area at the oval window'; round window bulges accommodate stapes movement), p. 3 (stapedius, tensor tympani)."}, {"id": "m2mk2-q27", "n": 27, "part": 1, "title": null, "stem": "Glutamatergic cortical input activates striatal neurons of the indirect pathway. Which sequence follows?", "options": [{"letter": "A", "text": "Striatum inhibits the internal pallidum -> the internal pallidum inhibits the thalamus less -> the thalamus excites cortex more"}, {"letter": "B", "text": "Striatum inhibits the external pallidum -> the external pallidum inhibits the subthalamic nucleus less -> the subthalamic nucleus excites the internal pallidum more -> the thalamus is inhibited more -> cortical activity falls"}, {"letter": "C", "text": "Striatum excites the external pallidum -> the external pallidum inhibits the subthalamic nucleus more -> the internal pallidum is excited less -> the thalamus is disinhibited"}, {"letter": "D", "text": "Striatum inhibits the subthalamic nucleus directly -> the internal pallidum is excited less -> the thala
