mus is disinhibited"}, {"letter": "E", "text": "Striatum inhibits the substantia nigra pars compacta -> less dopamine reaches the striatum -> both pathways lose dopamine's effect"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO3", "difficulty": 3, "format": "sequence", "drug_item": null, "laterality": false, "reworks": "wk4-slide-questions #1 (stimulation of the direct pathway -> effect on GPi/thalamus): other pathway (indirect) and new ask (the full chain)", "explanation": "Indirect pathway: cortex (glutamate) -> striatum (GABA) -| external pallidum (GABA) -| subthalamic nucleus (glutamate) -> internal pallidum (GABA) -| thalamus -> cortex. Activating it releases the subthalamic nucleus from pallidal inhibition, so it drives the internal pallidum harder, inhibition of the thalamus rises, and movement is suppressed.", "distractor_explanations": {"A": "That is the direct pathway, which facilitates movement.", "C": "Striatal output neurons are GABAergic, so they inhibit, not excite, the external pallidum.", "D": "The striatum does not project to the subthalamic nucleus; the indirect pathway reaches it through the external pallidum.", "E": "That isn't the indirect pathway's route; it runs striatum -> external pallidum -> subthalamic nucleus -> internal pallidum."}, "source": "Wk4 packet p. 13 (LO3-6: indirect pathway 'cortex ... striatum ... globus pallidus external segment (GPe) and from there to the subthalamic nucleus (STN) utilizing a GABAergic pathway, and finally from the subthalamic nucleus to the globus pallidus internal segment (GPi) utilizing an excitatory glutamatergic projection'; 'activation of the indirect pathway further inhibits thalamo-cortical neurons'); BG deck slide 14 (diagram)."}, {"id": "m2mk2-q28", "n": 28, "part": 1, "title": null, "stem": "A small hemorrhage destroys the upper temporal retina of the right eye. Where in that eye's visual field is the blind spot?", "options": [{"letter": "A", "text": "Upper temporal"}, {"letter": "B", "text": "Upper nasal"}, {"letter": "C", "text": "Lower temporal"}, {"letter": "D", "text": "The center of fixation"}, {"letter": "E", "text": "Lower nasal"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO2", "difficulty": 3, "format": "direct", "drug_item": null, "laterality": true, "reworks": null, "explanation": "The lens flips and reverses the image: the top of the visual field lands on the lower retina and the nasal field lands on the temporal retina. A lesion of the upper temporal retina of the right eye therefore causes a defect in the lower nasal field of that eye only.", "distractor_explanations": {"A": "That would be the field location if the lens didn't invert and reverse the image; retinal and field quadrants are opposite.", "B": "Nasal is right (temporal retina sees the nasal field), but upper retina sees the lower field.", "C": "Lower is right (upper retina sees the lower field), but temporal retina sees the nasal field.", "D": "Central vision depends on the fovea, which is not in the upper temporal quadrant."}, "source": "Wk5 packet p. 68-69 (LO2: 'the top of an image lands on the bottom of the retina, and the ... right half of an image lands on the left half of the retina'), p. 71 ('Nasal retina receives light from the temporal visual field' ... 'Temporal retina receives light from the nasal visual field'), p. 72 ('damage to temporal areas of the retina causes nasal field losses, and damage to superior areas of the retina causes inferior field losses')."}, {"id": "m2mk2-q29", "n": 29, "part": 1, "title": null, "stem": "A static head tilt bends the utricle's hair bundles but not those of the semicircular canal cristae. Which property of the cupula explains this?", "options": [{"letter": "A", "text": "It contains calcium carbonate otoconia"}, {"letter": "B", "text": "It is bathed in perilymph rather than endolymph"}, {"letter": "C", "text": "It has the same density as the surrounding endolymph, so gravity does not displace it"}, {"letter": "D", "text": "Its hair cells lack tip links"}, {"letter": "E", "text": "It is anchored to the bony labyrinth rather than the membranous labyrinth"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": null, "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO3", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The cupula is a gelatinous flap with no otoliths and the same density as endolymph, so a static head tilt doesn't deflect it. Only endolymph moving during angular acceleration bends it. The otolithic membranes of the utricle and saccule are weighted by otoconia, so gravity and linear acceleration displace them.", "distractor_explanations": {"A": "Otoconia are in the otolithic membranes of the utricle and saccule; they make those membranes heavier than endolymph, which is why the utricle does respond to tilt.", "B": "Cristae and maculae both sit in the membranous labyrinth, bathed in endolymph.", "D": "Canal hair cells transduce through tip links like all labyrinth hair cells.", "E": "The cupula sits on the crista inside the membranous duct's ampulla."}, "source": "Wk5 packet p. 31 (LO1-3: otolithic membrane 'more-dense than endolymph'; cupula 'a gelatinous flap with no otoliths'), p. 35 ('A normal cupula has the same density as its endolymphatic surroundings, so gravity causes no movement of the cupula relative to its crista, and the semicircular ducts are insensitive to head position')."}, {"id": "m2mk2-q30", "n": 30, "part": 1, "title": null, "stem": "A 47-year-old woman with Huntington disease, confirmed by genetic testing 3 years ago, has chorea that now makes eating and dressing difficult, along with suspicious, paranoid thinking. Her neurologist starts haloperidol. By which mechanism does this drug reduce her chorea?", "options": [{"letter": "A", "text": "It blocks vesicular monoamine transport, so dopamine is degraded instead of released"}, {"letter": "B", "text": "It stimulates D1 receptors on direct-pathway neurons, restoring the GO pathway"}, {"letter": "C", "text": "It blocks muscarinic receptors on striatal neurons"}, {"letter": "D", "text": "It blocks D2 receptors on the surviving indirect-pathway striatal neurons, removing dopamine's inhibition so the indirect (NOGO) pathway becomes more active"}, {"letter": "E", "text": "It blocks NMDA receptors, protecting striatal neurons from glutamate excitotoxicity"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": "Huntington chorea drug item. Mock #1 Q23 already asked tetrabenazine's mechanism and Quiz #4 Q20 the anti-chorea side effects, so this asks the D2-blocker route; tetrabenazine is a distractor.", "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO2; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Haloperidol", "laterality": false, "reworks": null, "explanation": "In Huntington disease the indirect-pathway (D2) striatal neurons degenerate first, leaving the direct pathway unopposed and producing chorea. Enough indirect neurons survive to respond to dopamine. Dopamine at D2 (Gi) receptors inhibits them, so a D2 blocker such as haloperidol removes that inhibition, increases NOGO activity and reduces chorea; it also treats psychotic symptoms. Its listed side effects are drug-induced parkinsonism and hypotension.", "distractor_explanations": {"A": "That is tetrabenazine's mechanism (VMAT inhibitor), the other drug route for HD chorea.", "B": "Chorea comes from an overactive direct pathway relative to a damaged indirect one; stimulating D1 would worsen it, and haloperidol is an antagonist.", "C": "Antimuscarinics (trihexyphenidyl, benztropine) treat PD tremor and antipsychotic-induced EPS, not chorea.", "E": "No listed HD drug works this way, and it wouldn't explain a quick drop in chorea."}, "source": "Wk4 packet p. 76 (Hyperkinetic LO2: 'Striatal (medium spiny) neurons that give rise to the indirect pathway are selectively vulnerable'; 'enough neurons of the indirect (NOGO) pathway remain functional to respond to dopaminergic innervation, thus D2-receptor blocking drugs may retain effectiveness ... The D2-receptor blocking drugs prevent the inhibitory effect of dopamine, and thus increase activity in this pathway'); drug list (Exam 2, Huntington's Disease): Haloperidol 'Inhibition of dopamine D2 receptors', Tetrabenazine 'VMAT inhibitor'; Wk4 packet p. 14 (D2 = Gi, inhibits the indirect pathway)."}, {"id": "m2mk2-q31", "n": 31, "part": 1, "title": null, "stem": "A 70-year-old woman with glaucoma uses pilocarpine drops. She notices that her pupils are small, her distance vision is dim and blurred, and she has an ache over her brows. Through which receptors, on which muscles, does pilocarpine cause these effects?", "options": [{"letter": "A", "text": "Alpha-1 receptors on the pupillary dilator"}, {"letter": "B", "text": "Muscarinic (M3) receptors on the pupillary sphincter and the ciliary muscle"}, {"letter": "C", "text": "Nicotinic receptors on postganglionic neurons in the ciliary ganglion"}, {"letter": "D", "text": "Beta-2 receptors on the ciliary epithelium"}, {"letter": "E", "text": "Alpha-2 receptors on sympathetic nerve terminals"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Sympathetics & Parasympathetics of the Eye", "topic": "Sympathetics & Parasympathetics of the Eye", "note": null, "blueprint_category": "Sympathetics & Parasympathetics of the Eye", "learning_objective": "Sympathetics LO1-2, LO5; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Pilocarpine", "laterality": false, "reworks": null, "explanation": "Pilocarpine is a cholinergic (muscarinic) agonist. At M3 receptors it contracts the pupillary sphincter (miosis, dim vision) and the ciliary muscle (accommodation that blurs distance vision, brow ache), and ciliary contraction stretches open the trabecular outflow pathway to lower intraocular pressure.", "distractor_explanations": {"A": "Alpha-1 stimulation (phenylephrine) dilates the pupil; pilocarpine constricts it.", "C": "Ganglionic receptors are nicotinic, but pilocarpine is a muscarinic agonist acting at the muscles themselves.", "D": "Beta blockade at the ciliary epithelium (timolol) lowers aqueous production without miosis or brow ache.", "E": "Alpha-2 agonists (apraclonidine) reduce aqueous production and norepinephrine release; they don't cause miosis or accommodation."}, "source": "Drug list (Exam 2, Ocular pharmacology): Pilocarpine 'Cholinergic agonist (Stimulates contraction of ciliary muscle which stretches open trabecular outflow pathway)', side effects 'Accommodation, miosis (dimmed vision), brow ache'; Wk5 packet p. 83 ('pupillary sphincter muscle is controlled by the parasympathetic system (M3) ... ciliary musculature ... also under the control of M3 receptors'), p. 85 (dilator alpha-1; nicotinic receptors on postganglionic neurons)."}, {"id": "m2mk2-q32", "n": 32, "part": 1, "title": null, "stem": "A tumor at the skull base damages a 52-year-old man's right ophthalmic nerve (V1); his facial nerves are intact. Which result is expected when each cornea is lightly touched with a wisp of cotton?", "options": [{"letter": "A", "text": "Right cornea touched: neither eye blinks. Left cornea touched: both eyes blink."}, {"letter": "B", "text": "Right cornea touched: only the left eye blinks. Left cornea touched: both eyes blink."}, {"letter": "C", "text": "Right cornea touched: both eyes blink. Left cornea touched: only the left eye blinks."}, {"letter": "D", "text": "Either cornea touched: only the left eye blinks."}, {"letter": "E", "text": "Either cornea touched: neither eye blinks."}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "The cornea is innervated by V1, the afferent limb of the corneal blink reflex; the efferent limb is CN VII to orbicularis oculi. The reflex is bilateral (general knowledge: the trigeminal input reaches both facial nuclei). With the right V1 cut, touching the right cornea produces no blink in either eye, while touching the left cornea still gives a blink in both eyes.", "distractor_explanations": {"B": "Losing the right afferent (V1) removes the signal from the right cornea entirely, so neither eye responds to it.", "C": "That pattern fits a right facial (efferent) lesion, which this patient doesn't have.", "D": "That would need a right CN VII lesion; touching the right cornea would still need the right V1 afferent to work.", "E": "The left V1 and both facial nerves are intact, so touching the left cornea still produces a blink."}, "source": "Wk5 packet p. 56 (LO1: cornea 'innervated by CN V1 (particularly the cornea), which forms the afferent limb of the corneal blink reflex'), p. 53 (orbicularis oculi innervated by the facial nerve, CN VII). The bilateral (consensual) blink is general knowledge."}, {"id": "m2mk2-q33", "n": 33, "part": 1, "title": null, "stem": "A student is spun to the left in a chair at steady speed for a minute, then stopped abruptly. Which nystagmus follows, and why?", "options": [{"letter": "A", "text": "Left-beating, because the endolymph keeps the cupulae deflected as they were during the leftward rotation"}, {"letter": "B", "text": "Left-beating, because otoconia drift toward the left utricle"}, {"letter": "C", "text": "Right-beating, because the room now seems to move to the left, driving optokinetic nystagmus"}, {"letter": "D", "text": "None, because the cupulae return to rest the moment rotation stops"}, {"letter": "E", "text": "Right-beating, because the still-moving endolymph now deflects the cupulae as if the head were turning right"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Nystagmus", "topic": "Nystagmus", "note": null, "blueprint_category": "Nystagmus", "learning_objective": "Nystagmus LO1-2; Vestibular LO6", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "When rotation stops, the bony canals stop but the endolymph keeps moving and deflects the cupulae opposite to their direction at the start of rotation. The brainstem reads this as rotation to the right, so a brief right-beating post-rotatory nystagmus follows rotation to the left. Nystagmus is named for its fast phase.", "distractor_explanations": {"A": "During steady rotation the endolymph catches up and the cupulae return to rest; at the stop they are deflected the opposite way.", "B": "Otoconia sit in the utricle and saccule and signal linear acceleration and tilt, not post-rotatory movement.", "C": "Post-rotatory nystagmus comes from the canals (it occurs even in the dark), not from a moving visual pattern.", "D": "The endolymph keeps moving briefly after the head stops, deflecting the cupulae in the opposite direction."}, "source": "Wk5 packet p. 33 ('when one stops spinning the bony structure stops but the fluid is still moving and causing the cupula to bend in the opposite direction'), p. 34 ('Left-beating nystagmus is seen at the beginning of rotation to the left ... When the rotation stops, the cupula is deflected in the opposite direction ... a brief period of right-beating post-rotatory nystagmus ensues'; optokinetic nystagmus), p. 31 (otoconia)."}, {"id": "m2mk2-q34", "n": 34, "part": 1, "title": null, "stem": "Which accompanying finding most strongly suggests that a patient's ataxia is vestibular rather than cerebellar or sensory?", "options": [{"letter": "A", "text": "Halting, scanning speech"}, {"letter": "B", "text": "Worse balance with eyes closed, and loss of vibration sense in the feet"}, {"letter": "C", "text": "Overshoot on finger-to-nose testing"}, {"letter": "D", "text": "Spinning vertigo with ringing in one ear"}, {"letter": "E", "text": "Leg weakness with hyperreflexia"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO6, LO8", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Vestibular ataxia comes with vertigo, a distinct spinning sensation, and can come with decreased hearing or tinnitus, which aren't present in the other forms of ataxia. Sensory ataxia has no vertigo; scanning speech and dysmetria are cerebellar.", "distractor_explanations": {"A": "Scanning speech is a central sign seen in cerebellar ataxia, not in vestibular or sensory ataxia.", "B": "That pattern points to sensory ataxia (loss of conscious proprioception).", "C": "Dysmetria is a cerebellar sign.", "E": "Weakness points to a lesion outside the cerebellum (e.g., the brainstem); it isn't seen in vestibular ataxia."}, "source": "Wk4 packet p. 32 (LO8: vestibular ataxia 'typically experience vertigo ... Additional symptoms may include decreased hearing or tinnitus, which are not present in other forms of ataxia'), p. 34 (history clues: vertigo, weakness, scanning speech), p. 30 (dysmetria), p. 33 (sensory ataxia)."}, {"id": "m2mk2-q35", "n": 35, "part": 1, "title": null, "stem": "A 58-year-old man has a year of progressive weakness of both hands with fasciculations, muscle wasting and brisk reflexes. Sensation is normal. Over the same period he has become disinhibited, makes inappropriate jokes, and has lost interest in his family. His sister died of frontotemporal dementia at 61. Genetic testing is most likely to show a pathogenic variant in which gene?", "options": [{"letter": "A", "text": "SOD1"}, {"letter": "B", "text": "SMN1"}, {"letter": "C", "text": "C9orf72"}, {"letter": "D", "text": "HTT"}, {"letter": "E", "text": "FXN"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "ALS with UMN and LMN signs plus behavioral change and a family history of frontotemporal dementia fits the ALS-FTD spectrum. A C9orf72 hexanucleotide repeat expansion causes ALS, frontotemporal dementia, or both.", "distractor_explanations": {"A": "SOD1 variants cause familial ALS, but the combination with frontotemporal dementia points to C9orf72.", "B": "Biallelic SMN1 variants cause spinal muscular atrophy, a pure lower motor neuron disease usually of childhood.", "D": "An HTT CAG expansion causes Huntington disease (chorea, behavioral change), without fasciculations and LMN weakness.", "E": "FXN (frataxin) defects cause Friedreich ataxia, a sensory and spinocerebellar ataxia."}, "source": "Wk4 packet p. 105-106 (LO2 gene table: 'C9orf72: Pathogenic hexanucleotide repeat expansion ... ALS, frontotemporal dementia, or both'; SOD1: familial ALS), p. 105 (ALS-FTD spectrum), p. 111-112 (SMA, SMN1), p. 75 (HD, huntingtin), p. 34 (Friedreich ataxia, FXN)."}, {"id": "m2mk2-q36", "n": 36, "part": 1, "title": null, "stem": "In dim light, a faint star is seen better slightly off-center than straight on, but without detail. Which retinal arrangement explains this?", "options": [{"letter": "A", "text": "Each cone feeds a single bipolar cell and a single ganglion cell"}, {"letter": "B", "text": "Many rods converge onto each rod bipolar cell"}, {"letter": "C", "text": "Rod bipolar cells fire action potentials, unlike photoreceptors"}, {"letter": "D", "text": "Horizontal cells amplify rod signals in the inner plexiform layer"}, {"letter": "E", "text": "Rods are concentrated in the fovea"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO3", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": "wk5-worksheets wk5-eye-foveola row 3 (1:1 cone receptive field -> acuity): opposite end of the same idea (rod convergence -> sensitivity)", "explanation": "Rods dominate the peripheral retina and work in low light. Many rods converge on each rod bipolar cell, pooling their signals: sensitivity to dim light rises but acuity falls. Cone bipolars get input from only a few cones, giving high acuity in central vision.", "distractor_explanations": {"A": "One-to-one cone wiring at the fovea gives the highest acuity, not high sensitivity in dim light.", "C": "Bipolar cells don't generate action potentials; only ganglion cells do.", "D": "Horizontal cells mediate lateral interactions in the outer plexiform layer; they don't explain dim-light sensitivity.", "E": "The fovea holds cones; rods dominate the peripheral retina, which is why looking off to one side helps."}, "source": "Eye & Retina deck (42e068d1) slides 27-28 (rods 'important for vision in low-level lighting conditions'; 'Rod bipolar cells - synaptic input from many rods for lower visual acuity but higher sensitivity to low levels of light'; 'Cone bipolar cells - synaptic input from a small number of cones for high visual acuity'; 'Bipolar cells also do not generate action potentials'; 'Ganglion cells are the only retinal cell that generates action potentials'); Wk5 packet p. 59 (horizontal cells, outer plexiform layer)."}, {"id": "m2mk2-q37", "n": 37, "part": 1, "title": null, "stem": "To test the right superior oblique as the main mover during a clinical eye examination, the patient should be asked to look:", "options": [{"letter": "A", "text": "Down and to the left"}, {"letter": "B", "text": "Down and to the right"}, {"letter": "C", "text": "Up and to the left"}, {"letter": "D", "text": "Up and to the right"}, {"letter": "E", "text": "Straight down"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": null, "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO1", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Clinical testing isolates the obliques in adduction. Looking to the left adducts the right eye; looking down from there depends mainly on the right superior oblique. This is why trochlear palsy shows up as trouble looking down with the eye adducted (reading, going downstairs).", "distractor_explanations": {"B": "Looking down and right abducts the right eye, which isolates the right inferior rectus as the depressor.", "C": "Looking up and left tests the right inferior oblique (elevation in adduction).", "D": "Looking up and right tests the right superior rectus (elevation in abduction).", "E": "Straight down uses the superior oblique and inferior rectus together, so neither is isolated."}, "source": "Wk5 packet p. 106-107 (EOM LO1: 'clinical testing of EOM function involves first isolating the superior and inferior rectus from their combined actions with the superior and inferior oblique muscles'; Fig. 7 clinical testing diagram), p. 110 (Fig. 10: trochlear palsy 'difficulty looking downward when the eye is adducted')."}, {"id": "m2mk2-q38", "n": 38, "part": 1, "title": null, "stem": "A 59-year-old man has had constant vertigo, nausea and unsteadiness for 14 hours. It began while he was sitting still, persists when he lies motionless, and worsens with any head movement. He has no headache, weakness, numbness or double vision, and his speech is normal. What is the most appropriate next step to tell a benign cause from a dangerous one?", "options": [{"letter": "A", "text": "Dix-Hallpike maneuver"}, {"letter": "B", "text": "Epley maneuver"}, {"letter": "C", "text": "Weber and Rinne tuning-fork tests"}, {"letter": "D", "text": "Reassurance and observation, because head movement worsens it"}, {"letter": "E", "text": "A HINTS+ examination (head impulse, nystagmus, test of skew, hearing)"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Continuous vertigo present at rest (an acute vestibular syndrome), not brief position-triggered spells, makes BPPV unlikely. The remaining question is vestibular neuritis versus a brainstem or cerebellar stroke, and the HINTS+ examination is how the course separates them. If even one element is central, the patient needs an MRI for stroke.", "distractor_explanations": {"A": "Dix-Hallpike confirms BPPV, which gives brief, position-triggered spells, not continuous vertigo present at rest.", "B": "The Epley maneuver treats posterior-canal BPPV; there's no BPPV here to treat.", "C": "Tuning-fork tests sort conductive from sensorineural hearing loss; they don't separate vestibular neuritis from stroke.", "D": "Worsening with head movement occurs in both neuritis and stroke; a stroke must be excluded first."}, "source": "Wk5 packet p. 43-44 (Vertigo LO3: 'If the history is NOT most compatible with BPPV, further care must be taken to discriminate between ... vestibular neuritis and brainstem stroke ... To discriminate between vestibular neuritis and vestibular nucleus stroke, a HINTS+ exam is required'), p. 45 (Dix-Hallpike, Epley), p. 21 (Weber/Rinne)."}, {"id": "m2mk2-q39", "n": 39, "part": 1, "title": null, "stem": "Unlike most of the laryngeal lining, the vocal folds are covered by which epithelium?", "options": [{"letter": "A", "text": "Pseudostratified ciliated columnar"}, {"letter": "B", "text": "Keratinized stratified squamous"}, {"letter": "C", "text": "Simple cuboidal"}, {"letter": "D", "text": "Non-keratinized stratified squamous"}, {"letter": "E", "text": "Transitional epithelium"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": null, "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx & Larynx LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The larynx is lined by respiratory epithelium except for the vocal folds, which have non-keratinized stratified squamous epithelium to withstand vibration. Because they lack a submucosa and blood vessels, the vocal folds look white on laryngoscopy.", "distractor_explanations": {"A": "That respiratory epithelium lines most of the larynx, but not the vocal folds.", "B": "Keratinized epithelium is skin; the vocal folds are wet and non-keratinized.", "C": "Simple cuboidal epithelium lines ducts and glands, not a surface that takes the wear of vibration.", "E": "Transitional epithelium lines the urinary tract."}, "source": "Wk4 packet p. 56 (LO1: 'The larynx is lined by respiratory epithelium with the exception of the vocal folds, which are lined with non-keratinized stratified squamous epithelium'), p. 58 ('The vocal folds appear white due to the fact that they lack a submucosa and therefore blood vessels')."}, {"id": "m2mk2-q40", "n": 40, "part": 1, "title": null, "stem": "A small infarct destroys the left middle cerebellar peduncle. Input from which source is interrupted, and on which side are the limbs most uncoordinated?", "options": [{"letter": "A", "text": "Left cerebral cortex, relayed by the pontine nuclei; left limbs"}, {"letter": "B", "text": "Right cerebral cortex, relayed by the pontine nuclei; right limbs"}, {"letter": "C", "text": "Right cerebral cortex, relayed by the pontine nuclei; left limbs"}, {"letter": "D", "text": "Left spinal cord, via the posterior spinocerebellar tract; left limbs"}, {"letter": "E", "text": "Right inferior olive, via climbing fibers; right limbs"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO3-4", "difficulty": 3, "format": "direct", "drug_item": null, "laterality": true, "reworks": "wk4-worksheets wk4-cb-peduncles (peduncle -> pathways): new ask (lesion side -> source side and limb side)", "explanation": "The middle cerebellar peduncle carries the corticopontocerebellar pathway: cerebral cortex -> pontine nuclei -> crossed mossy fibers -> middle peduncle -> cerebrocerebellum. The left middle peduncle therefore carries input from the right cerebral cortex, and as with other cerebellar lesions, the incoordination is ipsilateral (left limbs).", "distractor_explanations": {"A": "Cortical input crosses in the pons: the left middle peduncle carries input from the right cortex.", "B": "Cerebellar lesions, including peduncle lesions, produce ipsilateral signs.", "D": "The posterior spinocerebellar tract enters through the ipsilateral inferior peduncle, not the middle peduncle.", "E": "Olivocerebellar climbing fibers enter through the inferior peduncle, and the signs would be on the side of the lesion."}, "source": "Wk4 packet p. 24 (LO3 afferent table: 'Corticopontocerebellar: Cerebral Cortex > Pontine Nuclei > Mossy Fibers > Middle Peduncle > Cerebrocerebellum'; olivocerebellar and posterior spinocerebellar via the inferior peduncle; 'cerebellar lesions (cortex, nuclei, or peduncles) overwhelmingly produce ipsilateral clinical signs'), p. 27 ('signals from the contralateral cortex go through the middle cerebellar peduncle')."}, {"id": "m2mk2-q41", "n": 41, "part": 1, "title": null, "stem": "The lenticular (lentiform) nucleus consists of which structures?", "options": [{"letter": "A", "text": "Caudate and putamen"}, {"letter": "B", "text": "Putamen and globus pallidus"}, {"letter": "C", "text": "Caudate, putamen and nucleus accumbens"}, {"letter": "D", "text": "Globus pallidus and subthalamic nucleus"}, {"letter": "E", "text": "Putamen and claustrum"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The putamen and globus pallidus have very different connections but are physically stuck together, so in combination they are called the lenticular nucleus. The striatum is the caudate, putamen and nucleus accumbens.", "distractor_explanations": {"A": "Caudate + putamen (+ nucleus accumbens) is the striatum.", "C": "That trio is the striatum, the input portion of the basal ganglia.", "D": "The subthalamic nucleus is diencephalic and not part of the lenticular nucleus.", "E": "The claustrum is a separate sheet of gray matter lateral to the putamen."}, "source": "Wk4 packet p. 11-12 (LO1-2: 'The putamen and globus pallidus ... in combination, they are referred to as the lenticular nucleus'; Fig. 3 terminology); BG deck slide 10 ('Lenticular Nucleus = Putamen, Globus Pallidum')."}, {"id": "m2mk2-q42", "n": 42, "part": 1, "title": null, "stem": "Axons in the left optic tract come from which parts of the two retinas?", "options": [{"letter": "A", "text": "Temporal retina of the left eye and nasal retina of the right eye"}, {"letter": "B", "text": "Nasal retina of the left eye and temporal retina of the right eye"}, {"letter": "C", "text": "Temporal retinas of both eyes"}, {"letter": "D", "text": "Nasal retinas of both eyes"}, {"letter": "E", "text": "The entire retina of the left eye"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO2", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": true, "reworks": "wk5-slide-questions #18 (right optic tract lesion -> field deficit): other side and new ask (fiber composition rather than deficit)", "explanation": "At the chiasm the nasal fibers cross and the temporal fibers stay on their own side. The left optic tract therefore carries the left eye's temporal retina and the right eye's nasal retina, which together view the right visual field.", "distractor_explanations": {"B": "Those fibers make up the right optic tract (left visual field).", "C": "Temporal fibers stay uncrossed, so each optic tract has temporal fibers from only one eye.", "D": "Nasal fibers cross at the chiasm, so each tract has nasal fibers from only the opposite eye.", "E": "That describes the left optic nerve, before the chiasm."}, "source": "Wk5 packet p. 69 and p. 72 (LO2: 'Right visual field (nasal retina of the right eye and temporal retina of the left eye) projects to the left optic tract'; 'At the optic chiasm, axons from the nasal halves of each retina decussate ... axons from the temporal halves remain uncrossed')."}, {"id": "m2mk2-q43", "n": 43, "part": 1, "title": null, "stem": "A 3-year-old boy has had a cold for 4 days and now has a fever, pulls at his right ear, and doesn't respond when spoken to on that side. His right tympanic membrane is red and bulging. How does this condition reduce his hearing?", "options": [{"letter": "A", "text": "Bacterial toxins destroy outer hair cells at the cochlear base"}, {"letter": "B", "text": "Swelling of the external canal blocks sound from reaching the tympanic membrane"}, {"letter": "C", "text": "New bone stiffens the stapes footplate in the oval window"}, {"letter": "D", "text": "The infection damages the cochlear nerve in the internal acoustic meatus"}, {"letter": "E", "text": "Fluid in the middle ear impairs movement of the tympanic membrane and ossicles"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "In acute otitis media, a cold or allergy swells the nasal passages and blocks the eustachian tube; fluid builds up in the middle ear (an effusion) and can become infected. The effusion impairs movement of the tympanic membrane and ossicles, causing a conductive hearing loss.", "distractor_explanations": {"A": "Acute otitis media causes a conductive loss from effusion, not hair-cell (sensorineural) damage.", "B": "That is otitis externa; here the drum itself is red and bulging from fluid behind it.", "C": "That is otosclerosis, a slowly progressive adult condition.", "D": "Nerve damage would be sensorineural; this middle-ear process is conductive."}, "source": "Wk5 packet p. 14-15 (LO1 conductive loss; LO2 a: 'This fluid build-up, called an effusion, impairs the movement of the tympanic membrane and ossicles, resulting in impaired hearing'); Hearing Loss deck slide 28 (AOM: kids < 5, fever, otalgia, CHL), slides 23, 31."}, {"id": "m2mk2-q44", "n": 44, "part": 1, "title": null, "stem": "The middle, vascular layer of the eyeball (the uvea) includes all of the following EXCEPT the:", "options": [{"letter": "A", "text": "Choroid"}, {"letter": "B", "text": "Ciliary body"}, {"letter": "C", "text": "Iris"}, {"letter": "D", "text": "Sclera"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO1", "difficulty": 1, "format": "negative", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The eyeball has three layers: an outer fibrous layer (sclera and cornea), a middle vascular uvea (choroid, ciliary body and iris), and the inner neural retina.", "distractor_explanations": {"A": "The choroid is the vascular part of the uvea lining the back of the eye.", "B": "The ciliary body is the muscular and vascular part of the uvea that secretes aqueous humor.", "C": "The iris is the anterior part of the uvea."}, "source": "Wk5 packet p. 56 (LO1: 'a middle highly vascularized layer called the uvea ... makes up the choroid, ciliary body, and iris'; outer fibrous layer 'includes the sclera and the cornea'); Eye & Retina deck p. 23-25."}, {"id": "m2mk2-q45", "n": 45, "part": 1, "title": null, "stem": "A patient with a cerebellar lesion reaches for a cup in separate jerky steps (shoulder, then elbow, then wrist). What is this sign called?", "options": [{"letter": "A", "text": "Dysmetria"}, {"letter": "B", "text": "Dysdiadochokinesia"}, {"letter": "C", "text": "Dyssynergia"}, {"letter": "D", "text": "Hypotonia"}, {"letter": "E", "text": "Disequilibrium"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO7", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": "wk4-worksheets wk4-cb-ataxia-defs (term -> definition): reversed ask (description -> term)", "explanation": "Dyssynergia is the breakdown of a smooth, coordinated movement into jerky, uncoordinated steps because agonists and antagonists aren't coordinated, so reaching occurs in segments ('decomposition of movement').", "distractor_explanations": {"A": "Dysmetria is misjudging distance (overshoot or undershoot of the target).", "B": "Dysdiadochokinesia is the inability to perform rapid alternating movements smoothly.", "D": "Hypotonia is reduced muscle tone.", "E": "Disequilibrium is difficulty maintaining balance and posture."}, "source": "Wk4 packet p. 30 (LO7: 'Dyssynergia: A breakdown of smooth, coordinated movements into jerky, uncoordinated steps ... when reaching for an object, the arm movement may occur in segments rather than in one smooth motion'), p. 29-30 (other signs)."}, {"id": "m2mk2-q46", "n": 46, "part": 1, "title": null, "stem": "A skull-base fracture cuts the left greater petrosal nerve, drying the left eye and nasal lining. Where would the cut preganglionic fibers have synapsed?", "options": [{"letter": "A", "text": "Ciliary ganglion"}, {"letter": "B", "text": "Otic ganglion"}, {"letter": "C", "text": "Submandibular ganglion"}, {"letter": "D", "text": "Geniculate ganglion"}, {"letter": "E", "text": "Pterygopalatine ganglion"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": null, "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal & Oral LO4", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Preganglionic parasympathetic fibers from CN VII travel in the greater petrosal nerve (then the nerve of the pterygoid canal) to the pterygopalatine ganglion. Postganglionic fibers ride branches of V2 to the nasal and palatal glands and reach the lacrimal gland, so cutting the nerve dries the eye and nasal mucosa.", "distractor_explanations": {"A": "The ciliary ganglion relays CN III parasympathetics to the pupillary sphincter and ciliary muscle.", "B": "The otic ganglion relays CN IX fibers (lesser petrosal nerve) to the parotid gland (general knowledge; the packet doesn't cover it).", "C": "The submandibular ganglion relays chorda tympani fibers to the submandibular and sublingual glands.", "D": "The greater petrosal nerve leaves CN VII at the geniculate ganglion, but that is a sensory ganglion with no autonomic synapse."}, "source": "Wk4 packet p. 43-44 (LO4: 'Preganglionic parasympathetic fibers destined for the pterygopalatine ganglion arise from the facial nerve (CN VII), travel with the greater petrosal nerve ... this ganglion also supplies parasympathetics to the lacrimal gland'; Fig. 6)."}, {"id": "m2mk2-q47", "n": 47, "part": 1, "title": null, "stem": "A 44-year-old woman had a cold last week and then 2 days of continuous vertigo, nausea and unsteadiness, with no change in hearing. Every element of her HINTS+ examination is peripheral, and she is diagnosed with vestibular neuritis. Her nausea is now easing. Which advice will best speed her recovery?", "options": [{"letter": "A", "text": "Bed rest with eyes closed until all vertigo has resolved"}, {"letter": "B", "text": "Early mobilization and vestibular rehabilitation exercises"}, {"letter": "C", "text": "Daily meclizine until every symptom is gone"}, {"letter": "D", "text": "A daily Epley maneuver"}, {"letter": "E", "text": "A low-sodium diet with a diuretic"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Vestibular neuritis is treated supportively. Short-term meclizine may help in the most symptomatic period, but as symptoms improve, early mobilization and vestibular rehabilitation help the brain recalibrate to the asymmetric input; prolonged sedation slows that compensation.", "distractor_explanations": {"A": "Immobility slows the central nervous system's recalibration to the asymmetric vestibular input.", "C": "Vestibular suppressants should be used only briefly; prolonged sedation interferes with compensation and increases fall risk.", "D": "The Epley maneuver treats posterior-canal BPPV (displaced otoconia), not vestibular neuritis.", "E": "Salt restriction and diuretics are used in Meniere disease (endolymphatic hydrops)."}, "source": "Wk5 packet p. 46 (LO5: 'These medications should generally be used only briefly ... prolonged sedation can interfere with the brain's normal vestibular compensation and increase fall risk. As symptoms begin to improve, early mobilization and vestibular rehabilitation are important'), p. 45 (Epley for BPPV); Hearing Loss deck slide 36 (Meniere: diuretics and salt restriction)."}, {"id": "m2mk2-q48", "n": 48, "part": 1, "title": null, "stem": "A girl who can't read the board but reads her book comfortably has an uncorrected acuity of 20/80 in each eye. Which statement is correct?", "options": [{"letter": "A", "text": "She has myopia, and at 20 feet she reads what a person with normal vision can read at 80 feet"}, {"letter": "B", "text": "She has hyperopia, and at 20 feet she reads what a person with normal vision can read at 80 feet"}, {"letter": "C", "text": "She has myopia, and at 80 feet she reads what a person with normal vision can read at 20 feet"}, {"letter": "D", "text": "She has hyperopia and must stand 80 feet away to read the 20-foot line"}, {"letter": "E", "text": "She has astigmatism, and 20/80 meets the definition of legal blindness"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Distance blur with clear near vision is myopia (near-sightedness). The Snellen fraction is test distance over letter size: 20/80 means she reads at 20 feet the letters a normal eye can just read at 80 feet. Normal is 20/20, the driving standard is 20/40, and 20/200 or worse is blindness.", "distractor_explanations": {"B": "Hyperopia blurs near vision with clear distance vision, the opposite of her pattern.", "C": "The numerator is the test distance (20 feet); the denominator is the distance at which a normal eye reads that line.", "D": "Wrong refractive error, and it misreads the Snellen fraction.", "E": "Blindness in the course notes is 20/200 or worse; her pattern (distance blur, near clear) is myopia."}, "source": "Eye Exam deck (995161cb) slides 4-5 (Snellen fraction: numerator test distance, denominator letter size), slide 10 ('Myopia: Without correction: distance blur, near clear; Hyperopia: distance clear, near blur'); Wk5 packet p. 131 (20/20, 20/40 driving, 20/200 blind)."}, {"id": "m2mk2-q49", "n": 49, "part": 1, "title": null, "stem": "A 30-year-old man was poked in the eye by his toddler yesterday. This morning the white of his eye is bright red, but he has no pain and his vision is normal. A photograph is shown. What is the finding?", "options": [{"letter": "A", "text": "Hyphema"}, {"letter": "B", "text": "Conjunctivitis"}, {"letter": "C", "text": "Hypopyon"}, {"letter": "D", "text": "Subconjunctival hemorrhage"}, {"letter": "E", "text": "Corneal ulcer"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/s-subconj.png", "image_needed": true, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO2", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "A solid sheet of blood beneath the conjunctiva over the sclera, sparing the clear cornea, in a painless eye with normal vision after minor trauma, is a subconjunctival hemorrhage.", "distractor_explanations": {"A": "A hyphema is blood layered in the anterior chamber in front of the iris; here the iris and pupil are clear and the blood lies over the sclera.", "B": "Conjunctivitis gives diffuse injected vessels with discharge, not a solid sheet of blood under a clear conjunctiva.", "C": "A hypopyon is a layer of white inflammatory cells in the anterior chamber.", "E": "A corneal ulcer is a painful, opaque defect on the cornea; this cornea is clear and the eye is painless."}, "source": "Eye Exam deck (995161cb) slide 26 ('Subconjunctival Hemorrhage: Blood pooling under conjunctiva; Trauma'; photo used here), slides 25 (conjunctivitis), 28-31 (cornea), 32 (hypopyon, hyphema); Wk5 packet p. 130.", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/s-subconj.png", "options": {"A": "Not shown: hyphema is on slide 32", "B": "Not this photo: conjunctivitis is the slide's 'Conjunctivitis & Keratoconjunctivitis' bullet (diffuse injection with discharge)", "C": "Not shown: hypopyon is on slide 32", "D": "Faculty slide heading 'Subconjunctival Hemorrhage: Blood pooling under conjunctiva; Trauma' (this photo)", "E": "Not shown: corneal ulcer, slides 28-31"}, "note": "The question photo is unlabeled; the annotated version is slide 26 with its bullets.", "how": "Faculty slide the photo comes from, with its bullets. Amber box with star = the slide text that answers the question. Amber outline = the photo used in the question.", "marked": [], "status": "built 2026-11-20 in Cowork: qbank/midterm2-mock2-images/annotated/s-subconj.png"}}, {"id": "m2mk2-q50", "n": 50, "part": 1, "title": null, "stem": "A 27-year-old medical student notices a fine tremor of both hands when she holds her arms straight out in front of her, especially after several cups of coffee before an exam. There is no tremor at rest, and finger-to-nose testing is accurate. Which best describes her tremor?", "options": [{"letter": "A", "text": "Resting tremor from loss of nigral dopamine"}, {"letter": "B", "text": "Intention tremor from cerebellar dysfunction"}, {"letter": "C", "text": "Postural (enhanced physiologic) tremor, worsened by adrenergic activity"}, {"letter": "D", "text": "Task-specific tremor from focal dystonia"}, {"letter": "E", "text": "Asterixis from a metabolic encephalopathy"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "TBL Abnormal Movement Case 5 (bilateral action tremor -> tremor type): new case (postural tremor with caffeine, accurate finger-to-nose) and other tremor type", "explanation": "A tremor brought out by holding the arms against gravity is a postural tremor. Physiological tremor has a postural component that is worsened by stress and the adrenergic system and by stimulants such as caffeine, and improves with beta-blockers.", "distractor_explanations": {"A": "A Parkinson resting tremor is present at rest and suppressed by movement; she has none at rest.", "B": "Intention tremor worsens as the limb nears a target on finger-to-nose testing, which is accurate here.", "D": "Task-specific tremor appears only during one skilled task, such as writing or playing an instrument.", "E": "Asterixis is lapses of posture in metabolic encephalopathy, not a fine rhythmic tremor in a healthy student."}, "source": "Tremor deck (0088ac9b) slide 6 ('Postural Tremor: Elicited by maintaining Upper extremity position against gravity; Physiological tremor has postural component; Worsened by stress or adrenergic system; Improved by beta-blockers'), slides 4, 8 (resting, intention and task-specific tremor), slide 9 (stimulants: amphetamines, caffeine); Wk4 packet p. 75 (asterixis)."}, {"id": "m2mk2-q51", "n": 51, "part": 2, "title": "Gross anatomy lab image: Midline Cavities", "stem": "Identify the structure indicated by the arrow on this coronal CT.", "options": [{"letter": "A", "text": "Ethmoid sinus"}, {"letter": "B", "text": "Sphenoid sinus"}, {"letter": "C", "text": "Maxillary sinus"}, {"letter": "D", "text": "Sphenoethmoidal recess"}, {"letter": "E", "text": "None of these"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/lab-mid-1.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Midline Cavities", "topic": "Midline Cavities", "note": null, "blueprint_category": "Anatomy Lab: Midline Cavities", "learning_objective": "Lab 4 (11/17) LO1-2 (bold structures on CT)", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is in the sphenoid sinus, the air space in the body of the sphenoid, which lies above the nasopharynx on this posterior coronal section. It drains into the sphenoethmoidal recess, and the pituitary is approached through it.", "distractor_explanations": {"A": "The ethmoid air cells lie between the orbits on more anterior coronal sections.", "C": "The maxillary sinuses sit in the maxillae, lateral to the nasal cavity and below the orbits.", "D": "The sphenoethmoidal recess is the nasal-cavity space above the superior concha into which the sphenoid sinus opens, not the sinus itself.", "E": "The arrowed structure is listed (sphenoid sinus)."}, "source": "Instructor deck Wk 5 (NeuroBlock 2026, MidlineCavitiesOrbitEar::LO2), card MDCAV26_CT_POSTERIOR_SINUS ('The sphenoid sinus lies above the nasopharynx on this posterior coronal section'; single label 'Sphenoid sinus'); Lab 4 structure list (bold: sphenoid sinus); Wk4 packet p. 39, 41.", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/lab-mid-1.png", "options": {"A": "not labeled in this figure", "B": "Faculty label 'Sphenoid sinus' (arrowed)", "C": "not labeled in this figure", "D": "not labeled in this figure", "E": "not applicable (the key is listed)"}, "note": "The instructor card has one label. The question inpainted out the card's cyan arrow and placed the amber arrow at that arrow's tip; the CT is upscaled 2x.", "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["B"], "status": "built 2026-11-20 in Cowork: qbank/midterm2-mock2-images/annotated/lab-mid-1.png"}}, {"id": "m2mk2-q52", "n": 52, "part": 2, "title": "Gross anatomy lab image: Midline Cavities", "stem": "Identify the structure indicated by the arrow.", "options": [{"letter": "A", "text": "Palatoglossal fold"}, {"letter": "B", "text": "Palatopharyngeal fold"}, {"letter": "C", "text": "Palatine tonsil"}, {"letter": "D", "text": "Uvula"}, {"letter": "E", "text": "None of these"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/lab-mid-2.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Midline Cavities", "topic": "Midline Cavities", "note": null, "blueprint_category": "Anatomy Lab: Midline Cavities", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the palatine tonsil in its fossa in the lateral wall of the oropharynx, between the palatoglossal fold (arch) in front and the palatopharyngeal fold (arch) behind.", "distractor_explanations": {"A": "The palatoglossal fold is the anterior arch in front of the tonsil.", "B": "The palatopharyngeal fold is the posterior arch behind the tonsil.", "D": "The uvula hangs in the midline from the soft palate.", "E": "The arrowed structure is listed (palatine tonsil)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 11 (Grant's Dissector 7.84), 'Palatine tonsil' label; Wk4 packet p. 55 (palatine tonsil between the palatoglossal and palatopharyngeal arches).", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/lab-mid-2.png", "options": {"A": "Labeled 'Palatoglossal fold'", "B": "Labeled 'Palatopharyngeal fold'", "C": "Labeled 'Palatine tonsil' (arrowed)", "D": "Labeled 'Uvula'", "E": "not applicable (the key is listed)"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"], "status": "built 2026-11-20 in Cowork: qbank/midterm2-mock2-images/annotated/lab-mid-2.png"}}, {"id": "m2mk2-q53", "n": 53, "part": 2, "title": "Gross anatomy lab image: Midline Cavities", "stem": "Identify the structure indicated by the arrow in this sagittal view of the larynx.", "options": [{"letter": "A", "text": "Aditus (laryngeal inlet)"}, {"letter": "B", "text": "Epiglottis"}, {"letter": "C", "text": "Vestibular fold"}, {"letter": "D", "text": "Ventricle"}, {"letter": "E", "text": "None of these"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock2-images/lab-mid-3.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Midline Cavities", "topic": "Midline Cavities", "note": null, "blueprint_category": "Anatomy Lab: Midline Cavities", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the aditus, labeled 'Laryngeal inlet' in Grant's (the green dashed line): the opening from the laryngopharynx into the larynx, framed by the epiglottis and the aryepiglottic folds.", "distractor_explanations": {"B": "The epiglottis is the leaf-shaped cartilage at the front-top of the inlet, anterior to the arrow.", "C": "The vestibular (false vocal) fold lies lower, just above the ventricle.", "D": "The ventricle is the recess between the vestibular and vocal folds.", "E": "The arrowed structure is listed (the aditus)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 18 (Grant's Dissector 7.91), 'Laryngeal inlet' label; Wk4 packet p. 56 ('The entrance into the larynx from the pharynx is through the aditus (laryngeal inlet), which is formed by the epiglottis and the aryepiglottic folds').", "annotation": {"image": "qbank/midterm2-mock2-images/annotated/lab-mid-3.png", "options": {"A": "Labeled 'Laryngeal inlet' (Grant's name for the aditus; arrowed)", "B": "Labeled 'Epiglottis'", "C": "Labeled 'Vestibular fold'", "D": "Labeled 'Ventricle'", "E": "not applicable (the key is listed)"}, "note": "The aryepiglottic fold (also on the lab list) is left out of the choices because its leader ends on the same dashed line just below the arrow.", "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn
