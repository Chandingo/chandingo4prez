elp; cochlear implants stimulate the auditory nerve electrically and are used for bilateral profound sensorineural loss.", "distractor_explanations": {"B": "Stapedectomy treats a fixed stapes (otosclerosis), a conductive cause.", "C": "Tubes drain middle ear fluid, a conductive problem; his loss is in the cochlea.", "D": "Eardrum repair corrects a perforation, a conductive cause.", "E": "These send sound through bone to the cochlea, so they need a working cochlea; his cochleas don't respond even to strong amplification."}, "source": "Wk5 packet p. 18 ('The infectious agents responsible for meningitis ... access the cochlea via cerebrospinal fluid and subsequently damage inner ear hair cells'); p. 28 ('Hearing aids are devices that amplify sound, but they do not reverse hearing loss. Cochlear implants are surgically implanted devices that use electrical stimulation to facilitate sound perception. These implants are typically used with individuals who have bilateral profound sensorineural hearing loss'; surgery for conductive causes such as a fixed ossicle or perforation); Hearing Loss deck slide 40."}, {"id": "m2mk3-q28", "n": 28, "part": 1, "title": null, "stem": "In essential tremor, the hyperactive central oscillator thought to drive the tremor lies in which structure?", "options": [{"letter": "A", "text": "Subthalamic nucleus"}, {"letter": "B", "text": "Red nucleus"}, {"letter": "C", "text": "Substantia nigra pars compacta"}, {"letter": "D", "text": "Primary motor cortex"}, {"letter": "E", "text": "Inferior olive"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course names hyperactive central oscillators that fire synchronized bursts: in the basal ganglia for parkinsonian tremor and in the inferior olive for essential tremor (with very mild cerebellar Purkinje cell loss).", "distractor_explanations": {"A": "The subthalamic nucleus is part of the basal ganglia; the course places the parkinsonian (not essential) oscillator in the basal ganglia.", "B": "Damage to pathways through the red nucleus causes a rubral (wing-beating) tremor, not essential tremor.", "C": "Loss of nigral dopamine neurons underlies Parkinson disease; DaTscan is normal in essential tremor.", "D": "The course doesn't place a tremor oscillator in the motor cortex."}, "source": "Wk4 packet p. 86 ('Hyperactive central oscillators in the thalamus, basal ganglia, and inferior olive ... These hyperactive oscillators are in the basal ganglia for Parkinsonian tremor or in the inferior olive for essential tremor'); p. 85 (ET: 'very mild Purkinje cell loss'); Tremor deck (0088ac9b) slide 10."}, {"id": "m2mk3-q29", "n": 29, "part": 1, "title": null, "stem": "A woman's right pupil is larger than her left, and the difference is greater in bright light than in dim light. Where is the lesion?", "options": [{"letter": "A", "text": "Sympathetic supply to the right pupillary dilator"}, {"letter": "B", "text": "Sympathetic supply to the left pupillary dilator"}, {"letter": "C", "text": "Parasympathetic supply to the right pupillary sphincter"}, {"letter": "D", "text": "Parasympathetic supply to the left pupillary sphincter"}, {"letter": "E", "text": "The right optic nerve"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Anisocoria that is greater in bright light means one pupil can't constrict: a lesion of the parasympathetic pathway to the sphincter, and the abnormal pupil is the larger one (here the right). Causes include CN III palsy, Adie's tonic pupil, iris damage and pharmacologic dilation.", "distractor_explanations": {"A": "A sympathetic lesion makes the affected pupil smaller, with anisocoria greatest in the dark.", "B": "A left Horner pupil would be small, but anisocoria from it is greatest in dim light, not bright light.", "D": "A parasympathetic lesion leaves the affected pupil larger; here the larger pupil is the right.", "E": "An optic nerve lesion causes a relative afferent defect; pupil sizes stay equal because of the consensual reflex."}, "source": "Eye Exam deck (995161cb) slide 53 ('Anisocoria Greater in Bright Light • Lesion in parasympathetic pathway • Decreased signal to iris sphincter'); slide 55 ('Anisocoria Greater in Dim Light • Lesion in sympathetic pathway'); Sympathetics deck (f6b7eb7b) slide 27 ('issue on the side of the larger pupil'); Wk5 packet p. 85; p. 75 (consensual reflex keeps pupils equal)."}, {"id": "m2mk3-q30", "n": 30, "part": 1, "title": null, "stem": "A small lesion destroys the globose and emboliform (interposed) nuclei on one side. Cerebellar modulation of which descending tract is most directly lost?", "options": [{"letter": "A", "text": "Lateral vestibulospinal tract"}, {"letter": "B", "text": "Reticulospinal tract"}, {"letter": "C", "text": "Lateral corticospinal tract, via the thalamus"}, {"letter": "D", "text": "Rubrospinal tract"}, {"letter": "E", "text": "Tectospinal tract"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q8 (truncal ataxia -> fastigial-reticular tract) and wk4-worksheets wk4-cb-peduncles row 2 (globose-emboliform-rubro pathway -> function): other nucleus than Quiz #4, and reversed ask from the worksheet (nucleus lesion -> descending tract)", "explanation": "The interposed nuclei (globose and emboliform) project through the superior cerebellar peduncle to the contralateral red nucleus, which gives rise to the rubrospinal tract for distal limb coordination.", "distractor_explanations": {"A": "The vestibulospinal tracts are modulated by the fastigial nucleus through the inferior peduncle.", "B": "The reticulospinal tract is modulated by the fastigial nucleus (fastigial-reticular pathway).", "C": "The dentate nucleus reaches the corticospinal system through the thalamus and motor cortex (dentatothalamic pathway).", "E": "The tectospinal tract arises in the superior colliculus; it isn't a target of the interposed nuclei."}, "source": "Wk4 packet p. 26 (efferent table: 'Globose- Emboliform- Rubral Interposed > Superior Rubrospinal Tract'); p. 27 ('Interposed Nuclei ... both project to the contralateral red nucleus')."}, {"id": "m2mk3-q31", "n": 31, "part": 1, "title": null, "stem": "While his blood alcohol is still rising during a night of heavy drinking, a man has brief vertigo and nystagmus whenever he lies on one side. What makes his semicircular ducts sensitive to head position?", "options": [{"letter": "A", "text": "Otoconia from the utricle have fallen into the posterior semicircular duct"}, {"letter": "B", "text": "Alcohol entering the cupulae first makes them less dense than the surrounding endolymph"}, {"letter": "C", "text": "Endolymph volume and pressure have increased (hydrops)"}, {"letter": "D", "text": "Alcohol has destroyed hair cells in the cristae"}, {"letter": "E", "text": "Alcohol leaving the cupulae first makes them denser than the endolymph"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": "Mock #2 Q29 asked the normal cupula/endolymph density match (static tilt); this item asks the alcohol-induced change.", "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO6-7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Normally the cupula has the same density as endolymph, so gravity doesn't deflect it. As blood alcohol rises, alcohol enters the cupulae before the endolymph, making them lighter; in certain head positions they try to float, deflecting the hair cells and causing positional vertigo and nystagmus until the concentrations equalize.", "distractor_explanations": {"A": "That is BPPV, a mechanical problem after age or trauma, not a temporary effect of rising blood alcohol.", "C": "Hydrops is Ménière disease: spontaneous attacks with hearing loss and tinnitus, not position-triggered vertigo while drinking.", "D": "Lost hair cells wouldn't create a new sensitivity to head position, and the effect passes in hours.", "E": "That happens later, as blood alcohol falls, and gives nystagmus in the opposite direction."}, "source": "Wk5 packet p. 35 ('A normal cupula has the same density as its endolymphatic surroundings'; 'As blood alcohol levels rise, alcohol initially leaves the capillaries and infiltrates the cupula, making them less dense than surrounding endolymph ... Subsequently, after blood alcohol levels drop, alcohol leaves the cupula first. This makes them more- dense than endolymph and causes several hours of positionally dependent nystagmus in the opposite direction')."}, {"id": "m2mk3-q32", "n": 32, "part": 1, "title": null, "stem": "A 71-year-old woman had paralytic polio in her right leg at age 6 and regained most of her strength. Over the past 2 years that leg has become weaker and she tires easily; she now rests halfway up the stairs, and the right calf looks thinner than the left. Sensation is normal and there are no upper motor neuron signs. What is the most likely explanation?", "options": [{"letter": "A", "text": "Reactivation of latent poliovirus in anterior horn cells"}, {"letter": "B", "text": "New degeneration of corticospinal neurons, as in ALS"}, {"letter": "C", "text": "Autoantibodies against acetylcholine receptors"}, {"letter": "D", "text": "Loss of SMN1 gene function"}, {"letter": "E", "text": "Failure of motor units that enlarged after the original infection"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Years after paralytic polio, survivors can develop new weakness, fatigue and reduced endurance (post-polio syndrome). Surviving motor neurons had sprouted to reinnervate orphaned fibers, making very large motor units, and these later fail. It isn't a new viral infection.", "distractor_explanations": {"A": "The course says post-polio syndrome is not a new poliovirus infection.", "B": "ALS would add upper motor neuron signs and spread to other regions; she has none.", "C": "Myasthenia gravis gives fatigable ocular and bulbar weakness, not late weakness confined to the old polio limb.", "D": "SMN1 loss causes inherited spinal muscular atrophy, which isn't related to past polio."}, "source": "Wk4 packet p. 112 ('Years or decades later, some survivors of paralytic polio develop post-polio syndrome, with new or worsening weakness, fatigue, and reduced endurance. This is thought to reflect failure of previously enlarged motor units rather than a new poliovirus infection')."}, {"id": "m2mk3-q33", "n": 33, "part": 1, "title": null, "stem": "A 36-year-old woman with multiple sclerosis has nystagmus in which her eyes drift back and forth at equal speeds with no distinct fast phase, in several directions of gaze. Her hearing is normal. Where is the lesion most likely to be?", "options": [{"letter": "A", "text": "Central: the flocculonodular lobe or its brainstem connections"}, {"letter": "B", "text": "Left horizontal semicircular canal"}, {"letter": "C", "text": "Right vestibular nerve"}, {"letter": "D", "text": "Posterior semicircular canal, from displaced otoconia"}, {"letter": "E", "text": "Left utricular macula"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Nystagmus", "topic": "Nystagmus", "note": null, "blueprint_category": "Nystagmus", "learning_objective": "Nystagmus LO3, LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course contrasts peripheral nystagmus, unidirectional with fast and slow phases (jerk), with central nystagmus, such as from damage to the flocculonodular lobe: pendular, with equal-velocity phases in any direction, and possibly gaze-evoked. Multiple sclerosis is one of the listed CNS causes.", "distractor_explanations": {"B": "Peripheral (labyrinthine) lesions cause unidirectional jerk nystagmus with fast and slow phases.", "C": "A vestibular nerve lesion is peripheral and causes unidirectional jerk nystagmus.", "D": "BPPV causes brief, position-triggered upbeat-torsional jerk nystagmus.", "E": "The utricle senses linear acceleration and tilt; it isn't the course's source of pendular nystagmus."}, "source": "Nystagmus ILM (TopHat, nystagmus_ilm_tophat.pdf) p. 9 ('Nystagmus due to peripheral lesions is typically unidirectional and has a jerky quality (fast and slow phases), whereas nysgatmus due to central lesions (such as damage to the flocculonodular lobe of the cerebellum) is described as pendular'); p. 11 (CNS causes include MS)."}, {"id": "m2mk3-q34", "n": 34, "part": 1, "title": null, "stem": "A 4-month-old girl has 3 days of constipation, poor feeding, a weak cry and a weak suck. She is floppy, with poor head control, and her pupils react sluggishly. Her parents sometimes dipped her pacifier in honey. Besides respiratory support, which specific treatment is indicated?", "options": [{"letter": "A", "text": "Equine-derived heptavalent botulinum antitoxin"}, {"letter": "B", "text": "Pyridostigmine"}, {"letter": "C", "text": "Human botulism immune globulin (BabyBIG)"}, {"letter": "D", "text": "An intravenous aminoglycoside"}, {"letter": "E", "text": "Nusinersen"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO9-10", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Constipation, poor feeding, weak cry and suck, hypotonia and sluggish pupils after honey exposure are infant botulism. The course table lists human botulism immune globulin IV (BabyBIG) as the specific treatment for typical infant intestinal botulism, along with respiratory and feeding support.", "distractor_explanations": {"A": "Equine antitoxin is the course's treatment for non-infant botulism; typical infant botulism is treated with human botulism immune globulin.", "B": "Pyridostigmine treats myasthenia gravis; it doesn't neutralize toxin.", "D": "Aminoglycosides impair neuromuscular transmission and should be avoided in botulism.", "E": "Nusinersen modifies SMN2 splicing for spinal muscular atrophy; constipation, honey exposure and sluggish pupils point to botulism."}, "source": "Wk4 packet p. 101 ('Infant botulism often presents somewhat differently. Early clues include constipation, poor feeding, a weak cry, diminished suck'; 'Honey exposure is a classic association'); p. 102 table ('Typical infant intestinal botulism | Human botulism immune globulin IV, BabyBIG'; adults: 'Equine-derived heptavalent botulinum antitoxin'); p. 102 ('Medications that further impair neuromuscular transmission should be avoided ... aminoglycosides and magnesium')."}, {"id": "m2mk3-q35", "n": 35, "part": 1, "title": null, "stem": "A 28-year-old boxer notices flashing lights, new floaters and a dark curtain over the upper part of his vision in one eye after a bout. The neural retina has separated from the pigment epithelium. Why must it be reattached as quickly as possible?", "options": [{"letter": "A", "text": "The central retinal artery has torn, so the inner retina is infarcting"}, {"letter": "B", "text": "Ganglion cell axons are being crushed at the lamina cribrosa"}, {"letter": "C", "text": "Vitreous enters the anterior chamber and blocks the trabecular meshwork"}, {"letter": "D", "text": "The detached photoreceptors have lost their supply from the choroidal capillaries"}, {"letter": "E", "text": "The pigment epithelium dies first because it loses its retinal blood supply"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": "Mock #1 Q10 asked the embryologic origin of the two layers in a myopic detachment; this item asks why it is urgent (blood supply).", "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO6", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk5-slide-questions wk5-eye-retina-p43-c (breach between RPE and photoreceptors -> what happens): reversed ask in a case (detachment -> why it is urgent)", "explanation": "The neural retina and pigment epithelium come from the two layers of the optic cup, so the plane between them is where detachment happens. Photoreceptors, the outer retina, are nourished by the choroidal capillaries through the pigment epithelium. Detachment pulls them away from that supply, so they must be pressed back quickly to avoid ischemic, permanent vision loss.", "distractor_explanations": {"A": "The central retinal artery runs on the inner surface with the neural retina and isn't separated by a detachment.", "B": "Axon crush at the optic nerve head is a mechanism of angle-closure glaucoma, not detachment.", "C": "That isn't how a detachment threatens vision; the photoreceptors are at risk.", "E": "The pigment epithelium stays on the choroid and keeps its supply; the separated photoreceptors are the cells at risk."}, "source": "Wk5 packet p. 64 ('retinal detachment pulls the photoreceptors away from their choroidal capillary arterial supply. In the event of a detached retina, the photoreceptors must be pressed back into the RPE as quickly as possible to avoid permanent vision loss due to ischemia'); p. 63 (detachment plane between RPE and photoreceptors; 'e.g. in instances of head trauma'); p. 127 ('the outer retina, including photoreceptors, relies on the choroidal circulation via the retinal pigment epithelium')."}, {"id": "m2mk3-q36", "n": 36, "part": 1, "title": null, "stem": "A 47-year-old woman has had a tumor removed near the right jugular foramen. When the right side of her posterior pharyngeal wall is touched with a tongue blade, she feels it, but the right side of her soft palate and pharynx does not contract and the uvula pulls to the left. Touching the left side gives the same result. Which nerve is damaged?", "options": [{"letter": "A", "text": "Right glossopharyngeal nerve"}, {"letter": "B", "text": "Right vagus nerve"}, {"letter": "C", "text": "Left vagus nerve"}, {"letter": "D", "text": "Left glossopharyngeal nerve"}, {"letter": "E", "text": "Right hypoglossal nerve"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": null, "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx & Larynx LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "In the gag reflex CN IX is the afferent and CN X the efferent. She feels the touch on both sides (CN IX intact), but the right palate and pharyngeal muscles don't contract (right CN X, which supplies the pharyngeal muscles and the levator veli palatini). The intact left side pulls the uvula to the left.", "distractor_explanations": {"A": "CN IX is the afferent limb of the gag reflex; she feels the touch, so it works.", "C": "The right side fails to contract, so the right vagus is the damaged efferent; the uvula pulls toward the intact left side.", "D": "Sensation is intact on both sides, so neither CN IX is damaged.", "E": "CN XII supplies tongue muscles, not the palate or pharynx."}, "source": "Wk4 packet p. 66 ('The vagus nerve (CN X: gag reflex efferents) supplies motor innervation to all of the pharyngeal muscles except the stylopharyngeus'; 'a tendency for CN IX to cover more superior areas (gag reflex afferent)'); p. 50 ('motor supply to one palate muscle, the levator veli palatine, is from the vagus nerve (CN X). Thus, upward movement of the palate to say ahhh tests this nerve'). Uvula deviation toward the intact side: general knowledge."}, {"id": "m2mk3-q37", "n": 37, "part": 1, "title": null, "stem": "Besides recurrent spontaneous vertigo attacks lasting 20 minutes to 12 hours and fluctuating ear symptoms, definite Ménière disease requires which documented finding?", "options": [{"letter": "A", "text": "Positional nystagmus on the Dix-Hallpike maneuver"}, {"letter": "B", "text": "A catch-up saccade on head-impulse testing"}, {"letter": "C", "text": "An enhancing mass in the internal auditory canal on MRI"}, {"letter": "D", "text": "Conductive hearing loss with an air-bone gap"}, {"letter": "E", "text": "Sensorineural hearing loss on audiometry"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": "Mock #1 Q33 asked the Ménière mechanism (hydrops); this item asks the diagnostic criteria.", "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO8", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course's criteria for definite Ménière disease are at least two spontaneous vertigo episodes lasting 20 minutes to 12 hours, documented sensorineural hearing loss on audiometry, and fluctuating auditory symptoms in the affected ear.", "distractor_explanations": {"A": "A positive Dix-Hallpike identifies BPPV, with attacks lasting under a minute.", "B": "A catch-up saccade during an acute vestibular syndrome suggests vestibular neuritis.", "C": "An enhancing mass is a vestibular schwannoma, a different cause of asymmetric hearing loss.", "D": "Ménière hearing loss is sensorineural, not conductive."}, "source": "Wk5 packet p. 48 ('For definite Ménière disease, the patient typically has at least two spontaneous episodes of vertigo lasting 20 minutes to 12 hours, documented sensorineural hearing loss on audiometry, and fluctuating auditory symptoms in the affected ear')."}, {"id": "m2mk3-q38", "n": 38, "part": 1, "title": null, "stem": "A 32-year-old woman with multiple sclerosis develops a slow, large-amplitude tremor of one arm that appears when she holds her arms out and flaps like a wing. MRI shows a new lesion in the midbrain tegmentum. Damage to pathways through which structure best explains this tremor?", "options": [{"letter": "A", "text": "Red nucleus"}, {"letter": "B", "text": "Substantia nigra"}, {"letter": "C", "text": "Inferior olive"}, {"letter": "D", "text": "Subthalamic nucleus"}, {"letter": "E", "text": "Oculomotor nucleus"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Multiple sclerosis can damage pathways through the red nucleus, giving a slow, high-amplitude postural tremor likened to wing-beating, called rubral tremor.", "distractor_explanations": {"B": "Nigral damage gives a parkinsonian resting tremor, which settles with action and posture.", "C": "The inferior olive is the course's oscillator for essential tremor, a bilateral kinetic tremor.", "D": "A subthalamic lesion causes hemiballismus: violent flinging movements, not a postural tremor.", "E": "The oculomotor nucleus controls eye movements; it doesn't produce limb tremor."}, "source": "Wk4 packet p. 83 ('Multiple sclerosis for example can affect the pathways passing through the red nucleus of the brainstem and cause a postural tremor either unilaterally or bilaterally, that has slow frequency high amplitude features that has been likened to a wing-beating tremor or referred to as a rubral tremor')."}, {"id": "m2mk3-q39", "n": 39, "part": 1, "title": null, "stem": "A 62-year-old woman with open-angle glaucoma has used a once-daily drop in her right eye for a year. She notices that her right iris has turned darker brown, her right eyelashes are longer and thicker, and that eye looks slightly red. How does this drop lower her intraocular pressure?", "options": [{"letter": "A", "text": "It blocks beta receptors on the ciliary epithelium, reducing aqueous secretion"}, {"letter": "B", "text": "It inhibits carbonic anhydrase in the ciliary epithelium"}, {"letter": "C", "text": "It contracts the ciliary muscle, pulling open the trabecular meshwork"}, {"letter": "D", "text": "It increases uveoscleral outflow through prostaglandin FP receptors"}, {"letter": "E", "text": "It stimulates alpha-2 receptors, reducing aqueous production"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Glaucoma", "topic": "Glaucoma", "note": "Mock #2 Q5 keyed timolol (asthma contraindication); TBL iRAT Q5 keyed acetazolamide (CKD). This item keys latanoprost from its side effects.", "blueprint_category": "Glaucoma", "learning_objective": "Glaucoma LO3; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Latanoprost", "laterality": false, "reworks": null, "explanation": "Darker iris pigmentation, eyelash growth and conjunctival redness are the drug-list side effects of the prostaglandin analogs latanoprost and bimatoprost. These FP-receptor agonists lower pressure by increasing the pressure-independent uveoscleral outflow.", "distractor_explanations": {"A": "Beta-blocker drops (timolol) cause bronchospasm and bradycardia, not iris darkening or eyelash growth.", "B": "Carbonic anhydrase inhibitors cause malaise, fatigue and metabolic effects, not iris pigmentation.", "C": "Cholinergic drops (pilocarpine) cause miosis, dim vision and brow ache.", "E": "Alpha-2 agonists (apraclonidine) cause ocular allergy, not darker irises and longer lashes."}, "source": "Drug list (Latanoprost/Bimatoprost: 'Prostaglandin FP receptor agonist (Increases uveoscleral (pressure-independent) outflow)'; side effects 'Eyelash growth, iridial pigmentation, conjunctival hyperemia'); Wk5 packet p. 101 ('Prostaglandin Analogs ... these increase uveoscleral outflow ... Latanoprost, bimatoprost, and travoprost are once daily eyedrops'; 'side effects - which include increase in eyelash growth')."}, {"id": "m2mk3-q40", "n": 40, "part": 1, "title": null, "stem": "Dopamine from arcuate nucleus neurons reaches the anterior pituitary through the median eminence. If a pituitary stalk injury interrupts this pathway, which hormone rises?", "options": [{"letter": "A", "text": "Growth hormone"}, {"letter": "B", "text": "Adrenocorticotropic hormone (ACTH)"}, {"letter": "C", "text": "Prolactin"}, {"letter": "D", "text": "Thyroid-stimulating hormone (TSH)"}, {"letter": "E", "text": "Luteinizing hormone (LH)"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO9 (dopamine pathways, deck slides 31-36)", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The tuberoinfundibular pathway runs from the arcuate nucleus to the median eminence, and its dopamine prevents prolactin release from the anterior pituitary. Losing it removes that brake, so prolactin rises.", "distractor_explanations": {"A": "Dopamine from the tuberoinfundibular pathway restrains prolactin, not growth hormone.", "B": "ACTH release isn't held down by tuberoinfundibular dopamine.", "D": "TSH isn't the hormone this dopamine pathway inhibits.", "E": "LH isn't the hormone this dopamine pathway inhibits."}, "source": "BG deck (4285501b) slide 35 ('Tuberoinfundibular pathway Goes from the arcuate nucleus of the hypothalamus that projects to the median eminence ... Dopamine prevents the release of prolactin from the anterior pituitary'); slide 36 summary."}, {"id": "m2mk3-q41", "n": 41, "part": 1, "title": null, "stem": "Which nucleus contains neurons that compare the arrival times of a sound at the two ears, allowing the sound to be localized?", "options": [{"letter": "A", "text": "Cochlear nuclei"}, {"letter": "B", "text": "Inferior colliculus"}, {"letter": "C", "text": "Medial geniculate nucleus"}, {"letter": "D", "text": "Spiral ganglion"}, {"letter": "E", "text": "Superior olivary nucleus"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO11", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": "wk5-slide-questions wk5-vestibular-s33-q2 (roles of the superior olivary nucleus): reversed ask (sound-localization function -> nucleus)", "explanation": "Most superior olivary neurons receive input from the cochlear nuclei of both sides (crossing in the trapezoid body) and are tuned to tiny interaural time differences, the basis of sound localization.", "distractor_explanations": {"A": "The cochlear nuclei receive input from one ear only (ipsilateral CN VIII); comparison of the two ears starts above them.", "B": "The inferior colliculus is a later relay reached through the lateral lemniscus.", "C": "The medial geniculate nucleus is the thalamic relay to auditory cortex.", "D": "The spiral ganglion holds the cell bodies of CN VIII primary afferents, before any binaural comparison."}, "source": "Wk5 packet p. 8 ('The superior olivary nucleus is particularly important for sound localization. Most of its cells receive input from the cochlear nuclei of both sides and (in us) are exquisitely tuned to precise differences in the time of arrival of a sound at the two ears'); p. 7 ('Cochlear nerve fibers end ipsilaterally')."}, {"id": "m2mk3-q42", "n": 42, "part": 1, "title": null, "stem": "A 38-year-old woman with multiple sclerosis cannot look to the left with either eye: on attempted left gaze, the left eye doesn't abduct and the right eye doesn't adduct. When she looks at a near target, the right eye adducts normally. Where is the lesion?", "options": [{"letter": "A", "text": "Left abducens nerve in the subarachnoid space"}, {"letter": "B", "text": "Left abducens nucleus"}, {"letter": "C", "text": "Left medial longitudinal fasciculus"}, {"letter": "D", "text": "Right medial longitudinal fasciculus"}, {"letter": "E", "text": "Right oculomotor nerve"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": "Mock #1 Q46 was an MLF lesion (INO); this item is the abducens nucleus (horizontal gaze palsy).", "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO2-3, LO6", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "The abducens nucleus holds both the motor neurons for the ipsilateral lateral rectus and the interneurons that cross into the MLF to drive the contralateral medial rectus. Destroying it causes a horizontal gaze palsy toward the lesion side. The medial rectus still works in convergence, because that command doesn't come through the abducens nucleus.", "distractor_explanations": {"A": "A nerve lesion paralyzes only the left lateral rectus; the right eye would still adduct on left gaze.", "C": "A left MLF lesion impairs adduction of the left eye on right gaze, while abduction on left gaze stays intact.", "D": "A right MLF lesion would leave left-eye abduction intact; here the left eye can't abduct.", "E": "A right CN III palsy would also stop convergence and cause ptosis and a down-and-out eye."}, "source": "Wk5 packet p. 111 ('the abducens nucleus holds cell bodies for both the CN VI fibers and the associated median longitudinal fasciculus interneurons. Damage at the nucleus itself will show not only ipsilateral lateral gaze paralysis ... but also contralateral medial rectus paralysis during attempted medial gaze. Clinically, this manifests as a horizontal gaze palsy'; 'Convergence is the best example of how the medial rectus is still functional'); p. 112 (internuclear ophthalmoplegia)."}, {"id": "m2mk3-q43", "n": 43, "part": 1, "title": null, "stem": "A 10-year-old boy has had repeated eye blinking, shoulder shrugging, sniffing and throat clearing nearly every day for 14 months. He can hold them back briefly in class, but a flurry follows. His examination and brain MRI are normal. Which condition commonly accompanies his disorder?", "options": [{"letter": "A", "text": "Attention-deficit/hyperactivity disorder"}, {"letter": "B", "text": "Wilson disease"}, {"letter": "C", "text": "Absence epilepsy"}, {"letter": "D", "text": "Schizophrenia"}, {"letter": "E", "text": "Narcolepsy"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": null, "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Multiple motor tics plus vocal tics (sniffing, throat clearing), present for more than a year and starting before 18, with a normal MRI, meet criteria for Tourette disorder. The course lists ADHD (especially in boys), anxiety and OCD as the common comorbid conditions.", "distractor_explanations": {"B": "Wilson disease is a copper disorder with liver disease and Kayser-Fleischer rings; it isn't a comorbidity of tic disorders.", "C": "Absence seizures are brief lapses of awareness, not suppressible tics, and aren't the listed comorbidity.", "D": "Schizophrenia isn't among the conditions the course links to Tourette disorder.", "E": "Narcolepsy isn't a recognized comorbidity of Tourette disorder in the course."}, "source": "Wk4 packet p. 77 (Tourette criteria: 'two or more motor tics ... and at least one vocal tic'; 'tics for at least a year'; 'begin before age 18 years'); p. 78 ('It is common for people with TS to have comorbid conditions, particularly attention- deficit/hyperactivity disorder (ADHD), anxiety, and obsessive-compulsive disorder (OCD)'); Hyperkinetic deck (7d8e90db) slide 19 ('Associated conditions - ADHD males - OCD females')."}, {"id": "m2mk3-q44", "n": 44, "part": 1, "title": null, "stem": "A dark-adapted rod absorbs a photon. What happens next in the rod?", "options": [{"letter": "A", "text": "Sodium channels open, the rod depolarizes, and it releases more glutamate"}, {"letter": "B", "text": "Voltage-gated calcium channels open and the rod fires an action potential"}, {"letter": "C", "text": "The rod hyperpolarizes but releases more glutamate onto bipolar cells"}, {"letter": "D", "text": "Sodium channels close, the rod hyperpolarizes, and it releases less glutamate"}, {"letter": "E", "text": "Rhodopsin is released into the synaptic cleft and excites bipolar cells"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO4", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "In the dark, photoreceptors tonically release glutamate. Light bleaches rhodopsin and starts the phototransduction cascade, which closes sodium channels and hyperpolarizes the rod, so it releases less glutamate and the bipolar cells are disinhibited.", "distractor_explanations": {"A": "This is the reverse: photoreceptors are depolarized and release glutamate in the dark.", "B": "Rods respond with graded potentials; the course's light response is hyperpolarization.", "C": "Hyperpolarization decreases transmitter release.", "E": "Rhodopsin stays in the outer-segment disks; it changes shape (bleaches) and starts the cascade."}, "source": "Wk5 packet p. 61 ('Paradoxically, photoreceptors in the dark tonically release the excitatory neurotransmitter glutamate (+). When light hits the photoreceptor, sodium channels on the cell membrane close and hyperpolarize the cell, decreasing the amount of neurotransmitter being released. In response, the bipolar cells of the inner nuclear layer are disinhibited')."}, {"id": "m2mk3-q45", "n": 45, "part": 1, "title": null, "stem": "A 72-year-old woman who takes her blood pressure medicines irregularly develops a sudden severe headache, vomiting and a stiff neck, and within an hour her left arm and leg become clumsy. Her blood pressure is 210/115 mm Hg. She is awake, her strength is full, and finger-to-nose testing on the left overshoots. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Outpatient MRI of the brain within 2 weeks"}, {"letter": "B", "text": "Serum vitamin B12 level and syphilis serology (VDRL)"}, {"letter": "C", "text": "Emergent noncontrast CT of the head"}, {"letter": "D", "text": "Dix-Hallpike maneuver"}, {"letter": "E", "text": "Lumbar puncture before any imaging"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": "Same disease as Midterm 2 Mock #1 Q41 (cerebellar hemorrhage), different ask (next step rather than exam finding).", "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Sudden headache, vomiting, neck stiffness and ipsilateral limb ataxia in a hypertensive patient suggest a hypertensive cerebellar hemorrhage. The course says acute ataxia needs emergent CT to rule out hemorrhage, and that immediate CT and neurosurgical intervention are crucial.", "distractor_explanations": {"A": "A routine MRI suits slowly progressive ataxia. Acute ataxia with headache needs emergency imaging to look for hemorrhage.", "B": "These tests work up a sensory ataxia. This onset is sudden, with headache and cerebellar signs.", "D": "Dix-Hallpike tests for positional vertigo; it has no role in sudden headache with limb ataxia.", "E": "A possible posterior fossa hemorrhage must be imaged first; the course's first step for acute ataxia is CT."}, "source": "Wk4 packet p. 31 ('Hypertensive hemorrhage in the cerebellum similarly presents with acute ipsilateral ataxia, headache, and neck stiffness. Immediate CT scan and neurosurgical intervention are crucial'; 'For acute symptoms, an emergent evaluation at an emergency department with a CT scan is often performed to quickly rule out hemorrhage')."}, {"id": "m2mk3-q46", "n": 46, "part": 1, "title": null, "stem": "An 80-year-old man wakes unable to see. An embolus has occluded the top of the basilar artery, infarcting both occipital lobes. His pupils constrict briskly to light and his fundi look normal. Why are his pupillary light reflexes preserved?", "options": [{"letter": "A", "text": "Macular sparing leaves enough visual cortex to drive the reflex"}, {"letter": "B", "text": "The reflex runs from the superior colliculus through the tectospinal tract"}, {"letter": "C", "text": "The Edinger-Westphal nucleus receives direct input from primary visual cortex"}, {"letter": "D", "text": "The lateral geniculate nucleus is supplied by the middle cerebral artery"}, {"letter": "E", "text": "The reflex fibers leave the optic tract for the pretectal area before the visual radiations begin"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO3-5", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "TBL iRAT Special Senses Q3 (macular-sparing hemianopia -> occipital lesion letter): new case (bilateral occipital infarct) and new ask (why the light reflex survives)", "explanation": "Occluding the top of the basilar artery cuts off both posterior cerebral arteries, infarcting both visual cortices and causing cortical blindness. The light reflex leaves the optic tract through the brachium of the superior colliculus to the pretectal area, which projects to both Edinger-Westphal nuclei. Because it bypasses the geniculocalcarine radiations and cortex, it stays intact.", "distractor_explanations": {"A": "The light reflex doesn't use the visual cortex at all.", "B": "The tectospinal tract is for head and eye orienting, not the pupillary reflex.", "C": "Edinger-Westphal input comes from the pretectal area, not the cortex.", "D": "The reflex doesn't depend on the lateral geniculate nucleus or its blood supply."}, "source": "Wk5 packet p. 73 ('Lesions in either the optic radiation or visual cortex leave the pupillary light reflex undisturbed'; 'occlusion of one posterior cerebral artery near its origin from the basilar artery'); p. 75 ('These enter the brachium of the superior colliculus and terminate in the pretectal area ... Pretectal neurons project bilaterally to the Edinger-Westphal nucleus')."}, {"id": "m2mk3-q47", "n": 47, "part": 1, "title": null, "stem": "Loud high-frequency noise in one ear reduces otoacoustic emissions from both ears. Through which efferent pathway does this suppression reach the cochlea?", "options": [{"letter": "A", "text": "Superior olivary neurons -> CN VII -> stapedius, damping the stapes"}, {"letter": "B", "text": "Superior olivary neurons -> CN VIII -> outer hair cells, reducing their motility"}, {"letter": "C", "text": "Cochlear nucleus neurons -> CN VIII -> inner hair cells, reducing glutamate release"}, {"letter": "D", "text": "Trigeminal motor neurons -> CN V -> tensor tympani"}, {"letter": "E", "text": "Inferior colliculus neurons -> CN VIII -> spiral ganglion cells"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO8, LO10", "difficulty": 2, "format": "sequence", "drug_item": null, "laterality": false, "reworks": "wk5-slide-questions wk5-vestibular-s33-q2 (roles of the superior olivary nucleus, incl. the otoacoustic-emission reflex): new ask (the full efferent route and its target cells)", "explanation": "Otoacoustic emissions come from motile outer hair cells. Their suppression uses a loop with CN VIII in and CN VIII out: superior olivary neurons send fibers through CN VIII to the outer hair cells and decrease their contractility, especially with high-frequency noise. The loop is bilateral, so one ear can affect both.", "distractor_explanations": {"A": "That is the acoustic (stapedius) reflex, the other efferent loop, which mainly damps low frequencies.", "C": "The efferent loop arises in the superior olivary nucleus and targets outer hair cells, not inner hair cells.", "D": "The course's two auditory efferent loops are the stapedius reflex (CN VII) and the olivocochlear control of outer hair cells (CN VIII).", "E": "The suppression acts on outer hair cells and starts in the superior olivary nucleus."}, "source": "Wk5 packet p. 8 ('The change in otoacoustic emissions involves direct control of the outer hair cells of the cochlea via neurons in the superior olivary nucleus'; 'superior olivary neurons that project through CN VIII directly to the cell bodies of outer hair cells. This is an inhibitory activity resulting in the decrease in the contractility of the outer hair cells- specially, in the presence of high-frequency noise. Information in this reflex pathway is also distributed bilaterally'; 'The efferent limb of the acoustic reflex is the facial nerve'); p. 6-7 (outer hair cells and otoacoustic emissions)."}, {"id": "m2mk3-q48", "n": 48, "part": 1, "title": null, "stem": "After blunt trauma to his eye, a 34-year-old man's dilated pupil looks like this on slit-lamp examination. Breakage of which structures caused this finding?", "options": [{"letter": "A", "text": "Lens zonules (suspensory ligaments)"}, {"letter": "B", "text": "Ciliary processes"}, {"letter": "C", "text": "Fibers of the pupillary sphincter"}, {"letter": "D", "text": "Corneal epithelium"}, {"letter": "E", "text": "Trabecular meshwork"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock3-images/s-lens.png", "image_needed": true, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO2", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The edge of the lens is visible inside the dilated pupil, with fine zonular fibers along it: a dislocated (subluxated) lens. The course defines it as breakage of the lens zonules, from trauma or a connective tissue disorder.", "distractor_explanations": {"B": "Ciliary processes secrete aqueous humor; they don't hold the lens in place.", "C": "A torn sphincter changes the pupil's shape and reaction, but the lens would stay centered.", "D": "An abrasion disrupts the corneal surface; it doesn't displace the lens.", "E": "The trabecular meshwork drains aqueous humor; it doesn't anchor the lens."}, "source": "Eye Exam deck (995161cb) slide 38 ('Physical Exam: Lens'; 'Dislocated Lens • Breakage of lens zonules; lens falls into vitreous • Trauma, connective tissue disorder'; this photo, top panel); slides 35-37 show the cataract photos for the same bullets.", "annotation": {"image": "qbank/midterm2-mock3-images/annotated/s-lens.png", "options": {"A": "Slide 38 bullet 'Dislocated Lens: Breakage of lens zonules' (the photo itself has no label)", "B": "not shown in this figure", "C": "not shown in this figure", "D": "not shown in this figure", "E": "not shown in this figure"}, "note": "Source: Eye Exam deck slide 38, top panel of the photo pair. Slides 34-38 share one bullet list; slides 35-37 show cataracts and slide 38 the dislocated lens.", "how": "Faculty slide showing the photo beside its bullet list. Green box = correct answer, on the 'Dislocated Lens' bullet. The other choices aren't labeled on this slide. Amber outline = the part of the figure the question showed.", "marked": ["A"], "status": "built 2026-11-20 in Cowork: faculty source with its labels, amber arrow mapped from the question image (OpenCV SIFT + partial-affine), label boxes from Tesseract OCR / pdftotext bboxes"}}, {"id": "m2mk3-q49", "n": 49, "part": 1, "title": null, "stem": "A 14-month-old girl's parents notice a white glow in her left pupil in flash photographs, and examination finds a retinoblastoma. All of the following are true of this tumor EXCEPT:", "options": [{"letter": "A", "text": "It results from inactivation of both copies of the RB1 tumor suppressor gene."}, {"letter": "B", "text": "Loss of RB1 function removes a brake on the G1-to-S transition of the cell cycle."}, {"letter": "C", "text": "It is the most common intraocular tumor of adults."}, {"letter": "D", "text": "Strabismus can be a presenting sign."}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": null, "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal LO4", "difficulty": 2, "format": "negative", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Retinoblastoma is the most common intraocular tumor in children; choroidal melanoma is the most common intraocular tumor in adults. It results from biallelic RB1 inactivation, which lifts the G1/S brake, and presents with leukocoria and sometimes strabismus.", "distractor_explanations": {"A": "True: retinoblastoma results from biallelic inactivation of RB1 on chromosome 13q14.", "B": "True: the RB1 protein regulates the G1/S checkpoint by inhibiting E2F transcription factors.", "D": "True: the course lists leukocoria and strabismus as key clinical signs."}, "source": "Retinal Disorders deck slides 30-31 (retinoblastoma: 'Most common intraocular tumor in children'; 'Choroidal Melanoma: Most common intraocular tumor in adults'); Wk5 packet p. 124 ('Retinoblastoma results from biallelic inactivation of the RB1 tumor suppressor gene, located on chromosome 13q14. The RB1 protein regulates the G1/S cell cycle checkpoint by inhibiting E2F transcription factors'; 'Key clinical signs include leukocoria (white pupillary reflex), strabismus')."}, {"id": "m2mk3-q50", "n": 50, "part": 1, "title": null, "stem": "A 24-year-old woman has hearing loss and tinnitus in both ears. Her contrast-enhanced MRI is shown. Which gene is most likely mutated?", "options": [{"letter": "A", "text": "NF1 (neurofibromin)"}, {"letter": "B", "text": "TSC1 (hamartin)"}, {"letter": "C", "text": "RB1"}, {"letter": "D", "text": "NF2 (merlin)"}, {"letter": "E", "text": "SOD1"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock3-images/s-mri-vs.png", "image_needed": true, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO3 (deck slide 38)", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The MRI shows enhancing masses at both cerebellopontine angles: bilateral vestibular schwannomas, which explain the bilateral hearing loss and tinnitus. Bilateral tumors are pathognomonic for NF2, an autosomal dominant disorder of the NF2 gene on chromosome 22, which encodes the tumor suppressor merlin.", "distractor_explanations": {"A": "NF1 causes optic pathway gliomas, Lisch nodules and neurofibromas, not bilateral vestibular schwannomas.", "B": "Tuberous sclerosis causes hamartomas (including retinal astrocytic hamartomas), not bilateral vestibular schwannomas.", "C": "RB1 loss causes retinoblastoma in young children.", "E": "SOD1 variants cause familial ALS."}, "source": "Hearing Loss deck (88ab33e1) slide 38 ('Bilateral pathognomonic for NF II'; image caption 'Bilateral VS: Neurofibromatosis II'); Wk5 packet p. 49 ('The development of bilateral vestibular schwannomas strongly suggests NF2-related schwannomatosis ... NF2 gene on chromosome 22, which encodes the tumor-suppressor protein merlin').", "annotation": {"image": "qbank/midterm2-mock3-images/annotated/s-mri-vs.png", "options": e Cavities", "topic": "Midline Cavities", "note": null, "blueprint_category": "Anatomy Lab: Midline Cavities", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the lingual frenulum, the midline fold of mucosa that attaches the underside of the tongue to the floor of the mouth.", "distractor_explanations": {"A": "The submandibular duct opens on the sublingual caruncle beside the base of the frenulum, below the arrow.", "B": "The palatoglossal fold is at the back of the mouth, in front of the palatine tonsil.", "D": "The palatopharyngeal fold is behind the palatine tonsil, at the entrance to the oropharynx.", "E": "The arrowed structure is listed (frenulum)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 11 (Grant's Dissector 7.84), 'Lingual frenulum' label; Lab 4 structure list (Tongue: 'Frenulum').", "annotation": {"image": "qbank/midterm2-mock3-images/annotated/lab-mid-2.png", "options": {"A": "Labeled 'Submandibular duct opening'", "B": "Labeled 'Palatoglossal fold'", "C": "Labeled 'Lingual frenulum' (arrowed)", "D": "Labeled 'Palatopharyngeal fold'", "E": "not applicable (the key is listed)"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"], "status": "built 2026-11-20 in Cowork: faculty source with its labels, amber arrow mapped from the question image (OpenCV SIFT + partial-affine), label boxes from Tesseract OCR / pdftotext bboxes"}}, {"id": "m2mk3-q53", "n": 53, "part": 2, "title": "Gross anatomy lab image: Midline Cavities", "stem": "Identify the structure indicated by the arrow on this midsagittal view of the larynx.", "options": [{"letter": "A", "text": "Aryepiglottic fold"}, {"letter": "B", "text": "Vest <script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("exam-data").textContent);
const Q = DATA.questions.slice().sort((a,b)=>a.n-b.n);
const N = Q.length;
const byN = {}; Q.forEach(q=>byN[q.n]=q);
const imgSrc = q => q.image ? "images/" + q.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const annSrc = q => q.annotation && q.annotation.image ? "images/ann-" + q.annotation.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
// explanation_image (Mock #5+): annotated figure shown only in feedback/review; same images/ + .png->.jpg mapping as question images
const explSrc = q => q.explanation_image ? "images/" + q.explanation_image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const fmtTime = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? h+":"+pad(m)+":"+pad(x) : m+":"+pad(x); };

/* ---------- state ---------- */
let S = {attempt:1, status:"in_progress", elapsed_s:0, started:null, mode:"immediate"};
let showClock = ls("m2mock3.clock") !== false;
let allResp = {};          // docId -> {attempt,n,choice,flagged}
let attempts = {};         // "a1" -> summary
let idx = 0;
let view = "exam";         // exam | results
let filter = "all";
let db = null, sync = "connecting";

function ls(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function struckOf(n){ const r=resp(n); return new Set(r && Array.isArray(r.struck) ? r.struck : []); }
function hlOf(n){ const r=resp(n); return r && Array.isArray(r.hl) ? r.hl : []; }
const revealed = n => submitted() || (S.mode==="immediate" && !!choiceOf(n));
const savedIdx = ls("m2mock3.idx"); if(typeof savedIdx==="number" && savedIdx>=0 && savedIdx<N) idx = savedIdx;

const rid = n => "a"+S.attempt+"-q"+pad(n);
function resp(n){ return allResp[rid(n)] || null; }
function choiceOf(n){ const r=resp(n); return r && r.choice ? r.choice : null; }
function flagOf(n){ const r=resp(n); return !!(r && r.flagged); }
const submitted = () => S.status === "submitted";
function answeredCount(){ let c=0; Q.forEach(q=>{ if(choiceOf(q.n)) c++; }); return c; }

/* ---------- persistence ---------- */
const queues = {};
function put(path, body){
  if(!db){ localSave(); return Promise.resolve(); }
  setSync("saving");
  const p = (queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).then(()=>{ if(queues[path]===p) setSync("saved"); }, e=>{ setSync("error", e && e.code); });
  queues[path] = p; return p;
}
function localSave(){ ls("m2mock3.local",{S, allResp, attempts}); }
function writeResp(n){
  const r = allResp[rid(n)];
  const q = byN[n];
  put("responses/"+rid(n), {attempt:S.attempt, n, qid:q.id, choice:r.choice||null, correct: r.choice? r.choice===q.answer : null, flagged:!!r.flagged,
    mode:S.mode, struck:Array.isArray(r.struck)?r.struck:[], hl:Array.isArray(r.hl)?r.hl:[], updated:new Date().toISOString()});
}
let stateTimer = null;
function writeState(now){
  clearTimeout(stateTimer);
  const go = ()=>put("exam/state", {attempt:S.attempt, status:S.status, mode:S.mode, elapsed_s:Math.round(S.elapsed_s), started:S.started, updated:new Date().toISOString()});
  if(now) go(); else stateTimer = setTimeout(go, 1500);
}
function setSync(s, code){
  sync = s; const el = document.getElementById("sync"); if(!el) return;
  el.className = "sync" + (s==="error" ? " warn" : "");
  el.textContent = s==="saving" ? "Saving…" : s==="saved" ? "Answers saved to this artifact" :
    s==="connecting" ? "Connecting…" : s==="local" ? "Saved in this browser" :
    "Last save failed"+(code?" ("+code+")":"")+". Keep going; the next answer retries.";
}

/* ---------- timer ---------- */
let last = Date.now();
setInterval(()=>{
  const now = Date.now(), dt = (now-last)/1000; last = now;
  if(!submitted() && S.started && document.visibilityState==="visible" && dt < 5) S.elapsed_s += dt;
  paintMeters();
}, 1000);
document.addEventListener("visibilitychange", ()=>{ last = Date.now(); if(document.visibilityState==="hidden" && S.started && !submitted()) writeState(true); });

/* ---------- actions ---------- */
function ensureResp(n){ const k=rid(n); if(!allResp[k]) allResp[k]={attempt:S.attempt,n,choice:null,flagged:false}; else allResp[k]=Object.assign({},allResp[k]); return allResp[k]; }
function choose(letter){
  if(submitted()) return;
  const q = Q[idx]; if(!q.options.some(o=>o.letter===letter)) return;
  if(revealed(q.n)) return;   // immediate feedback locks the first answer
  const r = ensureResp(q.n); r.choice = letter;
  if(Array.isArray(r.struck)) r.struck = r.struck.filter(x=>x!==letter);
  if(!S.started){ S.started = new Date().toISOString(); }
  writeResp(q.n); writeState(false); render();
}
function toggleFlag(){
  const q = Q[idx]; const r = ensureResp(q.n); r.flagged = !r.flagged;
  writeResp(q.n); render();
}
function toggleStrike(n, L){
  if(revealed(n)) return;
  const r = ensureResp(n); const s = new Set(Array.isArray(r.struck)?r.struck:[]);
  s.has(L)? s.delete(L) : s.add(L); r.struck = [...s].sort();
  writeResp(n); renderMain();
}
function setHL(n, ranges){ const r = ensureResp(n); r.hl = ranges; writeResp(n); renderMain(); }
function addHL(n, s, e){
  const all = hlOf(n).map(x=>x.slice()).concat([[s,e]]).sort((a,b)=>a[0]-b[0]);
  const out = [];
  all.forEach(r=>{ const last = out[out.length-1]; if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else out.push(r); });
  setHL(n, out);
}
function hlHTML(text, ranges){
  let h = "", pos = 0;
  ranges.forEach((r,i)=>{ const s=Math.max(pos,r[0]), e=Math.min(text.length,r[1]); if(e<=s) return;
    h += esc(text.slice(pos,s)) + '<mark data-h="'+i+'" title="Click to remove highlight">'+esc(text.slice(s,e))+'</mark>'; pos = e; });
  return h + esc(text.slice(pos));
}
function offsetIn(el, node, off){ const r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, off); return r.toString().length; }
document.addEventListener("mouseup", ()=>setTimeout(()=>{
  const sel = window.getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed) return;
  const el = document.getElementById("stem"); if(!el) return;
  const rg = sel.getRangeAt(0);
  if(!el.contains(rg.startContainer) || !el.contains(rg.endContainer)) return;
  const s = offsetIn(el, rg.startContainer, rg.startOffset), e = offsetIn(el, rg.endContainer, rg.endOffset);
  sel.removeAllRanges();
  if(e > s) addHL(Q[idx].n, s, e);
}, 0));
function setMode(m){
  if(submitted() || S.mode===m) return;
  S.mode = m; writeState(true); render();
}
function go(i){ idx = Math.max(0, Math.min(N-1, i)); ls("m2mock3.idx", idx); if(view!=="exam") view="exam"; render(); window.scrollTo({top:0}); }
function visibleList(){
  return Q.filter(q=>{
    if(filter==="all") return true;
    const c = choiceOf(q.n);
    if(filter==="flagged") return flagOf(q.n);
    if(filter==="unanswered") return !c;
    if(filter==="missed") return submitted() && c !== q.answer;
    return true;
  }).map(q=>q.n);
}
function step(d){
  const list = visibleList(); const cur = Q[idx].n;
  if(filter==="all" || !list.length) return go(idx+d);
  const pos = list.indexOf(cur);
  let target;
  if(pos>=0) target = list[pos+d];
  else target = d>0 ? list.find(n=>n>cur) : list.slice().reverse().find(n=>n<cur);
  if(target!=null) go(target-1);
}

function computeResults(){
  const out = {score:0, total:N, answered:0, misses:[], unanswered:[], flagged:[], choices:{}, part:{1:[0,0],2:[0,0]}, diff:{}, week:{}, cat:{}, lab:{}};
  Q.forEach(q=>{
    const c = choiceOf(q.n), ok = c===q.answer;
    out.choices[q.n] = c;
    if(c) out.answered++; else out.unanswered.push(q.n);
    if(ok) out.score++; else out.misses.push(q.n);
    if(flagOf(q.n)) out.flagged.push(q.n);
    const add = (o,k)=>{ o[k]=o[k]||[0,0,[]]; o[k][1]++; if(ok) o[k][0]++; else o[k][2].push(q.n); };
    out.part[q.part][1]++; if(ok) out.part[q.part][0]++;
    if(q.part===1){ add(out.diff, q.difficulty); add(out.week, q.week); add(out.cat, q.blueprint_category); } else add(out.lab, q.blueprint_category.replace(/^Anatomy Lab:\s*/,''));
  });
  return out;
}
function doSubmit(){
  S.status = "submitted";
  const R = computeResults();
  const summary = {attempt:S.attempt, submitted:new Date().toISOString(), elapsed_s:Math.round(S.elapsed_s), score:R.score, total:N, answered:R.answered,
    misses:R.misses, unanswered:R.unanswered, flagged:R.flagged, choices:Object.fromEntries(Object.entries(R.choices).map(([k,v])=>[k,v||""]))};
  attempts["a"+S.attempt] = summary;
  put("attempts/a"+S.attempt, summary); writeState(true);
  view = "results"; filter = "all"; closeOverlay(); render(); window.scrollTo({top:0});
}
function doRetake(){
  S = {attempt:S.attempt+1, status:"in_progress", elapsed_s:0, started:null, mode:S.mode};
  idx = 0; ls("m2mock3.idx",0); view="exam"; filter="all";
  writeState(true); closeOverlay(); render(); window.scrollTo({top:0});
}

/* ---------- overlay ---------- */
const overlay = document.getElementById("overlay");
function closeOverlay(){ overlay.innerHTML=""; }
function confirmBox(title, body, okLabel, onOk){

  document.getElementById("dlg-no").onclick = closeOverlay;
  document.getElementById("dlg-ok").onclick = onOk;
  document.getElementById("scrim").onclick = e=>{ if(e.target.id==="scrim") closeOverlay(); };
  document.getElementById("dlg-ok").focus();
}
function zoom(src){
  overlay.innerHTML = '<div class="scrim lightbox" id="scrim"><img alt="Enlarged figure" src="'+esc(src)+'"></div>';
  document.getElementById("scrim").onclick = closeOverlay;
}

/* ---------- render ---------- */
const $main = document.getElementById("main"), $rail = document.getElementById("rail");
function paintMeters(){
  const ans = answeredCount();
  if(S.mode==="immediate" && !submitted()){
    const ok = Q.filter(q=>choiceOf(q.n)===q.answer).length;
    document.getElementById("m-ans-l").textContent = "Correct";
    document.getElementById("m-ans").innerHTML = '<span class="live">'+ok+'</span> / '+ans+(ans? ' · '+Math.round(100*ok/ans)+'%' : '');
  } else {
    document.getElementById("m-ans-l").textContent = "Answered";
    document.getElementById("m-ans").textContent = ans+" / "+N;
  }
  document.getElementById("m-time").textContent = showClock ? fmtTime(S.elapsed_s) : "show clock";

  document.getElementById("mode-imm").setAttribute("aria-pressed", S.mode==="immediate");
  document.getElementById("mode-end").setAttribute("aria-pressed", S.mode!=="immediate");
  const bp = document.getElementById("b-pause"), bs = document.getElementById("b-submit");
  bp.hidden = !submitted();

    bp.textContent = view==="results" ? "Review questions" : "Results";
    bs.textContent = "Retake";
    bs.className = "btn";
  } else {

}
document.getElementById("b-pause").onclick = ()=>{
  if(submitted()){ view = view==="results" ? "exam" : "results"; render(); window.scrollTo({top:0}); }
};
document.getElementById("m-clock").onclick = ()=>{ showClock = !showClock; ls("m2mock3.clock", showClock); paintMeters(); };
document.getElementById("mode-imm").onclick = ()=>setMode("immediate");
document.getElementById("mode-end").onclick = ()=>{
  if(S.mode==="immediate" && answeredCount()) confirmBox("Hide answers until the end?", "Answers you already checked will be hidden again until you submit. Your picks stay as they are.", "Switch", ()=>{ closeOverlay(); setMode("end"); });
  else setMode("end");
};
document.getElementById("b-submit").onclick = ()=>{
  if(submitted()){
    confirmBox("Start attempt "+(S.attempt+1)+"?", "Your attempt "+S.attempt+" score stays saved. The new attempt starts blank with the timer at 0:00.", "Start retake", doRetake);
  } else {
