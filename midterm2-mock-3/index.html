<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

-old man has 2 years of falls, stiffness and slowness. He cannot look down on command, yet when the examiner tips his head back, his eyes move down fully. Carbidopa-levodopa gave only brief, partial benefit. Abnormal accumulation of which protein underlies his disorder?", "options": [{"letter": "A", "text": "Alpha-synuclein in neurons (Lewy bodies)"}, {"letter": "B", "text": "Alpha-synuclein in glia"}, {"letter": "C", "text": "Tau"}, {"letter": "D", "text": "Huntingtin with an expanded polyglutamine tract"}, {"letter": "E", "text": "Beta-amyloid"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hypokinetic Movement Disorders", "topic": "Hypokinetic Movement Disorders", "note": null, "blueprint_category": "Hypokinetic Movement Disorders", "learning_objective": "Hypokinetic LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q4 (PD vs atypical parkinsonism -> diagnosis): other disorder (PSP) and new ask (protein)", "explanation": "Parkinsonism with early falls, a voluntary vertical (downward) gaze palsy with a preserved oculocephalic reflex, and a poor, transient levodopa response is progressive supranuclear palsy. The course states that PSP is caused by abnormal accumulation of tau.", "distractor_explanations": {"A": "Neuronal alpha-synuclein (Lewy bodies) marks Parkinson disease, which responds well to levodopa and doesn't cause vertical gaze palsy.", "B": "Glial alpha-synuclein marks multisystem atrophy, which causes autonomic or cerebellar features rather than a vertical gaze palsy.", "D": "Mutant huntingtin causes Huntington disease, a hyperkinetic disorder with chorea.", "E": "Beta-amyloid plaques belong to Alzheimer disease, not a parkinsonian syndrome with gaze palsy."}, "source": "Wk4 packet p. 73 ('PSP features progressive paralysis of the extraocular movements particularly voluntary vertical gaze, though the oculocephalic reflex is preserved ... Levodopa response is partial and transient at best. PSP is caused by abnormal accumulation of the tau-protein'; MSA: 'synuclein accumulates more in glia than in neurons')."}, {"id": "m2mk3-q02", "n": 2, "part": 1, "title": null, "stem": "An aneurysm of the right internal carotid artery compresses only the lateral edge of the right side of the optic chiasm. Which field defect results?", "options": [{"letter": "A", "text": "Nasal hemianopia of the right eye"}, {"letter": "B", "text": "Temporal hemianopia of the right eye"}, {"letter": "C", "text": "Bitemporal hemianopia"}, {"letter": "D", "text": "Left homonymous hemianopia"}, {"letter": "E", "text": "Blindness of the right eye"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO3-4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "The lateral edge of the chiasm carries the non-crossing fibers from the temporal retina of the same eye. The temporal retina sees the nasal field, so damage there causes a nasal hemianopia of the right eye.", "distractor_explanations": {"B": "Temporal field loss comes from the crossing nasal-retina fibers, which run in the middle of the chiasm, not its lateral edge.", "C": "Bitemporal loss comes from pressure on the middle of the chiasm, as from a pituitary tumor.", "D": "A homonymous defect needs a lesion behind the chiasm, such as the right optic tract.", "E": "Complete monocular loss comes from an optic nerve lesion in front of the chiasm."}, "source": "Wk5 packet p. 74 Fig. 11 legend ('B, Damage to one side of the optic chiasm destroys the non-crossing fibers from the ipsilateral eye; these fibers arise in the temporal retina, so nasal hemianopia of the ipsilateral eye results'); p. 72 ('axons from the nasal halves of each retina decussate ... while axons from the temporal halves remain uncrossed')."}, {"id": "m2mk3-q03", "n": 3, "part": 1, "title": null, "stem": "A 58-year-old man who has smoked for 40 years has 3 months of weakness climbing stairs, constipation and erectile dysfunction. Nerve conduction studies show low compound muscle action potentials that increase markedly after brief exercise. Which evaluation is most important next?", "options": [{"letter": "A", "text": "Imaging of the anterior mediastinum to look for a thymoma"}, {"letter": "B", "text": "MRI of the cervical spine to look for cord compression"}, {"letter": "C", "text": "Serum vitamin B12 level"}, {"letter": "D", "text": "Lumbar puncture for oligoclonal bands"}, {"letter": "E", "text": "Imaging of the chest to look for small-cell lung cancer"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO6-7", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q14 (LEMS presentation -> mechanism of the post-exercise improvement): new case (autonomic symptoms, nerve conduction finding) and new ask (next evaluation)", "explanation": "Proximal leg weakness, autonomic symptoms and a low baseline CMAP that increases after brief exercise are the pattern of Lambert-Eaton myasthenic syndrome. LEMS is strongly associated with small-cell lung cancer, so a heavy smoker needs evaluation for an underlying lung tumor.", "distractor_explanations": {"A": "Thymoma goes with myasthenia gravis, which gives a decrement on repetitive stimulation, not a post-exercise increment.", "B": "Cord compression would give upper motor neuron signs and a sensory level, not an increment after exercise.", "C": "B12 deficiency causes a sensory ataxia and neuropathy, not this electrophysiologic pattern.", "D": "Oligoclonal bands support multiple sclerosis, which doesn't cause this neuromuscular junction pattern."}, "source": "Wk4 packet p. 99 ('LEMS has an important association with small-cell lung cancer ... Patients should be evaluated for an underlying malignancy, particularly when there is a significant smoking history'; 'Nerve conduction testing often shows a low baseline compound muscle action potential. After brief exercise or high-frequency repetitive stimulation, the response increases substantially'); p. 100 table (MG: thymoma; LEMS: small-cell lung cancer; autonomic symptoms)."}, {"id": "m2mk3-q04", "n": 4, "part": 1, "title": null, "stem": "A 45-year-old woman has trouble hearing in both ears. Her audiogram is shown. Which condition best fits this pattern?", "options": [{"letter": "A", "text": "Noise-induced loss of cochlear hair cells"}, {"letter": "B", "text": "Fluid in both middle ears from chronic otitis media"}, {"letter": "C", "text": "Aminoglycoside damage to cochlear hair cells"}, {"letter": "D", "text": "Age-related loss of hair cells at the cochlear base"}, {"letter": "E", "text": "Ménière disease"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock3-images/s-audiogram.png", "image_needed": true, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO12-13", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Bone conduction is normal in both ears, but air conduction is about 30-45 dB worse across all frequencies: a bilateral conductive loss (an air-bone gap). Sound reaches a healthy cochlea through bone but is blocked in the outer or middle ear. The packet uses this audiogram for chronic otitis media with middle ear fluid; the sensorineural choices would lower bone conduction too.", "distractor_explanations": {"A": "Hair cell damage lowers air and bone conduction together, typically at high frequencies; her bone conduction is normal.", "C": "Ototoxic hair cell damage is sensorineural, so bone conduction would be lost as well.", "D": "Presbycusis is a sensorineural, high-frequency loss with matching air and bone thresholds.", "E": "Ménière disease is sensorineural (bone conduction affected) and usually one-sided, mainly at low frequencies."}, "source": "Wk5 packet p. 24 Fig. 9B (caption cropped from the question: 'Audiometric results for a patient with bilateral conductive hearing loss caused by chronic otitis media (middle ear infection). Hearing by bone conduction is normal but hearing by air conduction is impaired'); p. 9 ('Someone who hears normally by bone conduction but not by air conduction is therefore likely to have a conductive hearing loss. Typical causes are accumulation of fluid in the middle ear').", "annotation": {"image": "qbank/midterm2-mock3-images/annotated/s-audiogram.png", "options": {"A": "not shown in this figure", "B": "Faculty caption (Fig. 9B): 'bilateral conductive hearing loss caused by chronic otitis media'", "C": "not shown in this figure", "D": "not shown in this figure", "E": "not shown in this figure"}, "note": "Source: Wk5 packet p. 24 Fig. 9, legend + panel B only (panel A, the 'B' letter and the caption were left out of the question). Same audiogram appears as Fig. 14B on p. 9.", "how": "Faculty figure with its caption showing (the question cropped it out). Green box = correct answer, on the caption naming the cause. The other choices aren't labeled on this figure. Amber outline = the part of the figure the question showed.", "marked": ["B"], "status": "built 2026-11-20 in Cowork: faculty source with its labels, amber arrow mapped from the question image (OpenCV SIFT + partial-affine), label boxes from Tesseract OCR / pdftotext bboxes"}}, {"id": "m2mk3-q05", "n": 5, "part": 1, "title": null, "stem": "A 58-year-old man has a small stroke confined to the head of his right caudate nucleus. He has no weakness and no involuntary movements, but his family says he now has trouble planning and organizing everyday tasks. Disruption of which basal ganglia loop best explains this?", "options": [{"letter": "A", "text": "Motor loop: sensorimotor cortex to putamen, then pallidum and thalamus back to the supplementary motor area"}, {"letter": "B", "text": "Limbic loop: limbic structures to nucleus accumbens, then ventral pallidum and thalamus"}, {"letter": "C", "text": "Cerebellar loop: pontine nuclei to cerebellum, then dentate nucleus and thalamus"}, {"letter": "D", "text": "Cognitive loop: association cortex to caudate, then pallidum and thalamus back to prefrontal cortex"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Association cortex projects preferentially to the caudate nucleus, which returns through the globus pallidus and thalamus to prefrontal association areas. This cognitive loop is thought to mediate ideation and planning, so a caudate lesion can impair planning without causing weakness or dyskinesia.", "distractor_explanations": {"A": "The motor loop enters through the putamen; its loss would affect movement, which is normal here.", "B": "The limbic loop enters through the nucleus accumbens (ventral striatum), not the head of the caudate.", "C": "This is a cerebellar circuit, not a basal ganglia loop, and the caudate isn't part of it."}, "source": "Wk4 packet p. 15 ('A loop involved in cognition preferentially uses the caudate nucleus as the input to the basal ganglia ... From the thalamus, projections travel to prefrontal association areas'; motor loop uses the putamen; limbic loop uses the nucleus accumbens); BG deck (4285501b) slide 25."}, {"id": "m2mk3-q06", "n": 6, "part": 1, "title": null, "stem": "A 44-year-old man has 2 years of slowly worsening hearing in his right ear. He has no vertigo or tinnitus and has never had ear surgery. The ear canal and eardrum look normal. With a 512-Hz tuning fork, the Weber test is heard louder in the right ear, and on the right, bone conduction is heard longer than air conduction. Which imaging study is most appropriate?", "options": [{"letter": "A", "text": "MRI with contrast of the internal auditory canals"}, {"letter": "B", "text": "Noncontrast CT of the temporal bones"}, {"letter": "C", "text": "CT angiography of the head and neck"}, {"letter": "D", "text": "MRI of the cervical spine"}, {"letter": "E", "text": "No imaging; this is age-related hearing loss"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": "Mock #1 Q50 was the sensorineural mirror (Weber to the good ear -> contrast MRI); this item is a conductive pattern -> temporal bone CT.", "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Weber lateralizing to the affected ear with bone conduction longer than air conduction on that side means a right conductive loss. With a normal canal and eardrum, the cause isn't visible on examination; the course says noncontrast temporal bone CT is the right study for acquired conductive loss, while MRI suits sensorineural loss.", "distractor_explanations": {"A": "Contrast MRI is for unexplained asymmetric sensorineural loss (to look for a vestibular schwannoma); his findings show a conductive loss.", "C": "Vascular imaging doesn't address a slowly progressive one-sided conductive loss.", "D": "The cervical spine has nothing to do with hearing.", "E": "Presbycusis is bilateral and sensorineural, not a one-sided conductive loss."}, "source": "Wk5 packet p. 21 ('conductive hearing loss is suspected if the sound lateralizes to the bad side'; 'An abnormal Rinne test, with bone>air conduction, is consistent with conductive loss, particularly if the Weber test also lateralizes to that side'); p. 22 Table 1; p. 28 ('MRI is the best imaging test for sensorineural hearing loss, but computed tomography (CT) scans are more appropriate for patients with acquired conductive hearing loss. A noncontrast CT scan of the temporal bones can be useful in determining the cause of conductive hearing loss when the answer is not apparent on physical examination')."}, {"id": "m2mk3-q07", "n": 7, "part": 1, "title": null, "stem": "Before treating an upper incisor, a dentist injects anesthetic at the incisive foramen, just behind the central incisors. Which nerve is anesthetized?", "options": [{"letter": "A", "text": "Nasopalatine nerve"}, {"letter": "B", "text": "Greater palatine nerve"}, {"letter": "C", "text": "Lesser palatine nerve"}, {"letter": "D", "text": "Inferior alveolar nerve"}, {"letter": "E", "text": "Lingual nerve"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": null, "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal & Oral LO9", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The nasopalatine branch of V2 descends through the incisive foramen at the front of the hard palate, behind the central incisors. The greater and lesser palatine nerves supply the rest of the palate.", "distractor_explanations": {"B": "The greater palatine nerve leaves through the greater palatine foramen at the back of the hard palate.", "C": "The lesser palatine nerve supplies the soft palate, far from the incisive foramen.", "D": "The inferior alveolar nerve (V3) supplies the lower teeth.", "E": "The lingual nerve (V3) supplies the anterior tongue and floor of the mouth."}, "source": "Wk4 packet p. 50 ('A nasopalatine nerve of V2 also descends through the incisive foramen'; 'The maxillary nerve (V2) transmits general sensations from the palate ... via the greater and lesser palatine nerves'; 'greater palatine foramina')."}, {"id": "m2mk3-q08", "n": 8, "part": 1, "title": null, "stem": "A 55-year-old smoker has 2 months of a droopy right eyelid, a small right pupil and no sweating on the right side of his face. Chest imaging shows a mass at the right lung apex that has damaged the sympathetic fibers passing over it on their way to the superior cervical ganglion. Which responses of the right pupil to eye drops are expected?", "options": [{"letter": "A", "text": "Apraclonidine: dilates · Hydroxyamphetamine: does not dilate"}, {"letter": "B", "text": "Apraclonidine: no change · Hydroxyamphetamine: dilates"}, {"letter": "C", "text": "Apraclonidine: no change · Hydroxyamphetamine: does not dilate"}, {"letter": "D", "text": "Apraclonidine: constricts · Hydroxyamphetamine: dilates"}, {"letter": "E", "text": "Apraclonidine: dilates · Hydroxyamphetamine: dilates"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Sympathetics & Parasympathetics of the Eye", "topic": "Sympathetics & Parasympathetics of the Eye", "note": "Mock #1 Q22 asked the expected cocaine result in a carotid-dissection Horner; this item uses apraclonidine + hydroxyamphetamine and a second-order lesion. No item keys apraclonidine's receptor subtype (the drug list says alpha-2; the ILM figure says weak alpha-1).", "blueprint_category": "Sympathetics & Parasympathetics of the Eye", "learning_objective": "Sympathetics LO3-5; drug list (green)", "difficulty": 3, "format": "vignette", "drug_item": "Apraclonidine; Hydroxyamphetamine", "laterality": false, "reworks": "TBL iRAT Special Senses Q9 (hydroxyamphetamine dilates -> mechanism) and Sympathetics deck slide 31 (apical lung mass -> preganglionic fibers): new ask (expected drop results combining two drugs)", "explanation": "This is Horner syndrome from a second-order (preganglionic) lesion at the lung apex. Apraclonidine dilates a Horner pupil but not a normal one, confirming the diagnosis. Hydroxyamphetamine releases norepinephrine from an intact third-order neuron, so it dilates the pupil with first- or second-order lesions and fails only when the postganglionic neuron is damaged.", "distractor_explanations": {"A": "Failure with hydroxyamphetamine localizes the lesion to the third-order (postganglionic) neuron; this lesion is before the superior cervical ganglion.", "B": "Apraclonidine dilates a Horner pupil whatever the lesion level; it is a normal pupil that it doesn't dilate.", "C": "Both are wrong here: apraclonidine dilates any Horner pupil, and the intact postganglionic neuron still releases norepinephrine for hydroxyamphetamine.", "D": "Apraclonidine is an alpha agonist on the dilator; it doesn't constrict the pupil."}, "source": "Wk5 packet p. 85 (second-order neuron 'passes over the pulmonary apex, through the stellate (inferior cervical) ganglion to synapse in the superior cervical ganglion'); p. 87 ('hydroxyamphetamine, which releases norepinephrine from an intact neuron. This can localize a lesion to a third-order neuron (no dilation) or either a first- or second-order neuron (dilation)'); p. 88 figure ('Apraclonidine is a weak α1 agonist which dilates a Horner pupil but not a normal pupil'); Eye Exam deck (995161cb) slide 57 ('Apraclonidine ... Causes pupil dilation in an eye with Horner syndrome'); drug list rows (Apraclonidine; Hydroxyamphetamine)."}, {"id": "m2mk3-q09", "n": 9, "part": 1, "title": null, "stem": "A 58-year-old woman received intravenous gentamicin for 3 weeks for endocarditis. She now feels unsteady, especially in the dark, and says the world bounces and blurs whenever she walks or turns her head; she has never had spinning vertigo. What best explains her bouncing vision?", "options": [{"letter": "A", "text": "Displaced otoconia in one posterior semicircular canal"}, {"letter": "B", "text": "A cerebellar infarct causing gaze-evoked nystagmus"}, {"letter": "C", "text": "Loss of hair cells in both inner ears has removed the vestibulo-ocular reflex that steadies the eyes during head movement"}, {"letter": "D", "text": "Loss of vestibular input from one ear, making the brain think she is rotating"}, {"letter": "E", "text": "Damage to the dorsal columns, removing proprioception"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO9", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Gentamicin is strongly vestibulotoxic. When the injury is bilateral, patients often don't describe spinning vertigo; instead they have chronic imbalance and oscillopsia, because the damaged vestibulo-ocular reflex can no longer hold the eyes steady as the head moves. Imbalance is worse in the dark because vision is the remaining cue.", "distractor_explanations": {"A": "BPPV causes brief spinning vertigo in certain head positions, not constant bouncing vision.", "B": "Nothing suggests a stroke, and gentamicin explains a bilateral peripheral injury.", "D": "One-sided loss causes spinning vertigo with nystagmus. Bilateral, symmetric loss causes imbalance and oscillopsia without spinning.", "E": "Lost proprioception would worsen balance in the dark but wouldn't make the visual world bounce with head movement."}, "source": "Wk5 packet p. 49 ('Gentamicin is particularly important because it is strongly associated with vestibular toxicity. When vestibular injury is bilateral as in these cases, patients may not describe classic spinning vertigo. Instead, they often develop chronic imbalance and oscillopsia ... because the damaged vestibulo-ocular reflex can no longer stabilize the eyes appropriately as the head moves'); p. 36 (with two of three balance systems lost, disability in the dark)."}, {"id": "m2mk3-q10", "n": 10, "part": 1, "title": null, "stem": "A 15-year-old girl has 3 years of worsening clumsiness and falls. She has lost vibration and joint-position sense in both feet, and Romberg testing is positive, yet her gait is wide-based and unsteady even with her eyes open. Strength is normal and she has no vertigo. Her parents are healthy, but her older brother has the same illness. Which mechanism underlies her disease?", "options": [{"letter": "A", "text": "An expanded CAG repeat producing a toxic polyglutamine protein"}, {"letter": "B", "text": "Antibodies against cerebellar Purkinje cells"}, {"letter": "C", "text": "Impaired absorption of vitamin B12 from the stomach"}, {"letter": "D", "text": "Defective frataxin protein, causing mitochondrial dysfunction"}, {"letter": "E", "text": "Loss of SMN protein in anterior horn cells"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO9", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Friedreich ataxia is autosomal recessive (healthy parents, affected sibling). Defective frataxin causes mitochondrial dysfunction and degeneration of the posterior columns (lost vibration and position sense, positive Romberg) and the spinocerebellar tracts (wide-based, unsteady gait even with the eyes open).", "distractor_explanations": {"A": "A CAG expansion (Huntington disease) is autosomal dominant and causes chorea, not loss of position sense; healthy parents with an affected sibling point to recessive inheritance.", "B": "Paraneoplastic cerebellar degeneration is an acquired disease of adults with a tumor; it doesn't affect siblings or remove position sense.", "C": "B12 deficiency is acquired and mainly hits the posterior columns; it wouldn't explain an affected brother or the eyes-open wide-based gait.", "E": "SMN loss (spinal muscular atrophy) causes lower motor neuron weakness with intact sensation."}, "source": "Wk4 packet p. 34 ('Friedreich ataxia, an autosomal recessive disorder on chromosome 9, leads to sensory ataxia through defective synthesis of frataxin (FXN) protein. This results in mitochondrial dysfunction and degeneration of multiple spinal cord tracts, including the posterior columns and spinocerebellar tracts'); p. 33 ('Disordered unconscious proprioception leads to a wide-based and unsteady gait')."}, {"id": "m2mk3-q11", "n": 11, "part": 1, "title": null, "stem": "Each eye has a blind spot in its visual field. Which statement explains it?", "options": [{"letter": "A", "text": "The foveola contains only rods, which don't work in daylight"}, {"letter": "B", "text": "The optic disc contains ganglion cell axons but no photoreceptors"}, {"letter": "C", "text": "Large retinal vessels block all light from reaching the macula"}, {"letter": "D", "text": "Ganglion cells are missing at the ora serrata"}, {"letter": "E", "text": "The pigment epithelium is missing at the fovea, so light scatters"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": "Mock #2 Q28 asked where a retinal hemorrhage's blind spot falls in the field; this item asks why the normal blind spot exists.", "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Ganglion cell axons converge on the optic disc, turn 90 degrees and leave the eye through the lamina cribrosa. There are no photoreceptors at the disc, so it corresponds to a blind spot in each eye's visual field.", "distractor_explanations": {"A": "The foveola contains only cones, and it's the region of sharpest vision.", "C": "Large vessels are absent from the macula, which is fed mainly by the choroid.", "D": "The ora serrata is the far-peripheral front edge of the visual retina; the blind spot is at the optic disc.", "E": "The pigment epithelium is present under the fovea; the blind spot is at the optic disc."}, "source": "Wk5 packet p. 61 ('Since there are no photoreceptors at the optic disk, it corresponds to a blind spot in the visual field of each eye'); p. 62 Fig. 17 caption ('The black spot represents the optic disc, which has no photoreceptors -- only retinal ganglion cell axons'); p. 62 ('the foveola, which has no rods at all -- only cones')."}, {"id": "m2mk3-q12", "n": 12, "part": 1, "title": null, "stem": "A 66-year-old man has had Parkinson disease for 9 years. About an hour after each carbidopa-levodopa dose he develops flowing, dance-like movements of his trunk and limbs that fade as the dose wears off; lowering the dose stops them but leaves him stiff and slow. His neurologist adds amantadine, one of the few drugs that directly treats this problem. By which mechanism does amantadine act?", "options": [{"letter": "A", "text": "Weak NMDA glutamate-receptor antagonism, along with increased dopamine release"}, {"letter": "B", "text": "Irreversible inhibition of monoamine oxidase B"}, {"letter": "C", "text": "Peripheral inhibition of catechol-O-methyltransferase"}, {"letter": "D", "text": "Direct agonism at D2 and D3 receptors"}, {"letter": "E", "text": "Inhibition of the vesicular monoamine transporter"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": null, "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO6; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Amantadine", "laterality": false, "reworks": null, "explanation": "Peak-dose levodopa-induced dyskinesia (chorea about an hour after each dose) responds to amantadine, which the course describes as a weak NMDA antagonist that also increases dopamine release and blocks its reuptake, with anticholinergic properties.", "distractor_explanations": {"B": "That is rasagiline (selegiline also inhibits MAO-B); MAO-B inhibitors raise dopamine and don't treat dyskinesia.", "C": "That is entacapone; COMT inhibitors prolong levodopa's effect, which helps wearing-off, not peak-dose dyskinesia.", "D": "That describes ropinirole and pramipexole.", "E": "That is tetrabenazine, a dopamine-depleting drug used for Huntington chorea and tardive dyskinesia."}, "source": "Drug list (Amantadine: 'Increases dopamine release and blocks dopamine reuptake; also is a weak NMDA antagonist'); Wk4 packet p. 90 ('Amantadine: This drug is a complicated molecule with a multifunctional mechanism of action including glutamate receptor (NMDA) antagonism ... It is one of the few drugs that can directly treat levodopa-induced dyskinesia'); p. 79 (LID: 'too much levodopa in the setting of PD can produce the opposite symptoms')."}, {"id": "m2mk3-q13", "n": 13, "part": 1, "title": null, "stem": "An infarct destroys the left ventral posteromedial (VPM) nucleus of the thalamus. Taste is most likely reduced on which part of the tongue?", "options": [{"letter": "A", "text": "The right side"}, {"letter": "B", "text": "Both sides equally"}, {"letter": "C", "text": "Neither side, because taste bypasses the thalamus"}, {"letter": "D", "text": "Only the posterior third, on both sides"}, {"letter": "E", "text": "The left side"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Taste and Smell", "topic": "Taste and Smell", "note": null, "blueprint_category": "Taste and Smell", "learning_objective": "Taste & Smell LO5", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": true, "reworks": null, "explanation": "First-order taste fibers (CN VII, IX, X) synapse in the rostral nucleus of the solitary tract, which projects to the VPM and then to the insula. The course notes that the human taste pathway does not cross, so a left VPM lesion reduces taste on the left.", "distractor_explanations": {"A": "Taste pathways don't cross the way other sensory pathways do, so the VPM serves the same side.", "B": "Each VPM relays taste from its own side, so a one-sided lesion doesn't affect both sides equally.", "C": "It is olfaction that reaches the cortex without first passing through the thalamus; taste relays in the VPM.", "D": "The VPM relays taste from CN VII and IX territories, not just the posterior third."}, "source": "Wk5 packet p. 97 ('The second-order taste neurons in the nucleus of the solitary tract convey information to the thalamus, specifically to the ventral posteromedial (VPM) nucleus. Note that the taste pathways in humans do not cross like other sensory pathways'; 'The primary gustatory cortex is in the insula'); p. 94 (olfactory pathway doesn't involve the thalamus)."}, {"id": "m2mk3-q14", "n": 14, "part": 1, "title": null, "stem": "A 59-year-old man has sudden vertigo, vomiting, hoarseness and trouble swallowing. He cannot sit without leaning, and finger-to-nose and heel-to-shin testing are ataxic on the left. Hearing is normal in both ears and his strength is full. Occlusion of which artery best explains these findings?", "options": [{"letter": "A", "text": "Right posterior inferior cerebellar artery"}, {"letter": "B", "text": "Left anterior inferior cerebellar artery"}, {"letter": "C", "text": "Left posterior inferior cerebellar artery"}, {"letter": "D", "text": "Left superior cerebellar artery"}, {"letter": "E", "text": "Right superior cerebellar artery"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO5", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Ipsilateral limb ataxia with vertigo plus lower cranial nerve signs (hoarseness, dysphagia) means the posterior-inferior cerebellum and the lateral medulla are both involved: the PICA territory on the side of the ataxia. Normal hearing argues against AICA, whose labyrinthine branch supplies the inner ear.", "distractor_explanations": {"A": "Cerebellar signs are ipsilateral, so left limb ataxia points to the left cerebellum and its artery.", "B": "AICA infarcts usually involve the labyrinthine artery and cause unilateral hearing loss; his hearing is normal.", "D": "The SCA supplies the superior cerebellum and deep nuclei; it doesn't reach the medulla, so it wouldn't cause hoarseness or dysphagia.", "E": "Wrong side and wrong level: no medullary signs would occur, and the ataxia would be on the right."}, "source": "Wk4 packet p. 28 ('The posterior inferior cerebellar arteries (Fig. 14, red territory; PICA) arise from the vertebral arteries at the upper medulla'; 'PICA and AICA vessels also supply the brainstem. This means that more proximal infarctions can present with cerebellar ataxias and cranial nerve signs'; 'PICA infarcts can also affect the lateral medulla'); p. 26 ('Cerebellum Signs are IPSILATERAL to the lesion'); Wk5 packet p. 47 (AICA and the labyrinthine artery: vertigo with unilateral hearing loss). Hoarseness and dysphagia from the lateral medulla: earlier brainstem sessions (general knowledge here)."}, {"id": "m2mk3-q15", "n": 15, "part": 1, "title": null, "stem": "This myelin-stained section passes through the pons with the cerebellum attached. Identify the structure indicated by the arrow.", "options": [{"letter": "A", "text": "Abducens nucleus"}, {"letter": "B", "text": "Superior vestibular nucleus"}, {"letter": "C", "text": "Superior olivary nucleus"}, {"letter": "D", "text": "Dentate nucleus"}, {"letter": "E", "text": "None of these"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock3-images/s-vn-section.png", "image_needed": true, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": null, "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO10", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the lateral part of the floor of the fourth ventricle at a pontine level. The faculty slide labels it the superior vestibular nucleus, the part of the vestibular complex that reaches up to about mid-pons.", "distractor_explanations": {"A": "The abducens nucleus sits next to the midline in the floor of the fourth ventricle, not at its lateral edge.", "C": "The superior olivary nucleus lies deep in the ventral tegmentum beside the trapezoid body, far from the ventricular floor.", "D": "The dentate nucleus is the folded band inside the cerebellum, at the top of this section.", "E": "The arrowed structure is listed (superior vestibular nucleus)."}, "source": "Vestibular deck (91f3d059) slide 21 (arrow labeled 'Superior Vestibular nucleus'); Wk5 packet p. 37 ('This is the superior vestibular nucleus, which ends at about the mid-pons'; the vestibular nuclei are the 'most lateral cranial nerve nuclei in the floor of the ventricle').", "annotation": {"image": "qbank/midterm2-mock3-images/annotated/s-vn-section.png", "options": {"A": "not labeled in this figure", "B": "Faculty label 'Superior Vestibular nucleus' (faculty arrow; arrowed)", "C": "not labeled in this figure", "D": "Unlabeled on the slide: the folded band in the cerebellum at the top of the section", "E": "not applicable (the key is listed)"}, "note": "Source: Vestibular deck (91f3d059) slide 21. The faculty arrow is a vector on the slide; the amber arrow tip was placed at the same point on the section (mapped from slide coordinates). The 'Actual size' inset was cropped off.", "how": "Faculty slide with its label and arrow showing (the question removed the label). Green box = correct answer. The other choices aren't labeled on this slide. Amber arrow = where the question pointed (same point as the faculty arrow).", "marked": ["B"], "status": "built 2026-11-20 in Cowork: faculty source with its labels, amber arrow mapped from the question image (OpenCV SIFT + partial-affine), label boxes from Tesseract OCR / pdftotext bboxes"}}, {"id": "m2mk3-q16", "n": 16, "part": 1, "title": null, "stem": "After a total thyroidectomy, a 52-year-old woman has noisy, labored breathing (stridor) as soon as she is extubated. Laryngoscopy shows both vocal folds resting near the midline, unable to move apart when she breathes in. Loss of which muscle's action best explains her airway obstruction?", "options": [{"letter": "A", "text": "Cricothyroid"}, {"letter": "B", "text": "Lateral cricoarytenoid"}, {"letter": "C", "text": "Transverse arytenoid"}, {"letter": "D", "text": "Posterior cricoarytenoid"}, {"letter": "E", "text": "Thyroarytenoid"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": "Mock #1 Q17 used thyroidectomy -> external laryngeal nerve (pitch); this item asks the abductor after bilateral recurrent nerve injury.", "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx & Larynx LO5-7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The posterior cricoarytenoid is the only muscle that rotates the arytenoids to abduct the vocal folds, which is needed for forced inspiration. Like the other intrinsic muscles except the cricothyroid, it is supplied by the recurrent laryngeal nerve, so bilateral recurrent nerve injury leaves both folds near the midline and blocks the airway.", "distractor_explanations": {"A": "The cricothyroid tenses the vocal folds to raise pitch (external laryngeal nerve); it doesn't open the airway.", "B": "The lateral cricoarytenoid adducts the vocal folds, the opposite action.", "C": "The transverse arytenoid pulls the arytenoids together, adducting the folds posteriorly.", "E": "The thyroarytenoid relaxes the vocal ligaments; it doesn't abduct the folds."}, "source": "Wk4 packet p. 64 ('The posterior cricoarytenoid muscles ... Their action is to rotate the arytenoid cartilages so as to produce abduction of the vocal folds. The lateral crico-arytenoid muscles ... causing adduction'); p. 65 ('Forced inspiration ... the vocal folds are heavily abducted'); p. 66 ('The remaining laryngeal muscles are innervated by the recurrent laryngeal (aka inferior laryngeal) nerves')."}, {"id": "m2mk3-q17", "n": 17, "part": 1, "title": null, "stem": "A 79-year-old man with wet age-related macular degeneration in his right eye is to start monthly intravitreal aflibercept. Which adverse effects should he be warned about?", "options": [{"letter": "A", "text": "Bronchospasm and bradycardia"}, {"letter": "B", "text": "Brow ache, small pupils and dim vision"}, {"letter": "C", "text": "Malaise, fatigue and weight loss"}, {"letter": "D", "text": "Sensitivity to light and blurred vision from a dilated pupil"}, {"letter": "E", "text": "Bacterial endophthalmitis and a rise in intraocular pressure"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": "Mock #1 Q14 asked the anti-VEGF mechanism in wet AMD; this item asks aflibercept's adverse effects.", "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal LO2; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Aflibercept", "laterality": false, "reworks": null, "explanation": "Wet age-related macular degeneration (choroidal neovascularization) is treated with intravitreal anti-VEGF drugs. Aflibercept is a fusion protein that acts as a decoy receptor for VEGF; its drug-list side effects include eye pain, conjunctival hemorrhage, raised intraocular pressure, floaters and bacterial endophthalmitis.", "distractor_explanations": {"A": "These are the side effects of timolol, a beta-blocker glaucoma drop.", "B": "These are the side effects of pilocarpine, a cholinergic glaucoma drop.", "C": "These are the side effects of acetazolamide, a carbonic anhydrase inhibitor.", "D": "These follow mydriatics such as atropine or phenylephrine."}, "source": "Drug list (Aflibercept: 'A fusion protein that acts as a decoy receptor for vascular endothelial growth factor (VEGF)'; side effects 'Eye pain, conjunctival hemorrhage, eye irritation, increased intraocular pressure, vitreous floaters and bacterial endophthalmitis'); Retinal Disorders deck slides 19, 23 ('*wet = treatable with anti-VEGF'); Wk5 packet p. 126, 128."}, {"id": "m2mk3-q18", "n": 18, "part": 1, "title": null, "stem": "A 68-year-old woman with diabetes wakes with slurred speech and double vision; her blood pressure is 182/96 mm Hg. Her right arm and leg are weak with a right Babinski sign, and finger-to-nose and heel-to-shin testing on the right are clumsy out of proportion to the weakness. Sensation is normal and she has no vertigo. Where is the lesion most likely to be?", "options": [{"letter": "A", "text": "Brainstem"}, {"letter": "B", "text": "Right cerebellar hemisphere"}, {"letter": "C", "text": "Left cerebellar hemisphere"}, {"letter": "D", "text": "Cerebellar vermis"}, {"letter": "E", "text": "Dorsal columns of the spinal cord"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO6-9 (localization)", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Ataxia with weakness, an upper motor neuron sign and cranial nerve findings (diplopia, dysarthria) can't come from the cerebellum alone. The course says weakness or cranial neuropathies with ataxia point to a lesion outside the cerebellum, such as a brainstem stroke that damages the pathways linking cerebellum, thalamus and motor cortex.", "distractor_explanations": {"B": "A cerebellar hemisphere lesion gives ipsilateral ataxia, but not weakness, a Babinski sign or double vision.", "C": "Cerebellar signs are ipsilateral to the lesion, so a left hemisphere lesion would affect the left limbs; it also wouldn't cause weakness.", "D": "A vermis lesion mainly causes truncal and gait ataxia, without limb weakness or cranial nerve signs.", "E": "Dorsal column disease gives a sensory ataxia with lost position sense; her sensation is normal and she has cranial nerve signs."}, "source": "Wk4 packet p. 31 ('Brainstem strokes, although technically not part of the cerebellum, affect pathways connecting the cerebellum to the thalamus and cerebral motor cortex, leading to cerebellar ataxia along with muscle weakness or cranial nerve lesions'); p. 34 ('Muscle Weakness or Cranial Neuropathies: Not seen in vestibular or sensory ataxia, suggesting a lesion outside the cerebellum (e.g., brainstem)'); p. 36 table."}, {"id": "m2mk3-q19", "n": 19, "part": 1, "title": null, "stem": "Intrinsically photosensitive retinal ganglion cells, which also feed the pupillary light reflex, send axons to which hypothalamic nucleus?", "options": [{"letter": "A", "text": "Lateral geniculate nucleus"}, {"letter": "B", "text": "Superior colliculus"}, {"letter": "C", "text": "Suprachiasmatic nucleus"}, {"letter": "D", "text": "Edinger-Westphal nucleus"}, {"letter": "E", "text": "Supraoptic nucleus"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Many optic tract axons in the light-reflex pathway come from the same intrinsically photosensitive ganglion cells that project to the suprachiasmatic nucleus of the hypothalamus.", "distractor_explanations": {"A": "The lateral geniculate nucleus is a thalamic relay for conscious vision, not a hypothalamic nucleus.", "B": "The superior colliculus is in the midbrain tectum and handles reflex orienting and saccades.", "D": "The Edinger-Westphal nucleus is in the midbrain; it receives pretectal, not retinal, input.", "E": "The course's retinal target in the hypothalamus is the suprachiasmatic nucleus."}, "source": "Wk5 packet p. 75 ('many of them from the same intrinsically photosensitive ganglion cells that project to the suprachiasmatic nucleus'); Visual Fields LO5 ('suprachiasmatic nucleus of the hypothalamus')."}, {"id": "m2mk3-q20", "n": 20, "part": 1, "title": null, "stem": "All of the following are true of subthalamic nucleus deep brain stimulation for Parkinson disease EXCEPT:", "options": [{"letter": "A", "text": "It acts like a reversible lesion of an overactive subthalamic nucleus."}, {"letter": "B", "text": "It works by raising dopamine levels in the striatum."}, {"letter": "C", "text": "It does not depend on drug absorption or pharmacokinetics."}, {"letter": "D", "text": "It can allow the number of medications to be reduced."}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Treatment of Movement Disorders", "topic": "Treatment of Movement Disorders", "note": null, "blueprint_category": "Treatment of Movement Disorders", "learning_objective": "PD Treatment LO4", "difficulty": 2, "format": "negative", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q21 (DBS target to decrease activity -> STN) and wk4-slide-questions wk4-bg-s38 (DBS nucleus): same therapy, new ask (properties of STN DBS)", "explanation": "The course stresses that DBS works without affecting dopamine levels in the brain. Stimulating the subthalamic nucleus acts like a reversible lesion of an overactive nucleus, avoids the pharmacokinetic problems of levodopa, and often lets the medication list shrink.", "distractor_explanations": {"A": "True: the course says STN stimulation can be thought of as a reversible lesion, reversing the overactivity caused by dopamine loss.", "C": "True: the course lists this as an advantage over dopamine replacement.", "D": "True: the course notes DBS often reduces polypharmacy."}, "source": "Wk4 packet p. 91 ('In the STN, DBS can be thought of as creating a reversible lesion. Since the STN becomes overactive in PD, DBS can reverse this trend'; 'it does not depend on complicated pharmacokinetics or drug absorption'; 'It is important and interesting to realize that DBS works without affecting dopamine levels in the brain'; 'DBS can reduce the number of medications')."}, {"id": "m2mk3-q21", "n": 21, "part": 1, "title": null, "stem": "A 64-year-old man has had continuous vertigo, nausea and spontaneous nystagmus for 10 hours. The nystagmus beats left in every direction of gaze, and head impulses to the right produce a catch-up saccade. On alternate cover testing, the right eye makes a vertical refixation movement each time it is uncovered. Hearing is normal, he has no headache or limb weakness, and finger-to-nose testing is normal. What is the best interpretation?", "options": [{"letter": "A", "text": "Every element is peripheral, so this is right vestibular neuritis"}, {"letter": "B", "text": "The abnormal head impulse rules out a stroke"}, {"letter": "C", "text": "Direction-fixed nystagmus proves the lesion is in the labyrinth"}, {"letter": "D", "text": "The vertical refixation shows a skew deviation, a central sign, so he needs urgent evaluation for a brainstem or cerebellar stroke"}, {"letter": "E", "text": "HINTS+ doesn't apply, because his symptoms are continuous"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO6-7", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "He has an acute vestibular syndrome, the setting HINTS+ is meant for. Two elements look peripheral, but the vertical refixation on alternate cover is a skew deviation, a central sign. The course says to interpret the elements together and that any single central finding should prompt urgent evaluation for stroke; an abnormal head impulse doesn't exclude one.", "distractor_explanations": {"A": "The skew deviation is not a peripheral finding; one central sign is enough to raise concern.", "B": "The course says an abnormal impulse alone does not exclude stroke.", "C": "Direction-fixed nystagmus supports a peripheral cause but doesn't override a central sign such as skew.", "E": "HINTS+ is designed for exactly this situation: continuous vestibular symptoms with spontaneous nystagmus."}, "source": "Wk5 packet p. 47 ('HINTS+ is intended for a very specific clinical situation: a patient who is currently symptomatic with continuous vestibular symptoms and spontaneous nystagmus'; 'Any single central finding should instead increase concern for a central lesion and prompt urgent evaluation'; skew: 'If present, this is also concerning for central etiology'); p. 48 table ('An abnormal impulse alone does not exclude stroke'; 'Vertical corrective movement/skew ... raises central concern')."}, {"id": "m2mk3-q22", "n": 22, "part": 1, "title": null, "stem": "A 46-year-old man has 2 years of slowly progressive weakness and wasting of his left hand and right wrist extensors, with cramps. He has no neck pain, bladder problems or trouble swallowing. Reflexes are normal to reduced, with no spasticity or Babinski signs, and sensation is normal. Nerve conduction studies show motor conduction block. Which conclusion is best supported?", "options": [{"letter": "A", "text": "Multifocal motor neuropathy, which can respond to intravenous immunoglobulin"}, {"letter": "B", "text": "ALS; start riluzole and monitor liver enzymes"}, {"letter": "C", "text": "Cervical spondylotic myelopathy; obtain MRI of the cervical spine"}, {"letter": "D", "text": "Spinal muscular atrophy; confirm with SMN1 testing"}, {"letter": "E", "text": "Post-polio syndrome; supportive rehabilitation"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO4, LO7", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Slowly progressive, asymmetric upper-limb weakness without upper motor neuron signs, plus motor conduction block on nerve conduction studies, is multifocal motor neuropathy. The course stresses it because it is a treatable ALS mimic that can respond to IV immunoglobulin.", "distractor_explanations": {"B": "ALS combines upper and lower motor neuron signs; he has no UMN signs, and conduction block points to a neuropathy instead.", "C": "Myelopathy gives UMN signs below the level and usually neck pain or sensory symptoms; he has neither.", "D": "SMA is an inherited, symmetric, proximal LMN disorder, not asymmetric distal weakness with conduction block.", "E": "Post-polio syndrome needs a history of paralytic polio and doesn't produce conduction block."}, "source": "Wk4 packet p. 108 ('Multifocal motor neuropathy often causes slowly progressive, asymmetric weakness, especially in the upper extremities, but it generally lacks upper motor neuron signs. Electrodiagnostic testing may show motor conduction block ... it can respond to IV immunoglobulin, making it a treatable ALS mimic'); p. 107 table ('motor conduction block suggest a neuropathic alternative')."}, {"id": "m2mk3-q23", "n": 23, "part": 1, "title": null, "stem": "A 76-year-old woman has noticed her vision slowly worsening over 3 years. Her left fundus is shown. Which complaint is she most likely to describe?", "options": [{"letter": "A", "text": "Night blindness with gradually shrinking side vision"}, {"letter": "B", "text": "A curtain coming down over part of her vision"}, {"letter": "C", "text": "Sudden, painless loss of all vision in that eye"}, {"letter": "D", "text": "Loss of the outer (temporal) half of the field in both eyes"}, {"letter": "E", "text": "A dark or missing patch in the center of her vision, with side vision preserved"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock3-images/s-fundus-drusen.png", "image_needed": true, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO7", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The photo shows many yellow drusen clustered in the macula: dry age-related macular degeneration. Damage to the macula, where cones are concentrated, causes declining central vision with a central scotoma while peripheral vision is preserved.", "distractor_explanations": {"A": "That is retinitis pigmentosa, a rod disease with peripheral pigment clumps and a preserved macula.", "B": "A curtain is the symptom of retinal detachment.", "C": "Sudden total loss suggests an artery occlusion, not a slowly progressive process.", "D": "Bitemporal loss comes from compression of the optic chiasm, not a macular disease."}, "source": "Retinal Disorders deck (jones_retinal_disorders) slide 23 (this photo, labeled 'Drusen in dry armd'); Wk5 packet p. 64 ('Dry / nonexudative: Accumulation of extracellular drusen bodies'; 'In both forms, patients experience a decline in central vision with a preservation of peripheral vision. Shadows or missing areas of central vision are called scotomas'); p. 65 Fig. 22.", "annotation": {"image": "qbank/midterm2-mock3-images/annotated/s-fundus-drusen.png", "options": {"A": "not shown in this figure", "B": "not shown in this figure", "C": "not shown in this figure", "D": "not shown in this figure", "E": "Faculty label 'Drusen in dry armd' (orange arrow on the slide)"}, "note": "Source: Retinal Disorders deck slide 23, upper-right photo. The faculty label and orange arrow are slide objects outside the embedded photo.", "how": "Faculty slide with its label showing (the question used the photo alone). Green box = correct answer, on the label naming the condition. The other choices aren't labeled on this slide.", "marked": ["E"], "status": "built 2026-11-20 in Cowork: faculty source with its labels, amber arrow mapped from the question image (OpenCV SIFT + partial-affine), label boxes from Tesseract OCR / pdftotext bboxes"}}, {"id": "m2mk3-q24", "n": 24, "part": 1, "title": null, "stem": "Ropinirole, a D2/D3 receptor agonist, improves movement in Parkinson disease. Through striatal D2 receptors alone, how does it change subthalamic nucleus activity and inhibition of the motor thalamus?", "options": [{"letter": "A", "text": "Subthalamic nucleus more active; motor thalamus more inhibited"}, {"letter": "B", "text": "Subthalamic nucleus less active; motor thalamus less inhibited"}, {"letter": "C", "text": "Subthalamic nucleus less active; motor thalamus more inhibited"}, {"letter": "D", "text": "Subthalamic nucleus more active; motor thalamus less inhibited"}, {"letter": "E", "text": "No change in the subthalamic nucleus; direct-pathway neurons excited"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": "Mock #2 Q27 asked the indirect-pathway chain after cortical activation, and Mock #1 Q31 the GPe release in Huntington disease; this item asks the net effect of a D2 agonist at two nodes.", "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO11-12; drug list (green)", "difficulty": 3, "format": "vignette", "drug_item": "Ropinirole", "laterality": false, "reworks": "wk4-slide-questions wk4-bg-s30 (D2 stimulation by dopamine -> more or less movement): new case (D2 agonist drug) and new ask (net change at the subthalamic nucleus and thalamus)", "explanation": "D2 receptors on indirect-pathway striatal neurons couple to Gi, so ropinirole inhibits them. With less striatal GABA, the external pallidum is released and inhibits the subthalamic nucleus more, so the subthalamic nucleus becomes less active. It then drives the internal pallidum less with glutamate, so the internal pallidum inhibits the motor thalamus less and movement is facilitated.", "distractor_explanations": {"A": "This is the effect of losing D2 stimulation (untreated Parkinson disease or a D2 blocker): the indirect pathway is released and the thalamus is braked.", "C": "A quieter subthalamic nucleus drives the internal pallidum less, so the thalamus is inhibited less, not more.", "D": "Inhibiting indirect-pathway striatal neurons releases the external pallidum, which inhibits the subthalamic nucleus more, so it becomes less active.", "E": "Exciting direct-pathway neurons is a D1 (Gs) effect; through D2 receptors the drug acts on the indirect pathway, which runs through the subthalamic nucleus."}, "source": "Drug list (Ropinirole: 'Dopamine D2 & D3 receptor agonist'); Wk4 packet p. 14 ('Dopamine at D2 receptors are G-Protein coupled receptors that couple to Gαi. Dopamine at D2 receptors inhibit transmission of the Indirect Pathway'); p. 16 ('The globus pallidus externa neurons are inhibitory on neurons of the subthalamic nucleus via GABA. The subthalamic neurons are excitatory on globus pallidus interna neurons via glutamate. The globus pallidus internal segment neurons are inhibitory on thalamic neurons'); p. 90 (dopamine agonists bind striatal receptors, D2>D1)."}, {"id": "m2mk3-q25", "n": 25, "part": 1, "title": null, "stem": "A sudden flash at the edge of vision makes both eyes jump reflexively toward it. Which structure initiates this saccade?", "options": [{"letter": "A", "text": "Frontal eye field"}, {"letter": "B", "text": "Parietal eye field"}, {"letter": "C", "text": "Superior colliculus"}, {"letter": "D", "text": "Flocculus"}, {"letter": "E", "text": "Vestibular nuclei"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": null, "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO4-5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course divides saccade initiation: the frontal eye fields start voluntary saccades and the superior colliculus starts reflexive saccades to sudden stimuli.", "distractor_explanations": {"A": "The frontal eye fields initiate voluntary saccades.", "B": "The parietal eye fields assist with attention and smooth pursuit.", "D": "The flocculus fine-tunes eye movements and suppresses the vestibulo-ocular reflex; it doesn't initiate saccades.", "E": "The vestibular nuclei drive the vestibulo-ocular reflex during head movement."}, "source": "Wk5 packet p. 115 ('The frontal eye fields initiate voluntary saccades, whereas the superior colliculus initiates reflexive saccades'); p. 113 (parietal eye fields: smooth pursuit; flocculus and vermis fine-tune)."}, {"id": "m2mk3-q26", "n": 26, "part": 1, "title": null, "stem": "The right chorda tympani is cut inside the middle ear during surgery. Which deficits are expected on the right?", "options": [{"letter": "A", "text": "Lost taste and touch from the anterior two-thirds of the tongue, with salivation normal"}, {"letter": "B", "text": "Lost taste from the posterior one-third of the tongue and a reduced gag response"}, {"letter": "C", "text": "Lost taste from the anterior two-thirds of the tongue and less saliva from the parotid gland"}, {"letter": "D", "text": "Lost taste from the anterior two-thirds of the tongue and less saliva from the submandibular and sublingual glands, with touch on the anterior tongue preserved"}, {"letter": "E", "text": "Weakness of tongue protrusion with loss of anterior taste"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": "Mock #1 Q29 cut the lingual nerve near the third molar (taste and touch both lost); this item cuts the chorda tympani in the middle ear, so touch is spared and salivation is reduced.", "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal & Oral LO7-8, LO10-11", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The chorda tympani carries taste from the anterior two-thirds of the tongue (cell bodies in the geniculate ganglion) and preganglionic parasympathetic fibers that synapse in the submandibular ganglion for the submandibular and sublingual glands. General sensation from the anterior tongue stays with the lingual nerve (V3), so touch is spared.", "distractor_explanations": {"A": "Touch from the anterior tongue travels in the lingual nerve (V3), which isn't in the middle ear, and the chorda tympani does carry salivary fibers.", "B": "The posterior third and the gag afferents belong to CN IX, not the chorda tympani.", "C": "The chorda tympani's parasympathetic fibers reach the submandibular ganglion; the parotid isn't supplied this way.", "E": "Tongue muscles are supplied by CN XII, which isn't near the middle ear."}, "source": "Wk4 packet p. 48 ('taste afferents from the anterior 2/3 of the tongue but these leave the lingual nerve in the infratemporal fossa on the chorda tympani branch of CN VII. These afferents then join the rest of CN VII in the middle ear'; 'the chorda tympani also bring preganglionic parasympathetic fibers ... synapse in the submandibular parasympathetic ganglion ... distributed to both the submandibular and sublingual salivary glands'); p. 47 (general sense of the anterior 2/3 is CN V3)."}, {"id": "m2mk3-q27", "n": 27, "part": 1, "title": null, "stem": "A 3-year-old boy has profound sensorineural hearing loss in both ears after pneumococcal meningitis, and powerful hearing aids give him no useful speech. Which intervention is most appropriate?", "options": [{"letter": "A", "text": "Bilateral cochlear implants"}, {"letter": "B", "text": "Stapedectomy"}, {"letter": "C", "text": "Tympanostomy tubes"}, {"letter": "D", "text": "Repair of the tympanic membranes"}, {"letter": "E", "text": "Bone-anchored hearing aids"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO3, LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Meningitis organisms reach the cochlea through CSF and damage hair cells, causing sensorineural loss. Hearing aids only amplify sound, so with profound bilateral loss they don't h
