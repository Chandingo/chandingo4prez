<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

branches of the posterior cerebral and posterior communicating arteries"}, {"letter": "E", "text": "Superior cerebellar artery"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "BG LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course assigns most of the globus pallidus to the anterior choroidal artery (small feeders from the internal carotid). The striatum (caudate and putamen) is supplied by the lenticulostriate and medial striate arteries, so an infarct that spares them and hits only the pallidum points to the anterior choroidal artery.", "distractor_explanations": {"A": "The lenticulostriate arteries supply most of the caudate and putamen, which are spared here.", "B": "The medial striate artery mainly supplies the nucleus accumbens and the head of the caudate.", "D": "These perforators supply the substantia nigra and subthalamic nucleus, below the posterior thalamus.", "E": "The superior cerebellar artery supplies the upper cerebellum and rostral lateral pons, not the basal ganglia."}, "source": "Wk4 packet p. 14 ('the striatum by perforating branches of the middle cerebral artery (also referred to as lenticulostriate) and perforating branches of the anterior cerebral artery (also referred to as medial striate arteries), and the globus pallidus by the anterior choroidal artery'); BG deck (4285501b) slides 26 and 37 ('Majority of the globus pallidus is supplied by the Anterior Choroidal Artery (off ICA)')."}, {"id": "m2mk4-q02", "n": 2, "part": 1, "title": null, "stem": "In the basal ganglia's limbic loop, limbic inputs reach which part of the striatum, and which pallidal region relays the loop's output to the thalamus?", "options": [{"letter": "A", "text": "Nucleus accumbens; ventral pallidum"}, {"letter": "B", "text": "Putamen; internal globus pallidus"}, {"letter": "C", "text": "Caudate nucleus; globus pallidus"}, {"letter": "D", "text": "Nucleus accumbens; external globus pallidus"}, {"letter": "E", "text": "Amygdala; ventral pallidum"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "BG LO8", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Limbic structures project to the ventral striatum, the nucleus accumbens, which projects to the ventral pallidum (a small part of the globus pallidus under the anterior commissure), which in turn projects to the thalamus.", "distractor_explanations": {"B": "Sensorimotor cortex projects mainly to the putamen: that is the motor loop.", "C": "Association cortex projects mainly to the caudate: that is the cognitive (prefrontal) loop.", "D": "The external pallidum is the first relay of the indirect pathway toward the subthalamic nucleus, not the limbic loop's output relay.", "E": "The amygdala is a limbic source of input, not part of the striatum."}, "source": "Wk4 packet p. 15 ('Limbic structures project to a ventral part of the striatum, the nucleus accumbens ... The nucleus accumbens then projects to a separate part of the globus pallidus just underneath the anterior commissure (the ventral pallidum), which in turn projects to the thalamus'; Fig. 8: association cortex emphasizes the caudate, sensorimotor cortex the putamen)."}, {"id": "m2mk4-q03", "n": 3, "part": 1, "title": null, "stem": "A 64-year-old man has had Parkinson disease for 11 years. Despite carbidopa-levodopa, a dopamine agonist and an MAO-B inhibitor at optimal doses, his rigidity and slowness are much worse on his left side, and he can no longer button his shirt with his left hand. A neurosurgeon makes a small lesion that silences his right internal globus pallidus. Which outcome is expected?", "options": [{"letter": "A", "text": "Movement of his right limbs improves, because his right motor thalamus is inhibited less"}, {"letter": "B", "text": "Movement of his left limbs worsens, because his right motor thalamus is inhibited more"}, {"letter": "C", "text": "Movement of his left limbs improves, because more dopamine is released in the right striatum"}, {"letter": "D", "text": "No change, because the internal globus pallidus is not part of the motor circuit"}, {"letter": "E", "text": "Movement of his left limbs improves, because his right motor thalamus is inhibited less"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "BG LO11-12", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "In Parkinson disease the internal globus pallidus is overactive and over-inhibits the motor thalamus. The course says therapy aims to inhibit the STN or GPi 'so that there is less inhibitory output from the GPi, encouraging movement'. Silencing the right GPi disinhibits the right VA/VL thalamus, which drives the right motor cortex; its corticospinal output crosses, so the left limbs improve. (Laterality step is Claude's application of the course circuit plus the pyramidal decussation.)", "distractor_explanations": {"A": "The right thalamus drives the right motor cortex, whose corticospinal fibers cross to control the left limbs.", "B": "Silencing the GPi removes its GABAergic output, so the thalamus is inhibited less, not more.", "C": "The lesion acts downstream of the striatum; it doesn't restore dopamine.", "D": "The GPi is the main output nucleus of the motor circuit and a standard surgical target in Parkinson disease."}, "source": "Wk4 packet p. 16 ('in Parkinson disease the frequency needed in the STN and GPi requires an inhibition of either nuclei so that there is less inhibitory output from the GPi – encouraging movement'; 'The globus pallidus internal segment neurons are inhibitory on thalamic neurons'); Wk4 packet p. 72 (GPi as the brake on movement); Wk4 packet p. 4, 6 (Ascending/Descending ILM: corticospinal fibers cross at the pyramidal decussation)."}, {"id": "m2mk4-q04", "n": 4, "part": 1, "title": null, "stem": "Axons from the inferior olivary nucleus, relaying cortical information to the cerebrocerebellum, end in the cerebellum as which type of fiber?", "options": [{"letter": "A", "text": "Mossy fibers"}, {"letter": "B", "text": "Climbing fibers"}, {"letter": "C", "text": "Parallel fibers"}, {"letter": "D", "text": "Purkinje cell axons"}, {"letter": "E", "text": "Dentatothalamic fibers"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "In the course's afferent table, the cortico-olivocerebellar pathway runs cerebral cortex → inferior olivary nuclei → climbing fibers → inferior cerebellar peduncle → cerebrocerebellum. The other cortical and spinal inputs arrive as mossy fibers.", "distractor_explanations": {"A": "Mossy fibers carry the corticopontocerebellar, spinocerebellar and vestibulocerebellar inputs, not the olivary input.", "C": "Parallel fibers are axons of granule cells inside the cerebellar cortex, not an afferent pathway.", "D": "Purkinje cell axons are the output of the cerebellar cortex to the deep nuclei.", "E": "Dentatothalamic fibers are an efferent pathway leaving through the superior peduncle."}, "source": "Wk4 packet p. 24 (afferent table: 'Cortico-olivocerebellar: Cerebral Cortex > Inferior Olivary Nuclei > Climbing Fibers > Inferior Peduncle > Cerebrocerebellum'; corticopontocerebellar and spinal inputs as 'Mossy Fibers')."}, {"id": "m2mk4-q05", "n": 5, "part": 1, "title": null, "stem": "This myelin-stained section passes through the caudal midbrain. A small infarct destroys only the midline region indicated by the arrow. Which deficit is most likely?", "options": [{"letter": "A", "text": "Ataxia of the left arm and leg only"}, {"letter": "B", "text": "Vertical double vision from weakness of both superior oblique muscles"}, {"letter": "C", "text": "Hearing loss in both ears"}, {"letter": "D", "text": "Ataxia of the arms and legs on both sides"}, {"letter": "E", "text": "Loss of vibration and position sense on both sides"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/s-cb-scpx.png", "image_needed": true, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO3-4", "difficulty": 3, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow sits where the faculty label reads 'Beginning of SCP decussation'. Output from the dentate and interposed nuclei leaves through the superior cerebellar peduncle and crosses here on its way to the red nucleus and thalamus. Because cerebellar circuits are double-crossed, this crossing is what keeps cerebellar signs ipsilateral. A midline lesion cuts the crossing fibers from both hemispheres at once, so limb coordination fails on both sides. (Bilateral ataxia is Claude's inference from the course facts; the course states the double-crossed rule.)", "distractor_explanations": {"A": "One-sided limb ataxia needs a lesion of one cerebellar hemisphere or of one superior peduncle before it crosses; this midline region carries crossing fibers from both sides.", "B": "The trochlear fibers cross at the top (dorsal surface) of this section, far from the arrow.", "C": "Auditory input is represented bilaterally above the cochlear nuclei, and the lateral lemniscus lies at the lateral edge of the section.", "E": "The medial lemnisci lie lateral to the arrowed region at this level."}, "source": "Ear Anatomy deck (c97442cf) slide 36 (Nolte section; label 'Beginning of SCP decussation'; also 'Trochlear decussation', 'Lateral lemniscus', 'Medial lemniscus', 'MLF'); Wk5 packet p. 38 ('C24. Caudal midbrain'); Wk4 packet p. 25-26 (efferent table: 'Dentatothalamic: Dentate > Superior'; 'Globose-Emboliform-Rubral: Interposed > Superior'; 'cerebellar circuits ... are either (1) completely ipsilateral or (2) double-crossed').", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/s-cb-scpx.png", "options": {"A": "Faculty label 'Superior cerebellar peduncle' (one side, before the fibers cross)", "B": "Faculty label 'Trochlear decussation' (top of the section)", "C": "Faculty label 'Lateral lemniscus'", "D": "Faculty label 'Beginning of SCP decussation' (arrowed region); the choice names the deficit", "E": "Faculty label 'Medial lemniscus'"}, "note": "Source: Ear Anatomy deck (c97442cf) slide 36 (same section as Wk5 packet p. 38, C24). The label text and two label tails were covered with white in the question crop; the faculty leader lines are baked into the image and were left in place. The choices are deficits, so the arrowed label is starred, not boxed.", "how": "Same faculty figure with its labels showing (the full labeled version). Amber star on the faculty label or title tied to the key (the choices aren't structure names); red boxes on labels tied to other choices. Arrow redrawn where the question placed it (if the question has one).", "marked": ["A", "B", "C", "D", "E"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q06", "n": 6, "part": 1, "title": null, "stem": "A 34-year-old woman with epilepsy had the dose of her seizure medication raised last week. She now has a staggering, wide-based gait, slurred speech and nystagmus, and finger-to-nose testing is clumsy in both arms. Strength and sensation are normal. What is the most likely cause?", "options": [{"letter": "A", "text": "A toxic (supratherapeutic) blood level of phenytoin"}, {"letter": "B", "text": "Vitamin B12 deficiency affecting the dorsal columns"}, {"letter": "C", "text": "Occlusion of the posterior inferior cerebellar artery"}, {"letter": "D", "text": "Paraneoplastic antibodies against Purkinje cells"}, {"letter": "E", "text": "Friedreich ataxia"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Cerebellum & Ataxia LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course lists phenytoin as a medication that causes cerebellar ataxia, chronically or acutely when blood levels are supratherapeutic. A symmetric pancerebellar picture (gait ataxia, dysarthria, nystagmus, bilateral dysmetria) right after a dose increase fits drug toxicity.", "distractor_explanations": {"B": "B12 deficiency causes a sensory ataxia with lost proprioception, not nystagmus and slurred speech, and wouldn't follow a dose change.", "C": "A PICA stroke is sudden and mainly one-sided, with vertigo and brainstem signs.", "D": "Paraneoplastic degeneration evolves over weeks to months with an underlying cancer; nothing here suggests one.", "E": "Friedreich ataxia begins in childhood or adolescence with loss of proprioception, not in an adult after a dose change."}, "source": "Wk4 packet p. 31 ('Drugs like phenytoin, used for epilepsy, can cause cerebellar ataxia both chronically as well as acutely if blood levels are toxically supratherapeutic'); p. 31 (PICA stroke: 'ipsilateral ataxia'; paraneoplastic ataxia); p. 34 (Friedreich ataxia; B12 and the posterior columns)."}, {"id": "m2mk4-q07", "n": 7, "part": 1, "title": null, "stem": "A 62-year-old man with long-standing, poorly controlled diabetes has a year of unsteady walking that is worst at night and when he closes his eyes in the shower. He has lost vibration and joint-position sense in his fingers and toes, and his ankle reflexes are absent. He uses a cane at night and has fallen twice in the dark. Strength is normal. Which additional finding is most expected?", "options": [{"letter": "A", "text": "Slow, irregular rapid alternating hand movements with eyes open"}, {"letter": "B", "text": "Spinning vertigo whenever he turns his head"}, {"letter": "C", "text": "Finger-to-nose is accurate with eyes open, but with eyes closed the hand drops and rebounds upward"}, {"letter": "D", "text": "Halting, scanning speech"}, {"letter": "E", "text": "Nystagmus on looking to either side"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Cerebellum & Ataxia LO9", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Diabetes can damage the large sensory fibers that carry proprioception, producing a sensory ataxia: worse in the dark or with eyes closed, with lost position and vibration sense. Vision compensates for missing proprioception, so pointing is normal with eyes open; the course says that with eyes closed the hand drops and rebounds upward. Vertigo, nystagmus, dysdiadochokinesia and scanning speech are absent in sensory ataxia.", "distractor_explanations": {"A": "Dysdiadochokinesia is a cerebellar sign; the course says rapid alternating movements are intact in sensory ataxia.", "B": "Vertigo points to vestibular ataxia and is absent in sensory ataxia.", "D": "Scanning speech is a cerebellar sign, not seen in sensory ataxia.", "E": "Nystagmus occurs in vestibular and cerebellar ataxia, not sensory ataxia."}, "source": "Wk4 packet p. 33 ('Peripheral neuropathies affecting large sensory fibers responsible for proprioception and vibratory touch can cause sensory ataxia ... Common causes include vitamin B deficiencies and diabetes'); p. 35 ('In sensory ataxia, pointing is normal with eyes open, but the hand drops and rebounds upwards when eyes are closed'; 'The inability to perform rapid alternating movements is seen in cerebellar ataxia but not in other types'); p. 35-36 table (vertigo, nystagmus, speech problems: No for sensory ataxia)."}, {"id": "m2mk4-q08", "n": 8, "part": 1, "title": null, "stem": "In a patient with ataxia, halting, 'scanning' speech points to which type of dysfunction?", "options": [{"letter": "A", "text": "Proprioceptive (sensory) dysfunction"}, {"letter": "B", "text": "Cerebellar dysfunction"}, {"letter": "C", "text": "Vestibular dysfunction"}, {"letter": "D", "text": "Frontal lobe dysfunction"}, {"letter": "E", "text": "Primary motor cortex dysfunction"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Cerebellum & Ataxia LO6-7", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course names halting ('scanning') speech as a central symptom seen in some cerebellar ataxias, but not in sensory or vestibular ataxia.", "distractor_explanations": {"A": "The course lists no speech abnormality in sensory ataxia.", "C": "Vestibular ataxia brings vertigo and nystagmus, not speech problems.", "D": "Frontal gait disorders aren't one of the course's three ataxia types, and scanning speech isn't attributed to them.", "E": "Motor cortex lesions cause weakness, not an ataxia with scanning speech."}, "source": "Wk4 packet p. 34 ('Speech Abnormalities: Halting (“scanning”) speech is a central symptom that may be seen in some cases of cerebellar ataxia, but not sensory or vestibular ataxia'); p. 36 table ('Speech problems: No / No / Frequently')."}, {"id": "m2mk4-q09", "n": 9, "part": 1, "title": null, "stem": "A 38-year-old woman has 3 months of nasal speech, fatigable chewing, trouble swallowing and neck weakness that worsen through the day; last week she needed a brief ICU stay for shortness of breath. She has no ptosis today, but her speech becomes nasal and fades as she keeps talking. Pupils, reflexes and sensation are normal. Serum acetylcholine receptor antibodies are negative. Which test is the most appropriate next step to support the suspected diagnosis?", "options": [{"letter": "A", "text": "Voltage-gated calcium channel antibodies"}, {"letter": "B", "text": "Serum creatine kinase"}, {"letter": "C", "text": "Sensory nerve conduction studies"}, {"letter": "D", "text": "Muscle biopsy"}, {"letter": "E", "text": "Serum muscle-specific kinase (MuSK) antibodies"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Fatigable bulbar, neck and respiratory weakness with normal pupils, reflexes and sensation is myasthenia gravis. A negative AChR antibody result doesn't exclude it. The course says to test MuSK antibodies when AChR testing is negative, and that MuSK MG often has prominent bulbar or respiratory involvement, as here.", "distractor_explanations": {"A": "These support Lambert-Eaton syndrome, which causes proximal leg weakness, reduced reflexes and autonomic symptoms rather than fatigable bulbar weakness.", "B": "An elevated CK points to a muscle disease, and wouldn't support a neuromuscular junction disorder.", "C": "Sensation is normal; sensory studies look for a neuropathy, not impaired transmission.", "D": "A biopsy evaluates primary muscle disease and isn't part of the myasthenia work-up."}, "source": "Wk4 packet p. 96 (LO4 table: 'MuSK antibodies: Evaluate a compatible syndrome, especially when AChR testing is negative. MuSK MG often has prominent bulbar or respiratory involvement'; 'negative routine antibody testing does not completely exclude MG'); p. 95 (sensation, reflexes and pupils spared in MG)."}, {"id": "m2mk4-q10", "n": 10, "part": 1, "title": null, "stem": "A 33-year-old woman has drooping eyelids and double vision that worsen by evening. Each of the following findings would fit myasthenia gravis EXCEPT:", "options": [{"letter": "A", "text": "Ptosis that worsens during a minute of sustained upward gaze"}, {"letter": "B", "text": "Ptosis that is worse on one side than the other"}, {"letter": "C", "text": "Normal tendon reflexes"}, {"letter": "D", "text": "Pupils that are dilated and react sluggishly to light"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO3", "difficulty": 2, "format": "negative", "drug_item": null, "laterality": false, "reworks": null, "explanation": "MG targets muscle-type nicotinic receptors at the skeletal neuromuscular junction, not the autonomic receptors that control the pupil, so pupils are spared. The course says abnormal pupils, prominent sensory loss, markedly reduced reflexes or nonfatigable weakness should raise concern for another diagnosis (for example botulism, which dilates the pupils).", "distractor_explanations": {"A": "Fatigability with sustained upgaze is a classic MG finding.", "B": "The course notes ocular weakness in MG may be asymmetric.", "C": "The course says tendon reflexes are generally normal in MG."}, "source": "Wk4 packet p. 95 ('Pupillary responses are typically spared because MG targets muscle-type nicotinic receptors at the skeletal neuromuscular junction rather than the autonomic receptors that control the pupil'; 'Sustained upward gaze may gradually worsen ptosis'; 'Tendon reflexes are also generally normal'; ocular row: 'weakness may be asymmetric'); p. 96 (pupillary abnormalities point to an alternative diagnosis)."}, {"id": "m2mk4-q11", "n": 11, "part": 1, "title": null, "stem": "Which microscopic finding is present in the motor neurons of most patients with sporadic amyotrophic lateral sclerosis?", "options": [{"letter": "A", "text": "Lewy bodies containing alpha-synuclein"}, {"letter": "B", "text": "Cytoplasmic TDP-43 inclusions, often marked by ubiquitin"}, {"letter": "C", "text": "Neurofibrillary tangles of tau"}, {"letter": "D", "text": "Intranuclear huntingtin inclusions"}, {"letter": "E", "text": "Glial cytoplasmic alpha-synuclein inclusions"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course states that most sporadic ALS and many genetic forms are associated with abnormal cytoplasmic TDP-43 inclusions, often marked by ubiquitin; Bunina bodies are another classic finding.", "distractor_explanations": {"A": "Lewy bodies mark Parkinson disease and related synucleinopathies.", "C": "Tau aggregates belong to PSP, corticobasal degeneration and Alzheimer disease.", "D": "Huntingtin inclusions belong to Huntington disease.", "E": "Alpha-synuclein in glia marks multisystem atrophy."}, "source": "Wk4 packet p. 107 ('most sporadic ALS and many genetic forms are associated with abnormal cytoplasmic TDP-43 inclusions, often marked by ubiquitin. Another classic pathologic finding is the Bunina body'); p. 69, 73 (Lewy bodies, glial synuclein in MSA, tau in PSP/CBD)."}, {"id": "m2mk4-q12", "n": 12, "part": 1, "title": null, "stem": "A 57-year-old man with ALS has stiff, spastic legs and painful spasms at night. His neurologist adds an oral GABA-B receptor agonist for the spasticity. Which side effects should he be warned about?", "options": [{"letter": "A", "text": "Weakness and drowsiness (CNS depression)"}, {"letter": "B", "text": "Liver injury, nausea and weight loss"}, {"letter": "C", "text": "Bruising, gait disturbance and skin rash"}, {"letter": "D", "text": "Hypotension, dry mouth and constipation"}, {"letter": "E", "text": "Peripheral edema and dizziness"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO6; drug list (ALS)", "difficulty": 2, "format": "vignette", "drug_item": "baclofen (side effects)", "laterality": false, "reworks": "Weekly Quiz #4 Q7 (ALS drug by mechanism -> riluzole): new indication (spasticity) and new ask (side effects of the GABA-B agonist)", "explanation": "The GABA-B agonist used for spasticity in ALS is baclofen. The drug list gives its side effects as weakness and CNS depression: it relaxes muscle tone generally and is sedating.", "distractor_explanations": {"B": "These are riluzole's listed side effects; riluzole reduces glutamate excitotoxicity, not spasticity.", "C": "These are edaravone's listed side effects; edaravone is an antioxidant, not an antispastic drug.", "D": "These are tizanidine's listed side effects; tizanidine reduces spasticity as an alpha-2 agonist, not a GABA-B agonist.", "E": "These are gabapentin's listed side effects; gabapentin is an alpha-2-delta ligand, not the GABA-B agonist."}, "source": "Drug list, ALS table ('Reduces spasticity: Baclofen (Lioresal) (muscle relaxant): GABAB agonist-produces inhibitory effects in the CNS: Weakness, CNS depression'; tizanidine 'Alpha2 receptor agonist: Hypotension, drowsiness, lightheadedness, dry mouth, dizziness, constipation'; riluzole 'Nausea, Diarrhea, Weight loss, Dizziness, Hepatic injury'; edaravone 'Bruising, Gait disturbances ... skin rash'). Bold green. Reworks: Weekly Quiz #4 Q7 (ALS drug by mechanism -> riluzole): new indication (spasticity) and new ask (side effects of the GABA-B agonist)."}, {"id": "m2mk4-q13", "n": 13, "part": 1, "title": null, "stem": "After an operation in the left upper neck, a 58-year-old man has slurred speech and trouble moving food around his mouth. Taste and touch on his tongue are normal. When he sticks out his tongue, what is expected?", "options": [{"letter": "A", "text": "It deviates to the right"}, {"letter": "B", "text": "It protrudes in the midline but its left side is numb"}, {"letter": "C", "text": "It deviates to the left"}, {"letter": "D", "text": "It protrudes in the midline, but taste is lost on the left anterior two-thirds"}, {"letter": "E", "text": "It cannot be protruded past the teeth at all"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": null, "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal/Oral LO5, LO11", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Motor deficits of the tongue with normal taste and touch point to the left hypoglossal nerve (CN XII). The course says that when a patient with hypoglossal injury protrudes the tongue, it deviates toward the injured side (the intact genioglossus pushes it over).", "distractor_explanations": {"A": "The intact right genioglossus pushes the tongue toward the weak left side, not away from it.", "B": "Numbness would mean lingual (V3) nerve injury, and he has normal touch.", "D": "Taste loss would mean chorda tympani or lingual nerve injury, and his taste is normal.", "E": "A one-sided hypoglossal injury leaves the opposite genioglossus able to protrude the tongue."}, "source": "Wk4 packet p. 45 ('Injury to the hypoglossal nerve will impact the function of most of these muscles (e.g., the genioglossus muscle). If a patient protrudes their tongue, it will deviate toward the injured side'); p. 47 (tongue sensation: V3 general sense, chorda tympani taste)."}, {"id": "m2mk4-q14", "n": 14, "part": 1, "title": null, "stem": "A 44-year-old woman is having a pituitary adenoma removed through the nose. The surgeon reaches the sella turcica through the paranasal sinus that lies directly in front of and below it, entering that sinus through its natural opening. Where is that opening?", "options": [{"letter": "A", "text": "In the middle meatus, in the semilunar hiatus"}, {"letter": "B", "text": "In the superior meatus"}, {"letter": "C", "text": "In the inferior meatus"}, {"letter": "D", "text": "Through the cribriform plate of the ethmoid"}, {"letter": "E", "text": "In the sphenoethmoidal recess, above the superior concha"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": null, "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal/Oral LO1-2", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The sinus in front of and below the sella turcica is the sphenoid sinus, and the course notes that pituitary tumors are reached through the nose and sphenoid sinus. The sphenoid sinus opens into the sphenoethmoidal recess, the space above the superior concha.", "distractor_explanations": {"A": "The maxillary sinus (and frontal sinus) drain into the middle meatus, not the sinus beneath the sella.", "B": "The superior meatus receives the remaining (posterior) ethmoid air cells.", "C": "The inferior meatus receives the nasolacrimal duct, not a sinus.", "D": "The cribriform plate transmits olfactory nerve fibers to the anterior cranial fossa; no sinus opens there."}, "source": "Wk4 packet p. 39 ('the space above the superior concha is called the spheno-ethmoidal recess and it has the opening of the sphenoid sinuses'; inferior meatus: nasolacrimal duct; middle meatus: maxillary, frontal, many ethmoid sinuses; superior meatus: remaining ethmoid sinuses); p. 41 ('the sphenoid sinuses are ... anterior and inferior to the sella turcica. Their openings are in the sphenoethmoidal recess. Clinical point: access to pituitary tumors is via the nose and sphenoid sinus')."}, {"id": "m2mk4-q15", "n": 15, "part": 1, "title": null, "stem": "Which muscle runs from one arytenoid to the tip of the other, continuing into the aryepiglottic fold to close the laryngeal inlet during swallowing?", "options": [{"letter": "A", "text": "Transverse arytenoid"}, {"letter": "B", "text": "Posterior cricoarytenoid"}, {"letter": "C", "text": "Lateral cricoarytenoid"}, {"letter": "D", "text": "Oblique arytenoid"}, {"letter": "E", "text": "Cricothyroid"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": null, "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx/Larynx LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course describes the oblique arytenoids as running from the base of each arytenoid to the tip of the other and continuing into the aryepiglottic folds; their key action is to constrict the aryepiglottic folds like a purse string, closing the aditus during swallowing.", "distractor_explanations": {"A": "The transverse arytenoid runs straight across between the arytenoids and adducts the vocal folds posteriorly.", "B": "The posterior cricoarytenoid rotates the arytenoids to abduct the vocal folds.", "C": "The lateral cricoarytenoid adducts the vocal ligaments.", "E": "The cricothyroid tilts the thyroid cartilage to tense the vocal ligaments and raise pitch."}, "source": "Wk4 packet p. 65 ('The oblique arytenoid muscles run from the base of each arytenoid cartilage to the tip of the other arytenoid and then the muscle continues into the aryepiglottic folds. The most important action of these muscles is to help constrict the aryepiglottic folds, like a purse string, helping to close off the aditus during swallowing'); p. 64-65 (other intrinsic muscles)."}, {"id": "m2mk4-q16", "n": 16, "part": 1, "title": null, "stem": "After surgery in the upper neck, a 61-year-old man rarely coughs when drinking, and a swallow study shows thin liquid entering his larynx above the vocal folds without any cough. His voice, pitch and vocal fold movement are normal. Which nerve was most likely injured?", "options": [{"letter": "A", "text": "External laryngeal branch of the superior laryngeal nerve"}, {"letter": "B", "text": "Internal laryngeal branch of the superior laryngeal nerve"}, {"letter": "C", "text": "Recurrent laryngeal nerve"}, {"letter": "D", "text": "Glossopharyngeal nerve (CN IX)"}, {"letter": "E", "text": "Hypoglossal nerve (CN XII)"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": null, "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx/Larynx LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Sensation from the laryngeal lining above the vocal folds travels in the internal laryngeal branch of the superior laryngeal nerve. Losing it lets material enter the laryngeal vestibule silently, while motor function (pitch via the external branch, fold movement via the recurrent nerve) stays intact.", "distractor_explanations": {"A": "The external branch supplies the cricothyroid; injury would lower pitch, which is normal here.", "C": "The recurrent nerve moves the vocal folds and carries sensation below them; his folds move normally.", "D": "CN IX supplies the upper pharynx (gag afferent), not the laryngeal lining.", "E": "CN XII is motor to the tongue and carries no laryngeal sensation."}, "source": "Wk4 packet p. 66 ('Sensory innervation from the mucosal lining of the larynx above the vocal folds is carried by the internal laryngeal branch of the superior laryngeal nerve ... Sensory information from below the vocal folds runs in the recurrent (inferior) laryngeal nerve ... The superior laryngeal nerve gives off the external laryngeal nerve to the cricothyroid muscle (controls pitch)'); p. 66 LO8 (CN IX gag afferent)."}, {"id": "m2mk4-q17", "n": 17, "part": 1, "title": null, "stem": "A 63-year-old man has 2 years of slowness and rigidity without tremor, lightheadedness on standing, urinary urgency and an increasingly wide-based, unsteady gait. On examination he has symmetric rigidity, slow finger taps and dysmetria on finger-to-nose testing, and his systolic pressure falls by 30 mm Hg when he stands. A full trial of carbidopa-levodopa produced almost no benefit. What best explains the poor levodopa response in his disorder?", "options": [{"letter": "A", "text": "The striatal neurons that carry dopamine receptors are damaged as well, so restored dopamine has few targets"}, {"letter": "B", "text": "Carbidopa keeps levodopa from crossing the blood-brain barrier"}, {"letter": "C", "text": "His substantia nigra neurons are intact, so he has no dopamine deficit"}, {"letter": "D", "text": "Tau aggregates block the dopamine transporter"}, {"letter": "E", "text": "Levodopa is broken down outside the brain before it can reach the striatum"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hypokinetic Movement Disorders", "topic": "Hypokinetic Movement Disorders", "note": null, "blueprint_category": "Hypokinetic Movement Disorders", "learning_objective": "Hypokinetic LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Parkinsonism plus autonomic failure and cerebellar gait with little levodopa response is multisystem atrophy (olivopontocerebellar type). The course states that the failure of levodopa in MSA suggests the striatal neurons that express dopamine receptors are also damaged, so replacing dopamine doesn't help.", "distractor_explanations": {"B": "Carbidopa acts outside the brain and doesn't block levodopa's entry; it prevents peripheral conversion.", "C": "The core parkinsonian signs show nigrostriatal failure; the problem is the striatal targets.", "D": "Tau marks PSP and corticobasal degeneration; his autonomic and cerebellar picture is multisystem atrophy, a synucleinopathy.", "E": "Carbidopa prevents peripheral decarboxylation; that isn't why MSA fails to respond."}, "source": "Wk4 packet p. 73 ('One important aspect of MSA is that there is little or no response to levodopa'; 'the failure of levodopa to alleviate motor symptoms indicates that the striatal neurons that express the dopamine receptors are also damaged in MSA'; OPCA subtype: parkinsonian plus cerebellar symptoms); p. 90 (carbidopa prevents peripheral decarboxylation); drug list ('Carbidopa cannot cross the BBB')."}, {"id": "m2mk4-q18", "n": 18, "part": 1, "title": null, "stem": "A 58-year-old woman took haloperidol for schizophrenia for 12 years. Two months after it was stopped, she began smacking her lips, thrusting her tongue and making writhing finger movements. She has no family history of a movement disorder. What best explains her movements?", "options": [{"letter": "A", "text": "Haloperidol destroyed dopaminergic neurons of the substantia nigra"}, {"letter": "B", "text": "Her D2 receptors are still blocked by residual haloperidol"}, {"letter": "C", "text": "An expanded CAG repeat has degenerated her caudate nuclei"}, {"letter": "D", "text": "Copper has accumulated in her basal ganglia"}, {"letter": "E", "text": "Years of blockade up-regulated her dopamine receptors and their signaling, leaving the striatum hypersensitive to dopamine"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": null, "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "This is tardive dyskinesia, a late complication of dopamine-receptor blockers. The course explains that after chronic blockade the brain up-regulates dopamine receptors and downstream signaling; when the drug is stopped, a hyperkinetic state of chorea and dyskinesia appears.", "distractor_explanations": {"A": "Loss of nigral neurons causes parkinsonism (too little movement), not chorea.", "B": "Ongoing blockade causes drug-induced parkinsonism (EPS), not a hyperkinetic state.", "C": "Huntington disease is inherited and progressive; the timing after stopping a blocker points to tardive dyskinesia.", "D": "Wilson disease is a copper disorder unrelated to antipsychotic exposure."}, "source": "Wk4 packet p. 79 ('After chronic blockade of these dopamine receptors, the brain attempts to achieve homeostasis by upregulating dopamine receptors and/or up-regulating the downstream intracellular regulation of the dopamine system. When attempts are made to stop treatment with these drugs, a hyperkinetic state of chorea, dyskinesia, and other involuntary movements occur'; EPS during the acute phase); p. 80 (Wilson disease)."}, {"id": "m2mk4-q19", "n": 19, "part": 1, "title": null, "stem": "A 47-year-old woman has a creeping urge to move her legs every evening that is relieved by walking and keeps her from falling asleep. She has heavy menstrual periods, and blood tests show iron deficiency anemia. Which drug treats the likely cause of her symptoms?", "options": [{"letter": "A", "text": "Pramipexole"}, {"letter": "B", "text": "Gabapentin"}, {"letter": "C", "text": "Ferrous sulfate"}, {"letter": "D", "text": "Haloperidol"}, {"letter": "E", "text": "Propranolol"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": null, "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO6 (RLS); drug list (RLS)", "difficulty": 2, "format": "vignette", "drug_item": "ferrous sulfate (indication)", "laterality": false, "reworks": null, "explanation": "An evening urge to move the legs, relieved by movement, is restless legs syndrome. The course notes secondary RLS can be associated with iron deficiency anemia, and the drug list includes ferrous sulfate for RLS. Iron replacement addresses the cause; dopamine agonists and gabapentin treat symptoms.", "distractor_explanations": {"A": "Pramipexole, a D2/D3 agonist, treats restless legs symptoms but not the iron deficiency behind them.", "B": "Gabapentin treats restless legs symptoms but not their cause.", "D": "Dopamine-receptor blockers can cause or worsen restless legs syndrome.", "E": "Propranolol is a tremor drug, not a restless legs treatment."}, "source": "Wk4 packet p. 80-81 (RLS: 'strong, irresistible urge to move the legs ... relieved by movement ... Symptoms occur in the evening or at night'; 'secondary RLS, sometimes associated with iron deficiency anemia'; 'RLS can occur as a prominent side effect of dopamine receptor blocking drugs, and conversely may be treated with dopamine agonists or levodopa. Gabapentanoid drugs are useful'); Drug list, RLS table (ferrous sulfate, ropinirole, pramipexole, gabapentin). Bold green."}, {"id": "m2mk4-q20", "n": 20, "part": 1, "title": null, "stem": "A 61-year-old man with moderate persistent asthma, who uses an albuterol inhaler most days, has a bilateral hand tremor when he holds a cup or writes, which eases after a glass of wine. His physician avoids the usual first-choice drug because of his asthma and prescribes one that the body converts to a barbiturate. How does that active metabolite reduce tremor?", "options": [{"letter": "A", "text": "It increases the frequency of GABA-A chloride channel opening"}, {"letter": "B", "text": "It blocks beta-1 and beta-2 adrenergic receptors"}, {"letter": "C", "text": "It binds the alpha-2-delta subunit and reduces calcium channels at the membrane"}, {"letter": "D", "text": "It increases the duration of GABA-A chloride channel opening"}, {"letter": "E", "text": "It blocks muscarinic receptors in the striatum"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO3; drug list (Tremor)", "difficulty": 3, "format": "vignette", "drug_item": "primidone (mechanism)", "laterality": false, "reworks": "Weekly Quiz #4 Q16 (essential tremor -> propranolol): asthma makes the first-choice drug unsuitable; new ask (mechanism of the alternative)", "explanation": "An action tremor of both hands that improves with alcohol is essential tremor. Propranolol is first choice but its beta-2 blockade causes bronchospasm, so primidone is used. Primidone is converted to phenobarbital, which increases the duration of GABA-A chloride channel opening.", "distractor_explanations": {"A": "Increasing opening frequency is how benzodiazepines act; barbiturates prolong opening.", "B": "That is propranolol, avoided here because beta-2 blockade causes bronchospasm.", "C": "That is gabapentin's mechanism.", "E": "Antimuscarinics such as trihexyphenidyl treat parkinsonian rest tremor, not essential tremor."}, "source": "Drug list, Tremor table ('Primidone: Converted to phenobarbital and phenylethylmalonamide (PEMA). Phenobarbital increases duration of GABAA chloride channel openings'; propranolol 'Nonselective antagonist for the b1 and b2 adrenergic receptors: bradycardia, hypotension, fatigue, and bronchospasm'; gabapentin alpha-2-delta); Wk4 packet p. 85 ('An individual with essential tremor may find relief with either a beta-blocker or an anticonvulsant like primidone'); p. 83 (anticholinergics for PD rest tremor). Bold green. Reworks: Weekly Quiz #4 Q16 (essential tremor -> propranolol): asthma makes the first-choice drug unsuitable; new ask (mechanism of the alternative)."}, {"id": "m2mk4-q21", "n": 21, "part": 1, "title": null, "stem": "A 41-year-old professional violinist has a tremor of her bowing arm that appears only while she plays. It began a year ago and has threatened her orchestra job. Writing, eating and holding a cup are steady, and she has no tremor at rest. Neuroimaging studies of patients with this type of tremor have shown hyperactivity in which region?", "options": [{"letter": "A", "text": "The subthalamic nucleus"}, {"letter": "B", "text": "The red nucleus"}, {"letter": "C", "text": "The inferior olive"}, {"letter": "D", "text": "The posterior putamen"}, {"letter": "E", "text": "The cerebellar hemispheres"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "A tremor present only during one highly skilled task is a task-specific tremor (musician's or writer's cramp), often a mix of tremor and dystonia. The course states that neuroimaging in these patients showed hyperactivity in the cerebellar hemispheres.", "distractor_explanations": {"A": "The subthalamic nucleus is overactive in Parkinson disease, not in task-specific tremor.", "B": "Red nucleus damage (for example from MS) causes a slow, wing-beating rubral tremor, present with posture.", "C": "The inferior olive is the course's proposed oscillator for essential tremor, which appears in many tasks, not one.", "D": "The posterior putamen loses dopaminergic input in Parkinson disease; that isn't this tremor."}, "source": "Wk4 packet p. 84 ('Task-specific tremor occurs only during highly skilled movements, such as writing or playing a musical instrument ... often there is a combination of tremor and dystonia ... Neuroimaging studies in these patients showed hyperactivity in the cerebellar hemispheres'); p. 83 (rubral tremor); p. 86 (inferior olive oscillator for essential tremor)."}, {"id": "m2mk4-q22", "n": 22, "part": 1, "title": null, "stem": "A 72-year-old man with Parkinson disease nearly faints whenever he stands. His blood pressure is 132/80 mm Hg lying and 94/60 mm Hg standing, with little rise in heart rate. His neurologist starts midodrine. How does midodrine raise his standing blood pressure?", "options": [{"letter": "A", "text": "It is converted to norepinephrine, which acts on alpha-1 receptors"}, {"letter": "B", "text": "Its active metabolite is a selective alpha-1 adrenergic agonist that constricts blood vessels"}, {"letter": "C", "text": "It acts on renal mineralocorticoid receptors to retain sodium and water"}, {"letter": "D", "text": "It inhibits peripheral dopa decarboxylase"}, {"letter": "E", "text": "It blocks muscarinic receptors to raise heart rate"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Treatment of Movement Disorders", "topic": "Treatment of Movement Disorders", "note": null, "blueprint_category": "Treatment of Movement Disorders", "learning_objective": "Treatment LO3; drug list (Dystonia table)", "difficulty": 2, "format": "vignette", "drug_item": "midodrine (mechanism)", "laterality": false, "reworks": null, "explanation": "Neurogenic orthostatic hypotension is a non-motor symptom of Parkinson disease. Midodrine is a prodrug converted to desglymidodrine, a selective alpha-1 agonist that causes vasoconstriction.", "distractor_explanations": {"A": "This describes droxidopa, a norepinephrine prodrug.", "C": "This describes fludrocortisone, which expands blood volume.", "D": "This is carbidopa's action, which doesn't treat orthostatic hypotension.", "E": "Midodrine doesn't act on muscarinic receptors; antimuscarinics aren't the course's treatment for neurogenic orthostatic hypotension."}, "source": "Drug list, 'Medications used for Dystonia' table (orthostatic hypotension drugs: 'Midodrine: A prodrug that is converted to desglymidodrine and is a selective alpha-1 adrenergic receptor agonist causing vasoconstriction'; droxidopa 'a prodrug of norepinephrine'; fludrocortisone 'Acts at the mineralocorticoid receptors'); Wk4 packet p. 90 ('Neurogenic orthostatic hypotension (NOH) ... adrenergic agents such as midodrine are helpful. Fludrocortisone can assist in expanding blood volume. Droxidopa is a precursor to norepinephrine'). Bold green."}, {"id": "m2mk4-q23", "n": 23, "part": 1, "title": null, "stem": "This diagram shows the cochlea uncoiled. The arrow marks the opening at its apex. Which two spaces communicate through this opening?", "options": [{"letter": "A", "text": "Scala vestibuli and scala tympani"}, {"letter": "B", "text": "Cochlear duct (scala media) and scala tympani"}, {"letter": "C", "text": "Scala vestibuli and cochlear duct"}, {"letter": "D", "text": "Scala tympani and the middle ear cavity"}, {"letter": "E", "text": "The endolymph and perilymph compartments"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/s-cochlea.png", "image_needed": true, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO3-7", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is at the helicotrema, the small hole at the apex where the cochlear duct ends and the two perilymphatic spaces on either side of it, the scala vestibuli and scala tympani, communicate.", "distractor_explanations": {"B": "The cochlear duct is a closed endolymph space; it ends blindly at the apex.", "C": "The cochlear duct's endolymph never mixes with the perilymph of the scala vestibuli.", "D": "The scala tympani meets the middle ear only at the round window, which is sealed by a membrane.", "E": "Endolymph and perilymph never communicate; the membranous labyrinth is a closed system."}, "source": "Ear Anatomy deck (c97442cf) slide 29 (label 'Helicotrema'); Wk5 packet p. 6 ('The partition is complete except for a small hole at the apex of the cochlea (the helicotrema—“the hole in the helix”) at which the cochlear duct ends and the perilymphatic spaces (i.e., Scala vestibuli & Scala tympani) on either side of the cochlear duct communicate with each other'); p. 4 (the membranous labyrinth is a continuous, closed system).", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/s-cochlea.png", "options": {"A": "Faculty label 'Helicotrema' (arrowed)", "B": "not shown in this figure", "C": "not shown in this figure", "D": "Faculty label 'Round window' (base of the cochlea)", "E": "not shown in this figure"}, "note": "Source: Ear Anatomy deck (c97442cf) slide 29 (Nolte diagram). The 'Stapes footplate' label was covered and the 'Round window', 'Auditory tube' and 'Helicotrema' labels were cropped from the question; the slide's text bullets (base = high, apex = low frequencies) are not part of the image.", "how": "Same faculty figure with its labels showing (the full labeled version). Amber star on the faculty label or title tied to the key (the choices aren't structure names); red boxes on labels tied to other choices. Arrow redrawn where the question placed it (if the question has one).", "marked": ["A", "D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q24", "n": 24, "part": 1, "title": null, "stem": "A 36-year-old man has a complete left facial nerve palsy from a lesion in the facial canal, above the branch to the stapedius. His hearing is normal. A loud low-frequency tone is played into his right ear. Which response is expected?", "options": [{"letter": "A", "text": "Both stapedius muscles contract"}, {"letter": "B", "text": "Neither stapedius contracts, because input from the right ear cannot reach the brainstem"}, {"letter": "C", "text": "The right stapedius contracts; the left stapedius does not"}, {"letter": "D", "text": "The left stapedius contracts; the right does not"}, {"letter": "E", "text": "Both tensor tympani muscles contract instead"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO9-10", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": "Wk5 packet practice Q2 (low-frequency hearing complaint -> facial droop, CN VII): same reflex, new ask (which stapedius contracts, by side)", "explanation": "The acoustic reflex is 'VIII in and VII out': sound in either ear activates CN VIII and the cochlear nuclei, and superior olivary interneurons drive facial motor neurons on both sides, so both stapedius muscles normally contract. Here the afferent side (right ear) is intact, the right CN VII works, and the left CN VII is cut, so only the right stapedius contracts.", "distractor_explanations": {"A": "The reflex is bilateral, but the left efferent limb (left CN VII) is cut.", "B": "The right CN VIII and cochlear nuclei are intact, so the afferent limb works.", "D": "The left stapedius has lost its motor nerve; the right one is intact.", "E": "The tensor tympani (CN V) needs extremely loud sound and isn't the acoustic reflex muscle."}, "source": "Wk5 packet p. 3 ('the stapedius contracts bilaterally in response to low frequency sounds in either ear, as the result of a clinically useful reflex involving cranial nerves VIII and VII'; tensor tympani 'takes extremely loud sounds to make it contract'); p. 8 ('The efferent limb of the acoustic reflex is the facial nerve. (CN VIII in and CN VII out)'; Fig. 13: 'activation of some neurons of CN VII to contract the stapedius muscle in both ears'). Reworks: Wk5 packet practice Q2 (low-frequency hearing complaint -> facial droop, CN VII): same reflex, new ask (which stapedius contracts, by side)."}, {"id": "m2mk4-q25", "n": 25, "part": 1, "title": null, "stem": "A 19-year-old college student recovers from meningococcal meningitis but is left with sensorineural hearing loss in both ears. By which route did the infection most likely reach his inner ears?", "options": [{"letter": "A", "text": "Up the auditory tubes into the middle ears, then through the oval windows"}, {"letter": "B", "text": "Through the tympanic membranes from the ear canals"}, {"letter": "C", "text": "From the bloodstream directly into the endolymph of the cochlear duct"}, {"letter": "D", "text": "From the subarachnoid space into the perilymph, which connects to the CSF through a small channel in the temporal bone"}, {"letter": "E", "text": "Along the facial nerve into the middle ear"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO3-4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course states that meningitis organisms (S. pneumoniae, N. meningitidis) reach the cochlea through the cerebrospinal fluid and damage hair cells. The perilymph of the bony labyrinth is roughly equivalent to CSF and connects to the subarachnoid space by a tiny channel in the temporal bone.", "distractor_explanations": {"A": "That is the route of middle ear infection; the oval window is sealed by the stapes footplate, and this loss is from meningitis.", "B": "An intact tympanic membrane separates the ear canal from the middle ear; this isn't how meningitis reaches the cochlea.", "C": "The course describes spread through the CSF, not into the closed endolymph system.", "E": "CN VII doesn't carry infection from the meninges into the cochlea in the course's account."}, "source": "Wk5 packet p. 18 ('The infectious agents responsible for meningitis (e.g., S pneumoniae, Neisseria meningitidis) access the cochlea via cerebrospinal fluid and subsequently damage inner ear hair cells'); p. 4 ('The bony labyrinth is filled with perilymph, which is more or less equivalent to cerebrospinal fluid. (There’s actually a tiny channel in the temporal bone that connects this fluid compartment to subarachnoid space.)')."}, {"id": "m2mk4-q26", "n": 26, "part": 1, "title": null, "stem": "A 30-year-old woman who gets seasick wears a scopolamine patch behind her ear during a cruise. How does scopolamine reduce her motion sickness?", "options": [{"letter": "A", "text": "It blocks dopamine D2 receptors in the vomiting center"}, {"letter": "B", "text": "It stimulates muscarinic receptors on vestibular hair cells, steadying their firing"}, {"letter": "C", "text": "It blocks nicotinic receptors at the vestibular hair cell synapse"}, {"letter": "D", "text": "It stimulates alpha-2 receptors to reduce norepinephrine release"}, {"letter": "E", "text": "It blocks muscarinic receptors, reducing cholinergic signals from the vestibular nuclei to higher centers, including the vomiting center"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": null, "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO9; drug list (Ocular)", "difficulty": 2, "format": "vignette", "drug_item": "scopolamine (mechanism, motion sickness)", "laterality": false, "reworks": null, "explanation": "Motion sickness comes from conflict between vestibular, visual and somatosensory signals. The course says scopolamine, a muscarinic antagonist given as a patch, is thought to decrease cholinergic signals from the vestibular nuclei to higher centers and suppress the vomiting center. Its antimuscarinic side effects include dry mouth and dilated pupils.", "distractor_explanations": {"A": "Scopolamine isn't a dopamine antagonist.", "B": "Scopolamine is a muscarinic antagonist, not an agonist.", "C": "Vestibular hair cells release glutamate onto CN VIII, and scopolamine acts on muscarinic receptors.", "D": "That describes alpha-2 agonists such as apraclonidine or tizanidine."}, "source": "Wk5 packet p. 36 ('scopolamine, which is a muscarinic receptor antagonist (i.e., anticholinergic) medication as a patch. The antimuscarinic activity of scopolamine is thought to decrease the cholinergic signals passing from the vestibular nuclei to higher centers including suppressing the vomiting center'); Vestibular deck (91f3d059) slide 30 ('scopolamine works for motion sickness'); Drug list, Ocular table (scopolamine: muscarinic antagonist). Bold green."}, {"id": "m2mk4-q27", "n": 27, "part": 1, "title": null, "stem": "A 55-year-old man has a small lesion confined to the flocculus of the cerebellum. When he turns his head to look at someone beside him, his eyes are pulled back toward where he was looking before. Which normal function has he lost?", "options": [{"letter": "A", "text": "Generating the fast phase of nystagmus"}, {"letter": "B", "text": "Suppressing the vestibulo-ocular reflex when appropriate and adjusting its gain"}, {"letter": "C", "text": "Detecting angular acceleration of the head"}, {"letter": "D", "text": "Initiating voluntary saccades"}, {"letter": "E", "text": "Conscious perception of head position"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": null, "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO4, LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "When you look somewhere by turning your head, the vestibulo-ocular reflex would normally counter-rotate the eyes and hold them on the old target. The course says the flocculus suppresses the reflex when appropriate and adjusts its gain so the eyes move the right amount.", "distractor_explanations": {"A": "The course attributes the fast phase to the reticular formation, not the flocculus.", "C": "Angular acceleration is detected by the semicircular canals, not the cerebellum.", "D": "The frontal eye fields initiate voluntary saccades.", "E": "Conscious perception of motion and position reaches cortex through thalamocortical projections."}, "source": "Wk5 packet p. 35 ('If you tried to look to the left by turning your head to the left, the vestibulo-ocular reflex would normally “kick in” and would counterrotate your eyes and keep them pointed straight ahead. To avoid this, we have a flocculus of the cerebellum that suppresses the reflex when appropriate. The flocculus can also adjust the gain of the reflex'); p. 34 ('The fast phase of nystagmus depends on a functioning reticular formation'); Vestibular deck (91f3d059) slide 26 ('Flocculus ... suppress the vestibuloocular reflex')."}, {"id": "m2mk4-q28", "n": 28, "part": 1, "title": null, "stem": "A cerebellopontine angle tumor shows dense spindle-cell and loose myxoid areas, palisading nuclei around acellular zones, and S-100 staining. Which cells gave rise to it?", "options": [{"letter": "A", "text": "Schwann cells"}, {"letter": "B", "text": "Meningothelial (arachnoid) cells"}, {"letter": "C", "text": "Ependymal cells"}, {"letter": "D", "text": "Astrocytes"}, {"letter": "E", "text": "Oligodendrocytes"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO10", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "This is a vestibular schwannoma: S-100-positive Schwann cells with dense Antoni A and loose Antoni B areas, and palisading nuclei forming Verocay bodies. It usually arises from the vestibular part of CN VIII in the internal auditory canal and can grow into the cerebellopontine angle.", "distractor_explanations": {"B": "Meningiomas arise from arachnoid cells and form whorls, not Antoni A/B areas with Verocay bodies.", "C": "Ependymomas line the ventricles and form perivascular rosettes.", "D": "Astrocytic tumors arise within the brain parenchyma, not on a cranial nerve.", "E": "Oligodendrocytes myelinate CNS axons; the vestibular nerve's tumor arises from its peripheral myelinating cells."}, "source": "Wk5 packet p. 49 ('vestibular schwannomas are composed of S-100–positive Schwann cells and classically show a biphasic microscopic appearance: dense,
