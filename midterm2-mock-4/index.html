hypercellular spindle-cell regions are referred to as Antoni A areas, while looser, hypocellular, more myxoid regions are Antoni B areas. Palisading nuclei surrounding acellular zones may form Verocay bodies'; 'may gradually extend into the cerebellopontine angle'); p. 17 (most common cerebellopontine angle tumor)."}, {"id": "m2mk4-q29", "n": 29, "part": 1, "title": null, "stem": "For which patient is a HINTS+ examination appropriate?", "options": [{"letter": "A", "text": "A 70-year-old woman with 20-second spells of vertigo when she rolls over in bed, who is symptom-free with no nystagmus now"}, {"letter": "B", "text": "A 45-year-old man who had 3 hours of vertigo yesterday that has fully resolved; his examination is normal today"}, {"letter": "C", "text": "A 66-year-old woman whose vision dims and who feels faint only when she stands up quickly"}, {"letter": "D", "text": "A 63-year-old woman with 5 hours of continuous vertigo and vomiting, worse with head movement, who has spontaneous nystagmus now"}, {"letter": "E", "text": "A 52-year-old man with months of unsteadiness walking in the dark and normal eye movements"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO3, LO7", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course stresses that HINTS+ is meant for one situation: a patient who is currently symptomatic with continuous vestibular symptoms (an acute vestibular syndrome) and spontaneous nystagmus. It isn't appropriate for brief triggered episodes, resolved episodes, or patients without spontaneous nystagmus.", "distractor_explanations": {"A": "Brief, position-triggered episodes are BPPV territory (Dix-Hallpike), not HINTS+.", "B": "HINTS+ isn't for episodic symptoms that have already resolved.", "C": "This is presyncope from transient cerebral hypoperfusion, not vertigo.", "E": "Without continuous vestibular symptoms and spontaneous nystagmus, HINTS+ doesn't apply."}, "source": "Wk5 packet p. 47 ('HINTS+ is intended for a very specific clinical situation: a patient who is currently symptomatic with continuous vestibular symptoms and spontaneous nystagmus ... it is not appropriate for brief triggered episodes typical of BPPV, for episodic symptoms that have already resolved, or for a patient without spontaneous nystagmus'); p. 41 (presyncope)."}, {"id": "m2mk4-q30", "n": 30, "part": 1, "title": null, "stem": "A 44-year-old woman has definite Ménière disease in her right ear, with attacks of vertigo, roaring tinnitus and ear fullness every few weeks. Which long-term measure is aimed at reducing how often the attacks occur?", "options": [{"letter": "A", "text": "Repeated canalith-repositioning (Epley or Semont Plus) maneuvers"}, {"letter": "B", "text": "Continuous daily meclizine between attacks"}, {"letter": "C", "text": "Sodium restriction with a diuretic such as hydrochlorothiazide"}, {"letter": "D", "text": "A 10-day course of amoxicillin"}, {"letter": "E", "text": "Long-term oral corticosteroids"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Ménière disease is endolymphatic hydrops. The course's management aims to reduce attack frequency with dietary sodium modification and diuretics (for example hydrochlorothiazide or acetazolamide), which reduce excess endolymph, using vestibular suppressants such as meclizine only during severe attacks.", "distractor_explanations": {"A": "Repositioning maneuvers treat BPPV, not endolymphatic hydrops.", "B": "Vestibular suppressants are for severe attacks and short use; prolonged use hinders compensation.", "D": "Antibiotics treat bacterial otitis media, not Ménière disease.", "E": "Steroids aren't the course's maintenance treatment for Ménière disease."}, "source": "Wk5 packet p. 48 ('Management is individualized and is aimed primarily at reducing the frequency and severity of attacks. Options may include dietary or sodium modification, diuretic therapy, meclizine during severe attacks, and vestibular rehabilitation'); p. 28 ('Ménière disease is typically treated with a combination of a diuretic (e.g., hydrochlorothiazide, acetazolamide), a vestibular suppressant ... The diuretic works to reduce excess endolymphatic fluid'); p. 46 (prolonged vestibular suppressants interfere with compensation); p. 45 (Epley, Semont Plus for BPPV)."}, {"id": "m2mk4-q31", "n": 31, "part": 1, "title": null, "stem": "A 29-year-old woman has a documented profound sensorineural hearing loss in her right ear; her left ear is normal and both ear canals and eardrums look normal. With a 512-Hz fork, the Weber test lateralizes to the left. On the right, she says the fork sounds louder on the mastoid than beside the ear canal. What explains this right-sided Rinne result?", "options": [{"letter": "A", "text": "Her right ear also has a conductive loss"}, {"letter": "B", "text": "Bone conduction bypasses the damaged right cochlea"}, {"letter": "C", "text": "Her Weber result shows that the left ear has a conductive loss"}, {"letter": "D", "text": "A 512-Hz fork can't test hearing in a profoundly deaf ear"}, {"letter": "E", "text": "The bone-conducted sound is being heard by the left cochlea, so the right Rinne is falsely abnormal"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Weber lateralizes to the better (left) ear, consistent with a right sensorineural loss. The course notes that in severe sensorineural loss the patient may report bone > air on the affected side because the vibration on the mastoid is being sensed by the good contralateral ear: a false-negative Rinne.", "distractor_explanations": {"A": "Her canal and eardrum are normal and the right cochlea is already deaf; the course explains this result as the good ear hearing the vibration.", "B": "Bone conduction still depends on a working cochlea; it bypasses only the outer and middle ear.", "C": "A left conductive loss would make the left Rinne abnormal; her left ear is normal, and Weber goes to the better ear in sensorineural loss.", "D": "The 512-Hz fork is the course's standard; the issue is crossover to the other ear, not the frequency."}, "source": "Wk5 packet p. 22 (Table 1 footnote: '*For patients with severe sensorineural hearing loss, the patient may report bone conduction>air conduction because the sound is being sensed by the “good (contralateral) ear'); p. 20-21 (Weber lateralizes to the good ear in sensorineural loss; 512-Hz fork); p. 24 (bone conduction bypasses the outer and middle ears)."}, {"id": "m2mk4-q32", "n": 32, "part": 1, "title": null, "stem": "A newborn in the NICU passes otoacoustic emission screening in both ears but fails the automated auditory brainstem response test in both ears. What does this combination indicate?", "options": [{"letter": "A", "text": "Fluid in both middle ears"}, {"letter": "B", "text": "Outer hair cell function is present, so the problem lies beyond the outer hair cells, as in auditory neuropathy"}, {"letter": "C", "text": "Loss of outer hair cells in both cochleas"}, {"letter": "D", "text": "Normal hearing; the automated ABR failure can be ignored"}, {"letter": "E", "text": "Atresia of both external ear canals"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Otoacoustic emissions come from the outer hair cells and test the path from the middle ear to the outer hair cells. The automated ABR records responses from the cochlea up the brainstem and detects both sensorineural loss and auditory neuropathy. Normal emissions with an abnormal ABR place the defect beyond the outer hair cells (inner hair cells, cochlear nerve or brainstem pathway), as in auditory neuropathy. (Localization step is Claude's combination of the two course descriptions.)", "distractor_explanations": {"A": "Middle ear fluid would block the emissions too, because OAE testing depends on the middle ear.", "C": "Absent outer hair cells would abolish otoacoustic emissions, which he passed.", "D": "Any infant who fails a screening test needs further audiologic evaluation.", "E": "Blocked ear canals would prevent the OAE stimulus and recording."}, "source": "Wk5 packet p. 25 ('AABR can detect both sensorineural hearing loss (SNHL) and auditory neuropathy (AN)'; 'any child who fails one of these screening tests requires further audiologic evaluation'); p. 26 ('OAE testing measures the presence or absence of sound waves (i.e., OAEs) generated by the cochlear outer hair cells ... Since OAE evaluates hearing from the middle ear to the outer hair cells of the inner ear'); p. 6-7 (inner hair cells convey sound to the CNS)."}, {"id": "m2mk4-q33", "n": 33, "part": 1, "title": null, "stem": "A 55-year-old man has operated jackhammers for 30 years without ear protection and now has trouble following conversation in noisy rooms. The audiogram for his right ear is shown. What is the most likely cause of this pattern?", "options": [{"letter": "A", "text": "Fluid in the middle ear"}, {"letter": "B", "text": "Otosclerosis fixing the stapes footplate"}, {"letter": "C", "text": "Ménière disease"}, {"letter": "D", "text": "Noise damage to hair cells of the organ of Corti"}, {"letter": "E", "text": "A perforated tympanic membrane"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/s-audiogram-snhl.png", "image_needed": true, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO1, LO3-4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Air conduction (O) and bone conduction (>) fall together, with no air-bone gap, so the loss is sensorineural; it is worst in the high frequencies (deepest near 4000 Hz). With decades of unprotected noise above 85 dB, this is noise-induced loss: noise damages the stereocilia of the organ of Corti, and high pitches are lost first.", "distractor_explanations": {"A": "Middle ear fluid causes a conductive loss with normal bone conduction; here bone conduction falls with air conduction.", "B": "Otosclerosis causes a conductive loss (an air-bone gap), not matching air and bone thresholds.", "C": "Ménière disease is fluctuating, episodic and mainly affects low frequencies early; this loss is high-frequency.", "E": "A perforation causes a conductive loss with preserved bone conduction."}, "source": "Hearing Loss deck (88ab33e1) slide 19 (left panel titled 'Sensorineural Hearing Loss Audiogram'; title cropped from the question); Wk5 packet p. 19 ('Exposure to loud noise can damage stereocilia cells in the organ of Corti ... High-pitched hearing is lost first and sounds at a volume of 85 dB or higher can cause permanent hearing loss ... construction workers'); p. 24 (air vs bone conduction; conductive causes: middle ear fluid, otosclerosis); p. 17 (Ménière: low frequencies).", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/s-audiogram-snhl.png", "options": {"A": "Same slide, right panel 'Conductive Hearing Loss Audiogram' (air down, bone normal) for contrast", "B": "Same slide, right panel 'Conductive Hearing Loss Audiogram' for contrast", "C": "not shown in this figure", "D": "Faculty panel title 'Sensorineural Hearing Loss Audiogram' (cropped from the question)", "E": "not shown in this figure"}, "note": "Source: Hearing Loss deck (88ab33e1) slide 19, left panel; its title was cropped. The right panel (conductive audiogram) is the one Mock #1 Q30 used. The choices are causes, so the panel title is starred, not boxed.", "how": "Same faculty figure with its labels showing (the full labeled version). Amber star on the faculty label or title tied to the key (the choices aren't structure names); red boxes on labels tied to other choices. Arrow redrawn where the question placed it (if the question has one).", "marked": ["A", "B", "D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q34", "n": 34, "part": 1, "title": null, "stem": "Three weeks after a painful red bump on her eyelid margin from an infected lid gland, a 30-year-old woman has a painless, firm nodule in the same spot. The glands within the tarsal plate that are involved normally do what?", "options": [{"letter": "A", "text": "Secrete an oily product that keeps the tear film from drying out"}, {"letter": "B", "text": "Secrete the watery tears that wash over the cornea"}, {"letter": "C", "text": "Produce mucus as the lining of the eyelid"}, {"letter": "D", "text": "Collect tears and drain them to the lacrimal sac"}, {"letter": "E", "text": "Contain smooth muscle that raises the upper lid 1-2 mm"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO1", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "A hordeolum is an infection within a lid-margin gland, and a chalazion is the residual scar tissue left in the gland. The glands deep to the tarsal plate are the tarsal glands, sebaceous glands that secrete an oily product that helps prevent desiccation of the tears.", "distractor_explanations": {"B": "Watery tears come from the lacrimal gland in the upper lateral orbit.", "C": "The conjunctiva is the eyelid's mucous membrane lining; it isn't a tarsal gland.", "D": "Tears drain through small ducts at the medial end of each lid into the lacrimal sac.", "E": "That is the superior tarsal (Müller) muscle, a sympathetic smooth muscle, not a gland."}, "source": "Wk5 packet p. 53 ('The connective tissue of the upper eyelids is supplemented with a dense fibrous tarsal plate. Deep to this plate is an arrangement of linear sebaceous glands called tarsal glands, some of which are at the edge of the eyelid. These glands secrete an oily product that helps prevent desiccation of the tears'; conjunctiva 'a simple mucous membrane'; superior tarsal muscle); p. 54 (lacrimal gland and drainage); Eye Exam deck (995161cb) slide 18 ('Hordeolum & Chalazion: H: infection within lid margin gland; C: residual scar tissue in lid margin gland')."}, {"id": "m2mk4-q35", "n": 35, "part": 1, "title": null, "stem": "Which extraocular muscle is the only one that doesn't arise on or near the common tendinous ring, arising instead from the orbital floor?", "options": [{"letter": "A", "text": "Superior oblique"}, {"letter": "B", "text": "Inferior rectus"}, {"letter": "C", "text": "Inferior oblique"}, {"letter": "D", "text": "Levator palpebrae superioris"}, {"letter": "E", "text": "Lateral rectus"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course states that all extraocular muscles but the inferior oblique have a common area of origin on or near the common tendinous ring; the inferior oblique originates off the anterior-medial floor of the orbit and runs beneath the eye.", "distractor_explanations": {"A": "The superior oblique arises from the bony orbit near the ring and runs through the trochlea.", "B": "All four recti arise from the common tendinous ring.", "D": "The levator arises from the orbital roof just above the ring and is grouped with the ring-origin muscles.", "E": "The lateral rectus arises from the common tendinous ring."}, "source": "Wk5 packet p. 54 ('All but one (the inferior oblique) have a common area of origin on or near a tendinous ring called the annulus tendineus located in the medial-posterior wall of the orbit which surrounds the optic canal'); p. 55 ('The inferior oblique ... originates off the anterior-medial aspect of the floor of the orbit')."}, {"id": "m2mk4-q36", "n": 36, "part": 1, "title": null, "stem": "Rods respond to much dimmer light than cones. Which structural feature of the rod itself contributes to this greater sensitivity?", "options": [{"letter": "A", "text": "It contains three different opsins"}, {"letter": "B", "text": "It connects one-to-one with a single ganglion cell"}, {"letter": "C", "text": "It is concentrated in the foveola"}, {"letter": "D", "text": "It releases more glutamate when light strikes it"}, {"letter": "E", "text": "Its outer segment has more membranous disks loaded with photopigment"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO3-4", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Rod and cone outer segments contain stacks of disks loaded with photopigment. The course states that rods have more disks than cones, which is one reason rods are more sensitive in low light.", "distractor_explanations": {"A": "Three opsins (red, green, blue) belong to the three cone types; rods have one pigment, rhodopsin.", "B": "One-to-one wiring is the foveal cone arrangement, which favors acuity over sensitivity.", "C": "The foveola has only cones; rods dominate the peripheral retina.", "D": "Light closes sodium channels and hyperpolarizes photoreceptors, which reduces glutamate release."}, "source": "Wk5 packet p. 61 ('The disks arise as infoldings from the outer segment membrane and are loaded with a photosensitive protein ... rhodopsin in rods, and red/green/blue opsin in cones. Rods have more disks than cones, which is one reason why rods are more sensitive in low-light'; 'When light hits the photoreceptor, sodium channels on the cell membrane close and hyperpolarize the cell, decreasing the amount of neurotransmitter being released'); p. 62-63 (foveola: cones only, 1:1 receptive field)."}, {"id": "m2mk4-q37", "n": 37, "part": 1, "title": null, "stem": "A 45-year-old man ignores a painful, swollen upper molar. A week later he has fever of 39.2 °C, headache, swelling around both eyes and double vision; neither eye moves fully to the side, and his forehead is numb. Through which route did the infection most likely spread to cause these findings?", "options": [{"letter": "A", "text": "Into the maxillary sinus and out through the middle meatus"}, {"letter": "B", "text": "Through the valveless ophthalmic veins of the orbit into the cavernous sinus"}, {"letter": "C", "text": "Along the inferior alveolar nerve into the mandibular canal"}, {"letter": "D", "text": "Through the cribriform plate into the anterior cranial fossa"}, {"letter": "E", "text": "Through the nasolacrimal duct into the orbit"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO1", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The ophthalmic veins drain through the superior orbital fissure into the cavernous sinus and have no valves, so flow depends on pressure. The course notes that infection from the upper teeth and face can reach the cavernous sinus and cause cavernous sinus thrombosis, affecting the many structures passing through it: CN III, IV and VI (double vision) and V1 (forehead numbness).", "distractor_explanations": {"A": "Maxillary sinusitis drains into the nose; it doesn't explain double vision and forehead numbness.", "C": "The inferior alveolar nerve serves the lower teeth, not an upper molar, and doesn't lead to the orbit.", "D": "Spread there could cause meningitis or anosmia but wouldn't produce this eye-movement and forehead pattern.", "E": "The nasolacrimal duct drains tears from the eye into the inferior meatus; it isn't a route from the teeth."}, "source": "Wk5 packet p. 55 ('The ophthalmic vein ... drain[s] through the superior orbital fissure to end in the cavernous sinus near the sella turcica. There are no valves in these veins, so blood flow is controlled primarily by pressure. Infection from the upper teeth and face can reach the cavernous sinus and result in cavernous sinus thrombosis, impacting the many structures that travel through it (cavernous sinus syndrome)'); p. 110-111 (cavernous sinus: CN III, IV, VI with V1 and V2)."}, {"id": "m2mk4-q38", "n": 38, "part": 1, "title": null, "stem": "A 70-year-old man has a small infarct confined to the tip of his right occipital pole; the rest of both occipital lobes is spared. Which visual field defect is expected?", "options": [{"letter": "A", "text": "A small central scotoma in the right visual field of both eyes"}, {"letter": "B", "text": "Left homonymous hemianopia with macular sparing"}, {"letter": "C", "text": "A central scotoma in the right eye only"}, {"letter": "D", "text": "A small central (macular) scotoma in the left visual field of both eyes"}, {"letter": "E", "text": "Left homonymous superior quadrantanopia"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO2, LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Each occipital lobe sees the opposite visual field of both eyes. The macula and fovea are represented at the posterior part of V1, around the occipital pole, while peripheral vision is represented more anteriorly. A small lesion at the right occipital pole therefore causes a left homonymous central (macular) scotoma. (Applying the course's retinotopy to a pole-only lesion is Claude's step.)", "distractor_explanations": {"A": "The right occipital lobe represents the left visual field.", "B": "Macular sparing is the opposite pattern: a large occipital lesion that spares the pole.", "C": "A defect in one eye only comes from a lesion in front of the chiasm.", "E": "A superior quadrantanopia comes from the inferior bank of the calcarine fissure or Meyer's loop, not the pole."}, "source": "Wk5 packet p. 71 ('the macula and fovea are represented more posteriorly. Thus, the occipital poles register light signals from the macula in a discrete region of the primary visual cortex'); p. 72 ('The central vision (from the macula) is processed at the posterior part of the visual cortex, while peripheral vision is processed more anteriorly'); p. 73-75 (homonymous defects behind the chiasm; macular sparing; quadrantanopia sites)."}, {"id": "m2mk4-q39", "n": 39, "part": 1, "title": null, "stem": "After a stroke in the inferior temporo-occipital cortex of both hemispheres, a 66-year-old woman can see, walk around furniture and track moving cars, but she can no longer recognize objects or her family's faces by sight. Damage to which visual processing stream best explains this?", "options": [{"letter": "A", "text": "The ventral 'what' stream, which processes mainly P-cell (parvocellular) information"}, {"letter": "B", "text": "The dorsal 'where' stream, which processes mainly M-cell information"}, {"letter": "C", "text": "The ventral 'what' stream, which processes mainly M-cell information"}, {"letter": "D", "text": "The retinohypothalamic projection to the suprachiasmatic nucleus"}, {"letter": "E", "text": "The pretectal projection that drives the pupillary light reflex"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The course divides visual association cortex into a dorsal 'where' stream (occipitoparietal, M-cell input: contrast and motion) and a ventral 'what' stream (temporo-occipital, P-cell input: detail and color, for object, letter and face recognition). Lost recognition with preserved motion fits ventral-stream damage.", "distractor_explanations": {"B": "The dorsal stream (occipitoparietal) handles motion and contrast, which she still has.", "C": "The ventral stream draws mainly on P cells, not M cells.", "D": "That projection sets circadian rhythm, not object recognition.", "E": "The pretectal pathway controls pupil size, not recognition."}, "source": "Wk5 packet p. 71 ('The cortical dorsal “where” pathway processes information collected primarily by the M Cell Pathway. Thus, the occipitoparietal association cortices interpret contrast and motion. The cortical ventral “what” pathway processes information collected primarily by the P Cell Pathway. Thus, the temporooccipital association cortices interpret detail and color –– providing object, letter, and facial recognition'); p. 75-76 (pretectal and suprachiasmatic projections)."}, {"id": "m2mk4-q40", "n": 40, "part": 1, "title": null, "stem": "Suppose a small lesion destroyed only the parvocellular layers of the left lateral geniculate nucleus, sparing the magnocellular layers. Which loss would be expected?", "options": [{"letter": "A", "text": "Motion and contrast in the right visual field of both eyes"}, {"letter": "B", "text": "Color and fine detail in the left visual field of both eyes"}, {"letter": "C", "text": "Color and fine detail in the right visual field of both eyes"}, {"letter": "D", "text": "Color and fine detail in the left eye only"}, {"letter": "E", "text": "All vision in the right visual field of both eyes"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO1-2", "difficulty": 3, "format": "direct", "drug_item": null, "laterality": true, "reworks": null, "explanation": "P (parvocellular) ganglion cells carry color and fine detail and project to the parvocellular layers of the LGN; M cells carry motion and contrast to the magnocellular layers. Each LGN receives the contralateral visual field from both eyes, so the left LGN carries the right field. (The selective-lesion scenario is hypothetical; the reasoning uses only course facts.)", "distractor_explanations": {"A": "Motion and contrast travel in the M (magnocellular) layers, which are spared.", "B": "The left LGN receives the right visual field.", "D": "Each LGN receives a visual field from both eyes, not one eye.", "E": "The magnocellular layers still relay part of the right field's signal."}, "source": "Wk5 packet p. 68 ('P ganglion cells are better at relaying detail and color, whereas the M ganglion cells are better at relaying contrast and movement. P and M ganglion cells in the retina have axons that project to the parvocellular and magnocellular layers of the lateral geniculate nucleus'); p. 70 ('The dual streams of the magnocellular (contrast and motion) and parvocellular (color and detail) pathways remain separate at each lateral geniculate nucleus'); p. 72 ('Each LGN receives input from the contralateral visual field')."}, {"id": "m2mk4-q41", "n": 41, "part": 1, "title": null, "stem": "Over 4 months, a 54-year-old woman has developed a mass that makes her right eye bulge forward. Her right eye now cannot move in any direction, the right upper lid droops, and her right forehead is numb. Vision and the left eye are normal. According to the course's localization scheme, where is the lesion?", "options": [{"letter": "A", "text": "Cavernous sinus"}, {"letter": "B", "text": "Oculomotor nucleus in the midbrain"}, {"letter": "C", "text": "Subarachnoid space where CN III leaves the midbrain"}, {"letter": "D", "text": "Orbital floor fracture with entrapment"}, {"letter": "E", "text": "Superior orbital fissure"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": null, "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO2-3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Total ophthalmoplegia with ptosis (CN III, IV and VI) plus V1 numbness means a site where these nerves travel together. The course distinguishes the cavernous sinus (involvement without proptosis) from the superior orbital fissure (involvement with proptosis). Her prominent proptosis points to the superior orbital fissure.", "distractor_explanations": {"A": "The course localizes combined III, IV, VI and V palsies without proptosis to the cavernous sinus; she has proptosis.", "B": "A nuclear CN III lesion wouldn't explain loss of CN IV and VI function and forehead numbness.", "C": "A lesion there affects CN III alone, without long-tract signs, not CN IV, VI and V1.", "D": "Entrapment restricts vertical movement and numbs the cheek, not total ophthalmoplegia with a numb forehead."}, "source": "Wk5 packet p. 110 (third nerve palsy by site: '3. In the cavernous sinus region—third nerve palsy with involvement of fourth, sixth and fifth—V1 and V2 segment without any proptosis. 4. In the superior orbital fissure—third nerve palsy with involvement of fourth, sixth and fifth—V1 and V2 segment with proptosis'; '2. Subarachnoid space ... Ipsilateral third nerve palsy without long tract signs'); p. 111-112 (same scheme for CN IV and VI); Eye Exam deck (995161cb) slide 11-12 (orbital blowout fracture: vertical asymmetry)."}, {"id": "m2mk4-q42", "n": 42, "part": 1, "title": null, "stem": "When a patient shifts her gaze from a distant sign to a book held close to her face, all of the following occur EXCEPT:", "options": [{"letter": "A", "text": "Both medial rectus muscles contract"}, {"letter": "B", "text": "The ciliary muscles contract"}, {"letter": "C", "text": "Tension on the zonular fibers increases, flattening the lens"}, {"letter": "D", "text": "The pupillary sphincter muscles contract"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": null, "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO4", "difficulty": 2, "format": "negative", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The near triad is convergence (medial recti), accommodation and pupillary constriction. In accommodation the ciliary muscle contracts, which reduces tension on the zonular fibers and lets the lens thicken. Increased zonular tension flattens the lens for distance vision, the opposite of what happens here.", "distractor_explanations": {"A": "Convergence of the optic axes (both medial recti, CN III somatic motor) is part of the near triad.", "B": "Ciliary contraction (Edinger-Westphal parasympathetics) is the accommodation step.", "D": "Pupillary constriction is the third part of the near triad."}, "source": "Wk5 packet p. 116-117 (near triad: '1. Convergence of optic axes (somatic motor) 2. Oculomotor nucleus signals both medial rectus mm. to contract ... Lens Accommodation (parasympathetic): Edinger-Westphal nucleus signal ciliary muscles to contract ... Reduce tension of suspensory ligaments of lens ... 3. Pupillary constriction (parasympathetic)'); p. 76 (accommodation: 'the ciliary muscle contracts, reducing tension on the zonular fibers')."}, {"id": "m2mk4-q43", "n": 43, "part": 1, "title": null, "stem": "A 49-year-old woman without diabetes has the worst headache of her life, which began suddenly while she was lifting a box, and a droopy left eyelid. Her left eye rests down and out, and her left pupil is dilated and does not react to light. Which cause is most important to exclude first?", "options": [{"letter": "A", "text": "Microvascular ischemia of the nerve from diabetes or hypertension"}, {"letter": "B", "text": "An aneurysm at the junction of the posterior communicating and internal carotid arteries compressing CN III"}, {"letter": "C", "text": "Horner syndrome from a carotid dissection"}, {"letter": "D", "text": "Pharmacologic dilation from a scopolamine patch"}, {"letter": "E", "text": "An internuclear ophthalmoplegia from a demyelinating lesion"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Sympathetics & Parasympathetics of the Eye", "topic": "Sympathetics & Parasympathetics of the Eye", "note": null, "blueprint_category": "Sympathetics & Parasympathetics of the Eye", "learning_objective": "SymPara LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "A pupil-involving third nerve palsy suggests compression, because the pupillary fibers run on the outer edge of CN III. The most concerning cause is an intracranial aneurysm, most often at the junction of the posterior communicating and internal carotid arteries, and the course says CTA or MRA is needed.", "distractor_explanations": {"A": "Ischemic third nerve palsies usually spare the pupil; a blown pupil means compression.", "C": "Horner syndrome causes a small pupil and mild ptosis, not a dilated pupil with a down-and-out eye.", "D": "A drug-dilated pupil wouldn't cause ptosis or an eye resting down and out.", "E": "INO affects adduction on lateral gaze without ptosis or pupil involvement."}, "source": "Wk5 packet p. 86 ('Non-pupil involving palsies can be caused by diabetes or hypertension ... When the pupil is involved we are concerned about physical compression of the nerve ... the actual pupillary fibers’ location at the very outer edge of CN III ... intracranial aneurysm is the most concerning pathology. The most common location is at the junction of the PCOM and ICA and either a CTA or MRA is necessary'); p. 86-87 (Horner syndrome; pharmacologic anisocoria); p. 112 (INO)."}, {"id": "m2mk4-q44", "n": 44, "part": 1, "title": null, "stem": "A passenger watches telephone poles stream past a train window, moving from left to right across her view. Which eye movements does she make?", "options": [{"letter": "A", "text": "Slow drifts to the left, then quick saccades to the right (right-beating nystagmus)"}, {"letter": "B", "text": "Smooth pursuit to the right with no fast phase"}, {"letter": "C", "text": "Pendular movements of equal speed in both directions"}, {"letter": "D", "text": "Slow drifts to the right following the poles, then quick resetting saccades to the left (left-beating nystagmus)"}, {"letter": "E", "text": "Upbeating nystagmus"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Nystagmus", "topic": "Nystagmus", "note": null, "blueprint_category": "Nystagmus", "learning_objective": "Nystagmus LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "This is optokinetic nystagmus, a normal response. The eyes follow the moving scene with a slow phase in the direction of motion (rightward), then saccade quickly the opposite way (leftward). Nystagmus is named by its fast phase, so this is left-beating.", "distractor_explanations": {"A": "The slow phase follows the moving scene, which is moving to the right.", "B": "Once the eyes reach the end of their range, a resetting saccade in the opposite direction follows.", "C": "Pendular nystagmus is a pathological central pattern, not the normal optokinetic response.", "E": "Horizontal motion of the scene produces horizontal, not vertical, nystagmus."}, "source": "Nystagmus ILM (TopHat, nystagmus_ilm_tophat.pdf) p. 6 ('Nystagmus is named after the fast phase'), p. 8 ('If an image is moving left to right (rightwards), the eyes drift rightwards. Once the eyes drift as far to the right as they can, they saccade quickly to the opposite direction (left wards). Thus, a rightward moving series of images ... elicits a fast-phase saccade to the left'), p. 9 (central nystagmus is pendular)."}, {"id": "m2mk4-q45", "n": 45, "part": 1, "title": null, "stem": "Unlike other sensory pathways, the olfactory pathway reaches its primary cortex without a thalamic relay. Which region is the primary olfactory cortex?", "options": [{"letter": "A", "text": "Piriform cortex"}, {"letter": "B", "text": "Orbitofrontal cortex"}, {"letter": "C", "text": "Insular cortex"}, {"letter": "D", "text": "Entorhinal cortex"}, {"letter": "E", "text": "Postcentral gyrus"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Taste and Smell", "topic": "Taste and Smell", "note": null, "blueprint_category": "Taste and Smell", "learning_objective": "Taste & Smell LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Mitral cell axons form the olfactory tracts and end in the primary olfactory cortex, the piriform cortex, an ancient three-layered cortex, without passing through the thalamus. The thalamus is involved only in secondary projections to association cortex such as the orbitofrontal cortex.", "distractor_explanations": {"B": "The orbitofrontal cortex is olfactory association cortex, reached secondarily (partly through the thalamus).", "C": "The insula receives gustatory information.", "D": "The entorhinal cortex receives olfactory projections but isn't the primary olfactory cortex.", "E": "The postcentral gyrus is primary somatosensory cortex."}, "source": "Wk5 packet p. 94 ('the olfactory nerves are unique in that they reach the cerebral hemisphere directly, without having to go through the thalamus. However, the thalamus gets involved in secondary projections from primary olfactory cortex to the olfactory association cortex (i.e., orbitofrontal cortex) ... The axons of the mitral cells form the olfactory tracts that connects the second order neurons to the third order neurons in the primary olfactory cortex (piriform cortex). The piriform cortex is an evolutionarily ancient variety of cortex that has only 3 layers'); p. 95 (orbitofrontal cortex also receives gustatory information from the insula)."}, {"id": "m2mk4-q46", "n": 46, "part": 1, "title": null, "stem": "Four days after a squash ball struck his left eye, a 27-year-old man has a dull ache and blurred vision in that eye. Blood layered in the anterior chamber after the injury, and his intraocular pressure is now 38 mm Hg. The right eye's pressure is 15 mm Hg, and he has no history of glaucoma. Gonioscopy of the left eye shows an open iridocorneal angle. What is raising his pressure?", "options": [{"letter": "A", "text": "The peripheral iris pushed against the trabecular meshwork, closing the angle"}, {"letter": "B", "text": "Increased secretion of aqueous by the ciliary processes"}, {"letter": "C", "text": "Fluid in the ciliary body rotating the lens-iris diaphragm forward"}, {"letter": "D", "text": "Obstruction of the nasolacrimal duct"}, {"letter": "E", "text": "Red blood cells clogging the trabecular meshwork (secondary open-angle glaucoma)"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Glaucoma", "topic": "Glaucoma", "note": null, "blueprint_category": "Glaucoma", "learning_objective": "Glaucoma LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Bleeding into the anterior chamber is a hyphema. The course describes secondary open-angle glaucoma: the angle is open but the drainage system is clogged, for example by red blood cells from a hyphema, pigment, or photoreceptors after a retinal detachment.", "distractor_explanations": {"A": "The angle is open on gonioscopy, so this isn't angle closure.", "B": "The course explains post-traumatic pressure rise by blocked outflow, not overproduction.", "C": "Ciliary body effusion (for example from topiramate) causes angle closure, and his angle is open.", "D": "The nasolacrimal duct drains tears, not aqueous humor."}, "source": "Wk5 packet p. 102 ('Secondary open-angle glaucoma occurs when the angle is open but the drainage system is clogged ... red blood cells (from hyphema, bleeding inside the eye), pigment cells ... or even photoreceptors liberated after retinal detachments can so “clog” the trabecular meshwork and lead to increased IOP'; topiramate 'ciliary body effusion ... rotates the entirety of the lens-iris diaphragm forward and causes angle closure'); Eye Exam deck (995161cb) slide 32 (hyphema)."}, {"id": "m2mk4-q47", "n": 47, "part": 1, "title": null, "stem": "A 9-month-old boy has lost the ability to sit, startles excessively to noise, and has a cherry-red spot at the center of each macula. Accumulation of what, in which cells, produces this fundus finding?", "options": [{"letter": "A", "text": "Drusen beneath the retinal pigment epithelium"}, {"letter": "B", "text": "Sphingolipid (ganglioside) in retinal ganglion cells surrounding the fovea"}, {"letter": "C", "text": "Cholesterol emboli in the retinal arterioles"}, {"letter": "D", "text": "Copper in the cornea"}, {"letter": "E", "text": "Pigment clumps in the peripheral retina"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": null, "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal Disorders LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Developmental regression with an exaggerated startle and bilateral cherry-red spots in an infant fits Tay-Sachs disease, a sphingolipidosis. Sphingolipids (gangliosides) accumulate in retinal ganglion cells, which whiten the retina around the fovea; the fovea has no ganglion cells, so it stays red.", "distractor_explanations": {"A": "Drusen are the extracellular deposits of age-related macular degeneration.", "C": "Emboli cause artery occlusion (CRAO), a cherry-red spot from infarction, not from storage.", "D": "Copper deposits in the cornea form Kayser-Fleischer rings in Wilson disease.", "E": "Peripheral pigment clumping is seen in retinitis pigmentosa."}, "source": "Wk5 packet p. 128 ('The cherry red spot appearance ... also appears in a number of inherited disorders, such as Tay-Sachs Disease (deterioration of nerve cells due to accumulation of gangliosides) or Niemann-Pick Disease ... The cherry-red appearance in these inherited disorders (sphingolipidoses, autosomal recessive diseases) are secondary to accumulation of sphingolipids within retinal ganglion cells and the fovea only contains photoreceptors and some outer tissue'); Retinal Disorders deck (jones_retinal_disorders) slide 11 (cherry red spot)."}, {"id": "m2mk4-q48", "n": 48, "part": 1, "title": null, "stem": "A 10-year-old girl has several large café-au-lait macules. A slit-lamp photograph of her iris is shown. The gene mutated in her disorder normally encodes a protein with which function?", "options": [{"letter": "A", "text": "A regulator of mTOR signaling (hamartin or tuberin)"}, {"letter": "B", "text": "A tumor suppressor that controls the G1-to-S checkpoint (RB1)"}, {"letter": "C", "text": "The tumor suppressor merlin"}, {"letter": "D", "text": "A negative regulator of Ras/MAPK signaling (neurofibromin)"}, {"letter": "E", "text": "A mitochondrial protein, frataxin"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/s-iris-lisch.png", "image_needed": true, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": null, "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal Disorders LO5", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The photo shows Lisch nodules: dome-shaped, pigmented iris hamartomas. With café-au-lait macules this is neurofibromatosis type 1, caused by mutations in NF1, which encodes neurofibromin, a negative regulator of Ras/MAPK signaling.", "distractor_explanations": {"A": "TSC1/TSC2 mutations cause tuberous sclerosis, whose eye finding is retinal astrocytic hamartomas.", "B": "RB1 mutations cause retinoblastoma, which presents with leukocoria.", "C": "NF2 (merlin) mutations cause bilateral vestibular schwannomas.", "E": "Frataxin defects cause Friedreich ataxia, with no iris hamartomas."}, "source": "Retinal Disorders deck (jones_retinal_disorders) slide 36 (this photo, labeled 'Lisch Nodules – benign iris hamartomas'; 'NF1 = Autosomal-dominant neurocutaneous syndrome'); Wk5 packet p. 124 ('Neurofibromatosis type 1 (NF1) is an autosomal-dominant neurocutaneous syndrome caused by mutations in the NF1 tumor suppressor gene, which encodes neurofibromin—a negative regulator of the Ras/MAPK signaling pathway ... Lisch nodules, benign iris hamartomas that appear as dome-shaped, pigmented lesions'; retinoblastoma RB1; TSC1/TSC2 mTOR); p. 49 (NF2 merlin).", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/s-iris-lisch.png", "options": {"A": "not shown in this figure", "B": "not shown in this figure", "C": "not shown in this figure", "D": "Faculty label 'Lisch Nodules – benign iris hamartomas' (slide 36, above this photo)", "E": "not shown in this figure"}, "note": "Source: Retinal Disorders deck slide 36, right-hand photo; the faculty label sits above the photo on the slide and is not part of the image. The choices are gene functions, so the label is starred.", "how": "Same faculty figure with its labels showing (the full labeled version). Amber star on the faculty label or title tied to the key (the choices aren't structure names); red boxes on labels tied to other choices. Arrow redrawn where the question placed it (if the question has one).", "marked": ["D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q49", "n": 49, "part": 1, "title": null, "stem": "A 46-year-old accountant now holds restaurant menus at arm's length to read them. Her distance vision is unchanged, and both eyes look healthy on examination. What explains her difficulty?", "options": [{"letter": "A", "text": "Myopia"}, {"letter": "B", "text": "Astigmatism"}, {"letter": "C", "text": "Age-related loss of accommodation, so the lens can't round up enough for near targets"}, {"letter": "D", "text": "Cataract"}, {"letter": "E", "text": "Paralysis of the ciliary muscle from a third nerve palsy"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO3", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Presbyopia is an age-related decrease in accommodation: the eye can no longer shift its focus to near targets. For near vision the ciliary muscle contracts, the zonules slacken and the lens rounds up; with age that shift is lost, so reading material has to be held farther away.", "distractor_explanations": {"A": "Myopia blurs distance vision while near vision stays clear, the opposite of her complaint.", "B": "Astigmatism blurs vision at all distances.", "D": "A cataract clouds the lens and blurs vision at all distances; her eyes look healthy.", "E": "A third nerve palsy would also cause ptosis, a dilated pupil and abnormal eye movements."}, "source": "Eye Exam deck (995161cb) slide 10 ('Myopia: distance blur, near clear; Hyperopia ...; Astigmatism: blur at all distances; Presbyopia: Age-related decrease in accommodation; Inability to focus at near'); Wk5 packet p. 130 ('Presbyopia- age related changes to the eye that eliminate shift in focus distance'); p. 76 (accommodation)."}, {"id": "m2mk4-q50", "n": 50, "part": 1, "title": null, "stem": "A 52-year-old man with myasthenia gravis has taken daily prednisone for 3 years. He now has glare from oncoming headlights and blurred reading vision, and his red reflex is disrupted. Which finding is most likely on slit-lamp examination?", "options": [{"letter": "A", "text": "Posterior subcapsular cataract"}, {"letter": "B", "text": "Lens dislocated into the vitreous"}, {"letter": "C", "text": "Vitreous hemorrhage"}, {"letter": "D", "text": "Corneal ulcer"}, {"letter": "E", "text": "Pterygium"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Long-term prednisone is the course's named cause of a posterior subcapsular cataract. A cataract is loss of lens transparency, which disrupts the red reflex and causes glare and blur.", "distractor_explanations": {"B": "A dislocated lens follows broken zonules from trauma or a connective tissue disorder, not steroid use.", "C": "Vitreous hemorrhage follows trauma or proliferative diabetic retinopathy and doesn't come from steroids.", "D": "A corneal ulcer is a painful infection of the cornea, not a lens finding.", "E": "A pterygium is fibrous tissue growing onto the cornea from sun exposure."}, "source": "Eye Exam deck (995161cb) slides 34-38 ('Cataract: Clouding/fogging of lens; loss of transparency; Aging, trauma; Posterior Subcapsular Cataract: prednisone use; Dislocated Lens: Breakage of lens zonules ...'), slides 27-31 (pterygium, corneal ulcer), slide 39 (vitreous hemorrhage); Wk5 packet p. 130 ('Abnormal Red Reflex - the red glow in photos is disrupted because of lens problems'); Drug list, MG table (prednisone)."}, {"id": "m2mk4-q51", "n": 51, "part": 2, "title": "Gross anatomy lab image: Midline Cavities", "stem": "Identify the structure indicated by the arrow on this frontal (anteroposterior) radiograph of the skull.", "options": [{"letter": "A", "text": "Ethmoid sinus"}, {"letter": "B", "text": "Maxillary sinus"}, {"letter": "C", "text": "Frontal sinus"}, {"letter": "D", "text": "Sphenoid sinus"}, {"letter": "E", "text": "None of these"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/lab-mid-1.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Midline Cavities", "topic": "Midline Cavities", "note": null, "blueprint_category": "Anatomy Lab: Midline Cavities", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the frontal sinus, the air space in the frontal bone above the orbits and nose. Frontal sinus is a bold (CT/MRI) structure on the lab list; this faculty radiograph is the instructor deck's frontal sinus card.", "distractor_explanations": {"A": "The ethmoid air cells lie lower, between the orbits on either side of the nasal cavity.", "B": "The maxillary sinuses are the large lucencies below the orbits, beside the nasal cavity.", "D": "The sphenoid sinus lies deep in the sphenoid body behind the nasal cavity and isn't seen separately on this view.", "E": "The arrowed structure is listed (frontal sinus)."}, "source": "Instructor deck Wk 5 (lectures/wk5/in-house-cards/neuroblock_2026_week_5.apkg), card image mdcav26_ap_sinuses.png (faculty arrows labeled 'Frontal sinus' and 'Maxillary sinus'); Wk4 packet p. 41 ('The frontal sinuses are located in the frontal bone, superior to the nose'); Lab 4 structure list ('Frontal sinus', bold).", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/lab-mid-1.png", "options": {"A": "not labeled in this figure", "B": "Labeled 'Maxillary sinus'", "C": "Labeled 'Frontal sinus' (arrowed)", "D": "not labeled in this figure", "E": "not applicable (the key is listed)"}, "note": "Source: instructor-deck radiograph card. The card's two cyan faculty arrows were masked in the question image (their pixels replaced with neighboring gray, the same as covering a label) and the label boxes cropped off; the amber arrow tip sits where the faculty 'Frontal sinus' arrow tip was.", "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["B", "C"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q52", "n": 52, "part": 2, "title": "Gross anatomy lab image: Midline Cavities", "stem": "Identify the structure indicated by the arrow.", "options": [{"letter": "A", "text": "Palatoglossal fold"}, {"letter": "B", "text": "Palatopharyngeal fold"}, {"letter": "C", "text": "Soft palate"}, {"letter": "D", "text": "Palatine tonsil"}, {"letter": "E", "text": "None of these"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/lab-mid-2.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Midline Cavities", "topic": "Midline Cavities", "note": null, "blueprint_category": "Anatomy Lab: Midline Cavities", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the palatoglossal fold, the anterior arch at the back of the oral cavity, raised by the palatoglossus muscle. The palatine tonsil lies behind it, between it and the palatopharyngeal fold.", "distractor_explanations": {"B": "The palatopharyngeal fold is the posterior arch, behind the palatine tonsil.", "C": "The soft palate is the posterior roof of the mouth above the arches, ending in the uvula.", "D": "The palatine tonsil sits in the fossa between the two folds.", "E": "The arrowed structure is listed (palatoglossal fold)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 11 (Grant's Dissector 7.84), 'Palatoglossal fold' label; Lab 4 structure list (Folds: 'Palatoglossal fold').", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/lab-mid-2.png", "options": {"A": "Labeled 'Palatoglossal fold' (arrowed)", "B": "Labeled 'Palatopharyngeal fold'", "C": "Labeled 'Soft palate'", "D": "Labeled 'Palatine tonsil'", "E": "not applicable (the key is listed)"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q53", "n": 53, "part": 2, "title": "Gross anatomy lab image: Midline Cavities", "stem": "Identify the structure indicated by the arrow on this sagittal view of the larynx.", "options": [{"letter": "A", "text": "Thyroid cartilage"}, {"letter": "B", "text": "Cricoid cartilage"}, {"letter": "C", "text": "Trachea"}, {"letter": "D", "text": "Hyoid"}, {"letter": "E", "text": "None of these"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/lab-mid-3.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Midline Cavities", "topic": "Midline Cavities", "note": null, "blueprint_category": "Anatomy Lab: Midline Cavities", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the cricoid cartilage, the complete ring below the thyroid cartilage and above the trachea, cut here in the midline.", "distractor_explanations": {"A": "The thyroid cartilage is the larger cartilage above, joined to the cricoid by the median cricothyroid ligament.", "C": "The trachea begins below the cricoid cartilage.", "D": "The hyoid is the bone at the top of the larynx, above the thyroid cartilage.", "E": "The arrowed structure is listed (cricoid cartilage)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 18 (Grant's Dissector 7.91), 'Cricoid cartilage' label; Wk4 packet p. 62-64 (laryngeal cartilages); Lab 4 structure list (Larynx: 'Cricoid cartilage').", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/lab-mid-3.png", "options": {"A": "Labeled 'Thyroid cartilage'", "B": "Labeled 'Cricoid cartilage' (arrowed)", "C": "Labeled 'Trachea'", "D": "Labeled 'Hyoid'", "E": "not applicable (the key is listed)"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q54", "n": 54, "part": 2, "title": "Gross anatomy lab image: Eye", "stem": "Identify the structure indicated by the arrow in this superior view of the orbit (superior muscles reflected).", "options": [{"letter": "A", "text": "Levator palpebrae superioris"}, {"letter": "B", "text": "Lateral rectus"}, {"letter": "C", "text": "Superior rectus"}, {"letter": "D", "text": "Lacrimal gland"}, {"letter": "E", "text": "None of these"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/lab-eye-1.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Eye", "topic": "Eye", "note": null, "blueprint_category": "Anatomy Lab: Eye", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the lacrimal gland, the almond-sized gland in the upper lateral corner of the orbit, which secretes tears into the superior conjunctival fornix.", "distractor_explanations": {"A": "The levator palpebrae superioris is cut and reflected; its stumps lie anteriorly and posteriorly, not at the upper lateral orbit.", "B": "The lateral rectus runs along the lateral wall below and behind the gland.", "C": "The superior rectus is cut and reflected with the levator.", "E": "The arrowed structure is listed (lacrimal gland)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 26 (Grant's Dissector 7.55), 'Lacrimal gland' label; Wk5 packet p. 54 ('Tears are produced in the lacrimal gland, which is an almond-sized gland in the upper lateral corner of the bony orbit'); Lab 4 structure list (Orbit: 'Lacrimal gland').", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/lab-eye-1.png", "options": {"A": "Labeled 'Levator palpebrae superioris (cut)' / '(reflected)'", "B": "Labeled 'Lateral rectus and abducens n. (CN VI)'", "C": "Labeled 'Superior rectus (cut)' / '(reflected)'", "D": "Labeled 'Lacrimal gland' (arrowed)", "E": "not applicable (the key is listed)"}, "note": "Figure changed from the lab split's Fig. 24 to Fig. 26: in Fig. 24 the black 'Cut 2' arrow crosses the gland, which would put a second arrow in the question crop.", "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q55", "n": 55, "part": 2, "title": "Gross anatomy lab image: Eye", "stem": "Identify the artery indicated by the arrow in this superior view of the orbit.", "options": [{"letter": "A", "text": "Ophthalmic artery"}, {"letter": "B", "text": "Lacrimal artery"}, {"letter": "C", "text": "Supraorbital artery"}, {"letter": "D", "text": "Central artery of the retina"}, {"letter": "E", "text": "None of these"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/lab-eye-2.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Eye", "topic": "Eye", "note": null, "blueprint_category": "Anatomy Lab: Eye", "learning_objective": "Lab 4 (11/17) LO1", ions": {"A": "The tensor tympani tendon hooks onto the handle of the malleus just below the arrow.", "B": "The malleus is the larger ossicle whose handle runs down the tympanic membrane.", "D": "CN VII descends in the facial canal at the posterior edge of the view.", "E": "The arrowed structure is listed (chorda tympani)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 29B (Grant's Dissector 7.96), 'Chorda tympani' label; Wk4 packet p. 48 (chorda tympani: taste and parasympathetic fibers via the lingual nerve); Lab 4 structure list (Ear nerves: 'Chorda tympani').", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/lab-ear-2.png", "options": {"A": "Labeled 'Tensor tympani: Tendon'", "B": "Labeled 'Malleus'", "C": "Labeled 'Chorda tympani' (arrowed)", "D": "Labeled 'Facial n. (CN VII) in facial canal'", "E": "not applicable (the key is listed)"}, "note": "The 'Tensor tympani: Tendon' pin is about 40 px (source scale) below the arrow tip.", "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "B", "C", "D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}, {"id": "m2mk4-q59", "n": 59, "part": 2, "title": "Gross anatomy lab image: Ear", "stem": "Identify the structure indicated by the arrow on this view of the medial wall of the middle ear. Be specific.", "options": [{"letter": "A", "text": "Greater petrosal nerve"}, {"letter": "B", "text": "Tensor tympani"}, {"letter": "C", "text": "Chorda tympani"}, {"letter": "D", "text": "Geniculate ganglion"}, {"letter": "E", "text": "None of these"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock4-images/lab-ear-3.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Ear", "topic": "Ear", "note": null, "blueprint_category": "Anatomy Lab: Ear", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the geniculate ganglion, the sensory ganglion of CN VII at the bend of the facial nerve, which holds the cell bodies of taste fibers from the anterior two-thirds of the tongue. The greater petrosal nerve leaves it anteriorly.", "distractor_explanations": {"A": "The greater petrosal nerve is the thin nerve leaving the ganglion anteriorly, not the swelling itself.", "B": "The tensor tympani is the muscle in its canal below, above the pharyngotympanic tube.", "C": "The chorda tympani arises lower on CN VII and crosses the lateral wall; it isn't seen here.", "E": "The arrowed structure is listed (geniculate ganglion)."}, "source": "Lab 4 dissector (uadissector_neuro_lab4_midlinecavitiesoe.docx) Fig. 29A (Grant's Dissector 7.96), 'Geniculate ganglion' label; Wk4 packet p. 48 ('Their cell bodies are located in the geniculate ganglion (the sensory ganglion of CN VII)'); Lab 4 structure list (Ear nerves: 'Geniculate ganglion').", "annotation": {"image": "qbank/midterm2-mock4-images/annotated/lab-ear-3.png", "options": {"A": "not labeled in this panel (the unlabeled nerve leaving the ganglion anteriorly)", "B": "Labeled 'Tensor tympani: Muscle'", "C": "not labeled in this panel", "D": "Labeled 'Geniculate ganglion' (arrowed)", "E": "not applicable (the key is listed)"}, "note": null, "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["B", "D"], "status": "built 2026-11-20 in Cowork (qbank/midterm2-mock4-images/annotated/)"}}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("exam-data").textContent);
const Q = DATA.questions.slice().sort((a,b)=>a.n-b.n);
const N = Q.length;
const byN = {}; Q.forEach(q=>byN[q.n]=q);
const imgSrc = q => q.image ? "images/" + q.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const annSrc = q => q.annotation && q.annotation.image ? "images/ann-" + q.annotation.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
// explanation_image (Mock #5+): annotated figure shown only in feedback/review; same images/ + .png->.jpg mapping as question images
const explSrc = q => q.explanation_image ? "images/" + q.explanation_image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const fmtTime = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? h+":"+pad(m)+":"+pad(x) : m+":"+pad(x); };

/* ---------- state ---------- */
let S = {attempt:1, status:"in_progress", elapsed_s:0, started:null, mode:"immediate"};
let showClock = ls("m2mock4.clock") !== false;
let allResp = {};          // docId -> {attempt,n,choice,flagged}
let attempts = {};         // "a1" -> summary
let idx = 0;
let view = "exam";         // exam | results
let filter = "all";
let db = null, sync = "connecting";

function ls(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function struckOf(n){ const r=resp(n); return new Set(r && Array.isArray(r.struck) ? r.struck : []); }
function hlOf(n){ const r=resp(n); return r && Array.isArray(r.hl) ? r.hl : []; }
const revealed = n => submitted() || (S.mode==="immediate" && !!choiceOf(n));
const savedIdx = ls("m2mock4.idx"); if(typeof savedIdx==="number" && savedIdx>=0 && savedIdx<N) idx = savedIdx;

const rid = n => "a"+S.attempt+"-q"+pad(n);
function resp(n){ return allResp[rid(n)] || null; }
function choiceOf(n){ const r=resp(n); return r && r.choice ? r.choice : null; }
function flagOf(n){ const r=resp(n); return !!(r && r.flagged); }
const submitted = () => S.status === "submitted";
function answeredCount(){ let c=0; Q.forEach(q=>{ if(choiceOf(q.n)) c++; }); return c; }

/* ---------- persistence ---------- */
const queues = {};
function put(path, body){
  if(!db){ localSave(); return Promise.resolve(); }
  setSync("saving");
  const p = (queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).then(()=>{ if(queues[path]===p) setSync("saved"); }, e=>{ setSync("error", e && e.code); });
  queues[path] = p; return p;
}
function localSave(){ ls("m2mock4.local",{S, allResp, attempts}); }
function writeResp(n){
  const r = allResp[rid(n)];
  const q = byN[n];
  put("responses/"+rid(n), {attempt:S.attempt, n, qid:q.id, choice:r.choice||null, correct: r.choice? r.choice===q.answer : null, flagged:!!r.flagged,
    mode:S.mode, struck:Array.isArray(r.struck)?r.struck:[], hl:Array.isArray(r.hl)?r.hl:[], updated:new Date().toISOString()});
}
let stateTimer = null;
function writeState(now){
  clearTimeout(stateTimer);
  const go = ()=>put("exam/state", {attempt:S.attempt, status:S.status, mode:S.mode, elapsed_s:Math.round(S.elapsed_s), started:S.started, updated:new Date().toISOString()});
  if(now) go(); else stateTimer = setTimeout(go, 1500);
}
function setSync(s, code){
  sync = s; const el = document.getElementById("sync"); if(!el) return;
  el.className = "sync" + (s==="error" ? " warn" : "");
  el.textContent = s==="saving" ? "Saving…" : s==="saved" ? "Answers saved to this artifact" :
    s==="connecting" ? "Connecting…" : s==="local" ? "Saved in this browser" :
    "Last save failed"+(code?" ("+code+")":"")+". Keep going; the next answer retries.";
}

/* ---------- timer ---------- */
let last = Date.now();
setInterval(()=>{
  const now = Date.now(), dt = (now-last)/1000; last = now;
  if(!submitted() && S.started && document.visibilityState==="visible" && dt < 5) S.elapsed_s += dt;
  paintMeters();
}, 1000);
document.addEventListener("visibilitychange", ()=>{ last = Date.now(); if(document.visibilityState==="hidden" && S.started && !submitted()) writeState(true); });

/* ---------- actions ---------- */
function ensureResp(n){ const k=rid(n); if(!allResp[k]) allResp[k]={attempt:S.attempt,n,choice:null,flagged:false}; else allResp[k]=Object.assign({},allResp[k]); return allResp[k]; }
function choose(letter){
  if(submitted()) return;
  const q = Q[idx]; if(!q.options.some(o=>o.letter===letter)) return;
  if(revealed(q.n)) return;   // immediate feedback locks the first answer
  const r = ensureResp(q.n); r.choice = letter;
  if(Array.isArray(r.struck)) r.struck = r.struck.filter(x=>x!==letter);
  if(!S.started){ S.started = new Date().toISOString(); }
  writeResp(q.n); writeState(false); render();
}
function toggleFlag(){
  const q = Q[idx]; const r = ensureResp(q.n); r.flagged = !r.flagged;
  writeResp(q.n); render();
}
function toggleStrike(n, L){
  if(revealed(n)) return;
  const r = ensureResp(n); const s = new Set(Array.isArray(r.struck)?r.struck:[]);
  s.has(L)? s.delete(L) : s.add(L); r.struck = [...s].sort();
  writeResp(n); renderMain();
}
function setHL(n, ranges){ const r = ensureResp(n); r.hl = ranges; writeResp(n); renderMain(); }
function addHL(n, s, e){
  const all = hlOf(n).map(x=>x.slice()).concat([[s,e]]).sort((a,b)=>a[0]-b[0]);
  const out = [];
  all.forEach(r=>{ const last = out[out.length-1]; if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else out.push(r); });
  setHL(n, out);
}
function hlHTML(text, ranges){
  let h = "", pos = 0;
  ranges.forEach((r,i)=>{ const s=Math.max(pos,r[0]), e=Math.min(text.length,r[1]); if(e<=s) return;
    h += esc(text.slice(pos,s)) + '<mark data-h="'+i+'" title="Click to remove highlight">'+esc(text.slice(s,e))+'</mark>'; pos = e; });
  return h + esc(text.slice(pos));
}
function offsetIn(el, node, off){ const r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, off); return r.toString().length; }
document.addEventListener("mouseup", ()=>setTimeout(()=>{
  const sel = window.getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed) return;
  const el = document.getElementById("stem"); if(!el) return;
  const rg = sel.getRangeAt(0);
  if(!el.contains(rg.startContainer) || !el.contains(rg.endContainer)) return;
  const s = offsetIn(el, rg.startContainer, rg.startOffset), e = offsetIn(el, rg.endContainer, rg.endOffset);
  sel.removeAllRanges();
  if(e > s) addHL(Q[idx].n, s, e);
}, 0));
function setMode(m){
  if(submitted() || S.mode===m) return;
  S.mode = m; writeState(true); render();
}
function go(i){ idx = Math.max(0, Math.min(N-1, i)); ls("m2mock4.idx", idx); if(view!=="exam") view="exam"; render(); window.scrollTo({top:0}); }
function visibleList(){
  return Q.filter(q=>{
    if(filter==="all") return true;
    const c = choiceOf(q.n);
    if(filter==="flagged") return flagOf(q.n);
    if(filter==="unanswered") return !c;
    if(filter==="missed") return submitted() && c !== q.answer;
    return true;
  }).map(q=>q.n);
}
function step(d){
  const list = visibleList(); const cur = Q[idx].n;
  if(filter==="all" || !list.length) return go(idx+d);
  const pos = list.indexOf(cur);
  let target;
  if(pos>=0) target = list[pos+d];
  else target = d>0 ? list.find(n=>n>cur) : list.slice().reverse().find(n=>n<cur);
  if(target!=null) go(target-1);
}

function computeResults(){
  const out = {score:0, total:N, answered:0, misses:[], unanswered:[], flagged:[], choices:{}, part:{1:[0,0],2:[0,0]}, diff:{}, week:{}, cat:{}, lab:{}};
  Q.forEach(q=>{
    const c = choiceOf(q.n), ok = c===q.answer;
    out.choices[q.n] = c;
    if(c) out.answered++; else out.unanswered.push(q.n);
    if(ok) out.score++; else out.misses.push(q.n);
    if(flagOf(q.n)) out.flagged.push(q.n);
    const add = (o,k)=>{ o[k]=o[k]||[0,0,[]]; o[k][1]++; if(ok) o[k][0]++; else o[k][2].push(q.n); };
    out.part[q.part][1]++; if(ok) out.part[q.part][0]++;
    if(q.part===1){ add(out.diff, q.difficulty); add(out.week, q.week); add(out.cat, q.blueprint_category); } else add(out.lab, q.blueprint_category.replace(/^Anatomy Lab:\s*/,''));
  });
  return out;
}
function doSubmit(){
  S.status = "submitted";
  const R = computeResults();
  const summary = {attempt:S.attempt, submitted:new Date().toISOString(), elapsed_s:Math.round(S.elapsed_s), score:R.score, total:N, answered:R.answered,
    misses:R.misses, unanswered:R.unanswered, flagged:R.flagged, choices:Object.fromEntries(Object.entries(R.choices).map(([k,v])=>[k,v||""]))};
  attempts["a"+S.attempt] = summary;
  put("attempts/a"+S.attempt, summary); writeState(true);
  view = "results"; filter = "all"; closeOverlay(); render(); window.scrollTo({top:0});
}
function doRetake(){
  S = {attempt:S.attempt+1, status:"in_progress", elapsed_s:0, started:null, mode:S.mode};
  idx = 0; ls("m2mock4.idx",0); view="exam"; filter="all";
  writeState(true); closeOverlay(); render(); window.scrollTo({top:0});
}

/* ---------- overlay ---------- */
const overlay = document.getElementById("overlay");
function closeOverlay(){ overlay.innerHTML=""; }
function confirmBox(title, body, okLabel, onOk){

  document.getElementById("dlg-no").onclick = closeOverlay;
  document.getElementById("dlg-ok").onclick = onOk;
  document.getElementById("scrim").onclick = e=>{ if(e.target.id==="scrim") closeOverlay(); };
  document.getElementById("dlg-ok").focus();
}
function zoom(src){
  overlay.innerHTML = '<div class="scrim lightbox" id="scrim"><img alt="Enlarged figure" src="'+esc(src)+'"></div>';
  document.getElementById("scrim").onclick = closeOverlay;
}

/* ---------- render ---------- */
const $main = document.getElementById("main"), $rail = document.getElementById("rail");
function paintMeters(){
  const ans = answeredCount();
  if(S.mode==="immediate" && !submitted()){
    const ok = Q.filter(q=>choiceOf(q.n)===q.answer).length;
    document.getElementById("m-ans-l").textContent = "Correct";
    document.getElementById("m-ans").innerHTML = '<span class="live">'+ok+'</span> / '+ans+(ans? ' · '+Math.round(100*ok/ans)+'%' : '');
  } else {
    document.getElementById("m-ans-l").textContent = "Answered";
    document.getElementById("m-ans").textContent = ans+" / "+N;
  }
  document.getElementById("m-time").textContent = showClock ? fmtTime(S.elapsed_s) : "show clock";
  document.getElementById("m-time-l").textContent = submitted() ? "Time used" : "Untimed";

  document.getElementById("mode-imm").setAttribute("aria-pressed", S.mode==="immediate");
  document.getElementById("mode-end").setAttribute("aria-pressed", S.mode!=="immediate");
  const bp = document.getElementById("b-pause"), bs = document.getElementById("b-submit");
  bp.hidden = !submitted();
  if(submitted()){
    bp.textContent = view==="results" ? "Review questions" : "Results";
    bs.textContent = "Retake";
    bs.className = "btn";
  } else {
    bs.textContent = S.mode==="immediate" ? "Finish & see results" : "Submit exam"; bs.className = "btn primary";
  }
