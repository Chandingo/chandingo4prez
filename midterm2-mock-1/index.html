it stays red: the cherry-red spot. Embolic CRAO often precedes a stroke, so these patients need a stroke workup.", "distractor_explanations": {"A": "Neovascular bleeding is proliferative diabetic retinopathy or wet AMD, not sudden painless whitening.", "B": "Sphingolipid storage (Tay-Sachs, Niemann-Pick) causes a cherry-red spot in children, not sudden loss in an older adult.", "D": "Drusen are the dry AMD finding.", "E": "Papilledema swells the disc; it doesn't whiten the retina."}, "source": "Wk5 packet p. 128 ('In CRAO the fovea appears red given the photoreceptors continue to get blood supply from the choroid, while the inner retinal cells have infarcted with subsequent swelling'); Retinal Disorders deck slide 11 (fundus photo, 'Cherry Red Spot').", "annotation": {"image": "qbank/midterm2-mock1-images/annotated/s-fundus-crao.png", "options": {"A": "not shown in this figure", "B": "not shown in this figure", "C": "Faculty label: 'Cherry Red Spot' (arrowed) on a CRAO fundus", "D": "not shown in this figure", "E": "not shown in this figure"}, "note": "On the slide a faculty red arrow points from the label 'Cherry Red Spot' to this spot. The arrow in the question is Claude-placed on the same spot because the slide's arrow isn't part of the photo.", "how": "Faculty slide with its label showing. Amber arrow = where the question placed it; amber box with star = the faculty label for that spot (the red arrow is the slide's own). The choices are mechanisms, so none is boxed.", "marked": [], "status": "built 2026-11-19 (Cowork): faculty source registered to the question crop (OpenCV SIFT + partial affine), label boxes from Tesseract OCR, hand-set where OCR missed"}}, {"id": "m2mk1-q33", "n": 33, "part": 1, "title": null, "stem": "A 45-year-old woman has had three attacks of spinning vertigo in 4 months, each lasting about 3 hours, with roaring tinnitus and fullness in her left ear. Her left-ear hearing worsens during attacks and has not fully recovered. What is the underlying abnormality?", "options": [{"letter": "A", "text": "Increased endolymphatic pressure (hydrops) in the inner ear"}, {"letter": "B", "text": "Otoconia displaced into a semicircular canal"}, {"letter": "C", "text": "Viral inflammation of the vestibular nerve"}, {"letter": "D", "text": "Ischemia in the anterior inferior cerebellar artery territory"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO8; Vestibular LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Recurrent attacks of vertigo lasting minutes to hours with tinnitus, aural fullness and fluctuating, progressive low-frequency sensorineural hearing loss is Ménière disease: increased endolymphatic pressure in the labyrinth.", "distractor_explanations": {"B": "Displaced otoconia (BPPV) cause seconds-long positional spells without hearing loss.", "C": "Vestibular neuritis causes one prolonged attack of vertigo without hearing loss.", "D": "AICA ischemia causes a single sudden, continuous attack, not recurrent 3-hour episodes."}, "source": "Wk5 packet p. 17 ('endolymphatic hydrops'), p. 35-36 and p. 48 (Vertigo LO8: 'Ménière disease as a cause of recurrent vertigo associated with increased endolymphatic pressure, tinnitus, and hearing loss'); Wk4 packet p. 33 (attacks '30 minutes to hours')."}, {"id": "m2mk1-q34", "n": 34, "part": 1, "title": null, "stem": "A 9-year-old boy has a nosebleed after picking his nose. The bleeding comes from the front of the nasal septum just inside the naris and stops with pressure. Which artery contributes to the plexus at this site?", "options": [{"letter": "A", "text": "Lesser palatine artery"}, {"letter": "B", "text": "Inferior alveolar artery"}, {"letter": "C", "text": "Posterior auricular artery"}, {"letter": "D", "text": "Lingual artery"}, {"letter": "E", "text": "Superior labial branch of the facial artery"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": null, "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal & Oral LO3", "difficulty": 1, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q13 (posterior epistaxis -> sphenopalatine artery): new case (anterior bleed in a child) and new ask (which artery forms the anterior plexus)", "explanation": "Most nosebleeds are anterior, from Kiesselbach's plexus on the anterior septum, where ethmoidal branches of the ophthalmic artery, the superior labial branch of the facial artery and sphenopalatine branches anastomose. Posterior bleeds come from the sphenopalatine artery.", "distractor_explanations": {"A": "The lesser palatine artery supplies the soft palate.", "B": "The inferior alveolar artery runs in the mandibular canal to the lower teeth.", "C": "The posterior auricular artery supplies the scalp behind the ear.", "D": "The lingual artery supplies the tongue and floor of the mouth."}, "source": "Wk4 packet p. 41-42 (LO3: 'Ethmoidal branches of the Ophthalmic aa, Superior labial branch of the Facial aa, and Sphenopalatine aa branches = Kisselbach's Plexus'); Lab 4 clinical correlations slide 4."}, {"id": "m2mk1-q35", "n": 35, "part": 1, "title": null, "stem": "A seated subject's head is turned briskly to the right. At the start of the turn, what happens to the right horizontal semicircular canal and the eyes?", "options": [{"letter": "A", "text": "Its hair cells hyperpolarize, the right vestibular nerve fires slower, and the eyes move slowly to the left"}, {"letter": "B", "text": "Its hair cells depolarize, the right vestibular nerve fires faster, and the eyes move slowly to the right"}, {"letter": "C", "text": "Its hair cells hyperpolarize, the right vestibular nerve fires slower, and the eyes move slowly to the right"}, {"letter": "D", "text": "Its hair cells depolarize, the right vestibular nerve fires faster, and the eyes move slowly to the left"}, {"letter": "E", "text": "Nothing changes, because the semicircular canals sense only linear acceleration"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": null, "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO3-4; Nystagmus LO1", "difficulty": 3, "format": "research scenario", "drug_item": null, "laterality": false, "reworks": null, "explanation": "When the head turns right, endolymph in the right horizontal duct lags and deflects the cupula toward the utricle, bending stereocilia toward the kinocilium: the right hair cells depolarize and right vestibular afferents fire faster (the left side is inhibited). Through the VOR (vestibular nuclei, MLF, CN VI and III) the eyes move slowly to the left to hold the image on the retina.", "distractor_explanations": {"A": "The canal on the side toward which the head turns is excited, not inhibited.", "B": "The VOR moves the eyes opposite to the head turn to keep the image still.", "C": "Both the canal response and the eye direction are reversed.", "E": "The canals sense angular (rotational) acceleration; the utricle and saccule sense linear acceleration."}, "source": "Wk5 packet p. 32-34 (cupula deflection by lagging endolymph; VOR: 'a head movement of 3 degrees to the left can be automatically nulled by movement of both eyes 3 degrees to the right'). Which canal is excited follows standard physiology (Nystagmus ILM LO1; the TopHat module isn't in the folder)."}, {"id": "m2mk1-q36", "n": 36, "part": 1, "title": null, "stem": "After a punch to the left eye, a 22-year-old has double vision when he looks up, cannot elevate the left eye fully, and has numbness of the left cheek and upper lip. CT shows a fracture of the orbital floor. Which muscle is most likely trapped?", "options": [{"letter": "A", "text": "Superior oblique"}, {"letter": "B", "text": "Inferior rectus"}, {"letter": "C", "text": "Lateral rectus"}, {"letter": "D", "text": "Superior rectus"}, {"letter": "E", "text": "Medial rectus"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO5", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "A blow-out fracture pushes the orbital floor (maxilla) into the maxillary sinus and can trap the inferior rectus, which then can't relax: upgaze is limited. Numbness of the cheek and upper lip comes from the infraorbital nerve in the floor.", "distractor_explanations": {"A": "The superior oblique lies along the superomedial orbit, far from the floor.", "C": "Lateral rectus entrapment would limit abduction (horizontal diplopia).", "D": "The superior rectus lies under the orbital roof.", "E": "The medial rectus is trapped in medial-wall (ethmoid) fractures, limiting horizontal gaze."}, "source": "Wk5 packet p. 132 ('Trauma. \"Blow out fracture\" causes orbital floor to capture inferior rectus'); Lab 4 clinical correlations slide 9 ('Orbit floor fractures ... R/O muscle entrapment: Inferior rectus')."}, {"id": "m2mk1-q37", "n": 37, "part": 1, "title": null, "stem": "A 52-year-old man with HIV has a year of unsteady, stomping gait. He stands steadily with his eyes open but sways and nearly falls when he closes them. Finger-to-nose testing is accurate with eyes open. Which laboratory evaluation is most appropriate?", "options": [{"letter": "A", "text": "Creatine kinase and aldolase"}, {"letter": "B", "text": "Acetylcholine receptor antibodies"}, {"letter": "C", "text": "Anti-Purkinje cell (paraneoplastic) antibodies"}, {"letter": "D", "text": "Serum ceruloplasmin"}, {"letter": "E", "text": "Serum vitamin B12 level and syphilis serology (VDRL)"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO9 (Cerebellum & Ataxia LO9)", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q1 (Romberg-positive wide-based gait -> proprioceptive etiology): new age/history and new ask (workup)", "explanation": "A stomping gait with a positive Romberg (steady with eyes open, falls with eyes closed) is sensory ataxia from loss of conscious proprioception. The course's dorsal-column causes are vitamin B12 deficiency and neurosyphilis (tabes dorsalis, now mainly with HIV), so the workup includes B12 and VDRL.", "distractor_explanations": {"A": "CK and aldolase look for muscle disease, which causes weakness, not a Romberg-positive stomping gait.", "B": "AChR antibodies test for myasthenia gravis (fatigable weakness), not proprioceptive loss.", "C": "Paraneoplastic anti-Purkinje antibodies cause cerebellar ataxia, which is unsteady with eyes open too.", "D": "Ceruloplasmin is for Wilson disease (tremor, dystonia, liver disease)."}, "source": "Wk4 packet p. 33-35 (LO9 sensory ataxia; 'Laboratory evaluations should include tests for syphilis (VDRL), vitamin B12 levels ... and metabolic assessment'; Romberg row of the ataxia table)."}, {"id": "m2mk1-q38", "n": 38, "part": 1, "title": null, "stem": "Aqueous humor is secreted by the ___ and leaves the eye mainly through the ___.", "options": [{"letter": "A", "text": "Choroid; trabecular meshwork and canal of Schlemm"}, {"letter": "B", "text": "Lens epithelium; uveoscleral route"}, {"letter": "C", "text": "Ciliary processes; central retinal vein"}, {"letter": "D", "text": "Ciliary processes; trabecular meshwork and canal of Schlemm"}, {"letter": "E", "text": "Iris; posterior chamber"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO2; Glaucoma LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The ciliary epithelium of the ciliary processes secretes aqueous into the posterior chamber. It flows through the pupil into the anterior chamber; about a third leaves by the uveoscleral route and the rest through the trabecular meshwork into Schlemm's canal.", "distractor_explanations": {"A": "The choroid nourishes the outer retina; it doesn't secrete aqueous.", "B": "The lens is avascular and doesn't secrete aqueous; the uveoscleral route carries about a third of outflow.", "C": "Aqueous doesn't drain into the central retinal vein.", "E": "The posterior chamber is where aqueous is secreted, not where it leaves."}, "source": "Wk5 packet p. 100 (Glaucoma notes: 'The ciliary epithelium ... is specialized as a secretory epithelium'; 'about a third ... (the uveoscleral route). The rest of it moves across the trabecular meshwork ... Schlemm's canal'); Eye & Retina deck p. 31."}, {"id": "m2mk1-q39", "n": 39, "part": 1, "title": null, "stem": "A 29-year-old woman with a right Bell palsy says that ordinary sounds, like dishes clattering, are painfully loud in her right ear. Paralysis of which muscle best explains this?", "options": [{"letter": "A", "text": "Tensor tympani"}, {"letter": "B", "text": "Tensor veli palatini"}, {"letter": "C", "text": "Stapedius"}, {"letter": "D", "text": "Posterior belly of the digastric"}, {"letter": "E", "text": "Levator veli palatini"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO2, LO9", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk5-ear-packet-p10-q2 (low-frequency hearing difficulty -> associated facial droop): reversed case (facial palsy -> hearing symptom) and new ask (muscle)", "explanation": "The acoustic reflex is 'VIII in, VII out': loud sound reaches the cochlear nuclei and superior olive, and facial motor neurons contract the stapedius in both ears to damp low-frequency sound. With a facial nerve lesion, the stapedius is paralyzed and sounds seem too loud (hyperacusis).", "distractor_explanations": {"A": "The tensor tympani is supplied by V3, which is intact in Bell palsy.", "B": "The tensor veli palatini (V3) tenses the palate and opens the auditory tube; it doesn't dampen sound.", "D": "The posterior belly of the digastric is supplied by CN VII but has no role in hearing.", "E": "The levator veli palatini (CN X) elevates the soft palate."}, "source": "Wk5 packet p. 8 ('The acoustic reflex is mediated by the stapedius ... The efferent limb of the acoustic reflex is the facial nerve'; Fig. 13 caption 'Individuals with damage to CN VII may complain of sounds being loud (Hyperacusis)')."}, {"id": "m2mk1-q40", "n": 40, "part": 1, "title": null, "stem": "A 67-year-old man has had continuous vertigo, vomiting and nystagmus for 6 hours, and he cannot hear finger rub in his left ear, which was normal yesterday. The head impulse test shows no corrective saccade. Occlusion of which artery best explains this?", "options": [{"letter": "A", "text": "Left anterior inferior cerebellar artery"}, {"letter": "B", "text": "Right anterior inferior cerebellar artery"}, {"letter": "C", "text": "Left posterior inferior cerebellar artery"}, {"letter": "D", "text": "Left superior cerebellar artery"}, {"letter": "E", "text": "Left posterior cerebral artery"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO6-7", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "New unilateral hearing loss with an acute vestibular syndrome is a central (HINTS+ 'plus') finding, and a normal head impulse is also central. The labyrinthine artery usually arises from the AICA, so AICA ischemia hits both the inner ear and central vestibular pathways: 'acute onset unilateral hearing loss is AICA stroke until proven otherwise.'", "distractor_explanations": {"B": "The hearing loss is on the left, and the labyrinthine artery to that ear comes from the left AICA.", "C": "PICA strokes cause vertigo and ataxia (often lateral medullary signs) without hearing loss.", "D": "The SCA supplies the superior cerebellum, not the inner ear.", "E": "The PCA supplies the occipital and medial temporal lobes and thalamus."}, "source": "Wk5 packet p. 44, 47-48 (HINTS+ table; 'AICA infarction ... the labyrinthine artery usually arises from the AICA circulation ... vertigo with unilateral hearing loss'); Wk4 packet p. 34."}, {"id": "m2mk1-q41", "n": 41, "part": 1, "title": null, "stem": "A 61-year-old man with poorly controlled hypertension has a sudden headache and becomes clumsy. CT shows a hemorrhage in the right cerebellar hemisphere. Which examination finding is most likely?", "options": [{"letter": "A", "text": "Overshoot and a lurching path on finger-to-nose testing with the left hand"}, {"letter": "B", "text": "Loss of vibration sense in the right foot"}, {"letter": "C", "text": "Weakness and hyperreflexia of the left arm"}, {"letter": "D", "text": "Overshoot and a lurching path on finger-to-nose testing with the right hand"}, {"letter": "E", "text": "Resting tremor of the right hand that stops with movement"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Hemisphere lesions produce dysmetria, dysdiadochokinesia and intention tremor on the same side as the lesion, because cerebellar output crosses twice (dentatothalamic, then corticospinal).", "distractor_explanations": {"A": "Cerebellar hemisphere signs are ipsilateral; left-hand dysmetria points to a left hemisphere lesion.", "B": "Vibration loss is a dorsal-column (sensory) sign, not cerebellar.", "C": "Contralateral UMN weakness points to the corticospinal tract above its decussation, not the cerebellum.", "E": "A resting tremor that stops with movement is the Parkinson pattern; cerebellar tremor appears with intention."}, "source": "Wk4 packet p. 29-31 ('cerebellar damage primarily affects the ipsilateral side'; dysmetria 'overshoot or undershoot on finger-to-nose'; hypertensive hemorrhage 'presents with acute ipsilateral ataxia')."}, {"id": "m2mk1-q42", "n": 42, "part": 1, "title": null, "stem": "A tumor in the deep white matter of the left parietal lobe destroys the superior (parietal) optic radiation. Which visual field defect is expected?", "options": [{"letter": "A", "text": "Right homonymous inferior quadrantanopia"}, {"letter": "B", "text": "Right homonymous superior quadrantanopia"}, {"letter": "C", "text": "Left homonymous inferior quadrantanopia"}, {"letter": "D", "text": "Right homonymous hemianopia with macular sparing"}, {"letter": "E", "text": "Bitemporal hemianopia"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO4", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": true, "reworks": "wk5-vfqa-s11 (right Meyer's loop -> left superior quadrantanopia): new side and other radiation (left parietal radiation)", "explanation": "Because the image is flipped on the retina, the superior (parietal) radiation carries the inferior visual field. A left parietal radiation lesion gives a right homonymous inferior quadrantanopia ('pie on the floor').", "distractor_explanations": {"B": "A superior quadrantanopia ('pie in the sky') comes from the inferior (temporal) radiation, Meyer's loop.", "C": "Left-hemisphere pathways carry the right visual field.", "D": "Macular-sparing hemianopia comes from a large occipital cortex lesion.", "E": "Bitemporal loss comes from the optic chiasm."}, "source": "Visual Fields deck p. 26 ('Superior optic radiation lesions cause homonymous inferior quadrantanopias'); VF Q&A pptx slide 12."}, {"id": "m2mk1-q43", "n": 43, "part": 1, "title": null, "stem": "A 62-year-old woman has 20-second spells of spinning when she rolls over in bed or looks up at a high shelf. Hearing is normal and she feels well between spells. Lying her back quickly with her head turned to the right brings on vertigo and upbeating torsional nystagmus. What is the best treatment?", "options": [{"letter": "A", "text": "High-dose oral corticosteroids"}, {"letter": "B", "text": "A low-salt diet with a diuretic"}, {"letter": "C", "text": "A canalith-repositioning maneuver such as the Epley or Semont Plus maneuver"}, {"letter": "D", "text": "Urgent MRI and stroke evaluation"}, {"letter": "E", "text": "Daily scopolamine patches for 6 months"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Dizziness & Vertigo", "topic": "Dizziness & Vertigo", "note": null, "blueprint_category": "Dizziness & Vertigo", "learning_objective": "Vertigo LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Brief positional vertigo with a positive Dix-Hallpike test (upbeating torsional nystagmus) is posterior-canal BPPV from otoconia displaced into the canal. It is treated by canalith repositioning (Epley, or the Semont Plus maneuver taught in the course).", "distractor_explanations": {"A": "Steroids are considered for vestibular neuritis (continuous vertigo for days), not BPPV.", "B": "Salt restriction and diuretics are for Ménière disease.", "D": "Brief, positional, triggered vertigo with a positive Dix-Hallpike is benign; HINTS+ and stroke workup are for continuous vertigo.", "E": "Vestibular suppressants don't fix displaced otoconia and slow central compensation."}, "source": "Wk5 packet p. 43-45 (LO4: Dix-Hallpike; 'posterior canal BPPV which is treated with the Epley maneuver'; 'the Semont Plus ...')."}, {"id": "m2mk1-q44", "n": 44, "part": 1, "title": null, "stem": "Which muscle tenses the soft palate and, together with the salpingopharyngeus, opens the pharyngotympanic tube during swallowing?", "options": [{"letter": "A", "text": "Levator veli palatini"}, {"letter": "B", "text": "Tensor veli palatini"}, {"letter": "C", "text": "Palatoglossus"}, {"letter": "D", "text": "Stylopharyngeus"}, {"letter": "E", "text": "Superior pharyngeal constrictor"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": null, "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx & Larynx LO2-3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The tensor veli palatini (V3) hooks around the pterygoid hamulus to tense the soft palate and, with the salpingopharyngeus, pulls open the pharyngotympanic tube during swallowing.", "distractor_explanations": {"A": "The levator elevates the soft palate to seal the nasopharynx (CN X).", "C": "The palatoglossus pulls the palate down onto the tongue.", "D": "The stylopharyngeus (CN IX) elevates and widens the pharynx.", "E": "The superior constrictor squeezes the bolus down the pharynx."}, "source": "Wk4 packet p. 59-62 ('The tensor veli palatini ... tenses the soft palate'; 'salpingopharyngeus also works with the tensor veli palatini to open the pharyngotympanic/auditory tube'; 'tightens (tensor veli palatine - CN V)')."}, {"id": "m2mk1-q45", "n": 45, "part": 1, "title": null, "stem": "Endolymph, which bathes the stereocilia of the hair cells in the membranous labyrinth, has an ionic composition most like that of:", "options": [{"letter": "A", "text": "Extracellular fluid (high Na+, low K+)"}, {"letter": "B", "text": "Cerebrospinal fluid"}, {"letter": "C", "text": "Plasma"}, {"letter": "D", "text": "Perilymph"}, {"letter": "E", "text": "Intracellular fluid (high K+, low Na+)"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Vestibular Anatomy & Neurophysiology", "topic": "Vestibular Anatomy & Neurophysiology", "note": null, "blueprint_category": "Vestibular Anatomy & Neurophysiology", "learning_objective": "Vestibular LO2", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Endolymph fills the membranous labyrinth and is high in K+ and low in Na+, like intracellular fluid; K+ influx through the stereocilia depolarizes the hair cells. Perilymph, in the bony labyrinth, resembles extracellular fluid and CSF.", "distractor_explanations": {"A": "Extracellular-type fluid is perilymph, in the bony labyrinth around the membranous labyrinth.", "B": "CSF is extracellular-type (high Na+); perilymph resembles it.", "C": "Plasma is high in Na+ and low in K+.", "D": "Perilymph is the high-Na+ fluid outside the membranous labyrinth."}, "source": "Wk5 packet p. 4 ('high [K+], low [Na+]'); Vestibular notes p. 31; Ear deck slide 15 ('Endolymph = High in K+')."}, {"id": "m2mk1-q46", "n": 46, "part": 1, "title": null, "stem": "A 27-year-old woman has double vision when she looks to the left. On left gaze, her left eye abducts with nystagmus but her right eye does not move past the midline. Right gaze is normal, and both eyes converge normally. Where is the lesion?", "options": [{"letter": "A", "text": "Left medial longitudinal fasciculus"}, {"letter": "B", "text": "Right abducens nucleus"}, {"letter": "C", "text": "Right medial longitudinal fasciculus"}, {"letter": "D", "text": "Left abducens nerve"}, {"letter": "E", "text": "Right oculomotor nerve"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": null, "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO6-7", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Internuclear ophthalmoplegia: on left gaze, the left abducens nucleus drives the left lateral rectus and sends interneuron axons up the right MLF to the right CN III medial rectus subnucleus. A right MLF lesion leaves the right eye unable to adduct on left gaze while convergence (which doesn't use the MLF) is spared. In a young woman, MS is the classic cause.", "distractor_explanations": {"A": "A left MLF lesion would stop the left eye adducting on right gaze.", "B": "An abducens nucleus lesion causes a gaze palsy of both eyes toward that side (right).", "D": "A left CN VI lesion would stop the left eye abducting.", "E": "A CN III palsy would also stop adduction during convergence and cause ptosis and a down-and-out eye."}, "source": "Wk5 packet p. 112 (EOM notes, LO2/LO6: 'Internuclear ophthalmoplegia ... ipsilateral lateral gaze is still intact. However, on this attempted ipsilateral gaze, the contralateral medial rectus will not fire'). No EOM slide deck in the folder; written from the packet."}, {"id": "m2mk1-q47", "n": 47, "part": 1, "title": null, "stem": "Striatal neurons that project to the structure indicated by the arrow mainly express which dopamine receptor, and what does dopamine do to them?", "options": [{"letter": "A", "text": "D2; dopamine inhibits them"}, {"letter": "B", "text": "D1; dopamine excites them"}, {"letter": "C", "text": "D2; dopamine excites them"}, {"letter": "D", "text": "D1; dopamine inhibits them"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock1-images/s-bg-gpe.png", "image_needed": true, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO1, LO5-6", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the external segment of the globus pallidus (GPe), lateral to the internal segment and medial to the putamen. Striatal neurons of the indirect pathway project to the GPe and carry D2 receptors; D2 is Gi-coupled, so nigral dopamine inhibits them and thereby favors movement.", "distractor_explanations": {"B": "D1 (Gs, excitatory) receptors are on direct-pathway neurons that project to the GPi and SNr, not to the GPe.", "C": "D2 receptors are Gi-coupled, so dopamine inhibits these neurons.", "D": "D1 receptors are Gs-coupled (excitatory) and sit on direct-pathway neurons."}, "source": "BG deck (4285501b) slide 8 (Nolte horizontal section; labels 'Globus pallidus external segment' / 'internal segment'); slide 21 ('D1 and D5 are Gs ... excitatory'; 'D2, D3 and D4 are Gi ... inhibitory'); packet BG LO5-6.", "annotation": {"image": "qbank/midterm2-mock1-images/annotated/s-bg-gpe.png", "options": {"A": "Arrowed structure: faculty label 'Globus pallidus external segment', target of the D2 (indirect-pathway) striatal neurons", "B": "D1 (direct-pathway) neurons project to the 'Globus pallidus internal segment', labeled just medial to the arrow", "C": "Receptor right, effect wrong (D2 is Gi-coupled)", "D": "Receptor wrong; D1 neurons go to GPi"}, "note": "The figure's other labels (putamen, GPi, internal capsule, thalamus) help orient the arrow; the choices are receptor/effect pairs, so the arrowed structure is starred.", "how": "Faculty slide with its labels showing (the question cropped them out). Amber arrow = where the question placed it; amber box with star = the faculty label whose leader ends at the arrow tip. The choices are receptor/effect pairs, so none is boxed.", "marked": [], "status": "built 2026-11-19 (Cowork): faculty source registered to the question crop (OpenCV SIFT + partial affine), label boxes from Tesseract OCR, hand-set where OCR missed"}}, {"id": "m2mk1-q48", "n": 48, "part": 1, "title": null, "stem": "A 34-year-old woman with bipolar disorder notices a fine tremor of both hands when she holds a cup or writes. It began a few weeks after she started a new medication. There is no tremor at rest. Which drug most likely caused it?", "options": [{"letter": "A", "text": "Haloperidol"}, {"letter": "B", "text": "Propranolol"}, {"letter": "C", "text": "Primidone"}, {"letter": "D", "text": "Lithium"}, {"letter": "E", "text": "Gabapentin"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO1-2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "Weekly Quiz #4 Q16 / wk4-gap-s7-case5 (bilateral action tremor -> essential tremor/propranolol): new case and new ask (drug cause)", "explanation": "Mood-stabilizing drugs such as lithium and valproic acid cause a high-frequency postural or kinetic tremor (an enhanced physiologic tremor), not a resting tremor.", "distractor_explanations": {"A": "Haloperidol and other dopamine blockers mimic the resting tremor of Parkinson disease.", "B": "Propranolol treats essential and physiologic tremor.", "C": "Primidone treats essential tremor.", "E": "Gabapentin is used for tremor on the course drug list, not a cause of it."}, "source": "Wk4 packet p. 84 (LO1 D: 'Mood disorder drugs such as lithium and valproic acid tend to cause high frequency postural or kinetic tremors'; 'Neuroleptics ... can mimic the resting tremor of Parkinson Disease'); p. 87 Table 1."}, {"id": "m2mk1-q49", "n": 49, "part": 1, "title": null, "stem": "A 19-year-old is struck in the eye by a racquetball. A photograph of the eye is shown. What is the finding?", "options": [{"letter": "A", "text": "Hypopyon"}, {"letter": "B", "text": "Chemosis"}, {"letter": "C", "text": "Corneal ulcer"}, {"letter": "D", "text": "Cataract"}, {"letter": "E", "text": "Hyphema"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock1-images/s-hyphema.png", "image_needed": true, "week": 5, "session_guess": "Basic Eye and Orbit Exam", "topic": "Basic Eye and Orbit Exam", "note": null, "blueprint_category": "Basic Eye and Orbit Exam", "learning_objective": "Eye Exam LO2", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Blood layering in the lower anterior chamber after trauma is a hyphema. It can impair vision and block aqueous drainage.", "distractor_explanations": {"A": "Hypopyon is a white layer of inflammatory cells in the anterior chamber (infection or inflammation).", "B": "Chemosis is fluid swelling of the conjunctiva.", "C": "A corneal ulcer is a white, opaque spot on the cornea with epithelial and Bowman's layer loss.", "D": "A cataract is a cloudy lens behind the pupil."}, "source": "Eye Exam deck (995161cb) slide 32 ('Hyphema: Collection of blood cells in AC; Trauma'); Wk5 packet p. 130.", "annotation": {"image": "qbank/midterm2-mock1-images/annotated/s-hyphema.png", "options": {"A": "Listed on the same slide (white layer of inflammatory cells); not in this photo", "B": "not shown in this figure", "C": "not shown in this figure", "D": "not shown in this figure", "E": "Shown (blood layering in the anterior chamber); faculty slide lists it as 'Hyphema ... Trauma'"}, "note": "Slide 32 pairs this photo with the hypopyon/hyphema definitions.", "how": "Faculty slide with the same photo. Green box = correct answer; red box = the other answer choice the slide lists. No arrow in the question.", "marked": ["A", "E"], "status": "built 2026-11-19 (Cowork): faculty source registered to the question crop (OpenCV SIFT + partial affine), label boxes from Tesseract OCR, hand-set where OCR missed"}}, {"id": "m2mk1-q50", "n": 50, "part": 1, "title": null, "stem": "A 52-year-old man has trouble hearing the phone with his left ear. With a 512-Hz tuning fork, the Weber test lateralizes to the right ear, and air conduction is louder than bone conduction in both ears. What is the most appropriate next step?", "options": [{"letter": "A", "text": "Tympanostomy tube placement in the left ear"}, {"letter": "B", "text": "MRI with contrast of the internal auditory canals and posterior fossa"}, {"letter": "C", "text": "CT of the temporal bone to look for ossicular fixation"}, {"letter": "D", "text": "Reassurance, because this is age-related hearing loss"}, {"letter": "E", "text": "Cerumen removal from the left ear"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO1, LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Weber lateralizing to the good (right) ear with a normal Rinne (air > bone) in both ears means a left sensorineural loss. An asymmetric sensorineural loss needs a contrast MRI of the internal auditory canal and posterior fossa to rule out a vestibular schwannoma (the course's term for an acoustic neuroma).", "distractor_explanations": {"A": "Tubes treat middle-ear effusion, a conductive loss; Rinne is normal here.", "C": "Ossicular fixation causes a conductive loss (Weber to the bad ear, bone > air), the opposite of this pattern.", "D": "Age-related loss is symmetric; an asymmetric sensorineural loss needs imaging.", "E": "Cerumen causes a conductive loss, with Weber toward the blocked ear."}, "source": "Wk5 packet p. 21 (Weber/Rinne interpretation: 'sensorineural hearing loss if the sound lateralizes to the \"good\" side'), p. 27-28 ('asymmetric sensorineural hea E": "Labeled 'Chorda tympani'"}, "note": "Panel B of the figure. The 'Tensor tympani: Tendon' leader also enters this panel; its tendon is not an answer choice.", "how": "Same faculty figure with its labels showing (the full labeled version). Green box = correct answer; red boxes = other answer choices the figure labels. Arrow redrawn where the question placed it.", "marked": ["A", "C", "D", "E"], "status": "built 2026-11-19 (Cowork): faculty source registered to the question crop (OpenCV SIFT + partial affine), label boxes from Tesseract OCR, hand-set where OCR missed"}}, {"id": "m2mk1-q59", "n": 59, "part": 2, "title": "Gross anatomy lab image: Ear", "stem": "Identify the muscle indicated by the arrow in this view of the medial wall of the middle ear.", "options": [{"letter": "A", "text": "Stapedius"}, {"letter": "B", "text": "Tensor tympani"}, {"letter": "C", "text": "Levator veli palatini"}, {"letter": "D", "text": "Tensor veli palatini"}, {"letter": "E", "text": "Salpingopharyngeus"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock1-images/lab-ear-3.png", "image_needed": true, "week": 5, "session_guess": "Anatomy Lab: Ear", "topic": "Ear", "note": null, "blueprint_category": "Anatomy Lab: Ear", "learning_objective": "Lab 4 (11/17) LO1", "difficulty": 1, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The arrow is on the tensor tympani, which lies in its bony canal above the pharyngotympanic tube; its tendon turns laterally to the handle of the malleus. It is supplied by V3.", "distractor_explanations": {"A": "The stapedius emerges as a tendon from the pyramidal eminence on the posterior wall.", "C": "The levator veli palatini lies below the auditory tube in the pharynx, not in the middle ear.", "D": "The tensor veli palatini is in the pharynx, hooking around the pterygoid hamulus.", "E": "The salpingopharyngeus descends from the audito <script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("exam-data").textContent);
const Q = DATA.questions.slice().sort((a,b)=>a.n-b.n);
const N = Q.length;
const byN = {}; Q.forEach(q=>byN[q.n]=q);
const imgSrc = q => q.image ? "images/" + q.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const annSrc = q => q.annotation && q.annotation.image ? "images/ann-" + q.annotation.image.split("/").pop().replace(/\.png$/i,".jpg") : null;
// explanation_image (Mock #5+): annotated figure shown only in feedback/review; same images/ + .png->.jpg mapping as question images
const explSrc = q => q.explanation_image ? "images/" + q.explanation_image.split("/").pop().replace(/\.png$/i,".jpg") : null;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const fmtTime = s => { s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? h+":"+pad(m)+":"+pad(x) : m+":"+pad(x); };

/* ---------- state ---------- */
let S = {attempt:1, status:"in_progress", elapsed_s:0, started:null, mode:"immediate"};
let showClock = ls("m2mock1.clock") !== false;
let allResp = {};          // docId -> {attempt,n,choice,flagged}
let attempts = {};         // "a1" -> summary
let idx = 0;
let view = "exam";         // exam | results
let filter = "all";
let db = null, sync = "connecting";

function ls(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function struckOf(n){ const r=resp(n); return new Set(r && Array.isArray(r.struck) ? r.struck : []); }
function hlOf(n){ const r=resp(n); return r && Array.isArray(r.hl) ? r.hl : []; }
const revealed = n => submitted() || (S.mode==="immediate" && !!choiceOf(n));
const savedIdx = ls("m2mock1.idx"); if(typeof savedIdx==="number" && savedIdx>=0 && savedIdx<N) idx = savedIdx;

const rid = n => "a"+S.attempt+"-q"+pad(n);
function resp(n){ return allResp[rid(n)] || null; }
function choiceOf(n){ const r=resp(n); return r && r.choice ? r.choice : null; }
function flagOf(n){ const r=resp(n); return !!(r && r.flagged); }
const submitted = () => S.status === "submitted";
function answeredCount(){ let c=0; Q.forEach(q=>{ if(choiceOf(q.n)) c++; }); return c; }

/* ---------- persistence ---------- */
const queues = {};
function put(path, body){
  if(!db){ localSave(); return Promise.resolve(); }
  setSync("saving");
  const p = (queues[path]||Promise.resolve()).then(()=>db.doc(path).set(body)).then(()=>{ if(queues[path]===p) setSync("saved"); }, e=>{ setSync("error", e && e.code); });
  queues[path] = p; return p;
}
function localSave(){ ls("m2mock1.local",{S, allResp, attempts}); }
function writeResp(n){
  const r = allResp[rid(n)];
  const q = byN[n];
  put("responses/"+rid(n), {attempt:S.attempt, n, qid:q.id, choice:r.choice||null, correct: r.choice? r.choice===q.answer : null, flagged:!!r.flagged,
    mode:S.mode, struck:Array.isArray(r.struck)?r.struck:[], hl:Array.isArray(r.hl)?r.hl:[], updated:new Date().toISOString()});
}
let stateTimer = null;
function writeState(now){
  clearTimeout(stateTimer);
  const go = ()=>put("exam/state", {attempt:S.attempt, status:S.status, mode:S.mode, elapsed_s:Math.round(S.elapsed_s), started:S.started, updated:new Date().toISOString()});
  if(now) go(); else stateTimer = setTimeout(go, 1500);
}
function setSync(s, code){
  sync = s; const el = document.getElementById("sync"); if(!el) return;
  el.className = "sync" + (s==="error" ? " warn" : "");
  el.textContent = s==="saving" ? "Saving…" : s==="saved" ? "Answers saved to this artifact" :
    s==="connecting" ? "Connecting…" : s==="local" ? "Saved in this browser" :
    "Last save failed"+(code?" ("+code+")":"")+". Keep going; the next answer retries.";
}

/* ---------- timer ---------- */
let last = Date.now();
setInterval(()=>{
  const now = Date.now(), dt = (now-last)/1000; last = now;
  if(!submitted() && S.started && document.visibilityState==="visible" && dt < 5) S.elapsed_s += dt;
  paintMeters();
}, 1000);
document.addEventListener("visibilitychange", ()=>{ last = Date.now(); if(document.visibilityState==="hidden" && S.started && !submitted()) writeState(true); });

/* ---------- actions ---------- */
function ensureResp(n){ const k=rid(n); if(!allResp[k]) allResp[k]={attempt:S.attempt,n,choice:null,flagged:false}; else allResp[k]=Object.assign({},allResp[k]); return allResp[k]; }
function choose(letter){
  if(submitted()) return;
  const q = Q[idx]; if(!q.options.some(o=>o.letter===letter)) return;
  if(revealed(q.n)) return;   // immediate feedback locks the first answer
  const r = ensureResp(q.n); r.choice = letter;
  if(Array.isArray(r.struck)) r.struck = r.struck.filter(x=>x!==letter);
  if(!S.started){ S.started = new Date().toISOString(); }
  writeResp(q.n); writeState(false); render();
}
function toggleFlag(){
  const q = Q[idx]; const r = ensureResp(q.n); r.flagged = !r.flagged;
  writeResp(q.n); render();
}
function toggleStrike(n, L){
  if(revealed(n)) return;
  const r = ensureResp(n); const s = new Set(Array.isArray(r.struck)?r.struck:[]);
  s.has(L)? s.delete(L) : s.add(L); r.struck = [...s].sort();
  writeResp(n); renderMain();
}
function setHL(n, ranges){ const r = ensureResp(n); r.hl = ranges; writeResp(n); renderMain(); }
function addHL(n, s, e){
  const all = hlOf(n).map(x=>x.slice()).concat([[s,e]]).sort((a,b)=>a[0]-b[0]);
  const out = [];
  all.forEach(r=>{ const last = out[out.length-1]; if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else out.push(r); });
  setHL(n, out);
}
function hlHTML(text, ranges){
  let h = "", pos = 0;
  ranges.forEach((r,i)=>{ const s=Math.max(pos,r[0]), e=Math.min(text.length,r[1]); if(e<=s) return;
    h += esc(text.slice(pos,s)) + '<mark data-h="'+i+'" title="Click to remove highlight">'+esc(text.slice(s,e))+'</mark>'; pos = e; });
  return h + esc(text.slice(pos));
}
function offsetIn(el, node, off){ const r = document.createRange(); r.selectNodeContents(el); r.setEnd(node, off); return r.toString().length; }
document.addEventListener("mouseup", ()=>setTimeout(()=>{
  const sel = window.getSelection(); if(!sel || !sel.rangeCount || sel.isCollapsed) return;
  const el = document.getElementById("stem"); if(!el) return;
  const rg = sel.getRangeAt(0);
  if(!el.contains(rg.startContainer) || !el.contains(rg.endContainer)) return;
  const s = offsetIn(el, rg.startContainer, rg.startOffset), e = offsetIn(el, rg.endContainer, rg.endOffset);
  sel.removeAllRanges();
  if(e > s) addHL(Q[idx].n, s, e);
}, 0));
function setMode(m){
  if(submitted() || S.mode===m) return;
  S.mode = m; writeState(true); render();
}
function go(i){ idx = Math.max(0, Math.min(N-1, i)); ls("m2mock1.idx", idx); if(view!=="exam") view="exam"; render(); window.scrollTo({top:0}); }
function visibleList(){
  return Q.filter(q=>{
    if(filter==="all") return true;
    const c = choiceOf(q.n);
    if(filter==="flagged") return flagOf(q.n);
    if(filter==="unanswered") return !c;
    if(filter==="missed") return submitted() && c !== q.answer;
    return true;
  }).map(q=>q.n);
}
function step(d){
  const list = visibleList(); const cur = Q[idx].n;
  if(filter==="all" || !list.length) return go(idx+d);
  const pos = list.indexOf(cur);
  let target;
  if(pos>=0) target = list[pos+d];
  else target = d>0 ? list.find(n=>n>cur) : list.slice().reverse().find(n=>n<cur);
  if(target!=null) go(target-1);
}

function computeResults(){
  const out = {score:0, total:N, answered:0, misses:[], unanswered:[], flagged:[], choices:{}, part:{1:[0,0],2:[0,0]}, diff:{}, week:{}, cat:{}, lab:{}};
  Q.forEach(q=>{
    const c = choiceOf(q.n), ok = c===q.answer;
    out.choices[q.n] = c;
    if(c) out.answered++; else out.unanswered.push(q.n);
    if(ok) out.score++; else out.misses.push(q.n);
    if(flagOf(q.n)) out.flagged.push(q.n);
    const add = (o,k)=>{ o[k]=o[k]||[0,0,[]]; o[k][1]++; if(ok) o[k][0]++; else o[k][2].push(q.n); };
    out.part[q.part][1]++; if(ok) out.part[q.part][0]++;
    if(q.part===1){ add(out.diff, q.difficulty); add(out.week, q.week); add(out.cat, q.blueprint_category); } else add(out.lab, q.blueprint_category.replace(/^Anatomy Lab:\s*/,''));
  });
  return out;
}
function doSubmit(){
  S.status = "submitted";
  const R = computeResults();
  const summary = {attempt:S.attempt, submitted:new Date().toISOString(), elapsed_s:Math.round(S.elapsed_s), score:R.score, total:N, answered:R.answered,
    misses:R.misses, unanswered:R.unanswered, flagged:R.flagged, choices:Object.fromEntries(Object.entries(R.choices).map(([k,v])=>[k,v||""]))};
  attempts["a"+S.attempt] = summary;
  put("attempts/a"+S.attempt, summary); writeState(true);
  view = "results"; filter = "all"; closeOverlay(); render(); window.scrollTo({top:0});
}
function doRetake(){
  S = {attempt:S.attempt+1, status:"in_progress", elapsed_s:0, started:null, mode:S.mode};
  idx = 0; ls("m2mock1.idx",0); view="exam"; filter="all";
  writeState(true); closeOverlay(); render(); window.scrollTo({top:0});
}

/* ---------- overlay ---------- */
const overlay = document.getElementById("overlay");
function closeOverlay(){ overlay.innerHTML=""; }
function confirmBox(title, body, okLabel, onOk){
  overlay.innerHTML = '<div class="scrim" id="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-h"><h3 id="dlg-h">'+esc(title)+'</h3><p>'+body+'</p><div class="row"><button class="btn" type="button" id="dlg-no">Keep working</button><button class="btn primary" type="button" id="dlg-ok">'+esc(okLabel)+'</button></div></div></div>';
  document.getElementById("dlg-no").onclick = closeOverlay;
  document.getElementById("dlg-ok").onclick = onOk;
  document.getElementById("scrim").onclick = e=>{ if(e.target.id==="scrim") closeOverlay(); };
  document.getElementById("dlg-ok").focus();
}
function zoom(src){
  overlay.innerHTML = '<div class="scrim lightbox" id="scrim"><img alt="Enlarged figure" src="'+esc(src)+'"></div>';
  document.getElementById("scrim").onclick = closeOverlay;
}

/* ---------- render ---------- */
const $main = document.getElementById("main"), $rail = document.getElementById("rail");
function paintMeters(){
  const ans = answeredCount();
  if(S.mode==="immediate" && !submitted()){
    const ok = Q.filter(q=>choiceOf(q.n)===q.answer).length;
    document.getElementById("m-ans-l").textContent = "Correct";
    document.getElementById("m-ans").innerHTML = '<span class="live">'+ok+'</span> / '+ans+(ans? ' · '+Math.round(100*ok/ans)+'%' : '');
  } else {
    document.getElementById("m-ans-l").textContent = "Answered";
    document.getElementById("m-ans").textContent = ans+" / "+N;
  }
  document.getElementById("m-time").textContent = showClock ? fmtTime(S.elapsed_s) : "show clock";
  document.getElementById("m-time-l").textContent = submitted() ? "Time used" : "Untimed";
  document.getElementById("modebox").hidden = submitted();
  document.getElementById("mode-imm").setAttribute("aria-pressed", S.mode==="immediate");
  document.getElementById("mode-end").setAttribute("aria-pressed", S.mode!=="immediate");
  const bp = document.getElementById("b-pause"), bs = document.getElementById("b-submit");
  bp.hidden = !submitted();
  if(submitted()){
    bp.textContent = view==="results" ? "Review questions" : "Results";
    bs.textContent = "Retake";
    bs.className = "btn";
  } else {
    bs.textContent = S.mode==="immediate" ? "Finish & see results" : "Submit exam"; bs.className = "btn primary";
  }
  document.getElementById("sub").textContent = "59 items · Wks 4–5 · Claude-written mock" + (S.attempt>1 ? " · attempt "+S.attempt : "");
}
document.getElementById("b-pause").onclick = ()=>{
  if(submitted()){ view = view==="results" ? "exam" : "results"; render(); window.scrollTo({top:0}); }
};
document.getElementById("m-clock").onclick = ()=>{ showClock = !showClock; ls("m2mock1.clock", showClock); paintMeters(); };
document.getElementById("mode-imm").onclick = ()=>setMode("immediate");
document.getElementById("mode-end").onclick = ()=>{
  if(S.mode==="immediate" && answeredCount()) confirmBox("Hide answers until the end?", "Answers you already checked will be hidden again until you submit. Your picks stay as they are.", "Switch", ()=>{ closeOverlay(); setMode("end"); });
  else setMode("end");
};
document.getElementById("b-submit").onclick = ()=>{
  if(submitted()){
    confirmBox("Start attempt "+(S.attempt+1)+"?", "Your attempt "+S.attempt+" score stays saved. The new attempt starts blank with the timer at 0:00.", "Start retake", doRetake);
  } else {
    const un = N-answeredCount(), fl = Q.filter(q=>flagOf(q.n)).length;
    const parts = [];
    if(un) parts.push("<b>"+un+"</b> unanswered (scored wrong)");
    if(fl) parts.push("<b>"+fl+"</b> flagged");
    confirmBox(S.mode==="immediate" ? "Finish this attempt?" : "Submit the exam?", (parts.length? "You have "+parts.join(" and ")+". " : "All "+N+" answered. ")+"Then you'll see your score by category and can review every question.", S.mode==="immediate" ? "Finish" : "Submit", doSubmit);
  }
};

function render(){ paintMeters(); renderRail(); if(view==="results" && submitted()) renderResults(); else { view="exam"; renderMain(); } }

const FLAG_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 15V1.5M3 2h8.5l-1.8 3.2L11.5 8.5H3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>';

function explImgBlock(q){
  const src = explSrc(q); if(!src) return "";
  const lines = String(q.explanation_image_legend||"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const rows = lines.map(t=>{ const m = t.match(/^([A-E★])\s*[:=.)]\s*(.*)$/);
    const cls = m ? (m[1]===q.answer||m[1]==="★" ? "k" : "d") : "n";
    return '<li>'+(m? '<span class="dot '+cls+'">'+esc(m[1])+'</span><span>'+esc(m[2])+'</span>' : '<span>'+esc(t)+'</span>')+'</li>'; }).join("");
  return '<div class="ann"><div class="ann-h">Annotated figure</div><img id="annimg" src="'+esc(src)+'" alt="Annotated figure for question '+q.n+'">'+
    (rows? '<ul>'+rows+'</ul>' : '')+'</div>';
}
function annBlock(q){
  if(q.explanation_image) return explImgBlock(q);
  const a = q.annotation, src = annSrc(q); if(!a || !src) return "";
  const lab = t => /^Labeled/.test(t);
  const rows = q.options.filter(o=>a.options && a.options[o.letter]).map(o=>{
    const t = a.options[o.letter], mk = a.marked ? a.marked.indexOf(o.letter)>=0 : lab(t), cls = o.letter===q.answer ? "k" : (mk ? "d" : "n");
    return '<li><span class="dot '+cls+'">'+o.letter+'</span><span>'+esc(t)+'</span></li>'; }).join("");
  return '<div class="ann"><div class="ann-h">Annotated figure</div><img id="annimg" src="'+esc(src)+'" alt="Annotated figure for question '+q.n+'">'+
    '<p class="how">'+esc(a.how||"")+'</p><ul>'+rows+'</ul>'+(a.note? '<p class="note">'+esc(a.note)+'</p>' : '')+'</div>';
}
function whyNot(q){
  const d = q.distractor_explanations; if(!d) return "";
  const rows = q.options.filter(o=>o.letter!==q.answer && d[o.letter]).map(o=>'<li><b>'+o.letter+'. '+esc(o.text)+'</b> — '+esc(d[o.letter])+'</li>').join("");
  return rows ? '<div class="whynot"><div class="whynot-h">Why the other choices are wrong</div><ul>'+rows+'</ul></div>' : "";
}
function renderMain(){
  const q = Q[idx], c = choiceOf(q.n), done = revealed(q.n);
  const src = imgSrc(q), struck = struckOf(q.n);
  const tags = [];
  if(q.part===2) tags.push('<span class="tag">Lab image</span>');
  if(q.thursday_11_5) tags.push('<span class="tag thu" title="Taught Thu 11/5">Thu 11/5 material</span>');
  if(done) tags.push('<span class="tag">'+esc(q.blueprint_category)+'</span>');
  let h = '<div class="qhead"><span class="qnum"><b>'+q.n+'</b>of '+N+'</span>'+tags.join("")+
    '<span class="spacer"></span><button class="btn flagbtn" type="button" id="b-flag" aria-pressed="'+flagOf(q.n)+'">'+FLAG_SVG+(flagOf(q.n)?"Flagged":"Flag")+'</button></div>';
  h += '<p class="stem" id="stem">'+hlHTML(q.stem, hlOf(q.n))+'</p>';
  if(src) h += '<figure class="figure"><img id="qimg" src="'+esc(src)+'" alt="Figure for question '+q.n+'"><figcaption>Tap the image to enlarge</figcaption></figure>';
  h += '<div class="opts" role="group" aria-label="Answer choices">';
  q.options.forEach(o=>{
    const cls = ["opt"];
    if(!done && c===o.letter) cls.push("sel");
    if(struck.has(o.letter)) cls.push("struck");
    if(done && o.letter===q.answer) cls.push("right");
    if(done && c===o.letter && c!==q.answer) cls.push("wrong");
    h += '<div class="optrow"><button type="button" class="'+cls.join(" ")+'" data-k="'+o.letter+'"'+(done?" disabled":"")+(done?"":' title="Right-click to cross out"')+'><span class="L">'+o.letter+'</span><span class="T">'+esc(o.text)+'</span></button></div>';
  });
  h += '</div>';
  if(done){
    const ok = c===q.answer;
    const v = !c ? '<span class="verdict bad">Unanswered.</span> Correct answer: '+q.answer
      : ok ? '<span class="verdict ok">Correct: '+q.answer+'</span>' : '<span class="verdict bad">You chose '+c+'.</span> Correct answer: '+q.answer;
    h += '<div class="explain"><div>'+v+'</div><p>'+esc(q.explanation)+'</p>'+annBlock(q)+whyNot(q)+'<dl>'+
      '<dt>Source</dt><dd>'+esc(q.source)+'</dd>'+
      '<dt>Objective</dt><dd>'+esc(q.learning_objective)+'</dd>'+
      '<dt>Item</dt><dd>Week '+q.week+' · faculty-style order '+q.difficulty+' · '+esc(q.format)+(q.drug_item? ' · drug: '+esc(q.drug_item):'')+'</dd>'+
      '<dt>Key</dt><dd>'+esc(q.answer_source)+'</dd></dl></div>';
  }
  h += '<div class="qnav"><button class="btn" type="button" id="b-prev"'+(idx===0?" disabled":"")+'>← Previous</button><button class="btn" type="button" id="b-next"'+(idx===N-1?" disabled":"")+'>Next →</button>'+
    (hlOf(q.n).length? '<button class="btn ghost" type="button" id="b-clearhl">Clear highlights</button>' : '')+
    '<span class="hint">'+(done? '<kbd>←</kbd> <kbd>→</kbd> move · <kbd>F</kbd> flag · select stem text to highlight' : '<kbd>A</kbd>–<kbd>E</kbd> answer · right-click an option to cross it out · select stem text to highlight · <kbd>←</kbd> <kbd>→</kbd> · <kbd>F</kbd> flag')+'</span></div>';
  $main.innerHTML = h;
  $main.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>choose(b.dataset.k);
    b.oncontextmenu = e=>{ e.preventDefault(); toggleStrike(q.n, b.dataset.k); };
  });
  $main.querySelectorAll(".stem mark").forEach(m=>m.onclick=()=>{
    const sel = window.getSelection(); if(sel && !sel.isCollapsed) return;
    const i = +m.dataset.h; setHL(q.n, hlOf(q.n).filter((_,j)=>j!==i));
  });
  const ch = document.getElementById("b-clearhl"); if(ch) ch.onclick = ()=>setHL(q.n, []);
  document.getElementById("b-flag").onclick = toggleFlag;
  document.getElementById("b-prev").onclick = ()=>step(-1);
  document.getElementById("b-next").onclick = ()=>step(1);
  const im = document.getElementById("qimg"); if(im) im.onclick = ()=>zoom(src);
  const ai = document.getElementById("annimg"); if(ai) ai.onclick = ()=>zoom(explSrc(q) || annSrc(q));
}

function renderRail(){
  const done = submitted(), list = new Set(visibleList());
  const cell = q => {
    const c = choiceOf(q.n), cls=["cell"];
    if(revealed(q.n)) cls.push(c===q.answer ? "ok" : "bad");
    else if(done) cls.push("skip");
    else if(c) cls.push("ans");
    if(flagOf(q.n)) cls.push("flg");
    if(view==="exam" && Q[idx].n===q.n) cls.push("cur");
    if(!list.has(q.n)) cls.push("dim");
    return '<button type="button" class="'+cls.join(" ")+'" data-i="'+(q.n-1)+'" aria-label="Question '+q.n+'">'+q.n+'</button>';
  };
  const fl = done ? ["all","missed","flagged","unanswered"] : ["all","flagged","unanswered"];
  const lab = {all:"All",missed:"Missed",flagged:"Flagged",unanswered:"Unanswered"};
  let h = '<div><p class="rail-h">Show</p><div class="filters">'+fl.map(f=>'<button type="button" class="chip" data-f="'+f+'" aria-pressed="'+(filter===f)+'">'+lab[f]+'</button>').join("")+'</div></div>';
  h += '<div><p class="rail-h">Session items · 1–50</p><div class="grid">'+Q.filter(q=>q.part===1).map(cell).join("")+'</div></div>';
  h += '<div><p class="rail-h">Lab image items · 51–59</p><div class="grid">'+Q.filter(q=>q.part===2).map(cell).join("")+'</div></div>';
  h += '<div class="legend">'+(done
      ? '<span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Wrong</span><span><i style="border:1px dashed var(--bad)"></i>Blank</span>'
      : S.mode==="immediate" ? '<span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>Correct</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Wrong</span><span><i></i>Open</span>'
      : '<span><i style="background:var(--accent-soft)"></i>Answered</span><span><i></i>Open</span>')+
    '<span><i style="background:var(--flag);border-color:var(--flag);border-radius:50%"></i>Flagged</span></div>';
  if(done) h += '<button type="button" class="btn" id="b-results"'+(view==="results"?" disabled":"")+'>View results</button>';
  h += '<div class="sync" id="sync"></div>';
  $rail.innerHTML = h;
  $rail.querySelectorAll(".cell").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  $rail.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ filter=b.dataset.f; const l=visibleList(); if(l.length && view==="exam" && !l.includes(Q[idx].n)) { idx=l[0]-1; } render(); });
  const br = document.getElementById("b-results"); if(br) br.onclick=()=>{ view="results"; render(); window.scrollTo({top:0}); };
  setSync(sync);
}

function pct(a,b){ return b? Math.round(100*a/b) : 0; }
function renderResults(){
  const R = computeResults();
  const missChips = arr => arr.map(n=>'<button type="button" class="miss'+(choiceOf(n)?"":" skipd")+'" data-n="'+n+'" title="'+(choiceOf(n)?"Wrong":"Blank")+'">'+n+'</button>').join("");
  const barRows = (obj, label) => Object.keys(obj).sort().map(k=>{ const [a,b]=obj[k]; return '<span>'+label(k)+'</span><div class="track" role="img" aria-label="'+a+' of '+b+'"><div class="fill" style="width:'+pct(a,b)+'%"></div></div><span class="mono">'+a+'/'+b+' · '+pct(a,b)+'%</span>'; }).join("");
  const cats = Object.entries(R.cat).sort((x,y)=> (x[1][0]/x[1][1]) - (y[1][0]/y[1][1]) || y[1][1]-x[1][1] || x[0].localeCompare(y[0]));
  const avg = R.answered ? S.elapsed_s / R.answered : 0;
  let h = '<section class="results"><h2>'+R.score+' of '+N+' correct</h2><p class="sub">Attempt '+S.attempt+' · submitted '+(attempts["a"+S.attempt]? new Date(attempts["a"+S.attempt].submitted).toLocaleString([], {weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "")+' · keys are Claude-written, checked against the cited course source</p>';
  h += '<div class="score">'+
    '<div class="stat lead"><small>Overall</small><span class="mono">'+pct(R.score,N)+'%<em>'+R.score+'/'+N+'</em></span></div>'+
    '<div class="stat"><small>Session items</small><span class="mono">'+pct(R.part[1][0],R.part[1][1])+'%<em>'+R.part[1][0]+'/'+R.part[1][1]+'</em></span></div>'+
    '<div class="stat"><small>Lab image items</small><span class="mono">'+pct(R.part[2][0],R.part[2][1])+'%<em>'+R.part[2][0]+'/'+R.part[2][1]+'</em></span></div>'+
    '<div class="stat"><small>Time used</small><span class="mono">'+fmtTime(S.elapsed_s)+'<em>'+(avg? Math.round(avg)+'s / item':'')+'</em></span></div></div>';
  if(R.misses.length) h += '<p class="section-h">Missed and blank items · tap to review</p><div>'+missChips(R.misses)+'</div>';
  h += '<p class="section-h">Session items by faculty-style order</p><div class="bars">'+barRows(R.diff, k=>({1:"1 · first order",2:"2 · second order",3:"3 · third order"}[k]||k))+'</div>';
  h += '<p class="section-h">Session items by week</p><div class="bars">'+barRows(R.week, k=>"Week "+k)+'</div>';
  h += '<p class="section-h">Lab image items by region</p><div class="bars">'+barRows(R.lab, k=>k)+'</div>';
  h += '<p class="section-h">Session items by session · weakest first</p><div class="tbl-wrap"><table><thead><tr><th>Session</th><th>Score</th><th>Missed</th></tr></thead><tbody>'+
    cats.map(([k,[a,b,m]])=>'<tr><td>'+esc(k)+'</td><td class="num">'+a+'/'+b+'</td><td>'+(m.length? missChips(m) : '<span class="hint">none</span>')+'</td></tr>').join("")+'</tbody></table></div>';
  const prev = Object.values(attempts).filter(a=>a.attempt!==S.attempt).sort((a,b)=>a.attempt-b.attempt);
  if(prev.length) h += '<p class="section-h">Earlier attempts</p><ul class="hist">'+prev.map(a=>'<li>Attempt '+a.attempt+': '+a.score+'/'+a.total+' ('+pct(a.score,a.total)+'%) · '+fmtTime(a.elapsed_s)+'</li>').join("")+'</ul>';
  h += '</section>';
  $main.innerHTML = h;
  $main.querySelectorAll(".miss").forEach(b=>b.onclick=()=>{ filter="missed"; go(+b.dataset.n-1); });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(overlay.innerHTML){ if(e.key==="Escape") closeOverlay(); return; }
  if(view!=="exam") return;
  const k = e.key.toUpperCase();
  if(k==="ARROWRIGHT"||k==="J"){ step(1); e.preventDefault(); }
  else if(k==="ARROWLEFT"||k==="K"){ step(-1); e.preventDefault(); }
  else if(k==="F"){ toggleFlag(); }
  else if(/^[A-G]$/.test(k)){ choose(k); }
  else if(/^[1-7]$/.test(k)){ choose("ABCDEFG"[+k-1]); }
});

/* ---------- boot ---------- */
render();
(async ()=>{
  const use = window.claude && window.claude.use;
  db = use ? await window.claude.use("db").catch(()=>null) : null;
  if(!db){
    const L = ls("m2mock1.local");
    if(L && L.S){ S=L.S; allResp=L.allResp||{}; attempts=L.attempts||{}; }
    setSync("local"); render(); return;
  }
  const t = setTimeout(()=>{ if(sync==="connecting") setSync("error","no answer from the store yet"); }, 10000);
  let firstState = true;
  db.doc("exam/state").onSnapshot(snap=>{
    if(!snap.metadata.fromCache) { clearTimeout(t); if(sync==="connecting") setSync("saved"); }
    if(!snap.exists) { render(); return; }
    const d = snap.data();
    if(firstState && d.status==="submitted") view = "results";
    firstState = false;
    if(d.attempt !== S.attempt || d.status !== S.status){
      S = {attempt:d.attempt, status:d.status, elapsed_s:d.elapsed_s||0, started:d.started||null, mode:d.mode||"immediate"};
    } else {
      S.elapsed_s = Math.max(S.elapsed_s, d.elapsed_s||0);
      if(!S.started && d.started) S.started = d.started;
      if(d.mode && d.mode !== S.mode) S.mode = d.mode;
    }
    render();
  }, e=>{ clearTimeout(t); setSync("error", e.code); });
  db.collection("responses").onSnapshot(qs=>{
    const m = {}; qs.docs.forEach(d=>{ m[d.id]=d.data(); }); allResp = m; render();
  }, e=>setSync("error", e.code));
  db.collection("attempts").onSnapshot(qs=>{
    const m = {}; qs.docs.forEach(d=>{ m[d.id]=d.data(); }); attempts = m; render();
  }, e=>setSync("error", e.code));
})();
})();
</script>

<script>
/* Added for GitHub Pages: long-press an answer choice on a touch screen to strike it out. */
(function(){
  var t=null, fired=false, touching=false, sx=0, sy=0;
  document.addEventListener("touchstart", function(e){
    var b=e.target.closest && e.target.closest("[data-k]"); if(!b) return;
    fired=false; touching=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    t=setTimeout(function(){ t=null; fired=true; b.dispatchEvent(new MouseEvent("contextmenu",{bubbles:true,cancelable:true})); }, 550);
  }, {passive:true});
  document.addEventListener("touchmove", function(e){
    if(t && (Math.abs(e.touches[0].clientX-sx)>10 || Math.abs(e.touches[0].clientY-sy)>10)){ clearTimeout(t); t=null; }
  }, {passive:true});
  document.addEventListener("touchend", function(e){ touching=false; if(t){ clearTimeout(t); t=null; } if(fired){ e.preventDefault(); fired=false; } });
  /* Android fires its own contextmenu on long-press: let exactly one strike happen per press. */
  document.addEventListener("contextmenu", function(e){
    if(!e.isTrusted || !touching) return;
    if(fired){ e.preventDefault(); e.stopPropagation(); return; }
    if(t){ clearTimeout(t); t=null; fired=true; }
  }, true);
})();
</script>
