<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: sticky exam bar; question column (serif stems, like a printed exam) + item navigator rail; rail drops below on phones. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#15202b; --muted:#5a6976; --line:#d3dce3;
  --accent:#1d5f8a; --accent-ink:#ffffff; --accent-soft:#dfebf4;
  --flag:#a86a12; --ok:#21764a; --ok-soft:#e1f1e8; --bad:#b1352d; --bad-soft:#f7e2e0;
  --hl:#fbe68a; --hl-ink:#15202b;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151e27; --ink:#e3e9ee; --muted:#93a2ae; --line:#283541;
  --accent:#6db3df; --accent-ink:#0b1620; --accent-soft:#183245;
  --flag:#e3aa4f; --ok:#5ec48b; --ok-soft:#153424; --bad:#ef7f75; --bad-soft:#3b1d1b; --hl:#6b5a14; --hl-ink:#fff6d6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-weight:600;font-size:16px;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:12.5px}
.meters{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.meter small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meter .mono{font-size:15px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 6px}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.qnum{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.qnum b{color:var(--ink);font-size:20px;font-weight:500;margin-right:4px}
.tag{font-size:11.5px;letter-spacing:.04em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.thu{border-color:var(--flag);color:var(--flag)}
.spacer{margin-left:auto}
.flagbtn{display:inline-flex;align-items:center;gap:6px}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag)}
.flagbtn svg{width:14px;height:14px}
.stem{font-family:var(--font-body);font-size:18px;line-height:1.6;max-width:68ch;margin:0 0 16px;cursor:text}
.stem mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px;cursor:pointer}
.stem mark:hover{text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:none;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.meter.clock{cursor:pointer;background:transparent;border:none;padding:0;font:inherit;color:inherit}
.live{color:var(--ok)}
.figure{margin:0 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:inline-block;max-width:100%}
.figure img{display:block;max-height:460px;width:auto;max-width:100%;border-radius:4px;cursor:zoom-in}
.ann{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ann-h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ann img{display:block;max-width:100%;max-height:620px;width:auto;border-radius:4px;cursor:zoom-in;background:#fff}
.ann .how{font-size:12.5px;color:var(--muted);margin:8px 0 6px}
.ann ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ann li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.ann .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 12px var(--font-mono);margin-top:1px}
.ann .dot.k{background:#169646}.ann .dot.d{background:#d63c32}.ann .dot.n{background:transparent;color:var(--muted);border:1px solid var(--line)}
.ann .note{font-size:13.5px;color:var(--muted);margin-top:8px}
.figure figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;max-width:72ch}
.optrow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-family:var(--font-body);font-size:16.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-family:var(--font-mono);font-size:13.5px;flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;margin-top:1px;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.struck .T{text-decoration:line-through;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .L{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:inherit}
.strike{flex:none;width:36px;border:1px solid transparent;background:transparent;border-radius:8px;color:var(--muted);font-size:13px}
.strike:hover{border-color:var(--line);color:var(--ink)}
.qnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.hint kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px}

.explain{margin-top:20px;max-width:72ch;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.explain .verdict{font-weight:600}
.explain .verdict.ok{color:var(--ok)} .explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;font-family:var(--font-body);font-size:16px;line-height:1.55}
.whynot-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.whynot ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--font-body);font-size:15px;line-height:1.5}
.whynot b{font-weight:600}
.explain dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.explain dt{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:2px}
.explain dd{margin:0}

/* rail */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside{position:static;max-height:none}}
.rail-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:4px}
.cell{position:relative;height:30px;border:1px solid var(--line);background:transparent;border-radius:5px;font-family:var(--font-mono);font-size:12px;color:var(--muted);padding:0}
.cell.ans{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell.skip{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.cell.flg::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--flag)}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.sync{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sync.warn{color:var(--flag)}

/* results */
.results h2{font-family:var(--font-body);font-weight:600;font-size:28px;margin:0 0 4px;text-wrap:balance}
.results .sub{color:var(--muted);margin:0 0 20px}
.score{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;min-width:140px;flex:1}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .mono{font-size:24px}
.stat .mono em{font-style:normal;font-size:14px;color:var(--muted);margin-left:6px}
.stat.lead{border-color:var(--accent)}
.section-h{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 8px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.track{height:10px;background:var(--bad-soft);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ok)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss{display:inline-block;font-family:var(--font-mono);font-size:12px;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 6px;margin:0 4px 4px 0;background:transparent}
.miss.skipd{border-style:dashed}
.hist{font-size:13px;color:var(--muted)}
.hist li{margin-bottom:2px}

/* dialog + lightbox */
.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-size:17px}
.dialog p{margin:0;color:var(--muted)}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.lightbox img{max-width:100%;max-height:calc(100vh - 60px);border-radius:6px;background:#fff;cursor:zoom-out}
@media (prefers-reduced-motion:no-preference){.opt,.cell,.btn{transition:border-color .12s,background-color .12s}}
</style>

: 12}, "keys_part1": {"A": 10, "B": 10, "C": 10, "D": 10, "E": 10}, "median_stem_words_part1": 35.0, "vignette_median_words": 39, "patient_framed_part1": 35, "drug_items": [14, 20, 22, 23, 27], "laterality_items": [4, 6, 7, 8, 9, 22, 40, 41, 42, 46, 50], "image_items": [11, 30, 32, 47, 49, 51, 52, 53, 54, 55, 56, 57, 58, 59], "reworked_items": [3, 9, 10, 15, 18, 19, 22, 23, 25, 28, 31, 34, 37, 39, 42, 48]}, "questions": [{"id": "m2mk1-q01", "n": 1, "part": 1, "title": null, "stem": "Years of heavy alcohol use can cause a wide-based, unsteady gait that persists when sober, while finger-to-nose testing and rapid alternating hand movements stay nearly normal. Degeneration of which region best explains this?", "options": [{"letter": "A", "text": "Lateral cerebellar hemispheres"}, {"letter": "B", "text": "Cerebellar vermis"}, {"letter": "C", "text": "Dorsal columns of the spinal cord"}, {"letter": "D", "text": "Substantia nigra"}, {"letter": "E", "text": "Primary motor cortex"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Ataxia", "topic": "Ataxia", "note": null, "blueprint_category": "Ataxia", "learning_objective": "Ataxia LO7", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Chronic alcohol use degenerates the vermis (midline cerebellum), giving gait and truncal ataxia with relatively preserved distal coordination.", "distractor_explanations": {"A": "Lateral hemisphere damage impairs limb coordination (dysmetria, dysdiadochokinesia), which is nearly normal here.", "C": "Dorsal-column disease gives a stomping, Romberg-positive sensory ataxia; nothing here points to it.", "D": "Nigral loss causes parkinsonism (bradykinesia, rigidity, resting tremor), not a wide-based gait with normal limbs.", "E": "Motor cortex lesions cause weakness, not ataxia with preserved limb coordination."}, "source": "Wk4 packet p. 30-31, 35 ('Chronic Alcohol Use: Leads to degeneration of the vermis and gait ataxia'; 'A wide-based gait with relatively preserved distal coordination suggests ... the cerebellar vermis')."}, {"id": "m2mk1-q02", "n": 2, "part": 1, "title": null, "stem": "A 64-year-old woman has 8 months of slurred speech and choking on liquids, and now weakness of her right hand. Her tongue is wasted with fasciculations, her jaw jerk is brisk, and sensation is normal. Which electrodiagnostic result would most support ALS?", "options": [{"letter": "A", "text": "A decremental response to slow repetitive nerve stimulation"}, {"letter": "B", "text": "A large increment in muscle response after 10 seconds of exercise"}, {"letter": "C", "text": "Fibrillation potentials and positive sharp waves in muscles of several body regions, with normal sensory nerve responses"}, {"letter": "D", "text": "Reduced sensory nerve action potentials in all four limbs"}, {"letter": "E", "text": "Slowed conduction velocities with conduction block"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Needle EMG in ALS shows active denervation (fibrillations, positive sharp waves) and chronic neurogenic changes across several regions, often in muscles not yet clearly weak, while sensory responses stay normal.", "distractor_explanations": {"A": "A decrement on repetitive stimulation is the myasthenia gravis pattern.", "B": "Post-exercise facilitation is the Lambert-Eaton pattern.", "D": "ALS spares sensory neurons; widespread sensory loss suggests a neuropathy.", "E": "Slowing with conduction block suggests a demyelinating neuropathy (e.g., multifocal motor neuropathy, CIDP)."}, "source": "Wk4 packet p. 107 (LO4 table: 'Needle EMG: Active denervation: fibrillation potentials and positive sharp waves ... Nerve conduction studies: Sensory responses are usually preserved')."}, {"id": "m2mk1-q03", "n": 3, "part": 1, "title": null, "stem": "Axons from the dentate nucleus leave the cerebellum through which structure on their way to the contralateral thalamus?", "options": [{"letter": "A", "text": "Superior cerebellar peduncle"}, {"letter": "B", "text": "Middle cerebellar peduncle"}, {"letter": "C", "text": "Inferior cerebellar peduncle"}, {"letter": "D", "text": "Juxtarestiform body"}, {"letter": "E", "text": "Cerebral peduncle"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO3-4", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": "wk4-worksheets wk4-cb-peduncles row 1 (superior peduncle, dentatorubrothalamic -> function): new ask (pathway -> peduncle)", "explanation": "The dentatorubrothalamic pathway leaves through the superior cerebellar peduncle, decussates in the caudal midbrain and reaches the contralateral VL thalamus, then motor cortex. Because the corticospinal tract crosses again, cerebellar signs are ipsilateral.", "distractor_explanations": {"B": "The middle peduncle carries pontocerebellar (afferent) fibers into the cerebellum.", "C": "The inferior peduncle mostly carries afferents (e.g., posterior spinocerebellar, olivocerebellar).", "D": "The juxtarestiform body carries vestibular connections, such as fastigial output to the vestibular nuclei.", "E": "The cerebral peduncle (crus cerebri) carries corticospinal and corticobulbar fibers in the midbrain."}, "source": "Cerebellum notes (wk4 deck 1feb0cd8) p. 42 pathway summary ('Superior | Efferent | Dentatorubrothalamic'); Wk4 packet Cerebellum LO3-4."}, {"id": "m2mk1-q04", "n": 4, "part": 1, "title": null, "stem": "A 63-year-old woman has a year of tremor in her right hand. Her examination is equivocal, so ioflupane (DaTscan) SPECT is ordered to separate Parkinson disease from essential tremor. Which result would support Parkinson disease?", "options": [{"letter": "A", "text": "Reduced uptake most marked in the caudate, with the putamen spared"}, {"letter": "B", "text": "Normal, symmetric striatal uptake"}, {"letter": "C", "text": "Reduced uptake, most marked in the posterior putamen, worse on the right"}, {"letter": "D", "text": "Reduced uptake in the dentate nuclei of the cerebellum"}, {"letter": "E", "text": "Reduced uptake, most marked in the posterior putamen, worse on the left"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hypokinetic Movement Disorders", "topic": "Hypokinetic Movement Disorders", "note": null, "blueprint_category": "Hypokinetic Movement Disorders", "learning_objective": "Hypokinetic LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Ioflupane binds the presynaptic dopamine transporter. In PD, uptake is lost most in the posterior putamen with relative caudate sparing, often asymmetric, matching the most affected side of the body (the left striatum for a right-sided tremor). Essential tremor gives a normal scan.", "distractor_explanations": {"A": "The PD pattern is the reverse: posterior putamen worst, caudate relatively spared.", "B": "A normal scan fits essential tremor and rules out PD.", "C": "Striatal loss is asymmetric toward the side opposite the more affected limbs, so right-hand symptoms point to the left striatum.", "D": "Ioflupane binds the dopamine transporter in the striatum; it doesn't image the cerebellum."}, "source": "Wk4 packet p. 72 (LO3: 'loss of uptake greatest in the posterior putamen and with relative sparing of the caudate, as well as often displaying asymmetric damage corresponding to the most affected side'); p. 85 (DaTscan normal in ET)."}, {"id": "m2mk1-q05", "n": 5, "part": 1, "title": null, "stem": "A 23-year-old man has 6 months of tremor and slurred speech. His liver enzymes are mildly elevated, and slit-lamp examination shows a brown ring at the edge of each cornea. Which laboratory finding is expected?", "options": [{"letter": "A", "text": "Expanded CAG repeat in the huntingtin gene"}, {"letter": "B", "text": "Low serum vitamin B12"}, {"letter": "C", "text": "Positive acetylcholine receptor antibodies"}, {"letter": "D", "text": "Low serum ceruloplasmin"}, {"letter": "E", "text": "Elevated serum creatine kinase"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": null, "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Movement disorder plus liver disease plus Kayser-Fleischer rings is Wilson disease: a genetic defect in copper handling, diagnosed by low serum ceruloplasmin and high urinary copper, with copper accumulating in the basal ganglia.", "distractor_explanations": {"A": "A CAG expansion means Huntington disease, which doesn't cause liver disease or corneal rings.", "B": "B12 deficiency causes sensory ataxia and neuropathy, not corneal rings.", "C": "AChR antibodies point to myasthenia gravis.", "E": "CK rises with muscle injury, not copper overload."}, "source": "Wk4 packet p. 80 (LO6: 'Wilson disease ... diagnosed by measuring serum ceruloplasmin levels, and urinary copper excretion'; Kayser-Fleisher rings on slit-lamp)."}, {"id": "m2mk1-q06", "n": 6, "part": 1, "title": null, "stem": "A small infarct confined to the right lateral lemniscus in the upper pons would most likely cause which change in hearing?", "options": [{"letter": "A", "text": "Deafness in the right ear"}, {"letter": "B", "text": "Deafness in the left ear"}, {"letter": "C", "text": "Loss of high frequencies in both ears"}, {"letter": "D", "text": "Loss of the acoustic reflex in the right ear only"}, {"letter": "E", "text": "No deafness in either ear"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO11", "difficulty": 3, "format": "direct", "drug_item": null, "laterality": true, "reworks": null, "explanation": "The cochlear nuclei project bilaterally, so at every level above them each ear is represented on both sides. A unilateral lesion of the lateral lemniscus, inferior colliculus, medial geniculate or auditory cortex doesn't cause deafness in either ear; at most it impairs sound localization.", "distractor_explanations": {"A": "Ipsilateral deafness comes from lesions of the cochlea, CN VIII or cochlear nuclei, not from pathways above them.", "B": "The lateral lemniscus carries input from both ears, so a unilateral lesion doesn't deafen the opposite ear either.", "C": "Tonotopic loss in both ears fits cochlear (hair cell) damage, not a unilateral brainstem tract lesion.", "D": "The acoustic reflex runs through the cochlear nuclei, superior olive and facial nucleus, below the lateral lemniscus, and is bilateral."}, "source": "Wk5 packet p. 7 (LO11: 'at all levels rostral to the cochlear nuclei each ear is represented bilaterally, and unilateral damage does not cause deafness of either ear')."}, {"id": "m2mk1-q07", "n": 7, "part": 1, "title": null, "stem": "A small midbrain infarct that destroys only the left trochlear nucleus produces which finding?", "options": [{"letter": "A", "text": "Weakness of the left superior oblique, with vertical double vision worst looking down and to the right"}, {"letter": "B", "text": "Weakness of the right lateral rectus, with horizontal double vision on looking right"}, {"letter": "C", "text": "A left eye that rests down and out, with ptosis and a dilated pupil"}, {"letter": "D", "text": "Weakness of the right superior oblique, with vertical double vision worst looking down and to the left"}, {"letter": "E", "text": "A right eye that fails to adduct on left gaze"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Extra-Ocular Movements & Oculomotion Neuropathies", "topic": "Extra-Ocular Movements & Oculomotion Neuropathies", "note": null, "blueprint_category": "Extra-Ocular Movements & Oculomotion Neuropathies", "learning_objective": "EOM LO1-2", "difficulty": 3, "format": "direct", "drug_item": null, "laterality": true, "reworks": null, "explanation": "The trochlear nerve is the only cranial nerve that crosses (dorsally, in the midbrain), so damage to the trochlear nucleus presents contralaterally. The right superior oblique depresses the eye most in adduction, so vertical diplopia is worst looking down and to the left (e.g., reading, stairs).", "distractor_explanations": {"A": "CN IV crosses after leaving its nucleus, so a nuclear lesion affects the opposite superior oblique.", "B": "The lateral rectus is CN VI.", "C": "Down-and-out with ptosis and mydriasis is a CN III palsy.", "E": "Failed adduction on lateral gaze is an MLF lesion (INO)."}, "source": "Wk5 packet p. 108 (LO2: 'damage to the nucleus for CN IV (trochlear) presents contralaterally'), p. 104-106 (superior oblique actions). No EOM slide deck in the folder; written from the packet."}, {"id": "m2mk1-q08", "n": 8, "part": 1, "title": null, "stem": "A 68-year-old woman with hypertension suddenly develops wild, flinging movements of her right arm and leg that she cannot suppress. Strength and sensation are normal. A small infarct in which structure most likely explains this?", "options": [{"letter": "A", "text": "Left subthalamic nucleus"}, {"letter": "B", "text": "Right subthalamic nucleus"}, {"letter": "C", "text": "Left substantia nigra pars compacta"}, {"letter": "D", "text": "Left caudate nucleus"}, {"letter": "E", "text": "Right cerebellar hemisphere"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO10-11; Hyperkinetic LO3", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": true, "reworks": null, "explanation": "Hemiballismus is the course's classic subthalamic nucleus lesion, usually a small vascular stroke (often a small PCA branch). Losing the STN's glutamate drive to the GPi reduces GPi inhibition of the thalamus on that side; through the ipsilateral cortex and crossed corticospinal tract, the movements appear on the opposite side of the body.", "distractor_explanations": {"B": "Basal ganglia output acts on the ipsilateral cortex and corticospinal tract, which crosses, so a right STN lesion causes left-sided movements.", "C": "Nigral (dopamine) loss reduces movement, as in Parkinson disease.", "D": "A small caudate infarct isn't the course's cause of hemiballismus; HD-type caudate loss gives bilateral chorea.", "E": "A right cerebellar lesion causes right-sided ataxia, not ballistic movements."}, "source": "Wk4 packet p. 75-76 ('Hemiballismus ... resulting from damage to the subthalamic nucleus'; 'most common cause ... a vascular stroke that includes the territory supplying the subthalamic nucleus')."}, {"id": "m2mk1-q09", "n": 9, "part": 1, "title": null, "stem": "A 71-year-old man with atrial fibrillation suddenly cannot see things to his right. He has a right homonymous hemianopia, but he can still read the eye chart with central vision. Which artery is most likely occluded?", "options": [{"letter": "A", "text": "Right posterior cerebral artery"}, {"letter": "B", "text": "Left posterior cerebral artery"}, {"letter": "C", "text": "Left middle cerebral artery, superior division"}, {"letter": "D", "text": "Left anterior choroidal artery"}, {"letter": "E", "text": "Left ophthalmic artery"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO3-4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": true, "reworks": "wk5-visual-fields-p30 (why macular sparing): new case and new ask (which artery)", "explanation": "The primary visual cortex is supplied mainly by the PCA, with MCA collaterals to the occipital pole where the macula is represented. An embolic left PCA occlusion gives a right homonymous hemianopia with macular sparing.", "distractor_explanations": {"A": "A right PCA stroke would take the left visual field.", "C": "The superior MCA division supplies frontal/parietal cortex (weakness, aphasia); it isn't the main supply of visual cortex.", "D": "The anterior choroidal supplies parts of the optic tract and LGN, which would give a hemianopia without macular sparing.", "E": "Ophthalmic artery occlusion causes monocular vision loss."}, "source": "Visual Fields deck p. 29 ('Visual cortex - primarily supplied by PCA, collateral circulation to the occipital pole by MCA'), p. 30 ('homonymous hemianopias with macular sparing')."}, {"id": "m2mk1-q10", "n": 10, "part": 1, "title": null, "stem": "A 58-year-old man with severe myopia sees a curtain spreading over his vision and is found to have a retinal detachment, in which the neural retina separates from the retinal pigment epithelium. These two layers develop from:", "options": [{"letter": "A", "text": "Neuroectoderm and surface ectoderm"}, {"letter": "B", "text": "Neural crest and mesoderm"}, {"letter": "C", "text": "The inner and outer layers of the optic cup, both neuroectoderm"}, {"letter": "D", "text": "Surface ectoderm and neural crest"}, {"letter": "E", "text": "Mesoderm and neuroectoderm"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO6", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk5-eye-retina-p42 (embryology -> between which layers detachment occurs): new ask (embryologic origin of the separated layers)", "explanation": "The optic vesicle grows out of the forebrain (neuroectoderm) and folds into the double-layered optic cup: the inner layer becomes the neural retina and the outer layer the RPE. The potential space between them is where the retina detaches.", "distractor_explanations": {"A": "Surface ectoderm forms the lens and corneal epithelium, not the RPE.", "B": "Neural crest forms the cornea, sclera, iris and choroid stroma; mesoderm forms the extraocular muscles.", "D": "Neither layer comes from surface ectoderm or neural crest.", "E": "Mesoderm forms the extraocular muscles."}, "source": "Wk5 packet p. 62 ('The inner layer of the optic cup ... becomes the neural layer of the retina'; 'The outer layer of the optic cup differentiates into the retinal pigment epithelium'); Eye & Retina deck p. 42."}, {"id": "m2mk1-q11", "n": 11, "part": 1, "title": null, "stem": "A 66-year-old woman's visual fields are shown (left eye, right eye; black = lost). Where is the lesion?", "options": [{"letter": "A", "text": "Right primary visual cortex, upper bank of the calcarine sulcus"}, {"letter": "B", "text": "Left primary visual cortex, lower bank of the calcarine sulcus"}, {"letter": "C", "text": "Right Meyer's loop (inferior optic radiation)"}, {"letter": "D", "text": "Right primary visual cortex, lower bank of the calcarine sulcus"}, {"letter": "E", "text": "Right optic tract"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock1-images/s-vf-quadrant.png", "image_needed": true, "week": 5, "session_guess": "Visual Fields & Deficits", "topic": "Visual Fields & Deficits", "note": null, "blueprint_category": "Visual Fields & Deficits", "learning_objective": "Visual Fields LO4", "difficulty": 3, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The fields show a left homonymous superior quadrantanopia with macular sparing. Left field = right hemisphere; superior field = inferior fibers and lower bank of the calcarine sulcus; macular sparing points to the cortex rather than the radiation. So the lesion is the right lower bank (lingual gyrus).", "distractor_explanations": {"A": "The upper bank (cuneus) holds the inferior visual field; its loss gives an inferior quadrantanopia.", "B": "Left visual cortex holds the right visual field.", "C": "Meyer's loop lesions give a superior quadrantanopia without macular sparing.", "E": "An optic tract lesion gives a complete homonymous hemianopia."}, "source": "Visual Fields deck (18cbc48f) p. 32 ('Right lower bank -> Left homonymous superior quadrantanopia w/macular sparing'; 'A lower bank lesion = contralateral homonymous superior quadrantanopia with macular sparing'); p. 26.", "annotation": {"image": "qbank/midterm2-mock1-images/annotated/s-vf-quadrant.png", "options": {"A": "Faculty label: 'Right upper bank' (the other field pair on the slide)", "B": "not shown in this figure", "C": "not shown in this figure", "D": "Faculty label: 'Right lower bank' (this field pair)", "E": "not shown in this figure"}, "note": "The slide shows two field pairs: right upper bank -> left inferior quadrantanopia with macular sparing, and right lower bank -> left superior quadrantanopia with macular sparing (the one in the question).", "how": "Faculty slide with its labels showing. Green box = correct answer; red box = the other answer choice the slide labels. The question showed the lower field pair.", "marked": ["A", "D"], "status": "built 2026-11-19 (Cowork): faculty source registered to the question crop (OpenCV SIFT + partial affine), label boxes from Tesseract OCR, hand-set where OCR missed"}}, {"id": "m2mk1-q12", "n": 12, "part": 1, "title": null, "stem": "An hour after entering a dark movie theater, a 64-year-old woman has severe right eye pain, headache, nausea and halos around lights. The eye is red, the cornea hazy, and the pupil mid-dilated and fixed. What is the mechanism?", "options": [{"letter": "A", "text": "The trabecular meshwork slowly loses permeability while the angle stays open"}, {"letter": "B", "text": "The ciliary processes overproduce aqueous humor"}, {"letter": "C", "text": "The peripheral iris pushes against the trabecular meshwork, closing the iridocorneal angle and blocking aqueous outflow"}, {"letter": "D", "text": "The central retinal artery is occluded"}, {"letter": "E", "text": "The optic nerve is inflamed"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Glaucoma", "topic": "Glaucoma", "note": null, "blueprint_category": "Glaucoma", "learning_objective": "Glaucoma LO2", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Pupil dilation in the dark can let the peripheral iris close a narrow angle. Aqueous can't drain, pressure rises sharply, and acute angle-closure glaucoma follows: pain, red eye, corneal edema and a mid-dilated, fixed pupil. Vision can be lost within hours.", "distractor_explanations": {"A": "Gradually reduced meshwork permeability is open-angle glaucoma, which is painless and slow.", "B": "Glaucoma is an outflow problem; aqueous overproduction isn't the mechanism.", "D": "CRAO causes sudden painless vision loss with a cherry-red spot.", "E": "Optic neuritis causes pain with eye movement and vision loss, not a red eye with a fixed mid-dilated pupil."}, "source": "Wk5 packet p. 100 (Glaucoma notes, LO2: 'If some process causes the peripheral iris to push up against the trabecular meshwork, obliterating the irido-corneal angle ... painful angle-closure glaucoma results'; hallmarks incl. corneal edema and 'mid-dilated and fixed pupil'). No Glaucoma slide deck in the folder; written from the packet."}, {"id": "m2mk1-q13", "n": 13, "part": 1, "title": null, "stem": "First-order taste neurons supplying taste buds on the anterior two-thirds of the tongue have their cell bodies in which ganglion?", "options": [{"letter": "A", "text": "Trigeminal ganglion"}, {"letter": "B", "text": "Geniculate ganglion"}, {"letter": "C", "text": "Inferior ganglion of the glossopharyngeal nerve"}, {"letter": "D", "text": "Submandibular ganglion"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Taste and Smell", "topic": "Taste and Smell", "note": null, "blueprint_category": "Taste and Smell", "learning_objective": "Taste & Smell LO5", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Taste from the anterior two-thirds travels in the chorda tympani (CN VII), whose sensory cell bodies are in the geniculate ganglion; central processes run in the solitary tract to the rostral nucleus of the solitary tract, then VPM, then insula.", "distractor_explanations": {"A": "The trigeminal ganglion holds general-sensation neurons of the lingual nerve (V3), not taste.", "C": "The inferior ganglion of CN IX holds taste neurons for the posterior third.", "D": "The submandibular ganglion is a parasympathetic ganglion for salivary secretion."}, "source": "Wk5 packet p. 97 ('The first-order taste neurons ... have cell bodies in the ganglia of cranial nerves VII, IX, and X ... geniculate ganglia [VII], inferior & superior ganglia [IX and X]')."}, {"id": "m2mk1-q14", "n": 14, "part": 1, "title": null, "stem": "A 76-year-old woman has 2 weeks of wavy, distorted central vision in her left eye. Examination shows new vessels growing beneath the macula with fluid and blood. She begins monthly intravitreal injections of ranibizumab. How does this drug work?", "options": [{"letter": "A", "text": "It is a prostaglandin FP receptor agonist"}, {"letter": "B", "text": "It inhibits carbonic anhydrase in the ciliary epithelium"}, {"letter": "C", "text": "It is a beta-adrenergic receptor antagonist"}, {"letter": "D", "text": "It is a monoclonal antibody against complement component C5"}, {"letter": "E", "text": "It is a monoclonal antibody that binds vascular endothelial growth factor"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": null, "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal Disorders LO2; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Ranibizumab", "laterality": false, "reworks": null, "explanation": "Neovascular (wet) AMD is driven by VEGF. Ranibizumab and bevacizumab are monoclonal antibodies that bind VEGF; aflibercept is a decoy-receptor fusion protein and pegaptanib an aptamer. Injected into the vitreous, they slow new vessel growth and can improve vision.", "distractor_explanations": {"A": "FP agonists (latanoprost, bimatoprost) lower eye pressure by increasing uveoscleral outflow.", "B": "Carbonic anhydrase inhibitors (acetazolamide) reduce aqueous secretion in glaucoma.", "C": "Beta blockers (timolol) reduce aqueous secretion in glaucoma.", "D": "Anti-C5 antibody is eculizumab, used in myasthenia gravis."}, "source": "Drug list (Exam 2, Ocular pharmacology): Bevacizumab, Ranibizumab, 'Monoclonal antibody that inhibits Vascular endothelial growth factor (VEGF)'; Wk5 packet p. 128 (anti-VEGF treatment of ARMD)."}, {"id": "m2mk1-q15", "n": 15, "part": 1, "title": null, "stem": "A 60-year-old man is unresponsive after a cardiac arrest. When ice water is irrigated into his right ear with the head raised 30°, both eyes deviate slowly to the right and stay there, with no fast phase. What does this indicate?", "options": [{"letter": "A", "text": "The vestibular nuclei and their connections to CN III and VI are intact, but the system that generates the fast phase is not working"}, {"letter": "B", "text": "The right vestibular nerve is destroyed"}, {"letter": "C", "text": "The right medial longitudinal fasciculus is destroyed"}, {"letter": "D", "text": "Brain death"}, {"letter": "E", "text": "He is awake and feigning unresponsiveness"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Nystagmus", "topic": "Nystagmus", "note": null, "blueprint_category": "Nystagmus", "learning_objective": "Nystagmus LO4", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk5-vestibular-s28-q1/q2 (cold water left ear, awake: slow phase then fast phase): new case (comatose patient, right ear) and new ask (what a slow phase alone means)", "explanation": "Cold water in the right ear inhibits the right horizontal canal, so the eyes drift slowly toward the cold ear (right). The corrective fast phase depends on a functioning reticular formation and arousal, so a comatose patient with an intact brainstem shows only the tonic slow deviation. No movement suggests brainstem failure.", "distractor_explanations": {"B": "With a destroyed right vestibular nerve, cold water in that ear would produce no eye movement at all.", "C": "An MLF lesion would stop the left eye adducting, giving a disconjugate response.", "D": "In brain death there is no eye movement to caloric testing.", "E": "An awake patient would show nystagmus with a fast phase to the left (cold, opposite)."}, "source": "Wk5 packet p. 34 ('The fast phase of nystagmus depends on a functioning reticular formation, so someone in a coma may show only the slow phase'); Vestibular deck slide 29 (COWS). Nystagmus ILM is a TopHat module not in the folder; written from the packet LOs and the Vestibular notes."}, {"id": "m2mk1-q16", "n": 16, "part": 1, "title": null, "stem": "An infarct confined to the superior surface of one cerebellar hemisphere, the superior vermis and the deep cerebellar nuclei, with the medulla spared, is most likely caused by occlusion of which artery?", "options": [{"letter": "A", "text": "Posterior inferior cerebellar artery"}, {"letter": "B", "text": "Anterior inferior cerebellar artery"}, {"letter": "C", "text": "Posterior cerebral artery"}, {"letter": "D", "text": "Superior cerebellar artery"}, {"letter": "E", "text": "Anterior spinal artery"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Cerebellum & Circuitry", "topic": "Cerebellum & Circuitry", "note": null, "blueprint_category": "Cerebellum & Circuitry", "learning_objective": "Cerebellum LO5", "difficulty": 2, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The SCA arises from the top of the basilar artery and supplies the anterior and upper posterior lobes, the deep nuclei and the superior vermis. AICA takes the anterior-inferior cerebellum and PICA the posterior-inferior cerebellum (and often the lateral medulla).", "distractor_explanations": {"A": "PICA supplies the posterior-inferior cerebellum and often the lateral medulla, which is spared here.", "B": "AICA supplies the anterior-inferior cerebellum and lateral pons (with the inner ear), not the superior surface.", "C": "The PCA supplies the occipital and medial temporal lobes and thalamus, not the cerebellum.", "E": "The anterior spinal artery supplies the medial medulla and anterior cord."}, "source": "Wk4 packet p. 28 (LO5: 'The anterior and upper posterior lobes, deep nuclei and superior part of the vermis are supplied by the SCA')."}, {"id": "m2mk1-q17", "n": 17, "part": 1, "title": null, "stem": "After a thyroidectomy, a 44-year-old singer speaks normally but can no longer reach high notes, and her voice tires quickly. Laryngoscopy shows that both vocal folds abduct and adduct normally. Which nerve was most likely injured?", "options": [{"letter": "A", "text": "Internal branch of the superior laryngeal nerve"}, {"letter": "B", "text": "Recurrent laryngeal nerve"}, {"letter": "C", "text": "Glossopharyngeal nerve"}, {"letter": "D", "text": "Hypoglossal nerve"}, {"letter": "E", "text": "External branch of the superior laryngeal nerve"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Pharynx & Larynx", "topic": "Pharynx & Larynx", "note": null, "blueprint_category": "Pharynx & Larynx", "learning_objective": "Pharynx & Larynx LO5, LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The cricothyroid tilts the thyroid cartilage forward to tense the vocal ligaments and raise pitch. It is the only intrinsic laryngeal muscle supplied by the external laryngeal nerve, which runs close to the superior thyroid artery and can be injured in thyroid surgery.", "distractor_explanations": {"A": "The internal branch is sensory to the larynx above the vocal folds; its loss impairs the cough reflex, not pitch.", "B": "RLN injury paralyzes the other intrinsic muscles, so a vocal fold wouldn't move normally (hoarseness).", "C": "CN IX supplies the stylopharyngeus and pharyngeal sensation, not the laryngeal muscles.", "D": "CN XII moves the tongue."}, "source": "Wk4 packet p. 64 (cricothyroid 'resulting in a higher pitch'), p. 66 (LO7: 'The superior laryngeal nerve gives off the external laryngeal nerve to the cricothyroid muscle (controls pitch)'); Lab 4 clinical correlations slide 8."}, {"id": "m2mk1-q18", "n": 18, "part": 1, "title": null, "stem": "A newborn fails the otoacoustic emission screening test in the left ear twice; the ear canal is clear and the middle ear is normal. Dysfunction of which cells most likely explains the result?", "options": [{"letter": "A", "text": "Outer hair cells of the cochlea"}, {"letter": "B", "text": "Inner hair cells of the cochlea"}, {"letter": "C", "text": "Neurons of the superior olivary nucleus"}, {"letter": "D", "text": "Hair cells of the saccule"}, {"letter": "E", "text": "Neurons of the inferior colliculus"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Ear Anatomy & Neurophysiology", "topic": "Ear Anatomy & Neurophysiology", "note": null, "blueprint_category": "Ear Anatomy & Neurophysiology", "learning_objective": "Ear LO8", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk5-vestibular-s31-q2 (otoacoustic-emission reflex -> nerves): new case (newborn screening) and new ask (which cells generate OAEs)", "explanation": "Outer hair cells are motile and amplify basilar-membrane vibration (the cochlear amplifier); they are the source of otoacoustic emissions. A recorded OAE shows that the middle ear and outer hair cells work, so absent emissions with a normal canal and middle ear point to outer hair cell dysfunction.", "distractor_explanations": {"B": "Inner hair cells carry most auditory information to CN VIII but are not the source of the emissions.", "C": "Olivocochlear neurons modulate outer hair cells; an OAE can be recorded without their input.", "D": "The saccule senses linear acceleration.", "E": "The inferior colliculus is a central relay; emissions arise in the cochlea."}, "source": "Ear deck (c97442cf) slide 28 (outer hair cells: 'Source of otoacoustic emissions'); Wk5 packet p. 7-8 (outer hair cells, otoacoustic emissions) and p. 26-27 (OAE testing)."}, {"id": "m2mk1-q19", "n": 19, "part": 1, "title": null, "stem": "A 16-year-old boy has trouble seeing at dusk and keeps bumping into objects at his sides. His central acuity is 20/20. Funduscopy shows dark clumps of pigment in the peripheral retina. Which cells degenerate first in his disease?", "options": [{"letter": "A", "text": "Cones"}, {"letter": "B", "text": "Retinal ganglion cells"}, {"letter": "C", "text": "Rods"}, {"letter": "D", "text": "Bipolar cells"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO3, LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk5-eye-retina-p63/p64 (why rod death -> night blindness; why central field preserved): new case and new ask (which cell is lost)", "explanation": "Night blindness and loss of peripheral vision with spared central acuity is retinitis pigmentosa: genetically linked photoreceptor death, typically rods first. Rods mediate scotopic vision and dominate the periphery; the cone-rich fovea is spared until late.", "distractor_explanations": {"A": "Cone loss would impair central acuity and color vision first; his acuity is normal.", "B": "Ganglion cell loss (e.g., glaucoma) gives field loss without night blindness or pigment clumps.", "D": "Bipolar cells aren't the primary target in retinitis pigmentosa."}, "source": "Eye & Retina deck (42e068d1) p. 63-64 ('Retinitis pigmentosa = genetically-linked selective photoreceptor death, typically rods'; loss of peripheral vision); Wk5 packet Eye LO7."}, {"id": "m2mk1-q20", "n": 20, "part": 1, "title": null, "stem": "A 45-year-old woman with generalized, AChR-antibody–positive myasthenia gravis is to start a humanized monoclonal antibody against complement component C5. She is vaccinated first because the drug most increases her risk of which infection?", "options": [{"letter": "A", "text": "Reactivation of latent tuberculosis"}, {"letter": "B", "text": "Meningococcal infection"}, {"letter": "C", "text": "Progressive multifocal leukoencephalopathy"}, {"letter": "D", "text": "Hepatitis B reactivation"}, {"letter": "E", "text": "Invasive aspergillosis"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO5; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Eculizumab", "laterality": false, "reworks": null, "explanation": "The drug is eculizumab. Blocking C5 prevents formation of the membrane attack complex, which is the main defense against Neisseria, so the drug list's side effect is risk of meningococcal infection; patients are vaccinated before starting.", "distractor_explanations": {"A": "TB reactivation is the classic risk of TNF-alpha inhibitors, not a C5 inhibitor.", "C": "PML is listed for mycophenolate mofetil on the course drug list (and natalizumab), not eculizumab.", "D": "Hepatitis B reactivation is a rituximab (anti-CD20) risk.", "E": "Invasive fungal infection isn't the listed eculizumab risk; terminal complement mainly defends against Neisseria."}, "source": "Drug list (Exam 2, Myasthenia Gravis): Eculizumab, 'Humanized monoclonal antibody that binds to the terminal complement component 5 (C5)'; side effects 'Risk of meningococcal infections, severe anemia'."}, {"id": "m2mk1-q21", "n": 21, "part": 1, "title": null, "stem": "In late August, a 66-year-old man in Phoenix has fever, headache and a stiff neck. Over the next 2 days, flaccid weakness develops in his right arm and left leg, with absent reflexes in those limbs. Sensation is intact. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Amyotrophic lateral sclerosis"}, {"letter": "B", "text": "Spinal muscular atrophy"}, {"letter": "C", "text": "Guillain-Barré syndrome"}, {"letter": "D", "text": "West Nile virus myelitis"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: ALS and UMN Disorders", "topic": "Motor Neuron Disorders: ALS and UMN Disorders", "note": null, "blueprint_category": "Motor Neuron Disorders: ALS and UMN Disorders", "learning_objective": "ALS LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "An acute, asymmetric, flaccid (anterior horn cell) paralysis with meningitic features in mosquito season is West Nile myelitis, a polio-like LMN syndrome; diagnosis is supported by West Nile IgM in serum or CSF.", "distractor_explanations": {"A": "ALS progresses over months with mixed UMN and LMN signs, not acutely with fever.", "B": "SMA is an inherited, symmetric, mostly proximal LMN disorder, not an acute febrile illness.", "C": "GBS is usually a symmetric, ascending weakness with sensory symptoms, without fever or meningitis at onset."}, "source": "Wk4 packet p. 111-113 (LO7 table: 'West Nile myelitis: Mosquito exposure, possible fever/meningitis/encephalitis, asymmetric weakness and areflexia')."}, {"id": "m2mk1-q22", "n": 22, "part": 1, "title": null, "stem": "A 41-year-old man has left neck pain after a chiropractic adjustment, then a droopy left eyelid and a small left pupil; facial sweating is normal. Cocaine drops confirm left Horner syndrome. Hydroxyamphetamine drops are later placed in both eyes. Which result is expected?", "options": [{"letter": "A", "text": "Both pupils dilate equally"}, {"letter": "B", "text": "The left pupil fails to dilate while the right pupil dilates"}, {"letter": "C", "text": "The left pupil dilates more than the right"}, {"letter": "D", "text": "Neither pupil dilates"}, {"letter": "E", "text": "The left pupil constricts while the right pupil dilates"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Sympathetics & Parasympathetics of the Eye", "topic": "Sympathetics & Parasympathetics of the Eye", "note": null, "blueprint_category": "Sympathetics & Parasympathetics of the Eye", "learning_objective": "Symp/Parasymp LO4-5; drug list (green)", "difficulty": 3, "format": "vignette", "drug_item": "Hydroxyamphetamine (and cocaine)", "laterality": true, "reworks": "wk5-sympara-s31 (right Horner + lung apex mass -> preganglionic fibers): new case (left, carotid dissection) and new ask (hydroxyamphetamine result)", "explanation": "Carotid dissection injures the third-order (postganglionic) fibers that run on the internal carotid; sweating is spared because facial sweat fibers follow the external carotid. Hydroxyamphetamine releases norepinephrine from intact postganglionic terminals: with a third-order lesion the terminals have degenerated, so the left pupil doesn't dilate. (Cocaine, a reuptake blocker, fails to dilate any Horner pupil because little NE is released.)", "distractor_explanations": {"A": "Equal dilation is expected with a first- or second-order lesion, where the postganglionic terminals still hold norepinephrine.", "C": "Greater dilation of the Horner pupil is the apraclonidine (denervation supersensitivity) result.", "D": "The normal right eye's intact terminals release norepinephrine and dilate.", "E": "Releasing norepinephrine never constricts the pupil."}, "source": "Eye Exam deck (995161cb) slide 56-57 ('Third-order neuron lesion: carotid artery dissection'; 'Hydroxyamphetamine ... Second-order neuron damage -> dilation; Third-order neuron damage -> no dilation'); Wk5 packet p. 86-87; drug list (Ocular pharmacology: hydroxyamphetamine 'Causes the release of norepinephrine from the nerve ending')."}, {"id": "m2mk1-q23", "n": 23, "part": 1, "title": null, "stem": "A 46-year-old man with Huntington disease has chorea that makes it hard for him to eat. He starts tetrabenazine. By which mechanism does this drug reduce his chorea?", "options": [{"letter": "A", "text": "It blocks postsynaptic D2 receptors in the striatum"}, {"letter": "B", "text": "It irreversibly inhibits monoamine oxidase B"}, {"letter": "C", "text": "It inhibits vesicular monoamine transport, so dopamine is not stored in vesicles and is degraded"}, {"letter": "D", "text": "It blocks NMDA glutamate receptors"}, {"letter": "E", "text": "It blocks dopamine reuptake through the dopamine transporter"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Hyperkinetic Movement Disorders", "topic": "Hyperkinetic Movement Disorders", "note": null, "blueprint_category": "Hyperkinetic Movement Disorders", "learning_objective": "Hyperkinetic LO2; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Tetrabenazine", "laterality": false, "reworks": "Weekly Quiz #4 Q20 (HD anti-chorea therapy -> paired side effects): new ask (mechanism)", "explanation": "Tetrabenazine is a VMAT inhibitor: dopamine can't be packaged into vesicles, is degraded in the cytoplasm, and less is released, which reduces chorea. Its listed side effects include depression, akathisia and parkinsonism.", "distractor_explanations": {"A": "D2 blockade is how risperidone and haloperidol (also on the HD list) work.", "B": "MAO-B inhibition (selegiline, rasagiline) raises dopamine and is used in Parkinson disease.", "D": "NMDA blockade isn't tetrabenazine's mechanism (amantadine is a weak NMDA antagonist).", "E": "Blocking reuptake would raise synaptic dopamine and worsen chorea."}, "source": "Drug list (Exam 2, Huntington's Disease): Tetrabenazine, 'Inhibition of dopamine uptake into vesicles, results in the degradation of dopamine'; Wk4 packet p. 76 ('vesicular monoamine transport inhibitors ... can treat chorea')."}, {"id": "m2mk1-q24", "n": 24, "part": 1, "title": null, "stem": "A 34-year-old woman has 2 months of drooping eyelids and double vision that worsen by evening, and her arms tire when she dries her hair. Pupils, reflexes and sensation are normal. Which test should be ordered first to confirm the suspected diagnosis?", "options": [{"letter": "A", "text": "Serum acetylcholine receptor antibodies"}, {"letter": "B", "text": "Voltage-gated calcium channel antibodies"}, {"letter": "C", "text": "Serum creatine kinase"}, {"letter": "D", "text": "MRI of the brainstem"}, {"letter": "E", "text": "Lumbar puncture for oligoclonal bands"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "topic": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "note": null, "blueprint_category": "Motor Neuron Disorders: Lower Motor Neuron / Junction", "learning_objective": "NMJ LO3-4", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Fluctuating, fatigable ptosis, diplopia and proximal limb weakness with normal pupils is myasthenia gravis. The course says antibody testing usually begins with AChR antibodies; MuSK and others follow if AChR testing is negative.", "distractor_explanations": {"B": "VGCC antibodies test for Lambert-Eaton syndrome, which causes proximal leg weakness, low reflexes and autonomic symptoms.", "C": "CK is raised in muscle disease; it is normal in myasthenia gravis.", "D": "Fatigable ocular and limb weakness with normal pupils points to the NMJ, not a brainstem lesion.", "E": "Oligoclonal bands support multiple sclerosis."}, "source": "Wk4 packet p. 95-96 (LO3-4; 'Antibody testing usually begins with AChR antibodies')."}, {"id": "m2mk1-q25", "n": 25, "part": 1, "title": null, "stem": "Which eyelid muscle is made of smooth muscle, is supplied by sympathetic fibers, and provides about 1–2 mm of upper eyelid elevation?", "options": [{"letter": "A", "text": "Levator palpebrae superioris"}, {"letter": "B", "text": "Orbicularis oculi, palpebral part"}, {"letter": "C", "text": "Frontalis"}, {"letter": "D", "text": "Superior rectus"}, {"letter": "E", "text": "Superior tarsal (Müller) muscle"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Structures of the Eye and Retina", "topic": "Structures of the Eye and Retina", "note": null, "blueprint_category": "Structures of the Eye and Retina", "learning_objective": "Eye & Retina LO1; Symp/Parasymp LO3", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": "Eye & Retina deck p. 16 compare-and-contrast prompt (levator palpebrae vs superior tarsal; worksheet wk5-eye-lid-openers): reversed ask (fiber type + innervation + role -> muscle)", "explanation": "The superior tarsal (Müller) muscle is smooth muscle attached to the upper tarsal plate, supplied by postganglionic sympathetics from the superior cervical ganglion. Its loss causes the mild ptosis of Horner syndrome.", "distractor_explanations": {"A": "The levator is skeletal muscle supplied by CN III and is the main eyelid opener.", "B": "The orbicularis oculi closes the eye (CN VII).", "C": "The frontalis raises the eyebrows (CN VII).", "D": "The superior rectus elevates the eyeball, not the lid (CN III)."}, "source": "Wk5 packet p. 86 ('Ptosis results from the interruption of innervation to superior tarsal/Müller's muscle in the upper eyelid, which gives 1-2mm of eyelid elevation'); Eye & Retina deck p. 16."}, {"id": "m2mk1-q26", "n": 26, "part": 1, "title": null, "stem": "Which feature favors essential tremor over the tremor of Parkinson disease?", "options": [{"letter": "A", "text": "Tremor at rest that lessens when the hand moves"}, {"letter": "B", "text": "Tremor that begins in one hand together with reduced arm swing"}, {"letter": "C", "text": "Tremor that improves on carbidopa/levodopa"}, {"letter": "D", "text": "Tremor appears with the arms outstretched or in use and lessens after a drink of alcohol"}], "answer": "D", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Tremor and Other Movement Disorders", "topic": "Tremor and Other Movement Disorders", "note": null, "blueprint_category": "Tremor and Other Movement Disorders", "learning_objective": "Tremor LO1", "difficulty": 1, "format": "direct", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Essential tremor is a postural/kinetic (action) tremor, often bilateral, frequently familial and often alcohol-responsive; the Parkinson tremor is a resting tremor that lessens with action.", "distractor_explanations": {"A": "A resting tremor that lessens with movement is typical of Parkinson disease.", "B": "Unilateral onset with reduced arm swing is parkinsonian (bradykinesia).", "C": "A levodopa response supports Parkinson disease."}, "source": "Wk4 packet p. 84-87 (essential tremor kinetic and alcohol-sensitive; Table 1 resting tremor = Parkinson disease)."}, {"id": "m2mk1-q27", "n": 27, "part": 1, "title": null, "stem": "A 70-year-old man with Parkinson disease had nausea and lightheadedness on levodopa alone, at doses that barely helped his movements. Adding carbidopa lets him take a lower levodopa dose with better benefit. Why?", "options": [{"letter": "A", "text": "Carbidopa inhibits COMT in the brain, prolonging dopamine action in the striatum"}, {"letter": "B", "text": "Carbidopa is itself converted to dopamine in the striatum"}, {"letter": "C", "text": "Carbidopa irreversibly inhibits MAO-B in the striatum"}, {"letter": "D", "text": "Carbidopa is a direct D2 receptor agonist"}, {"letter": "E", "text": "Carbidopa blocks conversion of levodopa to dopamine outside the brain and does not cross the blood-brain barrier"}], "answer": "E", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Treatment of Movement Disorders", "topic": "Treatment of Movement Disorders", "note": null, "blueprint_category": "Treatment of Movement Disorders", "learning_objective": "PD Treatment LO2; drug list (green)", "difficulty": 2, "format": "vignette", "drug_item": "Carbidopa/Levodopa", "laterality": false, "reworks": null, "explanation": "Carbidopa inhibits peripheral (GI and systemic) decarboxylation of levodopa but cannot cross the BBB. Less dopamine forms outside the brain (less nausea and orthostatic hypotension), and more levodopa reaches the brain to be converted to dopamine.", "distractor_explanations": {"A": "COMT inhibitors are tolcapone and entacapone; carbidopa inhibits DOPA decarboxylase.", "B": "Levodopa is the precursor converted to dopamine; carbidopa isn't.", "C": "MAO-B inhibitors are selegiline and rasagiline.", "D": "Direct agonists include ropinirole, pramipexole and bromocriptine."}, "source": "Drug list (Exam 2, Parkinson's): Carbidopa/Levodopa, 'Carbidopa is added to levodopa since it inhibits the breakdown by enzymes in the GI tract. (Carbidopa cannot cross the BBB)'; Wk4 packet p. 117."}, {"id": "m2mk1-q28", "n": 28, "part": 1, "title": null, "stem": "A 78-year-old man has trouble following conversation in noisy restaurants. Audiometry shows a symmetric sensorineural loss in both ears that is worst at the highest frequencies. Loss of hair cells in which part of the cochlea best explains this pattern?", "options": [{"letter": "A", "text": "The apex, near the helicotrema"}, {"letter": "B", "text": "The basal turn, near the oval and round windows"}, {"letter": "C", "text": "The middle turn only"}, {"letter": "D", "text": "Evenly along the whole cochlear duct"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO3; Ear LO7", "difficulty": 2, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk5-vestibular-s27-q2 (base of cochlea damaged -> which frequencies lost): reversed direction (presbycusis audiogram -> site)", "explanation": "The basilar membrane is narrow and stiff at the base (high frequencies) and wide and floppy at the apex (low frequencies). Presbycusis is a bilateral, high-frequency sensorineural loss from hair cell loss in the basal turn.", "distractor_explanations": {"A": "The apex, where the basilar membrane is widest and floppiest, encodes low frequencies.", "C": "Mid-turn damage would hit middle frequencies.", "D": "Even loss would flatten all frequencies, not mainly the highest."}, "source": "Hearing Loss deck slide 34 ('Presbycusis ... Usually bilateral, high frequency ... Caused by inner hair cell loss at the basal turns of the cochlea'); Wk5 packet p. 7 (basilar membrane 'wider, thinner and floppier in going from base to apex')."}, {"id": "m2mk1-q29", "n": 29, "part": 1, "title": null, "stem": "During removal of an impacted lower third molar, the surgeon cuts the lingual nerve where it lies against the medial surface of the mandible near the tooth. Which deficit is expected on that side?", "options": [{"letter": "A", "text": "Loss of general sensation only from the anterior two-thirds of the tongue"}, {"letter": "B", "text": "Loss of taste only from the anterior two-thirds of the tongue"}, {"letter": "C", "text": "Loss of both general sensation and taste from the anterior two-thirds of the tongue"}, {"letter": "D", "text": "Loss of taste and general sensation from the posterior one-third of the tongue"}, {"letter": "E", "text": "Deviation of the protruded tongue toward that side"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Nasal & Oral Cavities", "topic": "Nasal & Oral Cavities", "note": null, "blueprint_category": "Nasal & Oral Cavities", "learning_objective": "Nasal & Oral LO7, LO11", "difficulty": 2, "format": "procedural scenario", "drug_item": null, "laterality": false, "reworks": null, "explanation": "Near the third molar, the lingual nerve (V3) already carries chorda tympani fibers (CN VII): general sensation and taste from the anterior two-thirds of the tongue, plus preganglionic parasympathetics to the submandibular ganglion.", "distractor_explanations": {"A": "By this point the chorda tympani's taste fibers have joined the lingual nerve, so taste is lost too.", "B": "Taste alone would fit a chorda tympani lesion before it joins the lingual nerve (e.g., in the middle ear).", "D": "The posterior third is supplied by CN IX for both taste and general sensation.", "E": "Tongue deviation is a CN XII (hypoglossal) motor sign."}, "source": "Wk4 packet p. 47-48 (LO7: general sensation via the lingual nerve; 'The lingual nerve also carries taste afferents from the anterior 2/3 of the tongue but these leave the lingual nerve in the infratemporal fossa on the chorda tympani')."}, {"id": "m2mk1-q30", "n": 30, "part": 1, "title": null, "stem": "A 31-year-old woman has 2 years of slowly worsening hearing in her left ear. Her mother needed ear surgery for hearing loss in her 30s. The ear canal and tympanic membrane look normal. The audiogram for her left ear is shown. Which diagnosis is most likely?", "options": [{"letter": "A", "text": "Otosclerosis"}, {"letter": "B", "text": "Presbycusis"}, {"letter": "C", "text": "Ménière disease"}, {"letter": "D", "text": "Vestibular schwannoma"}, {"letter": "E", "text": "Noise-induced hearing loss"}], "answer": "A", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock1-images/s-audiogram.png", "image_needed": true, "week": 5, "session_guess": "Hearing Loss and Evaluation", "topic": "Hearing Loss and Evaluation", "note": null, "blueprint_category": "Hearing Loss and Evaluation", "learning_objective": "Hearing Loss LO2, LO4", "difficulty": 2, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "The audiogram shows normal bone conduction with air conduction about 50 dB down at all frequencies: an air-bone gap, i.e., conductive hearing loss. In a young adult with a normal tympanic membrane and a family history, the cause is otosclerosis, in which the stapes footplate becomes fixed.", "distractor_explanations": {"B": "Presbycusis is a bilateral, high-frequency sensorineural loss in older adults; bone and air conduction would both be reduced.", "C": "Ménière disease gives a fluctuating sensorineural loss with episodic vertigo.", "D": "A vestibular schwannoma causes asymmetric sensorineural loss (bone and air both reduced).", "E": "Noise damage is sensorineural (hair cells), so bone conduction would be reduced too."}, "source": "Hearing Loss deck (88ab33e1) slide 19 ('Conductive Hearing Loss Audiogram'); Wk5 packet p. 15 ('Otosclerosis ... stiffening of the stapes footplate ... progressive hearing loss of one or both ears').", "annotation": {"image": "qbank/midterm2-mock1-images/annotated/s-audiogram.png", "options": {"A": "Conductive pattern (air-bone gap) shown; otosclerosis is the cause from the history", "B": "not shown in this figure", "C": "not shown in this figure", "D": "not shown in this figure", "E": "not shown in this figure"}, "note": "The faculty slide pairs this conductive audiogram with a sensorineural audiogram (air and bone both down, falling at high frequencies) for contrast.", "how": "Faculty slide with both audiograms. Amber box with star = the panel the question showed (conductive). No answer choice is labeled on the slide.", "marked": [], "status": "built 2026-11-19 (Cowork): faculty source registered to the question crop (OpenCV SIFT + partial affine), label boxes from Tesseract OCR, hand-set where OCR missed"}}, {"id": "m2mk1-q31", "n": 31, "part": 1, "title": null, "stem": "A 41-year-old man has 2 years of irritability and brief, flowing, involuntary movements of his face and limbs. MRI shows atrophy of the caudate nuclei. The striatal neurons lost first in his disease express D2 receptors. Which change best explains his movements?", "options": [{"letter": "A", "text": "The direct pathway inhibits the internal globus pallidus more, so the thalamus is inhibited more"}, {"letter": "B", "text": "The external globus pallidus is released from striatal inhibition, inhibits the subthalamic nucleus, and the internal globus pallidus then inhibits the thalamus less"}, {"letter": "C", "text": "Loss of nigral dopamine at D1 receptors leaves the direct pathway underactive"}, {"letter": "D", "text": "The subthalamic nucleus becomes overactive and drives the internal globus pallidus to inhibit the thalamus more"}, {"letter": "E", "text": "Loss of cerebellar input to the ventral lateral thalamus releases cortical motor activity"}], "answer": "B", "answer_source": "Claude-written key, checked twice against the cited course source", "image": null, "image_needed": false, "week": 4, "session_guess": "Basal Ganglia & Circuitry", "topic": "Basal Ganglia & Circuitry", "note": null, "blueprint_category": "Basal Ganglia & Circuitry", "learning_objective": "Basal Ganglia LO5, LO11", "difficulty": 3, "format": "vignette", "drug_item": null, "laterality": false, "reworks": "wk4-bg-s30 (D2 stimulation -> movement): new case (Huntington disease) and new ask (circuit consequence of losing D2 neurons)", "explanation": "In Huntington disease the striatal medium spiny neurons of the indirect (NOGO, D2/enkephalin) pathway are lost first. Without their GABA, the GPe is released and inhibits the STN more; the STN then drives the GPi less, so GPi inhibition of the thalamus falls. The unopposed direct pathway produces chorea.", "distractor_explanations": {"A": "More direct-pathway inhibition of GPi would disinhibit the thalamus (more movement), not inhibit it; and HD hits the indirect-pathway neurons first.", "C": "Loss of nigral dopamine is the Parkinson disease mechanism and causes too little movement.", "D": "An overactive STN and GPi is the hypokinetic (Parkinson) pattern; in HD the STN is inhibited more by a disinhibited GPe.", "E": "Cerebellar output loss causes ataxia and intention tremor, not chorea."}, "source": "Wk4 packet p. 76 (HD: 'Striatal (medium spiny) neurons that give rise to the indirect pathway are selectively vulnerable ... The unopposed action of the direct pathway then produces involuntary movements'); BG deck (4285501b) slides 14, 20-22 (direct/indirect pathways, D1/D2)."}, {"id": "m2mk1-q32", "n": 32, "part": 1, "title": null, "stem": "A 74-year-old man has sudden, painless loss of vision in his left eye. His fundus is shown; the arrow marks the fovea. Why does the fovea look red while the retina around it is pale?", "options": [{"letter": "A", "text": "Fragile new vessels have bled at the fovea"}, {"letter": "B", "text": "Sphingolipid has accumulated in the ganglion cells around the fovea"}, {"letter": "C", "text": "The fovea's photoreceptors still receive blood from the choroid, while the surrounding inner retina, supplied by the occluded central retinal artery, is infarcted and swollen"}, {"letter": "D", "text": "Drusen have accumulated beneath the fovea"}, {"letter": "E", "text": "The optic disc is swollen from raised intracranial pressure"}], "answer": "C", "answer_source": "Claude-written key, checked twice against the cited course source", "image": "qbank/midterm2-mock1-images/s-fundus-crao.png", "image_needed": true, "week": 5, "session_guess": "Retinopathy / Macular Degeneration", "topic": "Retinopathy / Macular Degeneration", "note": null, "blueprint_category": "Retinopathy / Macular Degeneration", "learning_objective": "Retinal Disorders LO3; Eye & Retina LO6", "difficulty": 3, "format": "image", "drug_item": null, "laterality": false, "reworks": null, "explanation": "This is a central retinal artery occlusion (usually embolic). The inner retina, supplied by the central retinal artery, infarcts and swells (pale). The fovea has no inner layers and its photoreceptors are fed by the choroid, so
